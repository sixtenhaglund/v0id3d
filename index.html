<script>
// V0ID3D — draw-world.js: drawing the world: background, lightning bolts, the map edge, The Anchor, the seal cutscene
"use strict";

// =====================================================================
//  DRAWING THE WORLD
// =====================================================================
function diamond(x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill();
}

// the dark colors for far-away rifts: things far away look dimmer (that's
// also how real fog and distance work — it's called "atmospheric perspective")
const FAR_PAL = [[125, 0, 0], [65, 0, 0], [105, 105, 105], [32, 0, 0]];
const FAR_RIFTS = {};
function farRift(r, v) {                                   // baked once per size + variant
  const key = r + '_' + v;
  return FAR_RIFTS[key] || (FAR_RIFTS[key] = makeBlob(r, 5000 + r * 13 + v * 101, 4, 1.25, FAR_PAL));
}

function drawBackground(camX, camY, k, late) {
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  // when time runs low, bright red glitch bits appear all over the void.
  // MORE pieces at full strength — not a see-through red layer, which
  // would just mix with the black into a muddy, washed-out dark red.
  if (late > 0) {
    for (let i = 0, n = Math.round(late * 70); i < n; i++) {
      const [w, h] = glitchSize();
      g.fillStyle = REDS[i & 3]; g.fillRect(ri(0, W), ri(0, H), w, h);
    }
  }

  // (area stabilized: the far rifts and the far lightning glitch out as well)
  const gone = S.stab || 0;
  // FAR-AWAY RIFTS: small, dark versions of the corruption masses, deep in
  // the background. Two layers: the further one is smaller and moves slower.
  const rf = Math.floor(S.t * 10);
  if (gone < 1 && world.opt.farRifts !== false) for (const L of [{ p: 0.2, cell: 210, r0: 4, r1: 7, seed: 121 }, { p: 0.38, cell: 170, r0: 7, r1: 12, seed: 131 }]) {
    const ox = camX * L.p, oy = camY * L.p;
    for (let i = Math.floor(ox / L.cell) - 1; i <= Math.floor((ox + W) / L.cell) + 1; i++)
      for (let j = Math.floor(oy / L.cell) - 1; j <= Math.floor((oy + H) / L.cell) + 1; j++) {
        const h = hash2(i, j, L.seed); if (h > 0.32 || (gone && rnd() < gone)) continue;
        const spr = farRift(L.r0 + Math.floor(hash2(i, j, L.seed + 1) * (L.r1 - L.r0 + 1)), Math.floor(hash2(i, j, L.seed + 2) * 3));
        const x = i * L.cell + hash2(i, j, L.seed + 3) * L.cell - ox, y = j * L.cell + hash2(i, j, L.seed + 4) * L.cell - oy;
        if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
        glowAt(x, y, spr.w * 0.9, spr.h * 0.8, 0.12 + L.p * 0.15);
        g.drawImage(spr.frames[(hash2(i * 7 + j, rf, L.seed) * spr.frames.length) | 0], Math.round(x - spr.cx), Math.round(y - spr.cy));
      }
  }

  // DISTANT LIGHTNING in the back layers: small, dark bolts that flash for a
  // split second far behind everything, like a storm far away. The further
  // layer's bolts are smaller and darker. Near the portal they turn blue-purple.
  const P = world.portal, psx = P ? P.x - camX : 1e9, psy = P ? P.y - camY : 1e9;
  if (gone < 1 && world.opt.farLightning !== false) for (const L of [{ p: 0.25, cell: 150, len: 18, seed: 141, glow: '#520000', core: '#9a5a5a' },
                   { p: 0.45, cell: 120, len: 30, seed: 151, glow: '#780000', core: '#b88a8a' }]) {
    const ox = camX * L.p, oy = camY * L.p;
    for (let i = Math.floor(ox / L.cell); i <= Math.floor((ox + W) / L.cell); i++)
      for (let j = Math.floor(oy / L.cell); j <= Math.floor((oy + H) / L.cell); j++) {
        const x0 = i * L.cell + hash2(i, j, L.seed) * L.cell - ox, y0 = j * L.cell + hash2(i, j, L.seed + 1) * L.cell - oy;
        const blue = clamp(1 - Math.hypot(x0 - psx, y0 - psy) / 260, 0, 1);
        // each spot gets its own clock; every ~0.3 s it might strike (more often near the portal)
        const tb = Math.floor((S.t + hash2(i, j, L.seed + 2) * 10) * 3);
        if (hash2(i * 13 + j, tb, L.seed + 3) > 0.14 + blue * 0.4) continue;
        if (hash2(i * 13 + j, Math.floor(S.t * 20), L.seed + 4) < 0.35 || (gone && rnd() < gone)) continue;   // flicker while it's on
        let x = x0, y = y0, a = hash2(i, tb, L.seed + 5) * 6.283;
        const pts = [[x, y]];
        for (let s = 0, n = 4 + Math.floor(hash2(j, tb, L.seed + 6) * 4); s < n; s++) {
          a += (hash2(i * 7 + s, tb, L.seed + 7) - 0.5) * 1.6;
          const st = L.len / n * (0.6 + hash2(j * 7 + s, tb, L.seed + 8) * 0.8);
          x += Math.cos(a) * st; y += Math.sin(a) * st; pts.push([x, y]);
        }
        const glow = blue > 0.3 ? '#2a268e' : L.glow, core = blue > 0.3 ? '#8a84dc' : L.core;
        glowAt(x0, y0, L.len * 1.3, L.len * 1.3, 0.1 + L.p * 0.15, blue > 0.3 ? GLOW_BLUE : GLOW);   // the flash lights up the void a little
        for (const [w, col] of [[2, glow], [1, core]]) {
          g.strokeStyle = col; g.lineWidth = w; g.beginPath();
          pts.forEach(([px, py], k) => k ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
        }
      }
  }

  // white dots in THREE layers; the further a layer is, the slower it moves
  // and the dimmer its dots (parallax + atmospheric perspective = fake depth)
  const fq = Math.floor(S.t * 6);
  for (const L of [{ p: 0.12, cell: 20, seed: 3, big: 0, far: true }, { p: 0.3, cell: 30, seed: 1, big: 0 }, { p: 0.65, cell: 46, seed: 2, big: 0.25 }]) {
    const ox = camX * L.p, oy = camY * L.p;
    const i0 = Math.floor(ox / L.cell), i1 = Math.floor((ox + W) / L.cell);
    const j0 = Math.floor(oy / L.cell), j1 = Math.floor((oy + H) / L.cell);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const h = hash2(i, j, L.seed);
      if (h > 0.5) continue;
      let sx = Math.floor(i * L.cell + hash2(i, j, L.seed + 10) * L.cell - ox);
      const sy = Math.floor(j * L.cell + hash2(i, j, L.seed + 20) * L.cell - oy);
      const tw = hash2(i, j, fq + L.seed * 999);
      if (tw < 0.04 + k * 0.08) continue;                     // flicker off
      if (late > 0 && tw > 1 - late * 0.3) sx += ri(-4, 4);   // jitter when breaking
      const redden = hash2(i, j, 5) < late;
      g.fillStyle = redden ? (L.far ? '#8a0000' : '#ff0000') : L.far ? (h < 0.08 ? '#6e6e76' : '#3c3c42') : (h < 0.12 ? '#fff' : '#8c8c96');
      const s = h < L.big * 0.2 ? 2 : 1;
      g.fillRect(sx, sy, s, s);
    }
  }
}

// CLOSE UP: specks floating IN FRONT of you. They move FASTER than the world
// (150%), which tricks your eye into feeling depth — like dust near a camera.
function drawMotes(camX, camY) {
  const p = 1.5, cell = 90, ox = camX * p, oy = camY * p;
  for (let i = Math.floor(ox / cell); i <= Math.floor((ox + W) / cell); i++)
    for (let j = Math.floor(oy / cell) - 1; j <= Math.floor((oy + H) / cell) + 1; j++) {
      const h = hash2(i, j, 101); if (h > 0.2) continue;
      const drift = S.t * (5 + h * 40);                      // slowly floating upward
      const x = i * cell + hash2(i, j, 102) * cell - ox + Math.sin(S.t * 0.6 + h * 30) * 5;
      const y = j * cell + (((hash2(i, j, 103) * cell - drift) % cell) + cell) % cell - oy;
      g.fillStyle = h < 0.04 ? '#ff0000' : h < 0.1 ? '#555' : '#333';
      g.fillRect(Math.round(x), Math.round(y), h < 0.1 ? 2 : 1, h < 0.1 ? 2 : 1);
    }
}

function drawTears(camX, camY, k, late) {
  const gone = S.stab || 0;                          // area stabilized: the tears glitch out too
  if (gone >= 1) return;
  for (const t of world.tears) {
    if (gone && rnd() < gone) continue;
    const lp = portalCalm(t.x, t.y);                  // purified by the portal: fades out, then gone
    if (lp > 0.55 || rnd() < lp * 1.6) continue;
    const tw = t.w * (1 + late * 1.5), th = t.h * (1 + late * 2.5);
    const x = t.x - camX - tw / 2, y = t.y - camY - th / 2;
    if (x > W || y > H || x + tw < 0 || y + th < 0) continue;
    // on/off flicker: mostly off when calm, mostly on when breaking
    const kk = k + (t === S.riftB ? S.rift * 3 : 0);  // stays open while you're close to it
    const on = Math.sin(S.t * 1.3 + t.ph) + Math.sin(S.t * 3.7 + t.ph * 2) > 1.4 - kk * 2.4;
    if (!on && rnd() > 0.03) continue;
    glowAt(x + tw / 2, y + th / 2, tw * 0.8, th * 0.5 + 18, 0.45 + (t === S.riftB ? S.rift * 0.4 : 0));
    // a torn strip of solid glitch: each 2-pixel row starts and ends at a random spot
    const fq = Math.floor(S.t * 14);
    for (let ry = 0; ry < th; ry += 2) {
      const n1 = hash2(ry, fq, t.ph * 97 | 0), n2 = hash2(ry, fq + 1, t.ph * 97 | 0);
      const l = n1 * tw * 0.3, r = tw - n2 * tw * 0.3;
      wallFill(Math.round(x + l), Math.round(y + ry), Math.round(r - l), 2, 5);
    }
    for (let i = 0; i < 3 + k * 8; i++) {           // loose pieces: lines, squares, blocks
      const [pw, ph] = glitchSize();
      g.fillStyle = glitchCol();
      g.fillRect(Math.round(x + rnd() * tw) + ri(-20, 10), Math.round(y + rnd() * th) + ri(-6, 6), pw, ph);
    }
  }
}

// a soft GLOW along a line: many see-through red strokes stacked on top of
// each other, from very wide to thin. Where lots of them overlap (right on
// the line) it's bright; further out only the wide ones reach, so it fades.
// Using MANY thin steps (14) is what makes the fade smooth instead of banded.
function glowStroke(tracePath, maxW, strength, color = '#ff0000', N = 14) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = color;
  for (let i = 0; i < N; i++) {
    g.lineWidth = 6 + maxW * Math.pow((N - i) / N, 1.6);
    g.globalAlpha = 0.03 * strength; tracePath(); g.stroke();
  }
  g.lineWidth = 5; g.globalAlpha = 0.3 * strength; tracePath(); g.stroke();   // bright core right on the line
  g.restore();
}

// A FAST glow along a line (used for the map edge and the tunnel). Same
// trick as the bloom: draw the line wide on a TINY canvas (1/4 size), shrink
// that again (which blurs it), then stretch both over the screen as light.
// 14 huge full-size strokes every frame was the biggest cause of lag.
const glowC = document.createElement('canvas'), gcx = glowC.getContext('2d');
const glowC2 = document.createElement('canvas'), gcx2 = glowC2.getContext('2d');
// pixel = true: the glow is drawn as chunky 8x8 BLOCKS (no smoothing) and
// without the smooth bright line — for the pixel-virus time-out wall
function glowLine(pts, ox, oy, maxW, strength, color = '#ff0000', pixel = false) {
  const w4 = Math.ceil(W / 4), h4 = Math.ceil(H / 4);
  if (glowC.width !== w4 || glowC.height !== h4) { glowC.width = w4; glowC.height = h4; glowC2.width = Math.ceil(W / 8); glowC2.height = Math.ceil(H / 8); }
  gcx.setTransform(1, 0, 0, 1, 0, 0); gcx.clearRect(0, 0, w4, h4);
  gcx.setTransform(0.25, 0, 0, 0.25, 0, 0);
  gcx.strokeStyle = color; gcx.lineJoin = 'round';
  gcx.beginPath(); pts.forEach(([x, y], i) => i ? gcx.lineTo(x + ox, y + oy) : gcx.moveTo(x + ox, y + oy)); gcx.closePath();
  gcx.globalAlpha = 0.45; gcx.lineWidth = maxW * 0.55; gcx.stroke();       // wide + faint
  gcx.globalAlpha = 1; gcx.lineWidth = maxW * 0.2; gcx.stroke();            // narrower + brighter
  gcx2.clearRect(0, 0, glowC2.width, glowC2.height); gcx2.imageSmoothingEnabled = true; gcx2.imageSmoothingQuality = 'high';
  gcx2.drawImage(glowC, 0, 0, glowC2.width, glowC2.height);
  g.save(); g.imageSmoothingEnabled = !pixel; g.globalCompositeOperation = 'lighter';
  g.globalAlpha = Math.min(1, 1.25 * strength); g.drawImage(glowC2, 0, 0, W, H);   // the wide soft glow (ONE full-screen draw)
  if (pixel) { g.restore(); return; }
  g.strokeStyle = color;                                                          // + a tighter glow and a bright core, as cheap lines
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy)); g.closePath();
  g.lineWidth = 12; g.globalAlpha = 0.14 * strength; g.stroke();
  g.lineWidth = 5; g.globalAlpha = 0.3 * strength; g.stroke();
  g.restore();
}

// glowing crack lines: a thick pure-red line with a thin white one on top
function crackLines(lines, ox, oy) {
  for (const [w, col] of [[3, '#ff0000'], [1, '#fff']]) {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    for (const ln of lines) ln.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy));
    g.stroke();
  }
}

// LIVING BOLTS: the cracks crackle with electricity.
//   - 14 times a second each bolt "re-strikes": its points jump a tiny bit
//   - its tip slowly reaches further out and pulls back again
//   - bright sparks race along it from the edge inward and pop at the tip
//   - now and then a side branch flickers out, or the whole bolt flashes white
// bolts = [[points, id], ...]; the id keeps each bolt's rhythm its own.
// pal = the colors: red + white normally, blue + white for the portal
const RED_BOLTS = { glow: '#ff0000', core: '#fff', spr: null };
const BLUE_BOLTS = { glow: '#5b62ff', core: '#ebe6ff', spr: null };
function drawBolts(bolts, ox, oy, pal = RED_BOLTS, alpha = 1) {        // alpha = fade the whole thing
  const GL = pal.spr || (pal === BLUE_BOLTS ? GLOW_BLUE : GLOW);     // (a palette can bring its own glow sprite)
  const T = S.t, strike = Math.floor(T * 14);
  const shaped = bolts.map(([ln, id, full]) => {             // full = always reach all the way
    const reach = full ? 1 : 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(T * (1.1 + (id % 5) * 0.35) + id * 2.1));
    const n = Math.max(2, Math.ceil(ln.length * reach)), pts = [];
    for (let i = 0; i < n; i++) {
      const j = i ? 1.8 : 0;                               // the first point stays stuck to the edge
      pts.push([ln[i][0] + ox + (hash2(id * 31 + i, strike, 1) - 0.5) * 2 * j,
                ln[i][1] + oy + (hash2(id * 31 + i, strike, 2) - 0.5) * 2 * j]);
    }
    return [pts, id];
  });
  const path = list => { g.beginPath(); for (const [pts] of list) pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  g.globalAlpha = alpha;
  g.strokeStyle = pal.glow; g.lineWidth = 3; path(shaped); g.stroke();
  g.strokeStyle = pal.core; g.lineWidth = 1; path(shaped); g.stroke();
  const flashing = shaped.filter(([, id]) => hash2(id, Math.floor(T * 8), 6) < 0.05);   // white-hot flash
  if (flashing.length) { g.strokeStyle = pal.core; g.lineWidth = 2; path(flashing); g.stroke(); }

  for (const [pts, id] of shaped) {
    const n = pts.length;
    // a side branch flickering out from somewhere along the bolt
    if (hash2(id, strike, 5) < 0.14) {
      const k = 1 + Math.floor(hash2(id, strike, 7) * (n - 2)), [bx, by] = pts[Math.min(k, n - 1)];
      const [px, py] = pts[Math.max(0, k - 1)];
      let a = Math.atan2(by - py, bx - px) + (hash2(id, strike, 8) < 0.5 ? 1 : -1) * (0.6 + hash2(id, strike, 9) * 0.6);
      let x = bx, y = by;
      g.strokeStyle = hash2(id, strike, 10) < 0.5 ? pal.core : pal.glow; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 3; s++) { a += (hash2(id * 3 + s, strike, 11) - 0.5) * 1.2; x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
      g.stroke();
    }
    // a spark racing along the bolt, edge -> tip, every 1-3 seconds
    const period = 1.1 + (id % 7) * 0.3, ph = ((T + id * 0.37) % period) / period;
    const f = ph * (n - 1), i = Math.min(n - 2, Math.floor(f)), u = f - i;
    const sx = lerp(pts[i][0], pts[i + 1][0], u), sy = lerp(pts[i][1], pts[i + 1][1], u);
    glowAt(sx, sy, 9, 9, 0.6 * alpha, GL); g.globalAlpha = alpha;
    g.fillStyle = '#fff'; g.fillRect(Math.round(sx) - 1, Math.round(sy) - 1, 3, 3);
    if (ph > 0.9) {                                        // ...and it POPS at the tip
      const [tx, ty] = pts[n - 1];
      for (let s = 0; s < 6; s++) {
        g.fillStyle = s % 3 ? pal.glow : pal.core;
        g.fillRect(Math.round(tx + (rnd() - 0.5) * 14), Math.round(ty + (rnd() - 0.5) * 14), 1 + (s & 1), 1);
      }
    }
  }
  g.globalAlpha = 1;
}

// =====================================================================
//  THE EDGE OF THE MAP — where reality runs out. From the inside out:
//   1) THE DISSOLVE ZONE (EDGE_ZONE px inside the border): the void slowly
//      gets infected — first single pixels, then bigger and denser blocks,
//      until the last bit crumbles into the wall
//   2) THE RIM: a band of bright, solid glitch with a glowing membrane and
//      energy pulses racing along it
//   3) THE ABYSS: behind the rim the glitch fades — in solid black pixels,
//      no see-through shading — into pitch black: the world falls away
//  The pattern is built on a grid of 4x4 cells that's stuck to the WORLD
//  (not the screen), so it stays put when you move instead of swimming.
// =====================================================================
const EDGE_ZONE = 140, EDGE_RIM = 45, EDGE_FADE = 90;     // dissolve zone / bright rim / fade to black (pixels)
const mapMaskC = document.createElement('canvas'), mmx = mapMaskC.getContext('2d');      // where the wall OR the black is
const mapWallMaskC = document.createElement('canvas'), mwmx = mapWallMaskC.getContext('2d');   // where the bright wall is
const mapWallC = document.createElement('canvas'), mwx = mapWallC.getContext('2d');
const MAP_BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
let mapGrid = null, mapImgA = null, mapImgB = null, mapA32 = null, mapB32 = null;

function drawEdge(camX, camY) {
  const e = world.edge, ox = -camX, oy = -camY;
  const far = Math.max(Math.hypot(camX, camY), Math.hypot(camX + W, camY), Math.hypot(camX, camY + H), Math.hypot(camX + W, camY + H));
  if (far < e.min - EDGE_ZONE - 140) return;                // the edge (and its glow) isn't on screen
  const T = S.t;
  // how close YOU are to the edge (0 = far ... 1 = touching): it reacts to you
  let near = 0, pa = 0;
  if (player) { pa = Math.atan2(player.y, player.x); near = clamp(1 - (edgeRadiusAt(e, pa) - Math.hypot(player.x, player.y)) / 160, 0, 1); }
  const nearAt = a => near * Math.max(0, 1 - Math.abs(((a - pa + 9.425) % 6.283) - 3.1416) / 0.35);   // only on your side of the map

  // 1) a chunky PIXEL glow along the border (brighter when you're close)
  glowLine(e.pts, ox, oy, 150, 0.5 + 0.1 * Math.sin(T * 1.7) + near * 0.35, '#ff0000', true);

  // 2) cracks running from the edge into the map
  const vis = e.cracks.map((ln, i) => [ln, i])
    .filter(([ln]) => ln.some(([x, y]) => x + ox > -20 && x + ox < W + 20 && y + oy > -20 && y + oy < H + 20));
  if (vis.length) drawBolts(vis, ox, oy);

  // 3) THE GRID. Every cell gets d = how far it is INSIDE the border (negative = outside)
  const gx0 = Math.floor(camX / 4), gy0 = Math.floor(camY / 4);
  const cols = Math.ceil(W / 4) + 1, rows = Math.ceil(H / 4) + 1, mw = cols * 2, mh = rows * 2;
  if (!mapImgA || mapMaskC.width !== mw || mapMaskC.height !== mh) {
    for (const c of [mapMaskC, mapWallMaskC]) { c.width = mw; c.height = mh; }
    mapImgA = mmx.createImageData(mw, mh); mapImgB = mwmx.createImageData(mw, mh);
    mapA32 = new Uint32Array(mapImgA.data.buffer); mapB32 = new Uint32Array(mapImgB.data.buffer);
    mapGrid = new Float32Array(cols * rows);
  }
  const A = mapA32, B = mapB32, D = mapGrid;
  A.fill(0); B.fill(0);
  const BLACK = 0xff000000, WHITE = 0xffffffff, tq = Math.floor(T * 6);
  const specks = { '#ff0000': new Path2D(), '#000': new Path2D(), '#fff': new Path2D(), '#8a0000': new Path2D() };
  let anyWall = false;
  const put = (M, i, j, q, v) => { M[(j * 2 + (q >> 1)) * mw + i * 2 + (q & 1)] = v; };
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const wx = (gx0 + i) * 4 + 2, wy = (gy0 + j) * 4 + 2, r = Math.hypot(wx, wy);
    if (r < e.min - EDGE_ZONE - 20) { D[j * cols + i] = 999; continue; }        // (clearly inside: nothing to do)
    const a = Math.atan2(wy, wx), d = edgeRadiusAt(e, a) - r;
    D[j * cols + i] = d;
    const ci = gx0 + i, cj = gy0 + j;                                            // world cell (so the pattern sticks to the world)
    if (d > 0) {
      // THE DISSOLVE ZONE: the closer to the border, the more cells are infected
      const z = 1 - d / EDGE_ZONE; if (z <= 0) continue;
      if (player && Math.abs(wx - player.x) < 9 && Math.abs(wy - player.y) < 9) continue;   // never cover YOU
      const p = z * z * 0.5 + nearAt(a) * z * 0.35;
      const h = hash2(ci, cj, 501);
      if (h > p) continue;
      // each infected cell flickers on its own clock (not all at the same moment)
      if (hash2(ci, cj, 502 + Math.floor(T * (1 + h * 4) + h * 9)) < 0.18) continue;
      if (d < 14) { for (let q = 0; q < 4; q++) if (hash2(ci * 4 + q, cj, tq) < 0.7) put(A, i, j, q, BLACK), put(B, i, j, q, WHITE); anyWall = true; continue; }   // crumbling into the wall
      const x = i * 4 - (camX - gx0 * 4), y = j * 4 - (camY - gy0 * 4);
      const c = hash2(ci, cj, 503), col = c < 0.55 ? '#ff0000' : c < 0.8 ? '#000' : c < 0.9 ? '#fff' : '#8a0000';
      // far from the border = single pixels, closer = 2x2, closest = whole 4x4 blocks
      const s = z > 0.75 ? 4 : z > 0.45 ? 2 : 1, sx = s < 4 ? Math.floor(hash2(ci, cj, 504) * (4 - s + 1)) : 0, sy = s < 4 ? Math.floor(hash2(ci, cj, 505) * (4 - s + 1)) : 0;
      specks[col].rect(x + sx, y + sy, s, s);
    } else {
      // OUTSIDE: the bright rim, fading in black pixels into the abyss
      anyWall = true;
      const depth = -d, k = clamp((depth - EDGE_RIM) / EDGE_FADE, 0, 1);       // 0 = rim ... 1 = pure abyss
      for (let q = 0; q < 4; q++) {
        put(A, i, j, q, BLACK);
        // (a few deep pixels still flicker with glitch: things moving in the dark)
        // the fade uses a fixed 4x4 checker of thresholds (BAYER dithering, the
        // old pixel-art way of shading) — so it's a neat pattern, not random noise
        const bx = (ci * 2 + (q & 1)) & 3, by = (cj * 2 + (q >> 1)) & 3;
        const keep = MAP_BAYER[by * 4 + bx] >= k || (k >= 1 && hash2(ci * 4 + q, cj, tq + 507) < 0.004);
        if (keep) put(B, i, j, q, WHITE);
      }
    }
  }
  // paint it: black everywhere the wall/abyss is, then the glitch pattern only where the bright part is
  const offX = -(camX - gx0 * 4), offY = -(camY - gy0 * 4);
  if (anyWall) {
    mmx.putImageData(mapImgA, 0, 0); mwmx.putImageData(mapImgB, 0, 0);
    g.save(); g.imageSmoothingEnabled = false;
    g.drawImage(mapMaskC, offX, offY, mw * 2, mh * 2);
    if (mapWallC.width !== W || mapWallC.height !== H) { mapWallC.width = W; mapWallC.height = H; }
    const wf = Math.floor(T * 12) + 21, wp = WALL[wf & 3];
    const wm = new DOMMatrix().translate((hash2(wf, 1, 21) * TILE) | 0, (hash2(wf, 2, 21) * TILE) | 0);
    const gp = WALL_GLOW[wf & 3]; wp.setTransform(wm); gp.setTransform(wm);
    mwx.globalCompositeOperation = 'copy'; mwx.globalAlpha = 1; mwx.fillStyle = wp; mwx.fillRect(0, 0, W, H);
    mwx.globalCompositeOperation = 'lighter'; mwx.globalAlpha = 0.6; mwx.fillStyle = gp; mwx.fillRect(0, 0, W, H);
    mwx.globalCompositeOperation = 'destination-in'; mwx.globalAlpha = 1; mwx.imageSmoothingEnabled = false;
    mwx.drawImage(mapWallMaskC, offX, offY, mw * 2, mh * 2);
    g.drawImage(mapWallC, 0, 0);
    g.restore();
  }
  for (const col in specks) { g.fillStyle = col; g.fill(specks[col]); }

  // 4) THE MEMBRANE: a 2-pixel line where the wall meets the void (red, white pixels marching along)
  const red = new Path2D(), white = new Path2D(), march = Math.floor(T * 16);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const d = D[j * cols + i]; if (d > 0 || d < -6) continue;                 // only the outermost wall cells
    const x = i * 4 + offX, y = j * 4 + offY, P = (i + j + march) % 6 ? red : white;
    const inN = (ii, jj) => ii >= 0 && jj >= 0 && ii < cols && jj < rows && D[jj * cols + ii] > 0;
    if (inN(i - 1, j)) P.rect(x - 2, y, 2, 4);
    if (inN(i + 1, j)) P.rect(x + 4, y, 2, 4);
    if (inN(i, j - 1)) P.rect(x, y - 2, 4, 2);
    if (inN(i, j + 1)) P.rect(x, y + 4, 4, 2);
  }
  g.fillStyle = '#ff0000'; g.fill(red); g.fillStyle = '#fff'; g.fill(white);

  // 5) ENERGY PULSES racing along the rim, like a force field
  for (let k = 0; k < 8; k++) {
    const head = ((T * (36 + k * 3) + k * e.N / 8) % e.N + e.N) % e.N | 0, len = 14;
    const pts = [];
    for (let s = 0; s < len; s++) { const [px, py] = e.pts[(head - s + e.N) % e.N], f = 1 - 3 / (Math.hypot(px, py) || 1); pts.push([px * f + ox, py * f + oy]); }
    if (!pts.some(([x, y]) => x > -10 && x < W + 10 && y > -10 && y < H + 10)) continue;
    glowAt(pts[0][0], pts[0][1], 16, 16, 0.6);
    for (let s = 0; s < len - 1; s++) {
      g.globalAlpha = 1 - s / len; g.fillStyle = s < 3 ? '#fff' : '#ff0000';
      g.fillRect(Math.round(pts[s][0]) - 1, Math.round(pts[s][1]) - 1, 2, 2);
    }
    g.globalAlpha = 1;
  }

  // 6) DEBRIS: chunks break off the wall and slowly drift into the map, then
  //    blink out. Each one follows its own fixed path (no random jumping).
  for (let i = 0; i < e.N; i += 5) {
    const h = hash2(i, 7, 511); if (h > 0.55) continue;
    const life = 2.5 + h * 3, u = ((T / life + hash2(i, 8, 511)) % 1), cyc = Math.floor(T / life + hash2(i, 8, 511));
    const [px, py] = e.pts[i], a = i / e.N * 6.283, dist = u * (25 + hash2(i, cyc, 512) * 70);
    const x = px + ox - Math.cos(a) * dist + Math.sin(a) * Math.sin(u * 3 + h * 9) * 6, y = py + oy - Math.sin(a) * dist - Math.cos(a) * Math.sin(u * 3 + h * 9) * 6;
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
    if (u > 0.8 && hash2(i, Math.floor(T * 14), 513) < (u - 0.8) * 5) continue;   // blinking out
    const s = Math.max(1, Math.round((1 - u) * (2 + hash2(i, cyc, 514) * 5)));
    const c = hash2(i, cyc, 515);
    g.fillStyle = c < 0.6 ? '#ff0000' : c < 0.85 ? '#000' : '#fff';
    g.fillRect(Math.round(x), Math.round(y), s + (c > 0.5 ? s : 0), s);
  }
}

// dots around a square whose corners are r away from the middle.
// rot = 0 gives a diamond. dash > 0 leaves every dash-th dot out.
function dotSquare(cx, cy, r, rot, n, s = 1, dash = 0, dashOff = 0) {
  for (let i = 0; i < n; i++) {
    if (dash && (i + dashOff) % dash === 0) continue;
    const t = i / n * 4, side = Math.floor(t), f = t - side;
    const a0 = rot + side * 1.5708, a1 = a0 + 1.5708;
    g.fillRect(Math.round(cx + lerp(Math.cos(a0), Math.cos(a1), f) * r - s / 2),
               Math.round(cy + lerp(Math.sin(a0), Math.sin(a1), f) * r - s / 2), s, s);
  }
}
// a 1-pixel line, drawn dot by dot so it stays crisp
function pixLine(x0, y0, x1, y1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) g.fillRect(Math.round(lerp(x0, x1, i / n)), Math.round(lerp(y0, y1, i / n)), 1, 1);
}

// Delivered shards orbit The Anchor on 3 tilted rings. A circle squashed
// flat (tilt) looks like a ring seen from an angle — that's the 3D trick.
// rot turns each ring a bit so they cross each other like an atom.
const ORBITS = [
  { r: 32, tilt: 0.36, rot: -0.35, spd: 0.9 },
  { r: 47, tilt: 0.3,  rot: 0.32,  spd: -0.6 },
  { r: 62, tilt: 0.42, rot: -0.08, spd: 0.42 },
];
// where on ring o is angle a?  Returns x, y and depth (+ = in FRONT of the core)
function orbitPos(o, a, r) {
  const px = Math.cos(a) * r, py = Math.sin(a) * r * o.tilt, c = Math.cos(o.rot), s = Math.sin(o.rot);
  return [px * c - py * s, px * s + py * c, Math.sin(a)];
}

// little lightning bolts that jump out of the core
function updateArcs(dt, k) {
  for (const a of world.arcs) a.life -= dt;
  world.arcs = world.arcs.filter(a => a.life > 0);
  if (rnd() < (1.5 + k * 6 + world.anchorPulse * 25) * dt) {
    const ang = rnd() * 6.283, len = rr(28, 70) * (1 + world.anchorPulse * 0.8), pts = [];
    let side = 0;
    for (let d = 8; d < len; d += rr(3, 7)) {
      side += rr(-3, 3);                                // wander left/right = zig-zag
      pts.push([Math.cos(ang) * d - Math.sin(ang) * side, Math.sin(ang) * d + Math.cos(ang) * side]);
    }
    world.arcs.push({ pts, life: rr(0.08, 0.22) });
  }
}

function drawAnchor(camX, camY, k) {
  const ax = Math.round(-camX), ay = Math.round(-camY);
  if (ax < -200 || ax > W + 200 || ay < -200 || ay > H + 200) return;
  const T = S.t, p = world.anchorPulse, stab = world.delivered / Math.max(1, world.total);
  const beat = beatK();
  const sc = 1 + p * 0.35 + stab * 0.35 + Math.sin(T * 2) * 0.03;
  const cs = sc * (1 + beat * 0.14);                    // the core itself thumps on the beat

  // 1) big red glow ('lighter' = light adds up, like real glow)
  g.globalCompositeOperation = 'lighter';
  const R = (95 + beat * 14) * sc, gr = g.createRadialGradient(ax, ay, 0, ax, ay, R);
  gr.addColorStop(0, 'rgba(255,60,60,0.95)');
  gr.addColorStop(0.1, 'rgba(255,0,0,0.6)');
  gr.addColorStop(0.4, 'rgba(170,0,0,0.22)');
  gr.addColorStop(1, 'rgba(80,0,0,0)');
  g.fillStyle = gr; g.fillRect(ax - R, ay - R, R * 2, R * 2);
  g.globalCompositeOperation = 'source-over';

  // 2) faint grey diamond outlines behind it, slowly breathing
  g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1;
  for (const [i, d] of world.anchorDia.entries()) {
    const b = 1 + Math.sin(T * 0.7 + i * 1.9) * 0.08;
    const x = ax + d.x * sc, y = ay + d.y * sc, s = d.s * sc * b;
    g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x - s, y); g.closePath(); g.stroke();
  }

  // 3) the band of squares streaming out of the core. pow(u, 1.6) makes
  //    them start slow (crowded near the core) and speed up as they leave.
  const cb = Math.cos(-0.45), sb = Math.sin(-0.45), fq = Math.floor(T * 10);
  for (const q of world.anchorSq) {
    const u = (q.u0 + T * q.v) % 1;
    const along = q.side * 165 * Math.pow(u, 1.6), perp = q.perp * (1 - 0.6 * u);
    let x = ax + (along * cb - perp * sb) * sc, y = ay + (along * sb + perp * cb) * sc;
    const hh = hash2(q.id, fq, 3);
    if (hh < 0.04) continue;
    if (hh > 0.93 - k * 0.2) { x += (hash2(q.id, fq, 4) - 0.5) * 24; y += (hash2(q.id, fq, 5) - 0.5) * 6; }
    const s = Math.round((2 + q.sz * (3 + (1 - u) * 9)) * (0.9 + p * 0.5 + beat * 0.25));
    g.globalAlpha = clamp(q.a * (0.85 + p * 0.5 + beat * 0.3) * Math.min(1, (1 - u) * 2.5), 0, 1);
    g.fillStyle = q.col;
    g.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), s, s);
  }
  g.globalAlpha = 1;

  // 4+5) orbit rings and orbiting shards. Draw the BACK half first, then
  //      the core, then the FRONT half — so they pass behind and in front of it.
  const home = world.shards.filter(s => s.state === 'home');
  const orbitLayer = front => {
    for (const o of ORBITS) {                           // the rings: a dotted path
      g.fillStyle = '#ff0000';
      for (let i = 0; i < 80; i++) {
        if ((i + Math.floor(T * 5)) % 4 === 0) continue;
        const [x, y, d] = orbitPos(o, i / 80 * 6.283 + T * o.spd * 0.25, o.r * sc);
        if ((d > 0) !== front) continue;
        g.globalAlpha = front ? 0.55 : 0.18;
        g.fillRect(Math.round(ax + x), Math.round(ay + y), 1, 1);
      }
    }
    g.globalAlpha = 1;
    if (S.mode === 'clear') return;                     // (the level-complete animation draws them instead)
    for (const s of home) {                             // your shards riding them
      const o = ORBITS[s.ring], grow = Math.min(1, (T - s.born) * 2.5);
      const [x, y, d] = orbitPos(o, s.oa + T * o.spd, o.r * sc * grow);
      // remember where it is, so the level-complete animation can start from here
      s.lastOx = x; s.lastOy = y; s.lastA = s.ang + T * s.spin;
      if ((d > 0) !== front) continue;
      drawShard(s, ax + x, ay + y, ART, k, front ? 0.6 : 0.3);
    }
  };
  orbitLayer(false);

  // 6) lens flare: long horizontal streak + shorter vertical one = a star
  g.globalCompositeOperation = 'lighter';
  const fw = (130 + beat * 20) * sc, lg = g.createLinearGradient(ax - fw, 0, ax + fw, 0);
  lg.addColorStop(0, 'rgba(255,0,0,0)'); lg.addColorStop(0.5, 'rgba(255,230,230,0.95)'); lg.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = lg; g.fillRect(ax - fw, ay, fw * 2, 1);
  g.globalAlpha = 0.35; g.fillRect(ax - fw * 0.6, ay - 1, fw * 1.2, 3); g.globalAlpha = 1;
  const fh = 38 * cs, vg = g.createLinearGradient(0, ay - fh, 0, ay + fh);
  vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(0.5, 'rgba(255,230,230,0.9)'); vg.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = vg; g.fillRect(ax, ay - fh, 1, fh * 2);
  g.globalCompositeOperation = 'source-over';

  // 7) two pixel squares spinning around the core in opposite directions
  g.fillStyle = '#ff0000'; g.globalAlpha = 0.9;
  dotSquare(ax, ay, 21 * cs, T * 0.7, 64, 1, 5, Math.floor(T * 8));
  g.fillStyle = '#fff'; g.globalAlpha = 0.6 + beat * 0.4;
  dotSquare(ax, ay, 28 * cs, -T * 0.45, 20, 2);
  g.globalAlpha = 1;

  // 8) THE CORE — a black rim makes it pop out of the glow
  diamond(ax, ay, 18 * cs, 'rgba(255,0,0,0.3)');
  diamond(ax, ay, 13 * cs, '#000');
  diamond(ax, ay, 11 * cs, '#ff0000');
  if (rnd() < 0.04 + k * 0.2)                           // glitch: a ghost of the core jumps sideways
    diamond(ax + ri(-5, 5), ay + ri(-1, 1), 7 * cs, 'rgba(255,255,255,0.6)');
  diamond(ax, ay, 6 * cs + p * 2, '#fff');
  g.globalCompositeOperation = 'lighter';
  const hot = g.createRadialGradient(ax, ay, 0, ax, ay, 14 * cs);
  hot.addColorStop(0, `rgba(255,255,255,${0.5 + beat * 0.5})`); hot.addColorStop(1, 'rgba(255,40,40,0)');
  g.fillStyle = hot; g.fillRect(ax - 14 * cs, ay - 14 * cs, 28 * cs, 28 * cs);
  g.globalCompositeOperation = 'source-over';

  orbitLayer(true);
  if (S.mode === 'clear') { if (world.opt.podiums) drawFinale(ax, ay); else drawSealAssembly(ax, ay, k); }

  // 9) lightning: red bolts with a white-hot start
  for (const a of world.arcs) {
    for (let i = 1; i < a.pts.length; i++) {
      g.fillStyle = i < 3 || rnd() < 0.1 ? '#fff' : '#ff0000';
      pixLine(ax + a.pts[i - 1][0] * sc, ay + a.pts[i - 1][1] * sc, ax + a.pts[i][0] * sc, ay + a.pts[i][1] * sc);
    }
  }

  // 10) shock waves when a shard arrives: a red circle + a white diamond
  if (p > 0) {
    const rr2 = (1 - p) * 140;
    g.fillStyle = '#ff0000'; g.globalAlpha = p;
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * 6.283 + p;
      g.fillRect(Math.round(ax + Math.cos(a) * rr2), Math.round(ay + Math.sin(a) * rr2), 2, 2);
    }
    g.fillStyle = '#fff';
    dotSquare(ax, ay, (1 - p) * 110 * sc, 0, 80, 1);
    g.globalAlpha = 1;
  }

  // delivery zone ring — shows up when you're carrying shards
  if (player && (player.carried.length || (player.held && player.held.pure && !player.held.anim)) && S.mode === 'play') {
    const inside = Math.hypot(player.x, player.y) <= CFG.deliverRange;
    g.fillStyle = inside ? '#fff' : '#ff0000';
    g.globalAlpha = inside ? 0.8 : 0.45;
    for (let i = 0; i < 72; i++) {
      if ((i + Math.floor(S.t * 8)) % 3 === 0) continue;
      const a = i / 72 * 6.283 + S.t * 0.2;
      g.fillRect(Math.round(ax + Math.cos(a) * CFG.deliverRange), Math.round(ay + Math.sin(a) * CFG.deliverRange), 1, 1);
    }
    g.globalAlpha = 1;
  }
}

// LEVEL COMPLETE — the cutscene (T = seconds since the last shard arrived)
//   0.0  black bars slide in, the camera glides up, and your pieces leave
//        their orbits and spread into a big ring ABOVE The Anchor
//   1.2  one by one, around the circle like a clock hand, each piece flies in
//        and SNAPS into place (click!) — slightly overshooting, then settling
//   4.2  all in. It trembles... and LIGHTS UP: the cracks burn, then the whole
//        seal turns white-hot
//   5.2  the white light cools into BLUE
//   6.0  it collapses into a tiny blue light
//   6.5  the light hangs there for a moment... then drops down into The Anchor
//   7.2  BOOM: flash, light beams, three shock rings — the area is stabilized
const CLEAR = { fly0: 1.2, fly1: 3.6, flyDur: 0.6, hold: 4.2, light: 5.2, shrink: 6.0, hover: 6.5, done: 7.2, text: 7.9, enter: 8.6, end: 13 };
const SEAL_Y = -95;                                      // the seal is put together this far ABOVE The Anchor
// the "back" easing a piece flies in with (see drawSealAssembly). It reaches its
// spot when (u - 1) = -C1 / (C1 + 1), i.e. 37% of the way through the flight —
// that's the moment it CLICKS. (The rest is the overshoot settling back.)
const SNAP_C1 = 1.70158, SNAP_HIT = 1 / (SNAP_C1 + 1);

// where a piece waits in the big ring (angle = the direction of its spot).
// (positions are measured from the seal's middle; asX/asY were measured from The Anchor)
function hoverPose(s, T, R) {
  const slotA = Math.atan2(s.piece.cy, s.piece.cx), FR = R + 46;
  const u = Math.min(1, T / CLEAR.fly0), e = u * u * (3 - 2 * u);
  return [lerp(s.asX, Math.cos(slotA) * FR, e), lerp(s.asY - SEAL_Y, Math.sin(slotA) * FR, e) + Math.sin(T * 3 + s.bob) * 2 * e, s.asA + T * 0.8];
}
// a piece's spot in the seal, with the whole seal turned by rot
function sealSpot(s, rot) {
  const c = Math.cos(rot), sn = Math.sin(rot);
  return [(s.piece.cx * c - s.piece.cy * sn) * ART, (s.piece.cx * sn + s.piece.cy * c) * ART];
}
// where the tiny blue light is (T >= CLEAR.shrink): it hangs, bobbing, then
// DROPS into The Anchor — speeding up as it goes (u² = it accelerates)
function blueLightPos(T, ax, ay) {
  const sy = ay + SEAL_Y;
  if (T < CLEAR.hover) return [ax, sy + Math.sin((T - CLEAR.shrink) * 9) * 1.5];
  const u = clamp((T - CLEAR.hover) / (CLEAR.done - CLEAR.hover), 0, 1);
  return [ax, lerp(sy, ay, u * u)];
}

function drawSealAssembly(ax, ay, k) {
  const seal = world.seal, T = S.clearT, R = seal.rad * ART, sx = ax, sy = ay + SEAL_Y;
  const home = world.shards.filter(s => s.state === 'home');

  if (T >= CLEAR.done) {                                // IT'S IN THE ANCHOR: light beams + shock rings
    const u = T - CLEAR.done, ox = ax, oy = ay;
    g.save(); g.globalCompositeOperation = 'lighter';
    const grow = Math.min(1, u * 3), fade = Math.min(1, u * 4);
    for (let i = 0; i < 12; i++) {                      // pure red wedges (added as light), a white line in every other one
      const a = i / 12 * 6.283 + u * 0.3, len = (R * 3 + 220) * grow, wd = 0.035 + 0.02 * Math.sin(u * 3 + i);
      g.globalAlpha = (i % 2 ? 0.12 : 0.22) * fade; g.fillStyle = '#ff0000';
      g.beginPath(); g.moveTo(ox, oy);
      g.lineTo(ox + Math.cos(a - wd) * len, oy + Math.sin(a - wd) * len);
      g.lineTo(ox + Math.cos(a + wd) * len, oy + Math.sin(a + wd) * len); g.closePath(); g.fill();
      if (i % 2 === 0) {
        g.globalAlpha = 0.6 * fade; g.strokeStyle = '#fff'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.cos(a) * len, oy + Math.sin(a) * len); g.stroke();
      }
    }
    g.restore();
    glowAt(ox, oy, R * 2.4, R * 2.4, 0.8 + Math.max(0, 1 - u) * 0.8);
    if (u < 0.6) glowAt(ox, oy, 60 * (1 - u), 60 * (1 - u), (0.6 - u) * 1.6, GLOW_BLUE);   // the blue light flashing inside it
    if (u < 1.4) {                                      // three shock rings, one after another
      for (let r = 0; r < 3; r++) {
        const v = u - r * 0.18; if (v < 0 || v > 0.9) continue;
        g.fillStyle = r === 1 ? '#ff0000' : '#fff'; g.globalAlpha = 1 - v / 0.9;
        const rad = 12 + v * 330;
        for (let i = 0; i < 120; i++) { const a = i / 120 * 6.283; g.fillRect(Math.round(ox + Math.cos(a) * rad), Math.round(oy + Math.sin(a) * rad), 2, 2); }
      }
      g.globalAlpha = 1;
    }
    return;
  }

  if (T >= CLEAR.shrink) {                              // THE TINY BLUE LIGHT
    const [lx, ly] = blueLightPos(T, ax, ay), v = T - CLEAR.shrink;
    // the collapse: a burst of blue sparks flying out as the seal shrinks to nothing
    if (v < 0.5) {
      const e = v / 0.5, sc = Math.pow(1 - e, 2.2);       // it shrinks fast, then the last bit slowly
      glowAt(sx, sy, R * 1.6 * sc + 20, R * 1.6 * sc + 20, 1, GLOW_BLUE);
      g.fillStyle = '#7aa0ff'; g.beginPath(); g.arc(sx, sy, Math.max(1, R * sc), 0, 6.2832); g.fill();
      for (let i = 0; i < 28; i++) {
        const a = hash2(i, 1, 301) * 6.283, d = (R * 0.6 + e * (60 + hash2(i, 2, 301) * 80));
        g.globalAlpha = 1 - e; g.fillStyle = i % 3 ? '#6e96ff' : '#fff';
        g.fillRect(Math.round(sx + Math.cos(a) * d), Math.round(sy + Math.sin(a) * d), 2, 2);
      }
      g.globalAlpha = 1;
    }
    // a short trail of fading copies while it drops
    if (T > CLEAR.hover) for (let i = 6; i >= 1; i--) {
      const [tx, ty] = blueLightPos(T - i * 0.025, ax, ay);
      g.globalAlpha = (1 - i / 7) * 0.5; g.fillStyle = '#6e96ff'; g.fillRect(Math.round(tx) - 1, Math.round(ty) - 1, 2, 2);
    }
    g.globalAlpha = 1;
    const tw = 0.85 + 0.15 * Math.sin(T * 30);           // it twinkles
    glowAt(lx, ly, 26 * tw, 26 * tw, 0.9, GLOW_BLUE);
    glowAt(lx, ly, 9, 9, 1, PDOTS[0]);
    g.save(); g.globalCompositeOperation = 'lighter';    // a little blue star: a horizontal + vertical streak
    g.globalAlpha = 0.8 * tw; g.fillStyle = '#6e96ff';
    g.fillRect(Math.round(lx - 14 * tw), Math.round(ly), Math.round(28 * tw), 1);
    g.fillRect(Math.round(lx), Math.round(ly - 8 * tw), 1, Math.round(16 * tw));
    g.restore();
    g.fillStyle = '#fff'; g.fillRect(Math.round(lx) - 1, Math.round(ly) - 1, 3, 3);   // the hot white middle
    return;
  }

  if (T >= CLEAR.hold) {                                // WHOLE (still cracked) — and it LIGHTS UP
    const L = clamp((T - CLEAR.hold) / (CLEAR.light - CLEAR.hold), 0, 1);   // 0 -> 1: white-hot
    const B = clamp((T - CLEAR.light) / (CLEAR.shrink - CLEAR.light), 0, 1); // 0 -> 1: cooling into blue
    const tremble = 0.6 + L * 1.6 - B * 1.2;
    const ox = sx + rr(-tremble, tremble), oy = sy + rr(-tremble, tremble);
    glowAt(ox, oy, R * (1.8 + L), R * (1.8 + L), (0.4 + L) * (1 - B));       // red glow fading out...
    if (B > 0) glowAt(ox, oy, R * (2.4 + B), R * (2.4 + B), B, GLOW_BLUE);  // ...blue glow taking over
    for (const s of home) { const [px, py] = sealSpot(s, 0); drawShard(s, ox + px, oy + py, ART, 0, 0.12, 0, true); }
    const lines = home.map(s => [...s.piece.poly, s.piece.poly[0]]);
    g.save(); g.globalAlpha = Math.min(1, 0.3 + L * 1.5); crackLines(lines, ox, oy); g.restore();   // the cracks burn
    // the light: a white-hot disc over the seal, fading in — then turning blue
    const heat = smoothstep(clamp((L - 0.35) / 0.65, 0, 1));
    if (heat > 0) {
      g.globalAlpha = heat;
      g.fillStyle = B > 0 ? `rgb(${Math.round(lerp(255, 120, B))},${Math.round(lerp(255, 160, B))},255)` : '#fff';
      g.beginPath(); g.arc(ox, oy, R + 0.5, 0, 6.2832); g.fill();
      g.globalAlpha = 1;
    }
    return;
  }

  for (const s of home) {                               // GATHERING + ASSEMBLING (above The Anchor)
    const [tx, ty] = sealSpot(s, 0);
    let x, y, a, glow = 0.7;
    if (T < s.asT) [x, y, a] = hoverPose(s, T, R);      // spread out and wait, turning slowly
    else {
      const [hx, hy, ha] = hoverPose(s, s.asT, R);      // fly in from where it was waiting
      const u = Math.min(1, (T - s.asT) / CLEAR.flyDur);
      // "back" easing: it shoots a little PAST its spot, then settles back = a satisfying snap
      const c1 = SNAP_C1, e = 1 + (c1 + 1) * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
      x = lerp(hx, tx, e); y = lerp(hy, ty, e);
      const turn = ((-ha % 6.283) + 9.425) % 6.283 - 3.1416;   // shortest way round to angle 0
      a = ha + turn * Math.min(1, u * 1.3); glow = u < 1 ? 1 : 0.15;
    }
    drawShard(s, sx + x, sy + y, ART, k * 0.3, glow, a, true);
  }
}

<script>
// V0ID3D — portal.js: The Portal, its ending (tunnel, warp, the dot) and the star dimension
"use strict";

// =====================================================================
//  THE BLUE PORTAL — the one thing in V0ID3D that is NOT red or glitchy.
//  Calm, smooth and deep: a window into another space, inspired by the
//  End portal's starfield. Everything here moves slowly and smoothly.
// =====================================================================
// the rim's shape: an oval that gently breathes (smooth sine waves only)
const portalShape = (a, t) => 1 + 0.028 * Math.sin(a * 3 + t * 0.7) + 0.016 * Math.sin(a * 5 - t * 1.1) + 0.007 * Math.sin(a * 8 + t * 1.7);

// drawn in TWO passes: 'outer' (halo, rays, specks) goes BEFORE the bloom so
// it glows; 'inner' (the dark window, rim, motes) goes AFTER, so the glow
// can't wash blue haze over the deep, dark inside
function drawPortal(camX, camY, pass) {
  const P = world.portal; if (!P) return;
  const sx = P.x - camX, sy = P.y - camY, T = S.t, RX = P.rx, RY = P.ry;
  if (sx < -320 || sx > W + 320 || sy < -320 || sy > H + 320) return;
  const rim = k => { g.beginPath();
    for (let i = 0; i <= 72; i++) { const a = i / 72 * 6.283, m = portalShape(a, T) * k; i ? g.lineTo(sx + Math.cos(a) * RX * m, sy + Math.sin(a) * RY * m) : g.moveTo(sx + Math.cos(a) * RX * m, sy + Math.sin(a) * RY * m); }
    g.closePath(); };

  if (pass === 'inner') return drawPortalInner(sx, sy, RX, RY, T, rim, P);

  // 0) SPACE BENDS AROUND IT. Take a snapshot of everything already drawn
  //    around the portal, then paint it back in thin rings — each ring turned
  //    a bit more (and pulled in a bit more) the closer it is to the rim.
  //    The void itself gets twisted into a slowly spinning whirlpool.
  // (only the square around the portal is copied and redrawn — copying the
  // whole screen 12+ times a frame was the biggest cause of lag)
  const R0 = RY * 0.95, R1 = RY * 3.8, NR = 12;
  const bx = Math.max(0, Math.floor(sx - R1 * 1.3)), by = Math.max(0, Math.floor(sy - R1 * 1.3));
  const bw = Math.min(W, Math.ceil(sx + R1 * 1.3)) - bx, bh = Math.min(H, Math.ceil(sy + R1 * 1.3)) - by;
  if (bw <= 0 || bh <= 0) return;
  psg.globalCompositeOperation = 'copy'; psg.drawImage(cv, bx, by, bw, bh, bx, by, bw, bh);
  for (let k = NR - 1; k >= 0; k--) {                   // outside ring first
    const u0 = k / NR, u1 = (k + 1) / NR, r0 = lerp(R0, R1, u0), r1 = lerp(R0, R1, u1);
    const f = 1 - (u0 + u1) / 2;                         // 1 = at the rim ... 0 = far out
    // the twist SWAYS (sin) instead of growing forever — if it kept growing,
    // neighbouring rings would drift further and further apart into a mess
    const twist = f * f * (0.9 + 0.4 * Math.sin(T * 0.45)), pinch = 1 + f * f * 0.22;
    // the outermost ring barely moves (under half a pixel) — redrawing it
    // would look exactly the same, so skip it (it's the biggest, slowest one)
    if (r1 * (twist + pinch - 1) < 0.5) continue;
    const q0 = lerp(RX / RY, 1, u0), q1 = lerp(RX / RY, 1, u1);   // oval near the rim -> round further out
    g.save(); g.beginPath();
    g.ellipse(sx, sy, r1 * q1, r1, 0, 0, 6.2832); g.ellipse(sx, sy, r0 * q0, r0, 0, 0, 6.2832);
    g.clip('evenodd');                                   // = only the ring between the two ovals
    g.translate(sx, sy); g.rotate(twist); g.scale(pinch, pinch); g.translate(-sx, -sy);
    // only the square this ring actually covers (the inner rings are small)
    const rq = r1 * 1.15, qx = Math.max(bx, Math.floor(sx - rq)), qy = Math.max(by, Math.floor(sy - rq));
    const qw = Math.min(bx + bw, Math.ceil(sx + rq)) - qx, qh = Math.min(by + bh, Math.ceil(sy + rq)) - qy;
    if (qw > 0 && qh > 0) g.drawImage(psnap, qx, qy, qw, qh, qx, qy, qw, qh);
    g.restore();
  }
  // a shadow just outside the rim: the ground falls away into the hole
  const sh = g.createRadialGradient(sx, sy, RY * 0.9, sx, sy, RY * 1.9);
  sh.addColorStop(0, 'rgba(0,0,0,0.8)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(sx - RY * 2, sy - RY * 2, RY * 4, RY * 4);

  // 1) a huge soft blue halo, slowly breathing
  glowAt(sx, sy, RX * 4.5, RY * 3.6, 0.5 + 0.12 * Math.sin(T * 1.3), GLOW_BLUE);
  // cracks in the void around it, crackling with blue-white lightning
  drawBolts(P.cracks.map((ln, i) => [ln, 500 + i]), sx, sy, BLUE_BOLTS);

  // 2) faint light rays slowly turning
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = '#6f5cff';
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * 6.283 + T * 0.12, len = RY * (3.2 + Math.sin(T * 0.8 + i * 2) * 0.6), wd = 0.035;
    g.globalAlpha = 0.06 + 0.035 * Math.sin(T * 1.1 + i);
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a - wd) * len, sy + Math.sin(a - wd) * len * 0.85);
    g.lineTo(sx + Math.cos(a + wd) * len, sy + Math.sin(a + wd) * len * 0.85); g.closePath(); g.fill();
  }
  // 3) specks of light being SUCKED IN on spiral paths
  for (let i = 0; i < 28; i++) {
    const ph = ((T * (0.12 + (i % 5) * 0.02) + i * 0.137) % 1);        // 0 = far out ... 1 = reaches the rim
    const a = i * 2.4 + (1 - ph) * 3.2 + T * 0.2, r = 1 + Math.pow(1 - ph, 1.3) * 2.4;
    const x = sx + Math.cos(a) * RX * r, y = sy + Math.sin(a) * RY * r * 0.9, s = 2 + (1 - ph) * 3;
    g.globalAlpha = Math.min(1, ph * 3) * Math.min(1, (1 - ph) * 6) * 0.9;
    g.drawImage(PDOTS[i % PDOTS.length], x - s, y - s, s * 2, s * 2);
  }
  g.restore();
}

// the Portal's window gets painted on its OWN little canvas first. That way we
// can fade its edge out afterwards (see-through + blurry) before putting it on
// the screen — cutting it with clip() only ever gives a hard, sharp edge
const pwin = makeCanvas(8, 8), pwc = pwin.getContext('2d');

function drawPortalInner(sx, sy, RX, RY, T, rim, P) {
  // 4) THE WINDOW: deep space, painted around (lx, ly) = the middle of the little canvas
  const ww = Math.ceil(RX * 2.5) + 4, wh = Math.ceil(RY * 2.5) + 4;
  if (pwin.width !== ww || pwin.height !== wh) { pwin.width = ww; pwin.height = wh; }
  const pc = pwc, lx = ww / 2, ly = wh / 2;
  pc.save(); pc.globalCompositeOperation = 'source-over'; pc.globalAlpha = 1;
  const bg = pc.createRadialGradient(lx, ly, 0, lx, ly, RY * 1.1);
  bg.addColorStop(0, '#1a1052'); bg.addColorStop(0.55, '#0a0628'); bg.addColorStop(1, '#030110');
  pc.fillStyle = bg; pc.fillRect(0, 0, ww, wh);
  pc.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {                           // faint, slow nebula clouds
    const a = T * (0.09 + i * 0.04) + i * 2.1, s = RX * (1.1 + i * 0.25);
    pc.globalAlpha = 0.07; pc.drawImage(PDOTS[i === 1 ? 4 : 2], lx + Math.cos(a) * RX * 0.45 - s, ly + Math.sin(a) * RY * 0.4 - s, s * 2, s * 2);
  }
  // TUNNEL RINGS: faint ovals that keep shrinking toward the middle, forever —
  // it feels like the portal goes on and on, deep into the distance
  pc.strokeStyle = '#8b6dff'; pc.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const k = 1 - ((T * 0.18 + i / 6) % 1);               // 1 = at the rim ... 0 = deep in the middle
    pc.globalAlpha = 0.28 * k * k;
    pc.beginPath(); pc.ellipse(lx, ly, RX * k, RY * k, 0, 0, 6.2832); pc.stroke();
  }
  // the starfield: 5 layers at different DEPTHS. The deepest layer barely
  // moves when the portal slides across your screen, the nearest moves most —
  // that difference (parallax) is what makes it look like you're looking INTO
  // it. Each layer also slowly swirls, in alternating directions.
  const offBaseX = W / 2 - sx, offBaseY = H / 2 - sy, span = RY * 1.25;
  for (let L = 0; L < 5; L++) {
    const p = 0.12 + L * 0.16, cell = 19 - L * 2.2, size = 0.8 + L * 0.45;
    const rot = T * (L % 2 ? -1 : 1) * (0.04 + L * 0.025), c = Math.cos(rot), s = Math.sin(rot);
    const offX = offBaseX * (1 - p) * 0.6, offY = offBaseY * (1 - p) * 0.6;
    // which grid cells land inside the window? (undo the swirl + slide to find out)
    const qx0 = -(offX * c + offY * s), qy0 = -(-offX * s + offY * c);
    for (let i = Math.floor((qx0 - span) / cell); i <= Math.floor((qx0 + span) / cell); i++)
      for (let j = Math.floor((qy0 - span) / cell); j <= Math.floor((qy0 + span) / cell); j++) {
        const h = hash2(i, j, 300 + L); if (h > 0.6) continue;
        const qx = i * cell + hash2(i, j, 310 + L) * cell, qy = j * cell + hash2(i, j, 320 + L) * cell;
        const x = lx + offX + qx * c - qy * s, y = ly + offY + qx * s + qy * c;
        if (Math.abs(x - lx) > RX * 1.2 || Math.abs(y - ly) > RY * 1.2) continue;
        const tw = 0.5 + 0.5 * Math.sin(T * (0.8 + h * 3) + h * 40);          // twinkle
        const sz = size * (0.55 + h) * (h < 0.04 ? 2.2 : 1);                 // a few big bright ones
        pc.globalAlpha = (0.3 + 0.7 * tw) * (0.45 + p * 0.7);
        pc.drawImage(PDOTS[(hash2(i, j, 330 + L) * 4) | 0], x - sz, y - sz, sz * 2, sz * 2);
      }
  }
  // LIGHTNING flickering across the deep inside: a new bolt ~9 times a second,
  // from one side of the rim to the other, wiggling most in the middle
  const lb = Math.floor(T * 9);
  pc.lineWidth = 1;
  for (let n = 0; n < 2; n++) {
    if (hash2(lb, n, 91) > 0.35) continue;
    const a1 = hash2(lb, n, 92) * 6.283, a2 = a1 + 2 + hash2(lb, n, 93) * 2.3;
    const x0 = lx + Math.cos(a1) * RX * 0.9, y0 = ly + Math.sin(a1) * RY * 0.9;
    const x1 = lx + Math.cos(a2) * RX * 0.9, y1 = ly + Math.sin(a2) * RY * 0.9;
    for (const [col, jit] of [['#6b5cff', 1.6], [n ? '#c9b8ff' : '#fff', 1]]) {
      pc.strokeStyle = col; pc.beginPath(); pc.moveTo(x0, y0);
      for (let s = 1; s <= 7; s++) {
        const f = s / 7, wig = (1 - Math.abs(f - 0.5) * 2) * 8 * jit;
        pc.lineTo(lerp(x0, x1, f) + (hash2(lb * 7 + s, n, 94) - 0.5) * wig, lerp(y0, y1, f) + (hash2(lb * 7 + s, n, 95) - 0.5) * wig);
      }
      pc.stroke();
    }
  }
  // THE BLURRY SEE-THROUGH EDGE: 'destination-in' keeps only as much of the
  // picture as the paint we put on top — solid paint keeps it, see-through
  // paint makes it see-through. So an oval gradient from solid (middle) to
  // nothing (edge) makes the window melt away into the void around it.
  pc.globalCompositeOperation = 'destination-in'; pc.globalAlpha = 1;
  pc.translate(lx, ly); pc.scale(RX / RY, 1);             // squash a circle into the portal's oval
  const fade = pc.createRadialGradient(0, 0, RY * 0.35, 0, 0, RY * 1.12);
  fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(0.5, 'rgba(0,0,0,0.8)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  pc.fillStyle = fade; pc.fillRect(-RY * 2, -RY * 2, RY * 4, RY * 4);
  pc.restore();
  g.drawImage(pwin, Math.round(sx - lx), Math.round(sy - ly));

  // 5) THE EDGE = LIGHTNING. No solid rim line any more — just arcs of
  //    electricity crawling around the rim, striking somewhere new every
  //    split second, plus short sparks jumping off it.
  drawRimLightning(sx, sy, RX, RY, T);

  // 6) motes of light orbiting it on a tilted ring, with little tails
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++) {
    for (let k = 0; k < 5; k++) {                          // k = 0 is the mote, 1..4 its fading tail
      const a = T * 0.9 + i / 12 * 6.283 - k * 0.07;
      const x = sx + Math.cos(a) * RX * 1.55, y = sy + Math.sin(a) * RY * 0.55 + Math.sin(a * 2 + i) * 3;
      const s = (k ? 2.2 : 3.4) * (1 - k * 0.15);
      g.globalAlpha = (1 - k * 0.22) * (Math.sin(a) > 0 ? 0.95 : 0.4);   // dimmer when "behind" the portal
      g.drawImage(PDOTS[i % 2 ? 3 : 0], x - s, y - s, s * 2, s * 2);
    }
  }
  g.restore();
}

// THE PORTAL'S EDGE, made of lightning. Each arc hugs the rim for a random
// stretch, lives a split second, then strikes again somewhere else — together
// they draw the portal's outline, but it's never the same twice.
function drawRimLightning(sx, sy, RX, RY, T) {
  const bolts = [];
  for (let i = 0; i < 10; i++) {                        // ARCS along the rim
    const life = 0.16 + hash2(i, 1, 211) * 0.22;          // each lives 0.16-0.38 s...
    const sd = Math.floor(T / life + hash2(i, 2, 211)) * 29 + i;   // ...then a new one (new random numbers)
    const a0 = hash2(sd, 3, 211) * 6.283, span = (0.7 + hash2(sd, 4, 211) * 1.1) * (hash2(sd, 5, 211) < 0.5 ? 1 : -1);
    const ln = [];
    for (let s = 0; s <= 9; s++) {
      const a = a0 + span * s / 9, m = portalShape(a, T) * (1 + (hash2(sd * 11 + s, 6, 211) - 0.5) * 0.24);
      ln.push([sx + Math.cos(a) * RX * m, sy + Math.sin(a) * RY * m]);
    }
    bolts.push([ln, 1400 + i, true]);
  }
  for (let i = 0; i < 7; i++) {                         // SPARKS jumping off it (mostly out, some in)
    const sd = Math.floor(T * 3.5 + i * 0.41) * 37 + i;
    if (hash2(sd, 1, 213) > 0.65) continue;
    const a = hash2(sd, 2, 213) * 6.283, m = portalShape(a, T), len = 7 + hash2(sd, 3, 213) * 14;
    let x = sx + Math.cos(a) * RX * m, y = sy + Math.sin(a) * RY * m, h = a + (hash2(sd, 4, 213) < 0.7 ? 0 : Math.PI);
    const ln = [[x, y]];
    for (let s = 0; s < 5; s++) { h += (hash2(sd * 7 + s, 5, 213) - 0.5) * 1.3; x += Math.cos(h) * len / 5; y += Math.sin(h) * len / 5; ln.push([x, y]); }
    bolts.push([ln, 1450 + i]);
  }
  // a soft glow under the bolts (the inside is drawn after the bloom, so it
  // doesn't glow by itself) — it follows the lightning, not a smooth ring
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#5b3dff'; g.lineJoin = 'round';
  g.beginPath(); for (const [ln] of bolts) ln.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.lineWidth = 9; g.globalAlpha = 0.12; g.stroke();
  g.lineWidth = 5; g.globalAlpha = 0.28; g.stroke();
  g.restore();
  drawBolts(bolts, 0, 0, BLUE_BOLTS);
}

// SMOOTH RANDOM: a random value at every whole step of t, blended smoothly in
// between — so it wanders randomly but never jumps. (i = which one, seed = which kind)
function vnoise(i, t, seed) {
  const a = Math.floor(t), f = t - a, s = f * f * (3 - 2 * f);
  return lerp(hash2(i, a, seed), hash2(i, a + 1, seed), s);
}

// IN THE PORTAL'S MIDDLE — it works like the time-out effect, but it's The
// Portal's own space closing in. It FADES in smoothly and it's SEE-THROUGH:
// a soft glow of starry blue/purple space that thickens toward the screen
// edges, with lightning reaching for you from its rim. k = 0..1 grows while
// you stay. It never hurts you.
function drawPortalTunnel(k, px, py) {
  const T = S.t, cx = W / 2, cy = H / 2;
  const kk = k * k * (3 - 2 * k);                            // smoothstep: eases in, no sudden switch
  const size = 1.5 - kk * 0.95, ax = W * 0.5 * size, by = H * 0.5 * size;
  const rimPts = [];                                          // the rim breathes (smooth waves only)
  for (let i = 0; i < 96; i++) {
    const a = i / 96 * 6.283, m = 1 + 0.04 * Math.sin(a * 3 + T * 0.3) + 0.025 * Math.sin(a * 5 - T * 0.45);
    rimPts.push([cx + Math.cos(a) * ax * m, cy + Math.sin(a) * by * m]);
  }
  // 1) The Portal's space: a see-through glow, clear in the middle and
  //    thicker toward the edges (an oval gradient — squash a circle with scale)
  g.save(); g.translate(cx, cy); g.scale(1, by / ax);
  const gr = g.createRadialGradient(0, 0, ax * 0.78, 0, 0, ax * 1.5);
  gr.addColorStop(0, 'rgba(60,35,170,0)'); gr.addColorStop(0.35, `rgba(60,35,170,${0.22 * kk})`); gr.addColorStop(1, `rgba(22,10,80,${0.72 * kk})`);
  g.fillStyle = gr; g.fillRect(-W * 2, -W * 2, W * 4, W * 4);
  g.restore();
  // its stars only show in the glow (the further out, the more you see)
  g.save(); g.globalCompositeOperation = 'lighter';
  const cell = 18;
  for (let i = -1; i <= W / cell; i++) for (let j = -1; j <= H / cell; j++) {
    const h = hash2(i, j, 131); if (h > 0.5) continue;
    const x = i * cell + hash2(i, j, 132) * cell + (T * 2) % cell, y = j * cell + hash2(i, j, 133) * cell;
    const v = clamp((Math.hypot((x - cx) / ax, (y - cy) / by) - 0.85) / 0.5, 0, 1) * kk;
    if (v < 0.02) continue;
    const tw = 0.5 + 0.5 * Math.sin(T * (0.4 + h * 1.2) + h * 30), s = 1 + h * 3;
    g.globalAlpha = v * (0.35 + tw * 0.6); g.drawImage(PDOTS[(hash2(i, j, 134) * 4) | 0], x - s, y - s, s * 2, s * 2);
  }
  g.restore();
  // (no line along its rim — it's just soft space fading in)
  // 2) LIGHTNING REACHING FOR YOU from the rim — more, longer and thicker as k grows
  const n = Math.round(4 + kk * 12), slow = Math.floor(T * 0.8), bolts = [];
  for (let i = 0; i < n; i++) {
    const [x0, y0] = rimPts[Math.floor(((i / n) + T * 0.004) % 1 * rimPts.length)];
    const f = Math.min(0.92, (0.25 + kk * 0.7) * (0.7 + 0.3 * hash2(i, 1, 141)));
    const ex = lerp(x0, px, f), ey = lerp(y0, py, f), len = Math.hypot(ex - x0, ey - y0) || 1;
    const nx = -(ey - y0) / len, ny = (ex - x0) / len, ln = [];
    for (let s = 0; s <= 9; s++) {
      const u = s / 9, wig = (hash2(i * 17 + s, slow, 142) - 0.5) * Math.min(26, len * 0.2) * Math.sin(u * Math.PI);
      ln.push([lerp(x0, ex, u) + nx * wig, lerp(y0, ey, u) + ny * wig]);
    }
    bolts.push([ln, 800 + i]);
  }
  if (kk > 0.3) {                                           // thicker: a wide soft purple glow under the bolts
    g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#5b3dff'; g.globalAlpha = (kk - 0.3) * 0.5; g.lineWidth = 3 + kk * 5;
    g.beginPath(); for (const [ln] of bolts) ln.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.restore();
  }
  drawBolts(bolts, 0, 0, BLUE_BOLTS, Math.min(1, kk * 1.6));
}

// THE STORM (during the portal sequence): long blue bolts crackling all
// across the screen — more and more of them. Each one lives ~0.4 s.
function drawWarpStorm(t) {
  const cx = W / 2, cy = H / 2, grow = Math.min(1, t / WARP.whole), n = Math.round(5 + grow * 25), bolts = [];
  for (let i = 0; i < n; i++) {
    const sd = Math.floor(t * 2.5 + i * 0.37) * 53 + i;      // each bolt lives ~0.4 s, then a new one
    const a0 = hash2(sd, 1, 161) * 6.283, a1 = a0 + (hash2(sd, 2, 161) - 0.5) * 2.6;
    const r0 = (0.35 + hash2(sd, 3, 161) * 0.9) * W * 0.5, r1 = hash2(sd, 4, 161) * W * 0.3;
    const x0 = cx + Math.cos(a0) * r0, y0 = cy + Math.sin(a0) * r0 * 0.6, x1 = cx + Math.cos(a1) * r1, y1 = cy + Math.sin(a1) * r1 * 0.6;
    const len = Math.hypot(x1 - x0, y1 - y0) || 1, nx = -(y1 - y0) / len, ny = (x1 - x0) / len, ln = [];
    for (let s = 0; s <= 10; s++) {
      const u = s / 10, wig = (hash2(sd * 11 + s, 5, 161) - 0.5) * Math.min(40, len * 0.25) * Math.sin(u * Math.PI);
      ln.push([lerp(x0, x1, u) + nx * wig, lerp(y0, y1, u) + ny * wig]);
    }
    bolts.push([ln, 1000 + i, true]);
  }
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#5b3dff'; g.globalAlpha = 0.35 + grow * 0.3; g.lineWidth = 4 + grow * 4;
  g.beginPath(); for (const [ln] of bolts) ln.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.restore();
  drawBolts(bolts, 0, 0, BLUE_BOLTS);
}

// THE WARP: copy the finished picture and paint it back in rings around the
// middle. Each ring is twisted, rippled and nudged by its OWN smooth random
// values (so it's never neat circles), starting at the edges and spreading in.
// At the same time the whole screen BENDS BACKWARDS — the outer rings are
// squeezed toward the middle, like a ball curving away from you — and the
// edges and corners sink into the dark. Then it all shrinks into the dot.
function applyWarp(t) {
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2 + 4;
  const reach = clamp(t / WARP.whole, 0, 1), r0 = R * (1 - reach);       // the twisting happens OUTSIDE r0
  const strength = Math.min(1, t / 6), bend = Math.min(1, t / WARP.whole);
  sg.globalCompositeOperation = 'source-over'; sg.drawImage(cv, 0, 0);
  // fade the picture's OWN edges to black first — in an oval that matches the
  // screen — so when it's squeezed and twisted, no straight rectangle edge shows
  sg.save(); sg.translate(cx, cy); sg.scale(1, H / W);
  // (in these squashed units the screen's border is exactly W/2 away in every direction)
  const fe = sg.createRadialGradient(0, 0, W * 0.5 * (0.98 - 0.5 * bend), 0, 0, W * 0.5);
  fe.addColorStop(0, 'rgba(0,0,0,0)'); fe.addColorStop(1, `rgba(0,0,0,${Math.min(1, bend * 5)})`);
  sg.fillStyle = fe; sg.fillRect(-W, -W, W * 2, W * 2); sg.restore();
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const NR = 14;
  for (let k = NR - 1; k >= 0; k--) {
    const ra = R * k / NR, rb = R * (k + 1) / NR, rm = (ra + rb) / 2;
    const e = clamp((rm - r0) / Math.max(1, R - r0), 0, 1);               // 0 = not reached yet ... 1 = the screen edge
    // (the t * numbers = how fast each ring changes its mind — kept slow and dreamy)
    const twist = strength * Math.pow(e, 1.5) * ((vnoise(k, t * 0.25, 151) - 0.5) * 2.4 + 0.35);   // random amount AND direction
    const ripple = 1 + strength * e * 0.16 * (vnoise(k, t * 0.8, 152) - 0.5) * 2;
    const ox = strength * e * (vnoise(k, t * 0.55, 153) - 0.5) * 12, oy = strength * e * (vnoise(k, t * 0.55, 154) - 0.5) * 8;
    const back = 1 - 0.38 * bend * Math.pow(rm / R, 2);                   // bending backwards: squeeze the outside inward
    g.save(); g.beginPath();
    g.arc(cx, cy, rb, 0, 6.2832); if (ra > 0.5) g.arc(cx, cy, ra, 0, 6.2832); g.clip('evenodd');
    g.translate(cx + ox, cy + oy); g.rotate(twist); g.scale(ripple * back, ripple * back); g.translate(-cx, -cy);
    g.drawImage(scratch, 0, 0);
    g.restore();
  }
  // the edges and corners sink into the dark (a round shadow — no rectangle)
  g.save(); g.translate(cx, cy); g.scale(1, H / W);
  const dark = g.createRadialGradient(0, 0, W * 0.5 * (0.95 - 0.55 * bend), 0, 0, W * 0.53);
  dark.addColorStop(0, 'rgba(0,0,0,0)'); dark.addColorStop(1, `rgba(0,0,0,${Math.min(1, 0.4 + bend * 1.2)})`);
  g.fillStyle = dark; g.fillRect(-W, -W, W * 2, W * 2); g.restore();

  if (t > WARP.whole) {                                                   // it all SHRINKS into the dot
    const u = clamp((t - WARP.whole) / (WARP.zoom - WARP.whole), 0, 1), s = Math.pow(1 - u, 2.4);
    sg.drawImage(cv, 0, 0);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);

//  in 3D: 50 flat layers of star-grids, one behind the other. A star's
//  spot on screen = its position DIVIDED by how far away its layer is —
//  that's "perspective": far layers look small and tightly packed (so they
//  blur into billions), near ones are big and spread out. You drift slowly
//  forward through the layers, forever, and WASD floats you around.

const STAR = {

const STAR_GLOW = (() => {
  const s = 64, c = makeCanvas(s, s), x = c.getContext('2d'), h = s / 2, gr = x.createRadialGradient(h, h, 0, h, h, h);
  gr.addColorStop(0, 'rgba(245,247,255,1)'); gr.addColorStop(0.1, 'rgba(205,215,255,0.95)'); gr.addColorStop(0.28, 'rgba(150,172,255,0.45)');

function updateStars(dt) {

  if (keys.a || keys.arrowleft) ix--;

  nextDot: 0.7,    // pause between one dot and the next
