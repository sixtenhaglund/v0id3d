        // they never come this close to The Anchor (its light is your safe zone)

// =====================================================================
//  AUTO-UPDATE (website only). When you quit to the menu or restart, the
//  game quietly asks the website "is there a newer version?" by reading a
//  tiny file, version.json. If its number is different from BUILD_ID, it
//  reloads into the new version. build-site.js stamps a real number in here
//  for the website; 'dev' (your own copy) never checks.
// =====================================================================
const BUILD_ID = '20261011124105';
// THE PUBLIC LOCK: true = the website/app won't start, it just says
// "NO IVAR. NO." (your own 'dev' copy always plays). false = everyone can play.
const PUBLIC_LOCKED = false;
function checkForUpdate(then = null, resume = null) {
  if (BUILD_ID === 'dev' || location.protocol === 'file:') { if (then) then(); return; }
  if (S.checking) return;
  S.checking = true;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })   // ?t= = never use an old saved copy
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      S.checking = false;
      // (only reload on a menu — never in the middle of a run you just started)
      if (v && v.build && v.build !== BUILD_ID && (S.mode === 'title' || S.mode === 'dead')) {
        try { sessionStorage.setItem('v0id3d_updated', JSON.stringify({ resume })); } catch (e) {}
        location.replace(location.pathname + '?v=' + v.build);   // a new address = the browser can't reuse the old page
      } else if (then) then();
    })
    .catch(() => { S.checking = false; if (then) then(); });   // offline? just keep playing
}

<script>
// V0ID3D — engine.js: the basics everything else uses: the canvas, random numbers, the pixel font, textures and the Rift sprites
"use strict";

// =====================================================================
//  CANVAS — we draw at a LOW resolution and let CSS blow it up.
//  Every game pixel becomes a PX x PX square on screen.
// =====================================================================
const cv = document.getElementById('c');
let g = cv.getContext('2d');                 // (let, not const: the HUD swaps it for a moment to draw a piece on its own layer — see hudLayer in purify.js)
let W = 640, H = 360, PX = 3;

// scratch canvases for screen effects
const scratch = document.createElement('canvas');
const sg = scratch.getContext('2d');
const redCopy = document.createElement('canvas');
const rg = redCopy.getContext('2d');
const psnap = document.createElement('canvas');            // snapshot of the world around the portal
const psg = psnap.getContext('2d');

// HOW MUCH OF THE MAP YOU SEE. It's measured in the screen's REAL pixels
// (innerWidth x devicePixelRatio). Browser zoom (Ctrl + scroll) changes
// innerWidth but not the real pixels — so zooming out can't show you more
// of the map any more. And nobody ever sees more than VIEW_W x VIEW_H game
// pixels: a bigger or wider window just gets black bars, not more vision.
const VIEW_W = 640, VIEW_H = 360;
function resize() {
  const dpr = devicePixelRatio || 1, devW = innerWidth * dpr, devH = innerHeight * dpr;
  PX = Math.max(1, Math.round(devH / VIEW_H));     // how many REAL pixels one game pixel is (a whole number = sharp)
  W = Math.max(8, Math.min(VIEW_W, Math.ceil(devW / PX)));   // (never 0 wide/tall — a squashed window would crash the drawing)
  H = Math.max(8, Math.min(VIEW_H, Math.ceil(devH / PX)));
  for (const c of [cv, scratch, psnap]) { c.width = W; c.height = H; }
  redCopy.width = Math.ceil(W / 2); redCopy.height = Math.ceil(H / 2);   // the red ghost is made at half size (4x cheaper)
  rg.imageSmoothingEnabled = false;
  const cw = W * PX / dpr, ch = H * PX / dpr;       // its size on the page (in browser pixels)
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = Math.max(0, (innerWidth - cw) / 2) + 'px';   // centred (black bars around it if the window is bigger)
  cv.style.top = Math.max(0, (innerHeight - ch) / 2) + 'px';
  g.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

// =====================================================================
//  SEEDED RANDOM — same seed = same map. That's how procedural
//  generation stays consistent while the level is being played.
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// hash two numbers into 0..1 (used for stars, so they need no storage)
function hash2(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const rnd = Math.random;
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smoothstep = u => u * u * (3 - 2 * u);            // 0..1 -> 0..1 with a slow start and a slow end
const lerp = (a, b, t) => a + (b - a) * t;

// =====================================================================
//  PIXEL FONT — every letter is 5x7 pixels, stored as 7 rows in hex.
//  "0E" = 01110 = .###.
// =====================================================================
const FONT_HEX = {
  A:'0E11111F111111', B:'1E11111E11111E', C:'0E11101010110E', D:'1E11111111111E',
  E:'1F10101E10101F', F:'1F10101E101010', G:'0E11101711110F', H:'1111111F111111',
  I:'0E04040404040E', J:'0702020202120C', K:'11121418141211', L:'1010101010101F',
  M:'111B1515111111', N:'11111915131111', O:'0E11111111110E', P:'1E11111E101010',
  Q:'0E11111115120D', R:'1E11111E141211', S:'0F10100E01011E', T:'1F040404040404',
  U:'1111111111110E', V:'11111111110A04', W:'1111111515150A', X:'11110A040A1111',
  Y:'11110A04040404', Z:'1F01020408101F',
  '0':'0E11131519110E', '1':'040C040404040E', '2':'0E11010204081F', '3':'1F02040201110E',
  '4':'02060A121F0202', '5':'1F101E0101110E', '6':'0608101E11110E', '7':'1F010204080808',
  '8':'0E11110E11110E', '9':'0E11110F01020C',
  ':':'000C0C000C0C00', '.':'00000000000C0C', '/':'01020204080810', '-':'0000001F000000',
  '!':'04040404040004', '?':'0E110102040004', '[':'0E08080808080E', ']':'0E02020202020E',
  '>':'08040201020408', '<':'02040810080402', '_':'0000000000001F', '+':'0004041F040400',
  ' ':'00000000000000', "'":'04040800000000', ',':'00000000040408',
};
const FONT = {};
for (const k in FONT_HEX) {
  const h = FONT_HEX[k], rows = [];
  for (let i = 0; i < 7; i++) rows.push(parseInt(h.substr(i * 2, 2), 16));
  FONT[k] = rows;
}
const textWidth = (s, sc = 1) => s.length * 6 * sc - sc;

// draw text. glitch 0..1 makes rows slide, pixels drop and a red ghost appear
function text(s, x, y, sc = 1, col = '#fff', glitch = 0, align = 'left') {
  s = String(s).toUpperCase();
  if (align === 'center') x -= textWidth(s, sc) / 2;
  else if (align === 'right') x -= textWidth(s, sc);
  x = Math.round(x); y = Math.round(y);
  const passes = glitch > 0 && rnd() < glitch * 0.8 ? 2 : 1;
  for (let p = passes - 1; p >= 0; p--) {
    const ox = p ? ri(-2, 2) * sc : 0, oy = p ? ri(-1, 1) * sc : 0;
    g.fillStyle = p ? '#ff0000' : col;
    for (let r = 0; r < 7; r++) {
      const shift = glitch > 0 && rnd() < glitch * 0.12 ? ri(-3, 3) * sc : 0;
      for (let i = 0; i < s.length; i++) {
        const gl = FONT[s[i]] || FONT['?'];
        const bits = gl[r];
        if (!bits) continue;
        for (let c = 0; c < 5; c++) {
          if (bits & (16 >> c)) {
            if (glitch > 0 && rnd() < glitch * 0.06) continue;
            g.fillRect(x + ox + shift + (i * 6 + c) * sc, y + oy + r * sc, sc, sc);
          }
        }
      }
    }
  }
}

// =====================================================================
//  TEXTURES — made once at startup, pixel by pixel, with ImageData.
// =====================================================================
const BLACK = [0, 0, 0], WHITE = [255, 255, 255], RED = [255, 0, 0], DRED = [150, 0, 0];
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// THE GLITCH PALETTE: 60% red, 30% black, 10% white.
// PURE red: #ff0000 = red all the way up, zero green, zero blue. Any blue
// mixed in pushes it toward pink/crimson, and that looks less vibrant.
const REDS = ['#ff0000', '#ff0000', '#f00000', '#e60000'];
function glitchCol() {
  const q = rnd();
  return q < 0.1 ? '#fff' : q < 0.4 ? '#000' : REDS[(rnd() * REDS.length) | 0];
}
// a random glitch piece size: mostly small, sometimes big.
// Lines, squares and rectangles all mixed together.
function glitchSize(scale = 1, noBig = false) {
  const q = noBig ? rnd() * 0.9 : rnd();
  if (q < 0.3) return [ri(3, 14) * scale, 1];                         // thin line
  if (q < 0.6) { const s = ri(1, 4) * scale; return [s, s]; }         // little square
  if (q < 0.9) return [ri(2, 10) * scale, ri(2, 7) * scale];          // rectangle
  return [ri(8, 26) * scale, ri(4, 14) * scale];                      // big block
}

// A tile of static made of lines, squares and blocks of random sizes.
// It wraps around at the edges so it can repeat without visible seams.
function makeStatic(size, density, onlyRed = false, blackBg = false) {
  const c = makeCanvas(size, size), x = c.getContext('2d');
  if (blackBg) { x.fillStyle = '#000'; x.fillRect(0, 0, size, size); }
  const n = density * size * size / 8;
  for (let i = 0; i < n; i++) {
    const [w, h] = glitchSize(1, rnd() < 0.85);            // big blocks are rare in tiles
    x.fillStyle = onlyRed ? REDS[ri(1, 2)] : glitchCol();
    const px = ri(0, size - 1), py = ri(0, size - 1);
    for (const ox of [0, -size]) for (const oy of [0, -size]) x.fillRect(px + ox, py + oy, w, h);
  }
  return c;
}
// A SOLID tile for the tunnel wall. Pieces are painted on top of each other
// until every pixel is covered, and each pixel ends up the color of the LAST
// piece that landed on it. Since every piece rolls its color with glitchCol(),
// the whole wall comes out 60% red / 30% black / 10% white.
// UNIQUE GLITCH SHAPES — not just boxes. One piece of glitch can be a block,
// a line, a triangle shard, a diagonal slash, a broken letter, a dither
// checkerboard, a ring, a zig-zag or a barcode. The seed decides which (and
// its size), so the same seed always draws the exact same piece.
const GLYPHS = 'ABEFHKMNRSVWXZ0123456789?/<>+-_';
// simple = true: ONLY lines, squares and rectangles (the time-out effect uses that)
function glitchShape(ctx, x, y, col, s, seed, simple = false) {
  const R = mulberry32(seed), I = (a, b) => a + Math.floor(R() * (b - a + 1));
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1;
  const q = simple ? R() * 0.42 : R();
  if (q < 0.42) {                                             // a block or a line (the classic)
    const t = R();
    if (t < 0.35) ctx.fillRect(x, y, I(3, 14) * s, 1);
    else if (t < 0.65) { const k = I(1, 4) * s; ctx.fillRect(x, y, k, k); }
    else ctx.fillRect(x, y, I(2, 10) * s, I(2, 7) * s);
  } else if (q < 0.52) {                                      // a sharp triangle shard
    const w = I(3, 10) * s, h = I(3, 9) * s;
    ctx.beginPath(); ctx.moveTo(x + R() * w, y); ctx.lineTo(x + w, y + R() * h); ctx.lineTo(x + R() * w * 0.4, y + h); ctx.closePath(); ctx.fill();
  } else if (q < 0.61) {                                      // a diagonal slash (a pixel staircase)
    const len = I(5, 15) * s, dir = R() < 0.5 ? 1 : -1, step = R() < 0.5 ? 1 : 0.5;
    for (let i = 0; i < len; i++) ctx.fillRect(x + i, Math.round(y + dir * i * step), 1 + s, 1);
  } else if (q < 0.69) {                                      // a broken letter from the game's own font
    const rows = FONT[GLYPHS[I(0, GLYPHS.length - 1)]];
    for (let r = 0; r < 7; r++) for (let c2 = 0; c2 < 5; c2++)
      if (rows[r] & (16 >> c2) && R() > 0.2) ctx.fillRect(x + c2 * s, y + r * s, s, s);   // some pixels missing = broken
  } else if (q < 0.77) {                                      // a dither checkerboard
    const w = I(3, 10) * s, h = I(2, 7) * s;
    for (let yy = 0; yy < h; yy++) for (let xx = (yy & 1); xx < w; xx += 2) ctx.fillRect(x + xx, y + yy, 1, 1);
  } else if (q < 0.84) {                                      // a little ring
    const r = I(2, 5) * s;
    for (let i = 0, n = 8 + r * 3; i < n; i++) { const a = i / n * 6.283; ctx.fillRect(Math.round(x + r + Math.cos(a) * r), Math.round(y + r + Math.sin(a) * r), 1, 1); }
  } else if (q < 0.92) {                                      // a zig-zag
    const len = I(6, 16) * s, amp = I(1, 3);
    for (let i = 0; i < len; i++) ctx.fillRect(x + i, y + ((i >> 1) & 1 ? amp : 0), 1, 1);
  } else {                                                    // a barcode
    const w = I(5, 14) * s, h = I(3, 8) * s;
    for (let xx = 0; xx < w; xx += I(1, 3)) if (R() < 0.6) ctx.fillRect(x + xx, y, 1 + (R() < 0.3 ? 1 : 0), h);
  }
}

function makeWall(size, simple = false) {
  const c = makeCanvas(size, size), x = c.getContext('2d');
  x.fillStyle = REDS[0]; x.fillRect(0, 0, size, size);
  const n = 3 * size * size / 8;
  for (let i = 0; i < n; i++) {
    const col = glitchCol(), px = ri(0, size - 1), py = ri(0, size - 1), seed = (rnd() * 1e9) | 0;
    glitchShape(x, px, py, col, 1, seed, simple);
    // near an edge? draw copies on the other side too, so the tile repeats seamlessly
    if (px > size - 20) glitchShape(x, px - size, py, col, 1, seed, simple);
    if (py > size - 20) glitchShape(x, px, py - size, col, 1, seed, simple);
    if (px > size - 20 && py > size - 20) glitchShape(x, px - size, py - size, col, 1, seed, simple);
  }
  return c;
}
// the GLOW for a wall tile: find every white pixel, blur them into a soft halo.
// (drawn 3x3 times first so the blur wraps around the tile edges seamlessly)
function makeWallGlow(tile) {
  const size = tile.width, d = tile.getContext('2d').getImageData(0, 0, size, size).data;
  const mask = makeCanvas(size, size), mx = mask.getContext('2d'), mi = mx.createImageData(size, size);
  for (let i = 0; i < d.length; i += 4) if (d[i + 1] > 200) { mi.data[i] = mi.data[i + 1] = mi.data[i + 2] = 255; mi.data[i + 3] = 255; }
  mx.putImageData(mi, 0, 0);
  const big = makeCanvas(size * 3, size * 3), bx = big.getContext('2d');
  bx.filter = 'blur(2.5px)';
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) bx.drawImage(mask, a * size, b * size);
  const out = makeCanvas(size, size); out.getContext('2d').drawImage(big, -size, -size);
  return out;
}
const TILE = 256;
const WALL_TILES = [0, 1, 2, 3].map(() => makeWall(TILE));
const WALL = WALL_TILES.map(t => g.createPattern(t, 'repeat'));
const WALL_GLOW = WALL_TILES.map(t => g.createPattern(makeWallGlow(t), 'repeat'));

// THE GLASS DEATH REMIX — your RANSOM clip, cut up and replayed live to

// its own time, speed and place.
//   hit      the crash, doubled an octave lower + a boom + glass cracking
//   (time-out) the screech, slowed way down (stretched, like time is
//            slowing), and on every creak a quick slice of it, higher each time
//   bulge    the crash played BACKWARDS = it sucks in... while a filter
//            takes the bass away
//   still    silence
//   drop     the crash comes back SLOW — the same slow motion as the
//            picture — then speeds up exactly when the glass does

    const gn = ctx.createGain(); gn.gain.value = vol;

  // shattering: during the slow motion, a few LOW, slow cracks (slowed down

  ticks(T.drop + T.slow, T.ramp, 26, 3500, 10000);
  ticks(T.drop + T.slow + T.ramp, Math.max(0.05, T.lens - T.drop - T.slow - T.ramp), 14, 5000, 11000);

  bash(pan) { burst(0.3, 0.3, 1500, 0.7, false, pan, 300); thump(0.4, 180, 60, 0.2); },
  basherBreak() { for (let i = 0; i < 8; i++) blip([rr(1500, 4000)], 0.02, 0.03, 'square', rr(-1, 1), i * 0.02); },
  split() { burst(0.2, 0.5, 6000, 2, true); bell(1568, 0.08, 0.8); bell(1175, 0.06, 0.8, 0, 0.04); },
  halfIn() { bell(784, 0.07, 1.2); thump(0.3, 120, 50, 0.3); },
  merge() { bell(523, 0.08, 1.5); bell(659, 0.07, 1.5, 0, 0.08); bell(784, 0.07, 1.5, 0, 0.16); burst(0.5, 0.15, 3000, 1, false, 0, 8000); },
  mawOpen(pan) { swoop(MAW.open, 60, 3, 'sawtooth', 900, 0.1, pan); burst(MAW.open, 0.12, 400, 1.5, true, pan, 2500); },
  mawZap(pan) { burst(0.5, 0.6, 3000, 0.5, true, pan, 400); swoop(0.4, 2400, 0.1, 'square', 5000, 0.1, pan); thump(0.6, 220, 40, 0.4); },
  mawDie() { thump(1, 100, 25, 1.4); burst(1.2, 0.5, 900, 0.5, true, 0, 100); for (const f of [55, 58.3, 82.4]) swoop(1.5, f, 0.4, 'sawtooth', 500, 0.06); },
  // THE ENDING: heartbeats speeding up under a rising roar (until the big boom)
  finale() {
    if (!AU.ctx) return;
    const d = FIN.boom - FIN.beams;
    for (let i = 0, t = 0, gap = 0.7; t < d && i < 40; i++) { thump(0.4 + t / d * 0.5, 110, 35, 0.3, t); t += gap; gap = Math.max(0.12, gap * 0.82); }
    noiseEnv(AU.ctx.currentTime, 'bandpass', 200, 4000, d, [[d * 0.9, 0.2], [d, 0]], 1, AU.master);
    swoop(d, 55, 4, 'sawtooth', 2000, 0.06);
  },
  // THE SEAL LIGHTS UP: a bright chord swelling in (rising), with a hiss of light
  sealLight() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime, dur = CLEAR.shrink - CLEAR.hold;
    for (const [f, v] of [[220, 0.04], [330, 0.035], [440, 0.03], [659, 0.025], [880, 0.02], [1319, 0.012]]) {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);   // rising a fifth
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + dur * 0.9); gn.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(gn).connect(AU.master); o.start(t); o.stop(t + dur + 0.05);
    }
    burst(dur, 0.12, 2000, 1, false, 0, 9000);
  },
  // IT SHRINKS INTO THE BLUE LIGHT: a glassy "shwoop" down, then one pure bell
  sealShrink() {
    if (!AU.ctx) return;
    swoop(0.45, 1800, 0.25, 'sine', 4000, 0.12);
    burst(0.4, 0.15, 6000, 1, false, 0, 800);
    bell(1568, 0.09, 2.5, 0, 0.42); bell(2349, 0.05, 2.2, 0, 0.42);
    blip([2637, 3136, 3951], 0.05, 0.03, 'sine', 0, 0.45);
  },
  // YOUR MISSION: one short beep per letter (a slightly different pitch for each, so it "talks")
  typeBeep(ch) {
    const f = 620 + ((ch.charCodeAt(0) * 37) % 7) * 22;
    blip([f], 0.028, 0.03, 'square');
  },
  // the menus: moving between cards, and choosing one
  menuMove() { blip([880], 0.02, 0.025, 'square'); },
  menuPick() { blip([523, 784, 1047], 0.05, 0.05, 'square'); burst(0.15, 0.1, 3000, 1, true); },
  sealed() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime;
    thump(1, 160, 28, 2.2);
    burst(2.5, 0.35, 400, 0.5, false, 0, 8000);
    for (const [f, v] of [[55, 0.08], [110, 0.06], [164.8, 0.045], [220, 0.04], [261.6, 0.03], [329.6, 0.03], [440, 0.02], [880, 0.012]])
      for (const det of [-7, 7]) {
        const o = ctx.createOscillator(), gn = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        lp.type = 'lowpass'; lp.frequency.setValueAtTime(3000, t); lp.frequency.exponentialRampToValueAtTime(500, t + 5);
        gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(v, t + 0.05); gn.gain.exponentialRampToValueAtTime(0.001, t + 5.5);
        o.connect(lp).connect(gn).connect(AU.master); o.start(t); o.stop(t + 5.6);
      }
  },
  // one piece clicks into place. f = 0..1 (first piece .. last piece), so the
  // ticks climb higher and higher as the circle fills up
  click(f) {
    const p = 700 * Math.pow(2, f * 1.5);
    blip([p, p * 1.5], 0.025, 0.05, 'square');
    burst(0.03, 0.18, 6000, 3);
  },
  // one clock tick. k = 0..1 (1:00 left ... 0:00): it starts barely there and
  // ends LOUD, with a heavy clunk in the last seconds. tock = the lower half.
  // The portal hushes it.
  clock(k, tock) {
    const v = (0.012 + k * k * 0.3) * (1 - S.pure);
    if (v < 0.002) return;
    blip([tock ? 1500 : 2100], 0.018, v * 0.6, 'square');
    burst(0.03, v, tock ? 2500 : 4000, 4);
    if (k > 0.6) thump(v * 1.2, 150, 60, 0.08);
  },
  complete() {
    [110, 165, 220, 330, 440].forEach((f, i) => {
      const ctx = AU.ctx; if (!ctx) return;
      const t = ctx.currentTime, o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 2, t + 1.6);
      o.detune.value = rr(-12, 12);
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.035, t + 0.3); gn.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
      o.connect(gn).connect(AU.master); o.start(t); o.stop(t + 2.3);
    });
    burst(1.8, 0.2, 200, 1, false, 0, 6000);
    thump(0.7, 90, 30, 1.2);
  },
  // THE KILL SOUND (time ran out): the glass remix of your RANSOM clip (see glassRemix)
  death() {
    if (!AU.ctx) return;
    if (!AU.kill) return SFX.deathSynth();          // clip not loaded? use the homemade one
    glassRemix(DEATH, 'time');
  },

  // the HOMEMADE version, built from a spectrogram of the clip. Only used
  // if the real clip can't be loaded.
  deathSynth() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime;
    const bus = ctx.createGain(); bus.gain.value = 0.9; bus.connect(AU.master);
    const dist = distortion(3); dist.connect(bus);

    // 1) the screech: two notes a "fifth" apart (1200 / 800 = 1.5), each with
    //    two slightly out-of-tune copies so it buzzes instead of beeping
    const scr = ctx.createGain();
    scr.gain.setValueAtTime(0, t); scr.gain.linearRampToValueAtTime(0.09, t + 0.02);
    scr.gain.setValueAtTime(0.09, t + 2.3); scr.gain.linearRampToValueAtTime(0, t + 2.55);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 350;
    // the stutter: from 1.3s a fast square wave switches the volume on/off 17x a second
    const stut = ctx.createGain(); stut.gain.setValueAtTime(1, t); stut.gain.setValueAtTime(0.5, t + 1.3);
    const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 17;
    const lfoAmt = ctx.createGain(); lfoAmt.gain.setValueAtTime(0, t); lfoAmt.gain.setValueAtTime(0.5, t + 1.3);
    lfo.connect(lfoAmt).connect(stut.gain); lfo.start(t); lfo.stop(t + 2.6);
    scr.connect(hp).connect(stut).connect(dist);
    for (const f of [802, 1203]) for (const det of [-14, 0, 14]) {
      const o = ctx.createOscillator(); o.type = det ? 'sawtooth' : 'square'; o.detune.value = det;
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.93, t + 2.3);       // the slow sag
      o.frequency.exponentialRampToValueAtTime(f * 0.2, t + 2.55);       // the dive
      o.connect(scr); o.start(t); o.stop(t + 2.6);
    }

    // 2) sub-bass rumble (43, 73, 100 Hz — the loudest low pitches in the clip)
    const sub = ctx.createGain();
    sub.gain.setValueAtTime(0, t); sub.gain.linearRampToValueAtTime(0.2, t + 0.03);
    sub.gain.setValueAtTime(0.2, t + 2.3); sub.gain.exponentialRampToValueAtTime(0.001, t + 3.4);
    sub.connect(bus);
    for (const f of [43, 73, 100]) {
      const o = ctx.createOscillator(); o.frequency.value = f; o.connect(sub); o.start(t); o.stop(t + 3.5);
    }
    for (const d of [0, 0.42, 0.84]) thump(0.7, 140, 32, 0.4, d);   // pounding hits
    thump(1, 200, 25, 1.2, 1.3);

    // 3) impact, the crash at 1.3s, and the downward sweep at 2.3s
    burst(0.4, 0.45, 1500, 0.4, true);
    burst(1.1, 0.5, 3000, 0.25, false, 0, 0, 1.3);
    burst(0.8, 0.35, 5000, 0.5, true, 0, 400, 1.3);
    burst(0.35, 0.35, 900, 2, true, 0, 90, 2.3);

    // 4) the low chord it lands on: G, B, D, G (196, 245, 293, 392 Hz)
    for (const f of [196, 245, 293, 392]) for (const det of [-8, 8]) {
      const o = ctx.createOscillator(), gn = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      lp.type = 'lowpass'; lp.frequency.value = 1400;
      gn.gain.setValueAtTime(0, t + 2.35); gn.gain.linearRampToValueAtTime(0.03, t + 2.42);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 4.3);
      o.connect(lp).connect(gn).connect(dist); o.start(t + 2.35); o.stop(t + 4.4);
    }
  },
  // random glitch noises. Each call picks one of 8 kinds of broken-computer
  // sound, at a random spot left/right. k = 0..1 makes them louder and wilder.
  glitch(k) {
    const pan = rr(-1, 1), v = 0.6 + k * 1.5, q = rnd();
    if (q < 0.2)                                 // CRACKLE: a burst of crushed noise
      burst(rr(0.02, 0.14 + k * 0.2), rr(0.04, 0.1) * v, rr(300, 5000), rr(0.5, 4), true, pan);
    else if (q < 0.33) {                         // CHIRP: jumps between random pitches
      const f = []; for (let i = 0, n = ri(3, 9); i < n; i++) f.push(rr(80, 3000));
      blip(f, rr(0.012, 0.03), rr(0.02, 0.045) * v, rnd() < 0.5 ? 'square' : 'sawtooth', pan);
    } else if (q < 0.47) {                       // STUTTER: the same tiny sound repeating, like a frozen computer
      const f = rr(200, 4000), gap = rr(0.02, 0.05), qq = rr(1, 5), len = rr(0.01, 0.025);
      for (let i = 0, n = ri(3, 8 + Math.round(k * 8)); i < n; i++) burst(len, rr(0.05, 0.09) * v, f, qq, true, pan, 0, i * gap);
    } else if (q < 0.59) {                       // DATA: a super-fast stream of beeps, like a modem
      const f = []; for (let i = 0, n = ri(8, 20); i < n; i++) f.push(400 * Math.pow(2, ri(0, 36) / 12));
      blip(f, rr(0.006, 0.012), rr(0.015, 0.03) * v, 'square', pan);
    } else if (q < 0.69) {                       // ZAP: a buzzy tone diving down
      const f0 = rr(800, 3000);
      blip([f0, f0 * 0.6, f0 * 0.35, f0 * 0.2, f0 * 0.1], 0.015, 0.04 * v, 'sawtooth', pan);
    } else if (q < 0.79) {                       // BUZZ: a short ugly low hum, like electricity
      swoop(rr(0.05, 0.2 + k * 0.2), rr(50, 130), 1, 'square', 900, 0.05 * v, pan);
    } else if (q < 0.9) {                        // CLICKS: a handful of tiny ticks
      for (let i = 0, n = ri(2, 6); i < n; i++) burst(0.006, rr(0.08, 0.15) * v, rr(2000, 7000), 1, true, rr(-1, 1), 0, rr(0, 0.15));
    } else {                                     // TAPE STOP: a tone that sags and dies
      swoop(rr(0.25, 0.45), rr(300, 900), 0.15, 'sawtooth', 2000, 0.04 * v, pan);
    }
  },
};
// called every frame to steer the background layers
// scream = 0..1 (0 = silent, 1 = full scream at 0:00)
function audioUpdate(k, humVol, humPan, scream, musicVol) {
  const ctx = AU.ctx; if (!ctx) return;
  const t = ctx.currentTime;
  AU.drone.gain.setTargetAtTime(0.085 + k * 0.1, t, 0.3);
  AU.droneLP.frequency.setTargetAtTime(160 + k * 900, t, 0.3);
  AU.dro[1].frequency.setTargetAtTime(49.5 + k * 6 + (k > 0.3 ? rr(-3, 3) * k : 0), t, 0.1);
  AU.stat.gain.setTargetAtTime(S.sector ? 0 : 0.006 + k * k * 0.16, t, 0.2);   // (the static hiss: silent in sectors)
  AU.statBP.frequency.setTargetAtTime(1200 + rr(-400, 400) * k, t, 0.05);
  AU.hum.gain.setTargetAtTime(humVol * 0.18, t, 0.08);
  AU.humPan.pan.setTargetAtTime(humPan, t, 0.08);
  // the scream fades in very slowly at first (scream^2.5), then fast
  AU.scream.gain.setTargetAtTime(0.26 * Math.pow(scream, 2.5), t, 0.15);
  const pitch = 330 + scream * scream * 520;                 // and rises in pitch
  for (const o of AU.scrOsc) o.frequency.setTargetAtTime(pitch * o.mult * rr(0.99, 1.01), t, 0.2);
  // the RANSOM scream starts slow and deep (70% speed) and rises to its REAL
  // pitch exactly at 0:00 — so it flows straight into the kill sound
  if (AU.scrClip) AU.scrClip.playbackRate.setTargetAtTime(0.7 + scream * scream * 0.3, t, 0.2);
  AU.scrStuAmt.gain.setTargetAtTime(scream * 0.6, t, 0.2);
  AU.music.gain.setTargetAtTime(musicVol, t, 0.3);
}

// =====================================================================
//  MUSIC — a tiny "step sequencer". The song is split into 16th-note
//  steps. A bit before each step is due, we look at the pattern and
//  schedule its notes at the exact time, so the beat never wobbles.
// =====================================================================
const MUS = { track: null, step: 0, next: 0 };
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);      // note number -> Hz (69 = A)
function tone(freq, t, dur, o = {}) {
  const ctx = AU.ctx;
  const osc = ctx.createOscillator(); osc.type = o.type || 'triangle';
  osc.frequency.value = freq; osc.detune.value = o.detune || 0;
  const gn = ctx.createGain(), vol = o.vol || 0.05;
  if (o.pad) {                                            // slow swell in and out
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + dur * 0.35);
    gn.gain.setValueAtTime(vol, t + dur * 0.6); gn.gain.linearRampToValueAtTime(0, t + dur);
  } else {                                                // pluck: hit, then fade
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  }
  let node = osc;
  if (o.cutoff) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.cutoff; f.Q.value = o.q || 1; osc.connect(f); node = f; }
  let out = gn;
  if (o.pan) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; gn.connect(p); out = p; }   // (o.pan = -1 left ... 1 right)
  node.connect(gn); out.connect(o.bus || AU.track || AU.music);   // (o.bus = send it somewhere else; normally the playing song's track)
  if (o.echo) { const e = ctx.createGain(); e.gain.value = o.echo; gn.connect(e).connect(o.echoBus || AU.echo); }
  if (o.verb) { const v = ctx.createGain(); v.gain.value = o.verb; gn.connect(v).connect(o.verbBus || AU.verb); }   // (into a reverb)
  osc.start(t); osc.stop(t + dur + 0.05);
}

// MENU: slow, sad chords (Am - F - Dm - E) with a broken music box on top
const MENU_CHORDS = [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59]];
function menuStep(step, t, sd) {
  const bar = Math.floor(step / 16) % 4, s = step % 16, ch = MENU_CHORDS[bar];
  if (s === 0) {
    for (const n of ch) for (const d of [-8, 8])
      tone(NOTE(n), t, sd * 17, { type: 'sawtooth', vol: 0.014, pad: true, cutoff: 800, detune: d });
    tone(NOTE(ch[0] - 24), t, sd * 16, { type: 'sine', vol: 0.09, pad: true });
  }
  const arp = [0, 3, 6, 8, 10, 13].indexOf(s);
  if (arp >= 0) {
    const n = ch[arp % 3] + (arp >= 3 ? 24 : 12);
    if (rnd() < 0.13) {                                    // glitch: stutter at a wrong pitch
      const f = NOTE(n + ri(-7, 7));
      for (let i = 0; i < 4; i++) tone(f, t + i * sd / 4, sd / 4, { type: 'square', vol: 0.02 });
    } else tone(NOTE(n), t, sd * 6, { type: 'triangle', vol: 0.045, echo: 0.5 });
  }
  if (s === 12 && bar === 3) tone(NOTE(76), t, sd * 10, { type: 'sine', vol: 0.03, echo: 0.6 });
}

// how hard The Anchor thumps right now. It has its own HEARTBEAT:
// lub (big) ... dub (smaller) ... pause. S.beatPh goes 0 -> 1 once per beat.
function beatK() {
  const p = S.beatPh;
  const lub = Math.exp(-p * 14);
  const dub = p >= 0.2 ? 0.7 * Math.exp(-(p - 0.2) * 14) : 0;
  return Math.max(lub, dub);
}

// THE PORTAL SONG — still calm (the only calm place in the game), but not
// cute any more: slow, dark and HUGE, like standing at the edge of something
// ancient. Minor chords (Dm9, Bbmaj7, Gm9, Asus4) as slow swelling pads, a
// deep bass, and now and then one lonely far-away note — all soaked in a
// long echo and the big reverb. No music box, no plinking.
const PORTAL_CHORDS = [[50, 53, 57, 64], [46, 50, 53, 57], [43, 46, 50, 57], [45, 50, 52, 57]];
const PMUS = { step: 0, next: 0, on: false };
function portalStep(step, t, sd) {
  const bar = Math.floor(step / 16) % 4, s = step % 16, ch = PORTAL_CHORDS[bar];
  const o = { bus: AU.pmus, echoBus: AU.pecho, verb: 0.9, verbBus: AU.pverb };
  if (s === 0) {
    for (const n of ch) for (const d of [-7, 7])                                     // dark, soft pad (sawtooth through a low filter)
      tone(NOTE(n), t, sd * 17, { ...o, type: 'sawtooth', vol: 0.011, pad: true, cutoff: 700, detune: d });
    tone(NOTE(ch[0] - 12), t, sd * 16, { ...o, type: 'sine', vol: 0.09, pad: true });   // deep bass note
  }
  if ((s === 6 || s === 12) && hash2(step, 3, 51) < 0.45) {                         // a lonely far-away note, sometimes
    const n = ch[(hash2(step, 1, 52) * 4) | 0] + 12;
    tone(NOTE(n), t, sd * 14, { ...o, type: 'triangle', vol: 0.03, pad: true, cutoff: 1600, echo: 0.5 });
  }
  if (s === 8 && bar === 3) tone(NOTE(ch[3] + 24), t, sd * 16, { ...o, type: 'sine', vol: 0.012, pad: true, echo: 0.6 });   // a faint high shimmer, once a round
}
function portalMusicTick() {
  const ctx = AU.ctx; if (!ctx || !AU.pmus) return;
  AU.pmus.gain.setTargetAtTime(MUS.track === 'portal' ? 0.9 * SONG_BY_KEY.portal.gain : S.pure * 0.9, ctx.currentTime, 0.4);   // louder the closer you are (or full, in the soundtrack player)
  const want = (S.mode === 'play' || S.mode === 'warping') && world && world.portal && S.pure > 0.01;
  if (want && !PMUS.on) { PMUS.on = true; PMUS.next = ctx.currentTime + 0.1; }
  if (!want) { PMUS.on = false; return; }
  if (PMUS.next < ctx.currentTime - 0.3) PMUS.next = ctx.currentTime + 0.05;
  while (PMUS.next < ctx.currentTime + 0.15) {
    const sd = 60 / 52 / 4;                                                          // 52 beats per minute: very slow
    portalStep(PMUS.step, PMUS.next, sd);
    PMUS.next += sd; PMUS.step++;
  }
}

// Every song plays into its OWN track channel (AU.track -> AU.music). That
// lets us cut the old song when you switch, and lets the soundtrack's meter
// listen to just the song. The new songs also get an echo that fits their
// tempo: a whole number of steps, so the echoes land ON the beat.
function newTrackBus(cut, song) {
  const ctx = AU.ctx, now = ctx.currentTime;
  if (cut && AU.track) { const old = AU.track; old.gain.setTargetAtTime(0, now, 0.015); setTimeout(() => old.disconnect(), 500); }
  if (cut || !AU.track) {
    AU.track = ctx.createGain(); AU.track.connect(AU.music); AU.track.connect(AU.anal);
    AU.songDist = null;                                    // (the shared distortion is rebuilt on the new track)
  }
  if (!cut) return;
  const sd = song ? 60 / song.bpm / 4 : 0;
  const delay = song && !song.game ? Math.max(1, Math.round(0.33 / sd)) * sd : 0.33;
  // empty the echo: mute its output and feedback for as long as it holds sound
  const hold = Math.max(AU.echo.delayTime.value, delay) + 0.05;
  AU.echoOut.gain.setValueAtTime(0, now); AU.echoOut.gain.setValueAtTime(1, now + hold);
  AU.echoFb.gain.setValueAtTime(0, now); AU.echoFb.gain.setValueAtTime(0.38, now + hold);
  AU.echo.delayTime.setValueAtTime(Math.min(0.99, delay), now);
}

// music only plays in the menu now — in a level it's just the hum + glitches
// (and the portal song, when you're near a portal)
function musicTick() {
  const ctx = AU.ctx; if (!ctx) return;
  portalMusicTick();
  // which song: in the soundtrack player, the one you picked; on the menus, the menu theme
  const want = S.mode === 'soundtrack' ? JUKE.playing
    : S.mode === 'title' || S.mode === 'realities' || S.mode === 'difficulty' || S.mode === 'sectors' || S.mode === 'settings' ? 'menu' : null;
  if (want !== MUS.track) {
    // in the soundtrack player, switching songs CUTS the old one cleanly
    // (its long notes and echoes) instead of letting it ring over the new one
    const cut = S.mode === 'soundtrack' || MUS.juke;
    MUS.juke = S.mode === 'soundtrack' && !!want;
    MUS.track = want; MUS.step = 0; MUS.next = ctx.currentTime + 0.1;
    newTrackBus(cut, want ? SONG_BY_KEY[want] : null);
  }
  if (!MUS.track) return;
  const song = SONG_BY_KEY[MUS.track], sd0 = 60 / song.bpm / 4;
  if (MUS.next < ctx.currentTime - 1) MUS.next = ctx.currentTime + 0.05;        // way behind (the tab was hidden): just carry on from now
  // a little behind (a slow frame): skip the missed steps, so the beat stays
  // ON the grid instead of everything after it shifting late
  while (MUS.next < ctx.currentTime) { MUS.next += sd0; MUS.step++; }
  while (MUS.next < ctx.currentTime + 0.3) {                                      // (plan 0.3 s ahead, so a slow frame can't make notes late)
    const sd = 60 / song.bpm / 4;                     // one step = a 16th note
    song.step(MUS.step, MUS.next, sd);
    MUS.next += sd; MUS.step++;
  }
}

<script>
// V0ID3D — songs.js: THE SOUNDTRACK — every song in the game, plus 10 new ones that only play in Settings > Soundtrack
"use strict";

// =====================================================================
//  HOW A SONG WORKS: it's a "step sequencer" (like a drum machine). Time is
//  cut into 16th notes ("steps" — 16 per bar). musicTick() calls the song's
//  step(step, t, sd) a moment before each step is due, and the song decides
//  which notes to play at exact time t. sd = how long one step lasts.
//  The notes are built from scratch with oscillators and noise — no audio files.
// =====================================================================

// --- little instruments, all going into the playing song's track (AU.track) ---
// a noise hit through a filter: hats, snares, crackle, wind
function sNoise(t, dur, vol, type, f, q = 1, crush = false, f1 = 0, dest = null) {
  const ctx = AU.ctx, s = ctx.createBufferSource(); s.buffer = crush ? AU.crush : AU.noise;
  const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
  if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const gn = ctx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  s.connect(fl).connect(gn).connect(dest || AU.track); s.start(t, rnd() * 1.5); s.stop(t + dur + 0.05);
  return gn;
}
// a kick drum: a sine wave whose pitch drops fast (that "boom" is just a falling tone)
function sKick(t, vol = 0.5, f0 = 140, f1 = 42, dur = 0.28) {
  const ctx = AU.ctx, o = ctx.createOscillator(), gn = ctx.createGain();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.7);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(gn).connect(AU.track); o.start(t); o.stop(t + dur + 0.05);
}
const sSnare = (t, v = 0.22, f = 1900) => { sNoise(t, 0.16, v, 'bandpass', f, 0.8); tone(185, t, 0.09, { type: 'triangle', vol: v * 0.45 }); };
const sHat = (t, v = 0.05, open = false) => sNoise(t, open ? 0.2 : 0.035, v, 'highpass', 7500, 0.7);
// a heavy distortion every song can share (made the first time it's needed)
function songDist() {
  if (!AU.songDist) { AU.songDist = distortion(3.5); const g2 = AU.ctx.createGain(); g2.gain.value = 0.35; AU.songDist.connect(g2).connect(AU.track); }
  return AU.songDist;
}

// --- bigger building blocks (to make the songs FULL instead of thin) ---
// a PAD: every note of the chord played by 3 voices, slightly out of tune
// with each other and spread left/middle/right. Out-of-tune copies "beat"
// against each other, which is what makes a synth sound wide and thick.
function sPad(notes, t, dur, o = {}) {
  for (const n of notes) [[-11, -0.6], [0, 0], [11, 0.6]].forEach(([d, p]) =>
    tone(NOTE(n), t, dur, { type: o.type || 'sawtooth', vol: o.vol || 0.01, pad: true, cutoff: o.cutoff || 900, detune: d, pan: p, verb: o.verb ?? 0.35 }));
}
const sSub = (n, t, dur, vol = 0.09) => tone(NOTE(n), t, dur, { type: 'sine', vol, pad: true });                  // deep bass you FEEL
const sShaker = (t, v = 0.03) => sNoise(t, 0.06, v, 'highpass', 6000, 0.6);
const sCrash = (t, v = 0.08) => sNoise(t, 1.6, v, 'highpass', 5000, 0.4);
const sTom = (t, f, v = 0.4) => sKick(t, v, f, f * 0.55, 0.25);
// a RISER: noise sweeping up and swelling, then cut — the "something is coming" sound
const sRiser = (t, dur, vol = 0.06) => noiseEnv(t, 'bandpass', 300, 8000, dur, [[dur * 0.92, vol], [dur, 0]], 1.4, AU.track);

// 1 — hard, dark industrial techno. 16-bar loop: bars 0-7 = groove, 8-15 = the
// drop with a screaming lead riff. Growling bass on E and F, pumping chord
// stabs, ride, claps, a riser into each half and a crash on the 1.
function songNullification(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 16, drop = bar >= 8;
  if (i % 4 === 0) sKick(t, 0.75, 160, 38, 0.32);
  if (i % 4 === 2) sHat(t, 0.09, true); else sHat(t, i % 2 ? 0.035 : 0.05);
  if (i === 4 || i === 12) { sNoise(t, 0.14, 0.26, 'bandpass', 1400, 0.9); sNoise(t + 0.012, 0.12, 0.18, 'bandpass', 1700, 0.9); }
  if (drop && i % 2 === 0) sNoise(t, 0.25, 0.025, 'highpass', 9000, 0.5);                                            // ride
  const pat = [0, 0, 12, 0, 0, 1, 0, 12, 0, 0, 13, 0, 0, 1, 12, 0], root = 28 + (bar % 8 >= 4 ? 5 : 0);
  tone(NOTE(root + pat[i]), t, sd * 0.9, { type: 'sawtooth', vol: 0.08, cutoff: 280 + (i % 8) * 110, q: 7, bus: songDist() });
  if (i % 4 === 0) sSub(root, t, sd * 3, 0.07);
  // pumping stabs: quiet on the kick, loud in between (that "breathing" is the techno sound)
  if (i % 4 === 2) sPad([52, 55, 59].map(n => n + root - 28), t, sd * 1.6, { vol: 0.009, cutoff: 1800, verb: 0.2 });
  if (drop) {                                                                                                         // THE LEAD
    const lead = [76, -1, 77, 76, 71, -1, 72, -1, 76, -1, 77, 79, 77, -1, 76, -1][i];
    if (lead > 0) { tone(NOTE(lead), t, sd * 1.4, { type: 'square', vol: 0.03, cutoff: 3500, echo: 0.3, pan: -0.3 }); tone(NOTE(lead + 12), t, sd * 1.2, { type: 'sawtooth', vol: 0.012, cutoff: 5000, pan: 0.3 }); }
  }
  if (bar % 8 === 7 && i === 0) sRiser(t, sd * 16, 0.08);
  if (bar % 8 === 0 && i === 0) sCrash(t, 0.1);
  if (bar % 4 === 3 && i >= 13) sNoise(t, sd, 0.14, 'bandpass', 600 + i * 300, 2, true);
}

// 2 — slow and heavy. The beat IS a heartbeat (lub... dub...) with a thump
// you feel, under a huge dark choir of chords, a low string pattern
// creeping along, and a sad bell melody on top in the second half.
const HEART_CHORDS = [[48, 51, 55], [44, 48, 51], [41, 44, 48], [43, 47, 50]];
const HEART_BELL = [67, -1, -1, 63, -1, -1, 65, -1, 63, -1, -1, 62, -1, -1, 60, -1];
function songHeart(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 8, ch = HEART_CHORDS[bar % 4];
  if (i === 0) { sKick(t, 0.85, 95, 32, 0.5); sNoise(t, 0.12, 0.08, 'lowpass', 300, 0.7); }
  if (i === 3) sKick(t, 0.55, 85, 32, 0.4);
  if (i === 0) {
    sPad(ch, t, sd * 17, { vol: 0.011, cutoff: 700, verb: 0.6 });
    sPad(ch.map(n => n + 12), t, sd * 17, { type: 'triangle', vol: 0.009, cutoff: 2000, verb: 0.7 });               // the "choir" an octave up
    sSub(ch[0] - 24, t, sd * 16, 0.1);
  }
  if (i % 2 === 0) tone(NOTE(ch[(i / 2) % 3] - 12), t, sd * 1.8, { type: 'sawtooth', vol: 0.016, cutoff: 500 + bar * 60, pan: (i % 4 ? 0.4 : -0.4) });   // low strings
  if (bar >= 4) { const b = HEART_BELL[i]; if (b > 0) tone(NOTE(b + 12), t, sd * 10, { type: 'sine', vol: 0.035, echo: 0.5, verb: 0.6 }); }
  if (i === 8) sNoise(t, 0.4, 0.02, 'bandpass', 900, 1.5, true);
  if (bar === 7 && i === 8) sRiser(t, sd * 8, 0.04);
}

// 3 — empty, floating, lonely — but HUGE: no drums, wide slow chords spread
// over 3 octaves, a deep drone underneath, wind, a slow lonely melody, and
// a sparkling dust of tiny high notes.
const VOID_CHORDS = [[52, 55, 59, 66], [48, 52, 55, 59], [45, 52, 55, 59], [47, 52, 54, 59]];
const VOID_MEL = [71, 74, 76, 74, 71, 67, 69, 71];
function songVoidlands(step, t, sd) {
  const i = step % 32, sec = Math.floor(step / 32) % 8, ch = VOID_CHORDS[sec % 4];
  if (i === 0) {
    sPad(ch, t, sd * 34, { type: 'triangle', vol: 0.014, cutoff: 2500, verb: 0.9 });
    sPad([ch[0] - 12, ch[2] - 12], t, sd * 34, { vol: 0.008, cutoff: 500, verb: 0.6 });
    sPad([ch[1] + 12, ch[3] + 12], t, sd * 34, { type: 'sine', vol: 0.008, verb: 1 });
    sSub(ch[0] - 24, t, sd * 32, 0.1);
    sNoise(t, sd * 30, 0.03, 'bandpass', 400, 0.6, false, 1600);                                                     // wind
  }
  if (sec >= 2 && i % 8 === 4) tone(NOTE(VOID_MEL[(sec * 4 + i / 8 | 0) % 8]), t, sd * 14, { type: 'sine', vol: 0.04, pad: true, echo: 0.5, verb: 0.9 });
  if (hash2(step, 2, 602) < 0.3) {
    const n = ch[(hash2(step, 3, 602) * 4) | 0] + 24 + (hash2(step, 4, 602) < 0.3 ? 12 : 0);
    tone(NOTE(n), t, sd * 6, { type: 'sine', vol: 0.02, echo: 0.55, verb: 0.8, pan: hash2(step, 5, 602) * 2 - 1 });
  }
}

// 4 — a creepy music-box WALTZ (3 beats per bar = 12 steps) over strings and
// record crackle: melody + a second music box in harmony, a waltz bass
// (OOM-pah-pah), a slow string pad, a wobbling ghost voice, and glitches.
const LULLABY = [76, 72, 69, 74, 71, 67, 72, 69, 64, 71, 68, 64, 69, 72, 76, 77, 76, 74, 72, 71, 69, 68, 69, -1];
const LULLABY_BASS = [45, 43, 41, 40, 45, 41, 40, 45];
const LULLABY_CH = [[57, 60, 64], [55, 59, 62], [53, 57, 60], [52, 56, 59], [57, 60, 64], [53, 57, 60], [52, 56, 59], [57, 60, 64]];
function songLullaby(step, t, sd) {
  const i = step % 12, bar = Math.floor(step / 12) % 8, beat = Math.floor(i / 4), round = Math.floor(step / 96) % 2;
  if (i % 4 === 0) {
    const n = LULLABY[bar * 3 + beat];
    if (n > 0) {
      if (hash2(step, 4, 603) < 0.1) for (let k = 0; k < 3; k++) tone(NOTE(n + 12) * (1 + (hash2(step, k, 604) - 0.5) * 0.06), t + k * sd / 3, sd / 3, { type: 'triangle', vol: 0.04 });
      else tone(NOTE(n + 12), t, sd * 6, { type: 'triangle', vol: 0.06, echo: 0.4, verb: 0.4, detune: (hash2(step, 5, 603) - 0.5) * 30, pan: -0.25 });
      tone(NOTE(n + 24), t, sd * 2, { type: 'sine', vol: 0.016 });
      if (round) tone(NOTE(n + 12 - 3), t, sd * 5, { type: 'triangle', vol: 0.03, echo: 0.4, pan: 0.35 });            // the harmony box (2nd time round)
    }
  }
  if (i === 0) { sSub(LULLABY_BASS[bar] - 12, t, sd * 12, 0.09); sPad(LULLABY_CH[bar], t, sd * 13, { vol: 0.007, cutoff: 1400, verb: 0.6 }); }
  if (i === 0) tone(NOTE(LULLABY_BASS[bar]), t, sd * 3, { type: 'triangle', vol: 0.05 });                              // OOM
  if (beat > 0 && i % 4 === 0) for (const c of LULLABY_CH[bar]) tone(NOTE(c), t, sd * 2, { type: 'triangle', vol: 0.012 });   // pah pah
  if (round && i === 6) tone(NOTE(LULLABY_CH[bar][2] + 12), t, sd * 10, { type: 'sine', vol: 0.02, pad: true, detune: Math.sin(step) * 40, verb: 0.8 });   // ghost voice
  if (hash2(step, 6, 603) < 0.45) sNoise(t, 0.02, 0.03, 'highpass', 4000, 0.5, true);
  if (i === 0 && bar % 4 === 0) sNoise(t, sd * 8, 0.012, 'lowpass', 600, 0.5, true);                                // tape hiss swell
}

// 5 — a glitchy hip-hop beat that keeps breaking: hard drums with ghost notes
// and a shaker, a gliding 808 bass, warm electric-piano chords, a chopped
// "vocal" (a buzzy tone through a mouth-shaped filter), stutters and bursts.
const CORR_ROOTS = [33, 33, 36, 31];
function songCorrupted(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 8, root = CORR_ROOTS[bar % 4];
  if (i === 0 || i === 10 || (i === 7 && bar % 2)) sKick(t, 0.75, 130, 42, 0.32);
  if (i === 8) { sSnare(t, 0.32); sNoise(t, 0.2, 0.06, 'bandpass', 900, 1); }
  if (i === 15 && bar % 2 === 0) sSnare(t, 0.08);                                                                    // ghost note
  sShaker(t, i % 2 ? 0.02 : 0.035);
  if (i % 4 === 2) sHat(t, 0.05);
  if (i === 0) { tone(NOTE(root), t, sd * 7, { type: 'sine', vol: 0.12 }); tone(NOTE(root + 12), t, sd * 4, { type: 'square', vol: 0.025, cutoff: 600 }); }
  if (i === 6) tone(NOTE(root + 12), t, sd * 2, { type: 'square', vol: 0.03, cutoff: 700, echo: 0.3 });
  if ((i === 2 || i === 9) && hash2(step, 7, 605) < 0.85) {                                                         // e-piano chords
    for (const n of [57, 60, 64, 67]) { tone(NOTE(n + root - 33), t, sd * 3, { type: 'triangle', vol: 0.016, pan: -0.3, echo: 0.2 }); tone(NOTE(n + root - 33 + 12), t, sd * 1.5, { type: 'sine', vol: 0.007, pan: 0.3 }); }
  }
  if (bar >= 4 && (i === 4 || i === 5 || i === 12)) {                                                                // the chopped "vocal"
    const v = NOTE([69, 72, 67][i % 3] + root - 33);
    tone(v, t, sd * 0.9, { type: 'sawtooth', vol: 0.04, cutoff: 900, q: 9, pan: 0.2 });
    tone(v, t, sd * 0.9, { type: 'sawtooth', vol: 0.02, cutoff: 2400, q: 12, pan: -0.2 });
  }
  if (i === 12 && bar % 2 === 1) for (let k = 0; k < 8; k++) tone(NOTE(76 - k), t + k * sd / 2, sd / 2, { type: 'square', vol: 0.03, pan: k % 2 ? 0.6 : -0.6 });
  if (i === 14 && hash2(step, 8, 605) < 0.5) sNoise(t, sd * 2, 0.12, 'bandpass', 1200, 1.5, true, 300);
  if (bar % 8 === 7 && i === 0) sRiser(t, sd * 16, 0.05);
}

// 6 — melancholic and drifting, but full: a rolling piano-like arpeggio in
// stereo, warm pads, a soft halftime beat, a deep bass, and a singing lead
// melody that comes in the second time round.
const OUT_CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const OUT_MEL = [76, -1, 74, 72, 71, -1, 72, -1, 69, -1, -1, -1, 67, -1, 69, 71];
function songOutskirts(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 8, ch = OUT_CHORDS[bar % 4], second = bar >= 4;
  const seq = [ch[0], ch[1], ch[2], ch[0] + 12, ch[2], ch[1]];
  tone(NOTE(seq[i % 6] + 12), t, sd * 3, { type: 'triangle', vol: 0.045, echo: 0.35, pan: i % 2 ? 0.35 : -0.35 });
  tone(NOTE(seq[i % 6] + 24), t, sd * 1.5, { type: 'sine', vol: 0.01, pan: i % 2 ? -0.35 : 0.35 });
  if (i === 0) { sPad(ch, t, sd * 17, { vol: 0.009, cutoff: 1100, verb: 0.5 }); sSub(ch[0] - 24, t, sd * 16, 0.1); }
  if (i === 8) sSub(ch[2] - 24, t, sd * 8, 0.06);
  if (i === 0 || i === 7) sKick(t, 0.5, 110, 45, 0.3);
  if (i === 8) sSnare(t, 0.16, 1500);
  if (i % 2 === 0) sHat(t, i % 4 === 2 ? 0.035 : 0.02);
  if (second) { const m = OUT_MEL[i]; if (m > 0) { tone(NOTE(m), t, sd * 3.5, { type: 'sawtooth', vol: 0.02, cutoff: 1600, echo: 0.4, verb: 0.4 }); tone(NOTE(m), t, sd * 3.5, { type: 'sine', vol: 0.03 }); } }
  if (bar === 3 && i === 0) sRiser(t, sd * 16, 0.035);
  if (bar === 4 && i === 0) sCrash(t, 0.06);
}

// 7 — FAST chiptune chase (like an old game console's 4 sound channels, but
// more of them): two square leads in harmony, a triangle bass, fast
// arpeggios, punchy drums, and a tom fill every 4 bars.
const RUN_LEAD = [69, -1, 72, 74, 76, -1, 74, 72, 69, -1, 67, 69, 72, -1, -1, -1, 76, -1, 79, 76, 74, -1, 72, 74, 76, -1, 72, -1, 69, -1, -1, -1];
const RUN_CHORDS = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]];
function songRiftRunner(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 8, ch = RUN_CHORDS[bar % 4];
  if (i % 4 === 0) sKick(t, 0.6, 170, 50, 0.18);
  if (i === 4 || i === 12) sNoise(t, 0.14, 0.24, 'bandpass', 2600, 0.7, true);
  sHat(t, i % 2 ? 0.045 : 0.025);
  tone(NOTE(ch[0] - 12 + (i % 2 ? 12 : 0)), t, sd * 0.9, { type: 'triangle', vol: 0.09 });                          // triangle bass
  tone(NOTE(ch[i % 3] + 12), t, sd * 0.8, { type: 'square', vol: 0.016, pan: -0.5 });
  tone(NOTE(ch[(i + 1) % 3] + 24), t, sd * 0.6, { type: 'square', vol: 0.008, pan: 0.5 });
  const n = RUN_LEAD[step % 32];
  if (n > 0) {
    tone(NOTE(n), t, sd * 1.8, { type: 'square', vol: 0.045, cutoff: 3500, echo: 0.2, pan: -0.15 });
    if (bar >= 4) tone(NOTE(n - 5), t, sd * 1.8, { type: 'square', vol: 0.025, cutoff: 3000, pan: 0.3 });             // harmony
  }
  if (i === 0) sPad(ch, t, sd * 16, { type: 'square', vol: 0.004, cutoff: 1500, verb: 0.2 });
  if (bar % 4 === 3 && i >= 12) sTom(t, 220 - (i - 12) * 35, 0.45);                                                 // tom fill
  if (bar === 0 && i === 0) sCrash(t, 0.08);
}

// 8 — dreamy and HOPEFUL: big bright chords, a soft swaying beat, a bass,
// TWO shimmering arpeggios crossing each other, and a choir-like lead.
const STAR_CHORDS = [[50, 54, 57, 61, 64], [47, 50, 54, 57, 61], [43, 47, 50, 54, 61], [45, 49, 52, 54, 57]];
const STAR_MEL = [74, -1, -1, 76, 78, -1, 76, -1, 74, -1, 73, -1, 71, -1, -1, -1];
function songStarDimension(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 8, ch = STAR_CHORDS[bar % 4];
  if (i === 0) {
    sPad(ch, t, sd * 17, { type: 'triangle', vol: 0.011, cutoff: 3000, verb: 0.8 });
    sPad(ch.slice(0, 3).map(n => n + 12), t, sd * 17, { vol: 0.005, cutoff: 2200, verb: 0.8 });
    sSub(ch[0] - 24, t, sd * 16, 0.1);
  }
  if (i === 0 || i === 10) sKick(t, 0.45, 100, 45, 0.35);
  if (i === 8) { sSnare(t, 0.1, 1700); sNoise(t, 0.6, 0.02, 'highpass', 4000, 0.5); }
  if (i % 2 === 1) sShaker(t, 0.02);
  tone(NOTE(ch[i % 5] + 24), t, sd * 4, { type: 'sine', vol: 0.02, echo: 0.5, verb: 0.6, pan: -0.5 });
  tone(NOTE(ch[4 - (i % 5)] + 36), t, sd * 2, { type: 'sine', vol: 0.009, echo: 0.5, pan: 0.5 });
  if (bar >= 4) { const m = STAR_MEL[i]; if (m > 0) sPad([m], t, sd * 5, { type: 'triangle', vol: 0.02, cutoff: 3500, verb: 0.9 }); }
  if (bar === 3 && i === 0) sRiser(t, sd * 16, 0.03);
}

// 9 — slow underwater DUB: a massive sub bass, a heavy beat, clicks and chords
// that echo away forever, a lonely melodica-like lead, a shaker, and a
// radio beeping a message in Morse code.
const MORSE = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 1, 1, 1, 0, 1, 0];
const DUB_LEAD = [74, -1, -1, 72, 69, -1, -1, -1, 72, -1, 69, -1, 67, -1, -1, -1];
function songDeepSignal(step, t, sd) {
  const i = step % 16, bar = Math.floor(step / 16) % 8, root = [38, 38, 41, 36][bar % 4];
  if (i === 0) sKick(t, 0.8, 90, 30, 0.55);
  if (i === 10) sKick(t, 0.4, 80, 30, 0.35);
  if (i === 8) { sSnare(t, 0.2, 1300); sNoise(t, 0.05, 0.2, 'bandpass', 1300, 1, false, 0, AU.echo); }
  if (i === 4 || i === 12) sNoise(t, 0.03, 0.18, 'bandpass', 3200, 2, false, 0, AU.echo);
  sShaker(t, i % 2 ? 0.012 : 0.022);
  if (i === 0) { tone(NOTE(root), t, sd * 6, { type: 'sine', vol: 0.16 }); tone(NOTE(root + 12), t, sd * 6, { type: 'triangle', vol: 0.02 }); }
  if (i === 7) tone(NOTE(root), t, sd * 3, { type: 'sine', vol: 0.12 });
  if (i === 6 || i === 14) for (const n of [62, 65, 69]) tone(NOTE(n + (root - 38)), t, sd * 0.5, { type: 'sawtooth', vol: 0.02, cutoff: 1000, echo: 0.85, pan: i === 6 ? -0.4 : 0.4 });

  const bgK = S.mode === 'paused' || S.mode === 'warping' || S.mode === 'beyond' || S.mode === 'stars' ? 0 : S.mode === 'mission' || S.mode === 'soundtrack' ? 0 : inMenu() ? 0.1 : S.mode === 'dying' ? 0.25 : S.mode === 'dead' ? 0.6 : lateK();

  if (AU.ctx && (S.mode === 'beyond' || S.mode === 'stars' || S.mode === 'soundtrack')) {   // (and in the soundtrack player: just the music)   // the glitch world's hum and static fade away completely
    AU.drone.gain.setTargetAtTime(0, AU.ctx.currentTime, 1);
    AU.stat.gain.setTargetAtTime(0, AU.ctx.currentTime, 1);
  }
}

function updatePlay(dt, k) {
  player.px = player.x; player.py = player.y;      // (where you were at the start of this frame — beams check your whole path)
  if (S.cutscene) { updateCutscene(dt); return; }   // (a tutorial cutscene: the world holds still)
  if (S.spawn) { updateSpawn(dt); return; }         // (the arrival at the start of a sector)
  // --- movement (smoothly speed up / slow down) ---
  let ix = 0, iy = 0;
  if (keys.a || keys.arrowleft) ix--;
  if (keys.d || keys.arrowright) ix++;
  if (keys.w || keys.arrowup) iy--;
  if (keys.s || keys.arrowdown) iy++;
  const il = Math.hypot(ix, iy) || 1;
  if (ix || iy) { player.fx = ix / il; player.fy = iy / il; }   // remember which way you're facing
  const slimed = world.slime && inSlime(player.x, player.y);   // (a dark Basher's slime: danger.js)
  const slow = (1 - S.pure * 0.65) * (S.shield ? CFG.shieldSlow : 1) * (slimed ? CFG.slimeSlow : 1);   // near The Portal you get slower and slower... (and with your shield up)
  const ps = CFG.playerSpeed * (S.sector ? diff().you : 1);   // (you're a bit faster on easier difficulties)
  const tvx = ix / il * ps * slow, tvy = iy / il * ps * slow;
  // IN THE PURIFICATION it's slippery: you speed up and slow down much more slowly (like on ice)
  const inPure = world.opt.podiums && !!insideNull(player.x, player.y);
  const acc = 1 - Math.exp(-dt * (inPure ? CFG.pureSlip : 12));
  if (S.launchT > 0) {
    // THROWN by the border: you fly back into the map and can't steer for a moment
    S.launchT -= dt; const f = Math.exp(-dt * 3); player.vx *= f; player.vy *= f;
  } else if (player.dashT > 0) {
    // DASHING: shoot straight forward at full dash speed (the normal
    // "speed up / slow down" is skipped, so after the dash you slide to a stop)
    player.dashT -= dt;
    const ds = CFG.dashSpeed * (1 - S.pure * 0.4);
    player.vx = player.fx * ds; player.vy = player.fy * ds;
    player.ghosts.push({ x: player.x, y: player.y, life: 0.3 });   // an afterimage every frame
  } else { player.vx += (tvx - player.vx) * acc; player.vy += (tvy - player.vy) * acc; }
  player.x += player.vx * dt; player.y += player.vy * dt;
  for (const gh of player.ghosts) gh.life -= dt;
  player.ghosts = player.ghosts.filter(gh => gh.life > 0);
  // the dash recharging (a little "ready" ping when it's back)
  if (S.dashCd > 0) { S.dashCd -= dt; if (S.dashCd <= 0) { S.dashCd = 0; S.dashReadyT = 0.4; SFX.dashReady(); } }
  S.dashReadyT = Math.max(0, (S.dashReadyT || 0) - dt);
  // ...and it DRAGS you in: a pull toward its middle that gets much stronger
  // up close (squared). Far out you can walk away; too close and it wins.
  const P = world.portal;
  if (P) {
    const dx = P.x - player.x, dy = P.y - player.y, d = Math.hypot(dx, dy);
    if (d < CFG.pureRange && d > 0.5) {
      // it SUCKS YOU IN — harder and harder the closer you get — all the way
      // to its exact middle, and holds you there. (Right at the middle the pull
      // turns into "3x the distance that's left", so you slide to a stop IN the
      // centre instead of overshooting and wobbling back and forth.)
      const pull = Math.min(d * 3, Math.pow(1 - d / CFG.pureRange, 1.6) * CFG.portalPull);
      player.x += dx / d * pull * dt; player.y += dy / d * pull * dt;
    }
    // right in the MIDDLE: your screen's edges fill with portal energy.
    // It creeps in VERY slowly (CORE_SPEED) and fades when you leave — and
    // after it takes you it keeps creeping in all through the warp
    const inMiddle = d < 26;
    S.core = inMiddle ? Math.min(1, S.core + dt * CORE_SPEED) : Math.max(0, S.core - dt * 0.8);
    S.coreT = inMiddle ? (S.coreT || 0) + dt : 0;
    if (S.coreT >= 4) { startWarp(); return; }                       // 4 seconds in the middle... it takes you
  } else S.core = Math.max(0, S.core - dt * 2);

  // --- bump into Rifts (they're egg-shaped, so squash y). Being CLOSE to one
  //     hurts (1 HP a second), TOUCHING one hurts more (2 HP a second) ---
  let gap = 1e9;                                   // how far you are from the nearest Rift's edge
  for (const b of world.blobs) {
    const dx = player.x - b.x, dy = (player.y - b.y) / 1.25, d = Math.hypot(dx, dy), min = b.r * 0.92 + 5;
    if (d < min && d > 0) { player.x = b.x + dx / d * min; player.y = b.y + dy / d * min * 1.25; }
    gap = Math.min(gap, d - min);
  }
  const riftRate = gap < 3 ? CFG.riftDamageTouch : gap < CFG.riftNearRange ? CFG.riftDamageNear : 0;
  if (riftRate) {
    // damage "fills up" at riftRate per second; every time it reaches 1, that's one bite
    if (S.riftTouch < 0) S.riftTouch = 0.7;        // (just got close: the first bite comes quickly)
    S.riftTouch += riftRate * dt;
    while (S.riftTouch >= 1) { S.riftTouch -= 1; hurt(1, 'rift', true); if (S.mode !== 'play') return; }
  } else S.riftTouch = -1;

  // standing in the Purification eats you away: 1 HP a second
  if (inPure) { S.pureTouch = (S.pureTouch || 0) + CFG.pureDamage * dt; while (S.pureTouch >= 1) { S.pureTouch -= 1; hurt(1, 'purified', true); if (S.mode !== 'play') return; } }
  else S.pureTouch = Math.max(0, (S.pureTouch || 0) - dt);
  // in a DANGERBLOB: CFG.dangerDps a second (in bites of 5)
  if (world.danger && insideDanger(player.x, player.y)) { S.dangerTouch = (S.dangerTouch || 0) + CFG.dangerDps * dt; while (S.dangerTouch >= 5) { S.dangerTouch -= 5; hurt(5, 'danger', true); if (S.mode !== 'play') return; } }
  else S.dangerTouch = 0;
  S.hurtT = Math.max(0, S.hurtT - dt);
  updateLocators(dt);
  // --- edge of the world ---
  const pd = Math.hypot(player.x, player.y), lim = edgeRadiusAt(world.edge, Math.atan2(player.y, player.x)) - 8;
  if (world.opt.podiums && pd > 1) {
    // THE WIND: the closer you get to the border, the harder it blows you back
    // (squared: barely anything far out, a storm right at the edge)
    const ux = player.x / pd, uy = player.y / pd, wk = clamp(1 - (lim - pd) / CFG.borderWindRange, 0, 1);
    S.windK = wk;
    if (wk > 0) {
      const push = CFG.borderWind * wk * wk;
      player.x -= ux * push * dt; player.y -= uy * push * dt;
      if (rnd() < dt * 90 * wk) {                            // streaks of wind flying past you, back into the map
        const sa = Math.atan2(uy, ux) + rr(-0.9, 0.9), sd = lim + rr(-30, 10);
        particles.push({ x: Math.cos(sa) * sd, y: Math.sin(sa) * sd, vx: -ux * rr(160, 300), vy: -uy * rr(160, 300), life: 0.5, max: 0.5, col: rnd() < 0.6 ? '#2fd0ff' : '#fff', s: 1, streak: true });
      }
    }
    // TOUCH IT: it throws you back in (and hurts)
    if (pd > lim && S.launchT <= 0) {
      player.x *= lim / pd; player.y *= lim / pd;
      player.dashT = 0; player.vx = -ux * CFG.borderLaunch; player.vy = -uy * CFG.borderLaunch; S.launchT = 0.35;
      explode(player.x + ux * 6, player.y + uy * 6, 'pure', 0.7); S.barrierHit = { x: player.x + ux * 8, y: player.y + uy * 8, t: S.t };
      hurt(CFG.borderDamage, 'border', false, true);
      if (S.mode !== 'play') return;
    }
  }
  if (pd > lim) { const l2 = Math.hypot(player.x, player.y); if (l2 > lim) { player.x *= lim / l2; player.y *= lim / l2; } }

  if ((Math.abs(player.vx) + Math.abs(player.vy) > 20) && rnd() < 0.7)
    player.trail.push({ x: player.x + rr(-2, 2), y: player.y + rr(-2, 2), life: 0.5, red: rnd() < 0.3 });
  for (const t of player.trail) t.life -= dt;
  player.trail = player.trail.filter(t => t.life > 0);

  // --- camera follows, looking a little ahead of where you walk ---
  const ca = 1 - Math.exp(-dt * 5);
  cam.x += (player.x + player.vx * 0.35 - cam.x) * ca;
  cam.y += (player.y + player.vy * 0.35 - cam.y) * ca;

  // --- picking up shards --- (purifying sectors: purify.js instead, plus the Beamers)
  if (world.opt.podiums) {
    updatePurify(dt); updateBeamers(dt);
    if (S.mode === 'play') updateMines(dt);
    if (S.mode === 'play') updateBashers(dt);
    if (S.mode === 'play') updateMaws(dt);
    if (S.mode !== 'play') return;
  }
  else for (const s of world.shards) {
    if (s.state !== 'free') continue;
    if (Math.hypot(s.x - player.x, s.y - player.y) < CFG.pickupRange + 6) {
      s.state = 'carried'; player.carried.push(s);
      s.cx = s.x; s.cy = s.y;
      burstParticles(s.x, s.y, 26, 0.8);
      SFX.pickup(clamp((s.x - cam.x) / 200, -1, 1));
      S.boost = Math.max(S.boost, 0.35);
      const left = world.shards.filter(q => q.state === 'free').length;
      pops.push({ x: s.x, y: s.y - 14, life: 1.4, txt: left ? left + ' LEFT' : 'RETURN TO THE ANCHOR' });
    }
  }
  // carried shards orbit around you
  const n = player.carried.length;
  player.carried.forEach((s, i) => {
    const a = S.t * 2.2 + i * 6.283 / n, r = 14 + n * 1.2;          // (full-size pieces need a wider circle)
    const tx = player.x + Math.cos(a) * r, ty = player.y + Math.sin(a) * r * 0.7;
    s.cx += (tx - s.cx) * (1 - Math.exp(-dt * 10)); s.cy += (ty - s.cy) * (1 - Math.exp(-dt * 10));
  });

  if (CFG.timer) updateTimer(dt);
}

// the countdown (only while CFG.timer is on)
function updateTimer(dt) {
  // --- the timer --- near the portal it's PURIFIED: the closer you are, the
  // slower it runs; at ~70% purity it STOPS, and right at the portal it slowly
  // runs BACKWARDS (never past the time the area started with)
  const rate = Math.max(0, 1 - S.pure * 1.4);      // 1 = normal ... 0 = stopped (it never gives time back)
  // gained time flows in: fast at first, then gently (a big pile takes about
  // as long as a small one), and at least 2 seconds' worth per second
  const fill = S.timePend > 0 ? Math.min(S.timePend, Math.max(S.timePend * (1 - Math.exp(-dt * CFG.timeFillSpeed)), dt * 2)) : 0;
  S.timePend -= fill;
  S.time = Math.min(S.timeMax, S.time + fill - dt * rate);
  S.rewinding = rate < 0;
  const sec = Math.ceil(S.time);
  if (sec > S.lastSec) S.lastSec = sec;            // rewound past a second: it can happen again later
  if (sec < S.lastSec) {
    S.lastSec = sec;
    // (no sudden hit at 1:00 any more — the corruption fades in smoothly by itself)
    if (sec === CFG.screamAt) { S.boost = 0.8; S.shake = 4; }
  }
  // the CLOCK: from 1:00 a tick every second, getting louder; in the last
  // 10 seconds it ticks twice a second (tick... tock... tick... tock)
  const half = Math.ceil(S.time * 2);
  if (half < S.lastHalf && S.time <= 60 && S.time > 0 && (S.time <= 10 || half % 2 === 0))
    SFX.clock(1 - S.time / 60, half % 2 === 1);
  S.lastHalf = half;
  if (S.time <= 0) { S.time = 0; grab(); }
}

// RIFTS: how close are you to the nearest corruption mass or void tear?
// 0 = far away, 1 = right up against it. Only for looks — they don't hurt.
function updateRift(dt) {
  let near = 0, best = null;
  for (const b of world.blobs) {                     // the big black masses (strong)
    const d = Math.hypot(player.x - b.x, (player.y - b.y) / 1.25) - b.r;   // distance to its EDGE
    const f = clamp(1 - d / CFG.riftRange, 0, 1);
    if (f > near) { near = f; best = b; }
  }
  for (const t of world.tears) {                     // the flickering tears (weaker)
    const dx = Math.max(0, Math.abs(player.x - t.x) - t.w / 2), dy = Math.max(0, Math.abs(player.y - t.y) - t.h / 2);
    const f = clamp(1 - Math.hypot(dx, dy) / (CFG.riftRange * 0.7), 0, 1) * 0.6;
    if (f > near) { near = f; best = t; }
  }
  near = near * near;                                // squared: gentle far away, strong up close
  // ease toward the new value instead of jumping, so it fades in and out smoothly
  S.rift += (near - S.rift) * (1 - Math.exp(-dt * 4));
  if (best) { S.riftB = best; S.riftX = best.x; S.riftY = best.y; }
}

function updateFlyers(dt) {
  for (const f of flyers) {
    f.t += dt;
    if (f.t < 0) {                                   // waiting its turn: stay next to the player
      if (player) { f.x = player.x + f.ox; f.y = player.y + f.oy; }
      continue;
    }
    if (!f.started) {                                // lift off: plan a curved path to The Anchor
      f.started = true; f.x0 = f.x; f.y0 = f.y;
      const len = Math.hypot(f.x0, f.y0) || 1, side = rnd() < 0.5 ? -1 : 1;
      f.qx = f.x0 / 2 + (-f.y0 / len) * side * rr(30, 80);
      f.qy = f.y0 / 2 + (f.x0 / len) * side * rr(30, 80) - 40;
      f.dur = 0.75 + len / 450;
    }
    const u = Math.min(1, f.t / f.dur), e = u * u * (3 - 2 * u);    // smooth start & stop
    f.x = (1 - e) * (1 - e) * f.x0 + 2 * (1 - e) * e * f.qx;        // curved path (bezier)
    f.y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * f.qy;
    if (rnd() < 0.8) particles.push({ x: f.x, y: f.y, vx: rr(-8, 8), vy: rr(-8, 8), life: 0.5, max: 0.5,
                                      col: rnd() < 0.7 ? '#ff0000' : '#fff', s: 1, streak: rnd() < 0.5 });
    if (u >= 1) {
      f.done = true; f.s.state = 'home';
      // it joins one of The Anchor's orbits (the rings take turns)
      f.s.ring = world.delivered % ORBITS.length; f.s.oa = rnd() * 6.283; f.s.born = S.t;
      world.delivered++; world.anchorPulse = 1; S.shake = Math.max(S.shake, 3);
      burstParticles(0, 0, 30, 1.2);
      SFX.anchor();
      // +10 SECONDS for every shard (but never more than the area started with).
      // It doesn't jump onto the timer: it goes into S.timePend and FLOWS in
      // over a couple of seconds (see the timer in updatePlay), so the timer
      // and the corrupted screen edges change smoothly
      if (S.mode === 'play' && CFG.timer) {
        const got = Math.max(0, Math.min(CFG.timePerDelivery, S.timeMax - S.time - S.timePend));
        S.timePend += got;
        if (got >= 0.5) { S.timeGain = Math.round(got); S.timeGainT = 1.3; }
      }
      if (world.delivered >= world.total && S.mode === 'play') areaClear();
    }
  }
  flyers = flyers.filter(f => !f.done);
}
