<script>"use strict";const onMap=(...e)=>E=>e.flatMap(T=>(typeof T=="function"?T(E):E[T])||[]),CODEX_ENEMIES=[{id:"beamer",name:"BEAMER",where:"OUTSKIRTS + SOLID SPACE",see:onMap(e=>e.beamers.filter(E=>E.kind===1&&!E.crawl)),text:"A PURIFIED CRYSTAL GUARDIAN. IT DRIFTS AROUND UNTIL IT SEES YOU, THEN CHASES YOU, STOPS, AIMS... AND FIRES A LASER. IT NEVER ENTERS THE ANCHOR'S LIGHT.",hit:"10 PER LASER",tip:"ITS AIM LOCKS A MOMENT BEFORE IT FIRES - STEP SIDEWAYS RIGHT THEN. YOUR SHIELD BLOCKS IT."},{id:"dualbeamer",name:"DUAL BEAMER",where:"OUTSKIRTS + SOLID SPACE",see:onMap(e=>e.beamers.filter(E=>E.kind===2)),text:"A BIGGER BEAMER WITH TWO EMITTERS FLOATING AT ITS SIDES. EACH ONE AIMS AT YOU BY ITSELF, SO BOTH LASERS MEET ON YOU.",hit:"7 PER LASER, 2 LASERS",tip:"THE TWO BEAMS CROSS ON YOU - DODGE THE SAME WAY YOU WOULD A NORMAL BEAMER."},{id:"triplebeamer",name:"TRIPLE BEAMER",where:"DANGERZONES AND LATER - RARE",see:onMap(e=>e.beamers.filter(E=>E.kind===3)),text:"THE RAREST AND BIGGEST BEAMER. THREE EMITTERS, THREE LASERS - AND EACH ONE HITS VERY HARD.",hit:"26 PER LASER",tip:"KEEP YOUR SHIELD READY, OR STAY OUT OF ITS SIGHT."},{id:"mine",name:"PURIFICATION MINE",where:"OUTSKIRTS + SOLID SPACE",see:onMap("mines"),text:"A FLOATING SPIKY ORB OF PURE LIGHT. GET TOO CLOSE AND IT EXPLODES - AND THE SHARD YOU HOLD IS PURIFIED AGAIN. ONE MINE GOING OFF SETS OFF THE ONES NEXT TO IT.",hit:"15",tip:"TRICK SHOT: LURE A BEAMER SO A MINE IS BETWEEN YOU. ITS LASER BLOWS THE MINE UP - AND EVERY ENEMY NEAR IT."},{id:"basher",name:"BASHER",where:"OUTSKIRTS",see:onMap("bashers"),text:"A SPIKY BALL WITH A LONG WAVY TAIL. IT SEES YOU, WINDS UP, AND BASHES STRAIGHT AT YOU. A HIT KNOCKS YOU AWAY AND CRACKS YOUR SHARD IN TWO.",hit:"25",tip:"HOLD YOUR SHIELD WHEN IT HITS: IT BURSTS INTO SPIKES. OR JUST STEP OUT OF THE DOTTED LINE."},{id:"thundermaw",name:"THUNDERMAW",where:"LIGHTNING ROUND",see:onMap("maws"),text:"A BIG ROUND GUARDIAN WITH WAVING FINS. IT TURNS TO YOU, OPENS ITS MOUTH AND S UNTS YOU FOR A FEW SECONDS. BLUE ONES ALSO SPRAY PLASMA FIRE.",hit:"14 + FIRE",tip:"RED STARS HAVE THE WEAKEST WORMS, BLUE STARS THE DEADLIEST. YOUR SHIELD BLOCKS THE FIRE."},{id:"flamebag",name:"FLAMEBAG",where:"STARSYSTEM",see:onMap("flamebags"),text:"A SMALL SACK OF PURIFICATION WITH A BLUE FLAME INSIDE. IT CREEPS CLOSER, BLINKING LIKE A BOMB, THEN SPRAYS A WIDE FLAMETHROWER AT YOU.",hit:"14 A SECOND IN THE FIRE",tip:"DASH THROUGH IT TO POP IT - BUT IT EXPLODES, SO HOLD YOUR SHIELD UP."},{id:"bhmine",name:"BLACK HOLE MINE",where:"DARK SPACE",see:onMap("bhMines"),text:"A TINY DARK ORB WITH A RING OF VIOLET DUST. COME CLOSE AND A LITTLE BLACK HOLE GROWS OUT OF IT, PULLING YOU IN... THEN IT IMPLODES.",hit:"4 A TICK, 24 WHEN IT IMPLODES",tip:"GET OUT OF ITS REACH BEFORE IT IS FULLY GROWN."},{id:"riftworm",name:"RIFTWORM",where:"DARK SPACE",see:onMap(e=>(e.travelers||[]).filter(E=>E.riftworm&&E.state!=="hidden")),text:"A LONG PURPLE WORM CRACKLING WITH LIGHTNING. IT DIVES INTO RIFTS AND COMES OUT OF OTHERS, RAMS YOU AND FIRES ENERGY BEAMS. SOME ARE HUGE.",hit:"30 RAM, 35 A SECOND BEAM",tip:"WATCH THE RIFTS - THAT IS WHERE IT COMES FROM."},{id:"missile",name:"VOIDMITE MISSILE",where:"DARK SPACE",see:onMap(e=>(e.voidlings||[]).filter(E=>E.missile)),text:"SOMETIMES A VOIDMITE THAT TOUCHES A DANGERZONE DOESN'T DIE - IT BECOMES A HEAT-SEEKING MISSILE, TRAILING FIRE AND SMOKE.",hit:"20 + KNOCKBACK",tip:"YOUR SHIELD BLOCKS THE BLAST. OR MAKE IT HIT SOMETHING ELSE."},{id:"infecter",name:"INFECTER",where:"VIRUS ALERT",see:onMap("infecters"),text:"A BEAMER THE VIRUS GOT HOLD OF - GREEN, BLACK INSIDE, BREAKING APART. IT CHASES YOU, AIMS, AND FIRES A GLITCHING GREEN LASER.",hit:"10 + YOUR SCREEN EDGES GLITCH GREEN FOR 3 SECONDS",tip:"JUST LIKE A BEAMER: ITS AIM LOCKS A MOMENT BEFORE IT FIRES - STEP SIDEWAYS. YOUR SHIELD BLOCKS IT."},{id:"drainer",name:"DRAINER",where:"VIRUS ALERT",see:onMap("drainers"),text:"A BIG BALL WITH LONG TAILS, A SMALL THUNDERMAW MOUTH AND TINY LEGS. ITS
