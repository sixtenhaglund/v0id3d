  for (const s of world.shards.slice(0, Math.min(CFG.testStartCarried, world.total - 1))) {   // (testing shortcut)
    s.state = 'carried'; s.cx = player.x; s.cy = player.y; player.carried.push(s);
  }
  cam.x = player.x; cam.y = player.y;
  particles = []; flyers = []; pops = [];
  S.mode = 'play'; S.intro = 3.2; S.boost = 1; S.msgT = 0; S.rift = 0; S.riftB = null;
  S.hp = CFG.maxHp; S.hurtT = 0; S.riftTouch = 0; S.hitFlash = 0; S.deathCause = null;   // full health each area
  S.core = 0;
  S.lastSec = Math.ceil(S.time); S.lastHalf = Math.ceil(S.time * 2); S.rewinding = false;
}
function newRun() { startArea(1, CFG.firstShards); }
function nextArea() { startArea(S.area + 1, S.shardCount + ri(CFG.moreShardsMin, CFG.moreShardsMax)); }
function toTitle(quit = false) {
  S.mode = 'title';
  world = genWorld(11, 777); player = null; flyers = []; particles = []; pops = [];
  cam.x = 0; cam.y = -30;
  if (quit) checkForUpdate();                     // quit to the menu = a good moment to grab a new version
}
function areaClear() {
  S.mode = 'clear'; S.clearT = 0; S.boost = 0.5; S.shake = 3;
  if (S.area > S.best) { S.best = S.area; saveBest(); }
  // every piece remembers where it is right now, then takes its turn flying
  // into its spot — in order around the circle, like a clock hand
  const home = world.shards.filter(s => s.state === 'home')
    .sort((a, b) => Math.atan2(a.piece.cy, a.piece.cx) - Math.atan2(b.piece.cy, b.piece.cx));
  home.forEach((s, i) => {
    s.asX = s.lastOx ?? 0; s.asY = s.lastOy ?? 0; s.asA = s.lastA ?? 0; s.asSc = s.lastSc ?? 0.5;
    s.asT = CLEAR.fly0 + i / Math.max(1, home.length - 1) * (CLEAR.fly1 - CLEAR.fly0);
    s.asN = i; s.clicked = false;
  });
  SFX.gather();
}
// a piece clicks into the seal: sparks, a tiny shake and a rising "tick"
function sealClick(s, n) {
  const ss = sealScale();
  burstParticles(s.piece.cx * ss, s.piece.cy * ss, 8, 0.5);
  S.shake = Math.max(S.shake, 1.5);
  SFX.click(s.asN / Math.max(1, n - 1));
}
// the whole seal is back together!
function sealComplete() {
  SFX.sealed();
  world.anchorPulse = 1; S.shake = 7; S.boost = 1;
  burstParticles(0, 0, 160, 3.2);
}
// TAKING DAMAGE. cause = what hurt you ('node' or 'rift') — remembered so the
// death menu can say what killed you. small = a Rift's little bite (it doesn't
// use the "can't be hit again" cooldown, it has its own 2-second rhythm).
function hurt(dmg, cause, small = false) {
  if (S.mode !== 'play') return;
  if (!small) { if (S.hurtT > 0) return; S.hurtT = CFG.hitCooldown; }
  S.hp = Math.max(0, S.hp - dmg);
  S.hitFlash = small ? 0.5 : 1; S.shake = Math.max(S.shake, small ? 1.5 : 5);
  if (small) SFX.riftBite(); else SFX.zapHurt();
  if (S.hp <= 0) crackDie(cause);
}
// DYING (by damage, or The Portal): the screen cracks from where you are,
// then the death menu tells you what killed you
const CRACK = { spread: 0.55, end: 1.35 };
function crackDie(cause) {
  S.mode = 'cracking'; S.crackT = 0; S.deathCause = cause; S.shatter = null; S.shake = 8;
  SFX.crackDeath();
}
// what the death menu says for each way of dying
const DEATH_TEXT = {
  time:   ['REALITY COLLAPSED', 'TIME RAN OUT'],
  node:   ['SHOCKED TO PIECES', 'KILLED BY A NODE CONNECTION'],
  rift:   ['CONSUMED', 'KILLED BY A RIFT'],
};

// the timer hit zero: the lightning catches you. (After GRAB.end, die()
// starts the screen-crack jumpscare.)
function grab() {
  S.mode = 'grabbed'; S.grabT = 0; S.torn = false; S.shake = 5;
  SFX.grab();
}
function die() {
  S.mode = 'dying'; S.dieT = 0; S.shake = 10; S.deathCause = 'time';
  S.shatter = null;                               // the glass gets built fresh on the first jumpscare frame
  SFX.death();
}

function say(m) { S.msg = m; S.msgT = 1.6; }

function tryDeliver() {
  const d = Math.hypot(player.x, player.y);
  if (!player.carried.length) { say(d <= CFG.deliverRange ? 'NO SHARDS TO DELIVER' : 'GO FIND THE SHARDS'); SFX.denied(); return; }
  if (d > CFG.deliverRange) { say('GET CLOSER TO THE ANCHOR'); SFX.denied(); return; }
  // every carried shard lifts off and floats to The Anchor, one after another
  player.carried.forEach((s, i) => {
    // ox/oy = where the shard sits relative to you while it waits its turn
    flyers.push({ s, ox: s.cx - player.x, oy: s.cy - player.y, x: s.cx, y: s.cy, t: -i * 0.17, started: false });
    s.state = 'flying';
  });
  player.carried = [];
  SFX.launch();
}

const PCOLS = ['#ff0000', '#ff0000', '#d00000', '#a00000', '#ff0000', '#d00000', '#ff0000', '#a00000', '#ff0000', '#fff'];
function burstParticles(x, y, n, speed = 1, cols = PCOLS) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, v = rr(15, 90) * speed;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rr(0.3, 1.1), max: 1.1,
                     col: cols[ri(0, cols.length - 1)], s: rnd() < 0.2 ? 2 : 1, streak: rnd() < 0.4 });
  }
}

// How broken is reality? 0 = fine, 1 = gone.
// Straight countdown from 1:00 would be "linear" (same speed all the way).
// Instead we bend it with an exponential curve: barely anything at 1:00,
// about 12% at 0:30, 36% at 0:15, then it rushes to 100% at the end.
function lateRaw() {
  if (S.mode === 'play' || S.mode === 'paused' || S.mode === 'cracking') return S.time < CFG.corruptAt ? 1 - S.time / CFG.corruptAt : 0;
  if (S.mode === 'grabbed' || S.mode === 'dying' || S.mode === 'dead') return 1;
  return 0;
}
function lateK() {
  const x = lateRaw();
  return (Math.exp(4 * x) - 1) / (Math.exp(4) - 1);
}
// 0 above 0:30, then climbs to 1 at 0:00
function screamK() {
  return (S.mode === 'play' || S.mode === 'grabbed') && S.time < CFG.screamAt ? 1 - S.time / CFG.screamAt : 0;
}
function glitchK() {
  let k;
  if (S.mode === 'title') k = 0.18;
  else if (S.mode === 'grabbed' || S.mode === 'dying' || S.mode === 'dead') k = 1;
  else k = CFG.baseGlitch + (1 - CFG.baseGlitch) * Math.pow(lateK(), 1.3);
  return Math.min(1, k + S.boost * 0.6) * (1 - S.pure * 0.9);     // the portal calms it down
}
// how broken the SCREEN looks: the real breakdown, calmed near the portal
// (the timer itself keeps running — it only LOOKS clearer)
const lateV = () => lateK() * (1 - S.pure * 0.85);

// =====================================================================
//  UPDATE — runs every frame; dt = seconds since the last frame
// =====================================================================
const keys = {};
function update(dt) {
  S.t += dt;
  // PURITY: 1 right at the portal, fading to 0 at pureRange. It changes
  // smoothly (eases toward the target) so nothing snaps on or off.
  let pt = 0;
  if (S.mode === 'play' && world && world.portal && player) {
    const d = Math.hypot(player.x - world.portal.x, player.y - world.portal.y);
    pt = Math.pow(clamp(1 - (d - 40) / (CFG.pureRange - 40), 0, 1), 1.2);
  }
  S.pure += (pt - S.pure) * (1 - Math.exp(-dt * 2.5));
  S.shake = Math.max(0, S.shake - dt * 14);
  S.boost = Math.max(0, S.boost - dt * 1.6);
  S.hitFlash = Math.max(0, (S.hitFlash || 0) - dt * 2.5);
  S.devFlash = Math.max(0, (S.devFlash || 0) - dt);
  S.msgT -= dt; S.intro -= dt;
  const k = glitchK();

  // glitch bursts: short moments where the screen AND the sound break together
  S.gb -= dt;
  if (S.mode !== 'paused' && S.gb <= 0 && rnd() < (0.25 * (1 - S.pure) + k * 3) * dt) {
    S.gb = rr(0.05, 0.18 + k * 0.3);
    if (S.mode !== 'title') SFX.glitch(k);
  }
  if (S.mode === 'play') {
    // extra glitch sounds on their own random timer — more as reality breaks
    if (rnd() < (0.9 + k * 4) * (1 - S.pure) * dt) SFX.glitch(k * 0.8);
    // and a constant fine crackle, like a broken speaker
    if (rnd() < (3 + k * 10) * (1 - S.pure) * dt) burst(0.005, rr(0.02, 0.05) * (0.6 + k), rr(2500, 8000), 1, true, rr(-1, 1));
  }
  // the heartbeat speeds up from ~66 to ~150 beats per minute as time runs out
  S.beatPh = (S.beatPh + dt * (1.1 + lateK() * 1.4)) % 1;

  if (S.mode === 'play') updateRift(dt);
  else if (S.mode !== 'paused') S.rift = Math.max(0, S.rift - dt * 2);

  if (S.mode === 'play') updatePlay(dt, k);
  else if (S.mode === 'title') { cam.x = Math.sin(S.t * 0.07) * 60; cam.y = -30 + Math.cos(S.t * 0.05) * 30; }
  else if (S.mode === 'clear') {
    const before = S.clearT; S.clearT += dt;
    const ca = 1 - Math.exp(-dt * 1.8);               // the camera glides slowly over to The Anchor
    cam.x += (0 - cam.x) * ca; cam.y += (0 - cam.y) * ca;
    const home = world.shards.filter(s => s.state === 'home');
    for (const s of home) if (!s.clicked && S.clearT >= s.asT + CLEAR.flyDur) { s.clicked = true; sealClick(s, home.length); }
    if (before < CLEAR.done && S.clearT >= CLEAR.done) sealComplete();
    if (S.clearT > CLEAR.end) nextArea();
  }
  else if (S.mode === 'cracking') { S.crackT += dt; if (S.crackT > CRACK.end) S.mode = 'dead'; }
  else if (S.mode === 'grabbed') {
    S.grabT += dt;
    // bits of you stream off your pieces, flowing out along the bolts
    const pull = grabPull();
    if (S.grabT > GRAB.snap) grabPieces(player.x, player.y).forEach(([x, y], k) => {
      const [dx, dy] = GRAB_DIRS[k];
      for (let i = 0, n = S.grabT < GRAB.tear ? (rnd() < 0.3 + pull * 0.07 ? 1 : 0) : 3; i < n; i++) {
        const v = rr(25, 70) * (S.grabT < GRAB.tear ? 1 : 2.5);
        particles.push({ x: x + rr(-2, 2), y: y + rr(-2, 2), vx: dx * v + rr(-12, 12), vy: dy * v + rr(-12, 12),
                         life: rr(0.2, 0.55), max: 0.55, col: rnd() < 0.5 ? '#fff' : '#ff0000', s: 1, streak: rnd() < 0.6 });
      }
    });
    if (!S.torn && S.grabT >= GRAB.tear) {           // RIP
      S.torn = true; S.shake = 9; SFX.tear();
      burstParticles(player.x, player.y, 40, 2.2, ['#fff', '#fff', '#ff0000', '#ff0000', '#000']);
    }
    if (S.grabT >= GRAB.end) die();
  }
  else if (S.mode === 'dying') { S.dieT += dt; if (S.dieT > DEATH.end) S.mode = 'dead'; }

  if (S.mode !== 'paused') {
    if (world) { world.anchorPulse = Math.max(0, world.anchorPulse - dt * 1.8); updateArcs(dt, k); }
    updateFlyers(dt);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const p of pops) { p.y -= 14 * dt; p.life -= dt; }
    pops = pops.filter(p => p.life > 0);
  }

  // shard hum: find the nearest shard you haven't picked up
  let hum = 0, pan = 0;
  if (S.mode === 'play' && world) {
    let best = 1e9, bs = null;
    for (const s of world.shards) if (s.state === 'free') {
      const d = Math.hypot(s.x - player.x, s.y - player.y);
      if (d < best) { best = d; bs = s; }
    }
    if (bs) { hum = Math.pow(clamp(1 - best / 340, 0, 1), 1.6); pan = clamp((bs.x - player.x) / 220, -1, 1); }
  }
  // the portal hums louder the closer you are, from its side of the screen
  if (AU.ctx && AU.portal) {
    let pv = 0, pp = 0;
    if (world && world.portal && player && (S.mode === 'play' || S.mode === 'clear')) {
      const dx = world.portal.x - player.x, d = Math.hypot(dx, world.portal.y - player.y);
      pv = Math.pow(clamp(1 - d / 420, 0, 1), 1.5) * 0.09; pp = clamp(dx / 200, -1, 1);
    }
    AU.portal.gain.setTargetAtTime(pv, AU.ctx.currentTime, 0.2);
    AU.portalPan.pan.setTargetAtTime(pp, AU.ctx.currentTime, 0.2);
  }
  const musicVol = S.mode === 'title' ? 0.55 : S.mode === 'paused' ? 0.12 : 0.45;
  // (while dying, the background noise drops so the kill sound cuts through)
  const bgK = S.mode === 'paused' ? 0 : S.mode === 'title' ? 0.1 : S.mode === 'dying' ? 0.25 : S.mode === 'dead' ? 0.6 : lateK();
  audioUpdate(bgK * (1 - S.pure), hum, pan, screamK() * (1 - S.pure * 0.85), musicVol);
}

function updatePlay(dt, k) {
  // --- movement (smoothly speed up / slow down) ---
  let ix = 0, iy = 0;
  if (keys.a || keys.arrowleft) ix--;
  if (keys.d || keys.arrowright) ix++;
  if (keys.w || keys.arrowup) iy--;
  if (keys.s || keys.arrowdown) iy++;
  const il = Math.hypot(ix, iy) || 1;
  const slow = 1 - S.pure * 0.65;                  // near The Portal you get slower and slower...
  const tvx = ix / il * CFG.playerSpeed * slow, tvy = iy / il * CFG.playerSpeed * slow;
  const acc = 1 - Math.exp(-dt * 12);
  player.vx += (tvx - player.vx) * acc; player.vy += (tvy - player.vy) * acc;
  player.x += player.vx * dt; player.y += player.vy * dt;
  // ...and it DRAGS you in: a pull toward its middle that gets much stronger
  // up close (squared). Far out you can walk away; too close and it wins.
  const P = world.portal;
  if (P) {
    const dx = P.x - player.x, dy = P.y - player.y, d = Math.hypot(dx, dy);
    if (d < CFG.pureRange && d > 0) {
      const pull = Math.pow(1 - d / CFG.pureRange, 2) * CFG.portalPull;
      player.x += dx / d * pull * dt; player.y += dy / d * pull * dt;
    }
    // right in the MIDDLE: your screen's corners fill with portal energy
    // (it builds up slowly while you stay, and fades when you leave)
    const target = clamp(1 - d / 26, 0, 1);
    S.core += (target - S.core) * (1 - Math.exp(-dt * (target > S.core ? 0.9 : 2)));
  } else S.core = Math.max(0, S.core - dt * 2);

  // --- bump into Rifts (they're egg-shaped, so squash y). Standing right
  //     against one hurts: 1 HP every 2 seconds ---
  let touching = false;
  for (const b of world.blobs) {
    const dx = player.x - b.x, dy = (player.y - b.y) / 1.25, d = Math.hypot(dx, dy), min = b.r * 0.92 + 5;
    if (d < min && d > 0) { player.x = b.x + dx / d * min; player.y = b.y + dy / d * min * 1.25; }
    if (d < min + 3) touching = true;
  }
  if (touching) {
    if (S.riftTouch <= 0) S.riftTouch = CFG.riftDamageEvery - 0.3;   // the first bite comes quickly
    S.riftTouch += dt;
    if (S.riftTouch >= CFG.riftDamageEvery) { S.riftTouch -= CFG.riftDamageEvery; hurt(CFG.riftDamage, 'rift', true); if (S.mode !== 'play') return; }
  } else S.riftTouch = 0;

  // --- Nodes drift around; walking into a node connection hurts ---
  S.hurtT = Math.max(0, S.hurtT - dt);
  updateNodes(dt);
  let nearLink = 1e9, nearX = 0;
  for (const [a, b, s] of world.links) {
    const d = segDist(player.x, player.y, a.x, a.y, b.x, b.y);
    if (d < nearLink) { nearLink = d; nearX = (a.x + b.x) / 2; }
    if (d < 5 && s > 0.5) { hurt(CFG.nodeDamage, 'node'); if (S.mode !== 'play') return; }
  }
  if (nearLink < 70 && rnd() < (1 - nearLink / 70) * 9 * dt)          // it crackles as you get close
    burst(0.02, 0.12 * (1 - nearLink / 70), rr(2500, 5000), 3, true, clamp((nearX - player.x) / 120, -1, 1));
  // --- edge of the world ---
  const pd = Math.hypot(player.x, player.y), lim = edgeRadiusAt(world.edge, Math.atan2(player.y, player.x)) - 8;
  if (pd > lim) { player.x *= lim / pd; player.y *= lim / pd; }

  if ((Math.abs(player.vx) + Math.abs(player.vy) > 20) && rnd() < 0.7)
    player.trail.push({ x: player.x + rr(-2, 2), y: player.y + rr(-2, 2), life: 0.5, red: rnd() < 0.3 });
  for (const t of player.trail) t.life -= dt;
  player.trail = player.trail.filter(t => t.life > 0);

  // --- camera follows, looking a little ahead of where you walk ---
  const ca = 1 - Math.exp(-dt * 5);
  cam.x += (player.x + player.vx * 0.35 - cam.x) * ca;
  cam.y += (player.y + player.vy * 0.35 - cam.y) * ca;

  // --- picking up shards ---
  for (const s of world.shards) {
    if (s.state !== 'free') continue;
    if (Math.hypot(s.x - player.x, s.y - player.y) < CFG.pickupRange + 6) {
      s.state = 'carried'; player.carried.push(s);
      s.cx = s.x; s.cy = s.y;
      burstParticles(s.x, s.y, 26, 0.8);
      SFX.pickup(clamp((s.x - cam.x) / 200, -1, 1));
      S.boost = Math.max(S.boost, 0.35);
      const left = world.shards.filter(q => q.state === 'free').length;
      pops.push({ x: s.x, y: s.y - 14, life: 1.4, txt: left ? left + ' LEFT' : 'RETURN TO THE ANCHOR' });
    }
  }
  // carried shards orbit around you
  const n = player.carried.length;
  player.carried.forEach((s, i) => {
    const a = S.t * 2.2 + i * 6.283 / n, r = 14 + n * 1.2;          // (full-size pieces need a wider circle)
    const tx = player.x + Math.cos(a) * r, ty = player.y + Math.sin(a) * r * 0.7;
    s.cx += (tx - s.cx) * (1 - Math.exp(-dt * 10)); s.cy += (ty - s.cy) * (1 - Math.exp(-dt * 10));
  });

  // --- the timer --- near the portal it's PURIFIED: the closer you are, the
  // slower it runs; at ~70% purity it STOPS, and right at the portal it slowly
  // runs BACKWARDS (never past the time the area started with)
  const rate = Math.max(0, 1 - S.pure * 1.4);      // 1 = normal ... 0 = stopped (it never gives time back)
  S.time = Math.min(S.timeMax, S.time - dt * rate);
  S.rewinding = rate < 0;
  const sec = Math.ceil(S.time);
  if (sec > S.lastSec) S.lastSec = sec;            // rewound past a second: it can happen again later
  if (sec < S.lastSec) {
    S.lastSec = sec;
    if (sec === CFG.corruptAt) { S.boost = 1; S.shake = 5; burst(0.8, 0.4, 500, 0.5); }
    if (sec === CFG.screamAt) { S.boost = 0.8; S.shake = 4; }
  }
  // the CLOCK: from 1:00 a tick every second, getting louder; in the last
  // 10 seconds it ticks twice a second (tick... tock... tick... tock)
  const half = Math.ceil(S.time * 2);
  if (half < S.lastHalf && S.time <= 60 && S.time > 0 && (S.time <= 10 || half % 2 === 0))
    SFX.clock(1 - S.time / 60, half % 2 === 1);
  S.lastHalf = half;
  if (S.time <= 0) { S.time = 0; grab(); }
}

// RIFTS: how close are you to the nearest corruption mass or void tear?
// 0 = far away, 1 = right up against it. Only for looks — they don't hurt.
function updateRift(dt) {
  let near = 0, best = null;
  for (const b of world.blobs) {                     // the big black masses (strong)
    const d = Math.hypot(player.x - b.x, (player.y - b.y) / 1.25) - b.r;   // distance to its EDGE
    const f = clamp(1 - d / CFG.riftRange, 0, 1);
    if (f > near) { near = f; best = b; }
  }
  for (const t of world.tears) {                     // the flickering tears (weaker)
    const dx = Math.max(0, Math.abs(player.x - t.x) - t.w / 2), dy = Math.max(0, Math.abs(player.y - t.y) - t.h / 2);
    const f = clamp(1 - Math.hypot(dx, dy) / (CFG.riftRange * 0.7), 0, 1) * 0.6;
    if (f > near) { near = f; best = t; }
  }
  near = near * near;                                // squared: gentle far away, strong up close
  // ease toward the new value instead of jumping, so it fades in and out smoothly
  S.rift += (near - S.rift) * (1 - Math.exp(-dt * 4));
  if (best) { S.riftB = best; S.riftX = best.x; S.riftY = best.y; }
}

function updateFlyers(dt) {
  for (const f of flyers) {
    f.t += dt;
    if (f.t < 0) {                                   // waiting its turn: stay next to the player
      if (player) { f.x = player.x + f.ox; f.y = player.y + f.oy; }
      continue;
    }
    if (!f.started) {                                // lift off: plan a curved path to The Anchor
      f.started = true; f.x0 = f.x; f.y0 = f.y;
      const len = Math.hypot(f.x0, f.y0) || 1, side = rnd() < 0.5 ? -1 : 1;
      f.qx = f.x0 / 2 + (-f.y0 / len) * side * rr(30, 80);
      f.qy = f.y0 / 2 + (f.x0 / len) * side * rr(30, 80) - 40;
      f.dur = 0.75 + len / 450;
    }
    const u = Math.min(1, f.t / f.dur), e = u * u * (3 - 2 * u);    // smooth start & stop
    f.x = (1 - e) * (1 - e) * f.x0 + 2 * (1 - e) * e * f.qx;        // curved path (bezier)
    f.y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * f.qy;
    if (rnd() < 0.8) particles.push({ x: f.x, y: f.y, vx: rr(-8, 8), vy: rr(-8, 8), life: 0.5, max: 0.5,
                                      col: rnd() < 0.7 ? '#ff0000' : '#fff', s: 1, streak: rnd() < 0.5 });
    if (u >= 1) {
      f.done = true; f.s.state = 'home';
      // it joins one of The Anchor's orbits (the rings take turns)
      f.s.ring = world.delivered % ORBITS.length; f.s.oa = rnd() * 6.283; f.s.born = S.t;
      world.delivered++; world.anchorPulse = 1; S.shake = Math.max(S.shake, 3);
      burstParticles(0, 0, 30, 1.2);
      SFX.anchor();
      if (world.delivered >= world.total && S.mode === 'play') areaClear();
    }
  }
  flyers = flyers.filter(f => !f.done);
}

// =====================================================================
//  DRAWING THE WORLD
// =====================================================================
function diamond(x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill();
}

// the dark colors for far-away rifts: things far away look dimmer (that's
// also how real fog and distance work — it's called "atmospheric perspective")
const FAR_PAL = [[125, 0, 0], [65, 0, 0], [105, 105, 105], [32, 0, 0]];
const FAR_RIFTS = {};
function farRift(r, v) {                                   // baked once per size + variant
  const key = r + '_' + v;
  return FAR_RIFTS[key] || (FAR_RIFTS[key] = makeBlob(r, 5000 + r * 13 + v * 101, 4, 1.25, FAR_PAL));
}

function drawBackground(camX, camY, k, late) {
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  // when time runs low, bright red glitch bits appear all over the void.
  // MORE pieces at full strength — not a see-through red layer, which
  // would just mix with the black into a muddy, washed-out dark red.
  if (late > 0) {
    for (let i = 0, n = Math.round(late * 70); i < n; i++) {
      const [w, h] = glitchSize();
      g.fillStyle = REDS[i & 3]; g.fillRect(ri(0, W), ri(0, H), w, h);
    }
  }

  // FAR-AWAY RIFTS: small, dark versions of the corruption masses, deep in
  // the background. Two layers: the further one is smaller and moves slower.
  const rf = Math.floor(S.t * 10);
  for (const L of [{ p: 0.2, cell: 210, r0: 4, r1: 7, seed: 121 }, { p: 0.38, cell: 170, r0: 7, r1: 12, seed: 131 }]) {
    const ox = camX * L.p, oy = camY * L.p;
    for (let i = Math.floor(ox / L.cell) - 1; i <= Math.floor((ox + W) / L.cell) + 1; i++)
      for (let j = Math.floor(oy / L.cell) - 1; j <= Math.floor((oy + H) / L.cell) + 1; j++) {
        const h = hash2(i, j, L.seed); if (h > 0.32) continue;
        const spr = farRift(L.r0 + Math.floor(hash2(i, j, L.seed + 1) * (L.r1 - L.r0 + 1)), Math.floor(hash2(i, j, L.seed + 2) * 3));
        const x = i * L.cell + hash2(i, j, L.seed + 3) * L.cell - ox, y = j * L.cell + hash2(i, j, L.seed + 4) * L.cell - oy;
        if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
        glowAt(x, y, spr.w * 0.9, spr.h * 0.8, 0.12 + L.p * 0.15);
        g.drawImage(spr.frames[(hash2(i * 7 + j, rf, L.seed) * spr.frames.length) | 0], Math.round(x - spr.cx), Math.round(y - spr.cy));
      }
  }

  // DISTANT LIGHTNING in the back layers: small, dark bolts that flash for a
  // split second far behind everything, like a storm far away. The further
  // layer's bolts are smaller and darker. Near the portal they turn blue-purple.
  const P = world.portal, psx = P ? P.x - camX : 1e9, psy = P ? P.y - camY : 1e9;
  for (const L of [{ p: 0.25, cell: 150, len: 18, seed: 141, glow: '#520000', core: '#9a5a5a' },
                   { p: 0.45, cell: 120, len: 30, seed: 151, glow: '#780000', core: '#b88a8a' }]) {
    const ox = camX * L.p, oy = camY * L.p;
    for (let i = Math.floor(ox / L.cell); i <= Math.floor((ox + W) / L.cell); i++)
      for (let j = Math.floor(oy / L.cell); j <= Math.floor((oy + H) / L.cell); j++) {
        const x0 = i * L.cell + hash2(i, j, L.seed) * L.cell - ox, y0 = j * L.cell + hash2(i, j, L.seed + 1) * L.cell - oy;
        const blue = clamp(1 - Math.hypot(x0 - psx, y0 - psy) / 260, 0, 1);
        // each spot gets its own clock; every ~0.3 s it might strike (more often near the portal)
        const tb = Math.floor((S.t + hash2(i, j, L.seed + 2) * 10) * 3);
        if (hash2(i * 13 + j, tb, L.seed + 3) > 0.14 + blue * 0.4) continue;
        if (hash2(i * 13 + j, Math.floor(S.t * 20), L.seed + 4) < 0.35) continue;   // flicker while it's on
        let x = x0, y = y0, a = hash2(i, tb, L.seed + 5) * 6.283;
        const pts = [[x, y]];
        for (let s = 0, n = 4 + Math.floor(hash2(j, tb, L.seed + 6) * 4); s < n; s++) {
          a += (hash2(i * 7 + s, tb, L.seed + 7) - 0.5) * 1.6;
          const st = L.len / n * (0.6 + hash2(j * 7 + s, tb, L.seed + 8) * 0.8);
          x += Math.cos(a) * st; y += Math.sin(a) * st; pts.push([x, y]);
        }
        const glow = blue > 0.3 ? '#2a268e' : L.glow, core = blue > 0.3 ? '#8a84dc' : L.core;
        glowAt(x0, y0, L.len * 1.3, L.len * 1.3, 0.1 + L.p * 0.15, blue > 0.3 ? GLOW_BLUE : GLOW);   // the flash lights up the void a little
        for (const [w, col] of [[2, glow], [1, core]]) {
          g.strokeStyle = col; g.lineWidth = w; g.beginPath();
          pts.forEach(([px, py], k) => k ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
        }
      }
  }

  // white dots in two layers; the far layer moves slower (parallax = fake depth)
  const fq = Math.floor(S.t * 6);
  for (const L of [{ p: 0.3, cell: 30, seed: 1, big: 0 }, { p: 0.65, cell: 46, seed: 2, big: 0.25 }]) {
    const ox = camX * L.p, oy = camY * L.p;
    const i0 = Math.floor(ox / L.cell), i1 = Math.floor((ox + W) / L.cell);
    const j0 = Math.floor(oy / L.cell), j1 = Math.floor((oy + H) / L.cell);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const h = hash2(i, j, L.seed);
      if (h > 0.5) continue;
      let sx = Math.floor(i * L.cell + hash2(i, j, L.seed + 10) * L.cell - ox);
      const sy = Math.floor(j * L.cell + hash2(i, j, L.seed + 20) * L.cell - oy);
      const tw = hash2(i, j, fq + L.seed * 999);
      if (tw < 0.04 + k * 0.08) continue;                     // flicker off
      if (late > 0 && tw > 1 - late * 0.3) sx += ri(-4, 4);   // jitter when breaking
      const redden = hash2(i, j, 5) < late;
      g.fillStyle = redden ? '#ff0000' : (h < 0.12 ? '#fff' : '#8c8c96');
      const s = h < L.big * 0.2 ? 2 : 1;
      g.fillRect(sx, sy, s, s);
    }
  }
}

// CLOSE UP: specks floating IN FRONT of you. They move FASTER than the world
// (150%), which tricks your eye into feeling depth — like dust near a camera.
function drawMotes(camX, camY) {
  const p = 1.5, cell = 90, ox = camX * p, oy = camY * p;
  for (let i = Math.floor(ox / cell); i <= Math.floor((ox + W) / cell); i++)
    for (let j = Math.floor(oy / cell) - 1; j <= Math.floor((oy + H) / cell) + 1; j++) {
      const h = hash2(i, j, 101); if (h > 0.2) continue;
      const drift = S.t * (5 + h * 40);                      // slowly floating upward
      const x = i * cell + hash2(i, j, 102) * cell - ox + Math.sin(S.t * 0.6 + h * 30) * 5;
      const y = j * cell + (((hash2(i, j, 103) * cell - drift) % cell) + cell) % cell - oy;
      g.fillStyle = h < 0.04 ? '#ff0000' : h < 0.1 ? '#555' : '#333';
      g.fillRect(Math.round(x), Math.round(y), h < 0.1 ? 2 : 1, h < 0.1 ? 2 : 1);
    }
}

function drawTears(camX, camY, k, late) {
  for (const t of world.tears) {
    const lp = portalCalm(t.x, t.y);                  // purified by the portal: fades out, then gone
    if (lp > 0.55 || rnd() < lp * 1.6) continue;
    const tw = t.w * (1 + late * 1.5), th = t.h * (1 + late * 2.5);
    const x = t.x - camX - tw / 2, y = t.y - camY - th / 2;
    if (x > W || y > H || x + tw < 0 || y + th < 0) continue;
    // on/off flicker: mostly off when calm, mostly on when breaking
    const kk = k + (t === S.riftB ? S.rift * 3 : 0);  // stays open while you're close to it
    const on = Math.sin(S.t * 1.3 + t.ph) + Math.sin(S.t * 3.7 + t.ph * 2) > 1.4 - kk * 2.4;
    if (!on && rnd() > 0.03) continue;
    glowAt(x + tw / 2, y + th / 2, tw * 0.8, th * 0.5 + 18, 0.45 + (t === S.riftB ? S.rift * 0.4 : 0));
    // a torn strip of solid glitch: each 2-pixel row starts and ends at a random spot
    const fq = Math.floor(S.t * 14);
    for (let ry = 0; ry < th; ry += 2) {
      const n1 = hash2(ry, fq, t.ph * 97 | 0), n2 = hash2(ry, fq + 1, t.ph * 97 | 0);
      const l = n1 * tw * 0.3, r = tw - n2 * tw * 0.3;
      wallFill(Math.round(x + l), Math.round(y + ry), Math.round(r - l), 2, 5);
    }
    for (let i = 0; i < 3 + k * 8; i++) {           // loose pieces: lines, squares, blocks
      const [pw, ph] = glitchSize();
      g.fillStyle = glitchCol();
      g.fillRect(Math.round(x + rnd() * tw) + ri(-20, 10), Math.round(y + rnd() * th) + ri(-6, 6), pw, ph);
    }
  }
}

// a soft GLOW along a line: many see-through red strokes stacked on top of
// each other, from very wide to thin. Where lots of them overlap (right on
// the line) it's bright; further out only the wide ones reach, so it fades.
// Using MANY thin steps (14) is what makes the fade smooth instead of banded.
function glowStroke(tracePath, maxW, strength, color = '#ff0000', N = 14) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = color;
  for (let i = 0; i < N; i++) {
    g.lineWidth = 6 + maxW * Math.pow((N - i) / N, 1.6);
    g.globalAlpha = 0.03 * strength; tracePath(); g.stroke();
  }
  g.lineWidth = 5; g.globalAlpha = 0.3 * strength; tracePath(); g.stroke();   // bright core right on the line
  g.restore();
}

// A FAST glow along a line (used for the map edge and the tunnel). Same
// trick as the bloom: draw the line wide on a TINY canvas (1/4 size), shrink
// that again (which blurs it), then stretch both over the screen as light.
// 14 huge full-size strokes every frame was the biggest cause of lag.
const glowC = document.createElement('canvas'), gcx = glowC.getContext('2d');
const glowC2 = document.createElement('canvas'), gcx2 = glowC2.getContext('2d');
function glowLine(pts, ox, oy, maxW, strength, color = '#ff0000') {
  const w4 = Math.ceil(W / 4), h4 = Math.ceil(H / 4);
  if (glowC.width !== w4 || glowC.height !== h4) { glowC.width = w4; glowC.height = h4; glowC2.width = Math.ceil(W / 8); glowC2.height = Math.ceil(H / 8); }
  gcx.setTransform(1, 0, 0, 1, 0, 0); gcx.clearRect(0, 0, w4, h4);
  gcx.setTransform(0.25, 0, 0, 0.25, 0, 0);
  gcx.strokeStyle = color; gcx.lineJoin = 'round';
  gcx.beginPath(); pts.forEach(([x, y], i) => i ? gcx.lineTo(x + ox, y + oy) : gcx.moveTo(x + ox, y + oy)); gcx.closePath();
  gcx.globalAlpha = 0.45; gcx.lineWidth = maxW * 0.55; gcx.stroke();       // wide + faint
  gcx.globalAlpha = 1; gcx.lineWidth = maxW * 0.2; gcx.stroke();            // narrower + brighter
  gcx2.clearRect(0, 0, glowC2.width, glowC2.height); gcx2.imageSmoothingEnabled = true; gcx2.imageSmoothingQuality = 'high';
  gcx2.drawImage(glowC, 0, 0, glowC2.width, glowC2.height);
  g.save(); g.imageSmoothingEnabled = true; g.globalCompositeOperation = 'lighter';
  g.globalAlpha = Math.min(1, 1.25 * strength); g.drawImage(glowC2, 0, 0, W, H);   // the wide soft glow (ONE full-screen draw)
  g.strokeStyle = color;                                                          // + a tighter glow and a bright core, as cheap lines
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy)); g.closePath();
  g.lineWidth = 12; g.globalAlpha = 0.14 * strength; g.stroke();
  g.lineWidth = 5; g.globalAlpha = 0.3 * strength; g.stroke();
  g.restore();
}

// glowing crack lines: a thick pure-red line with a thin white one on top
function crackLines(lines, ox, oy) {
  for (const [w, col] of [[3, '#ff0000'], [1, '#fff']]) {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    for (const ln of lines) ln.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy));
    g.stroke();
  }
}

// LIVING BOLTS: the cracks crackle with electricity.
//   - 14 times a second each bolt "re-strikes": its points jump a tiny bit
//   - its tip slowly reaches further out and pulls back again
//   - bright sparks race along it from the edge inward and pop at the tip
//   - now and then a side branch flickers out, or the whole bolt flashes white
// bolts = [[points, id], ...]; the id keeps each bolt's rhythm its own.
// pal = the colors: red + white normally, blue + white for the portal
const RED_BOLTS = { glow: '#ff0000', core: '#fff', spr: null };
const BLUE_BOLTS = { glow: '#5b62ff', core: '#ebe6ff', spr: null };
function drawBolts(bolts, ox, oy, pal = RED_BOLTS) {
  const GL = pal === BLUE_BOLTS ? GLOW_BLUE : GLOW;
  const T = S.t, strike = Math.floor(T * 14);
  const shaped = bolts.map(([ln, id, full]) => {             // full = always reach all the way
    const reach = full ? 1 : 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(T * (1.1 + (id % 5) * 0.35) + id * 2.1));
    const n = Math.max(2, Math.ceil(ln.length * reach)), pts = [];
    for (let i = 0; i < n; i++) {
      const j = i ? 1.8 : 0;                               // the first point stays stuck to the edge
      pts.push([ln[i][0] + ox + (hash2(id * 31 + i, strike, 1) - 0.5) * 2 * j,
                ln[i][1] + oy + (hash2(id * 31 + i, strike, 2) - 0.5) * 2 * j]);
    }
    return [pts, id];
  });
  const path = list => { g.beginPath(); for (const [pts] of list) pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  g.strokeStyle = pal.glow; g.lineWidth = 3; path(shaped); g.stroke();
  g.strokeStyle = pal.core; g.lineWidth = 1; path(shaped); g.stroke();
  const flashing = shaped.filter(([, id]) => hash2(id, Math.floor(T * 8), 6) < 0.05);   // white-hot flash
  if (flashing.length) { g.strokeStyle = pal.core; g.lineWidth = 2; path(flashing); g.stroke(); }

  for (const [pts, id] of shaped) {
    const n = pts.length;
    // a side branch flickering out from somewhere along the bolt
    if (hash2(id, strike, 5) < 0.14) {
      const k = 1 + Math.floor(hash2(id, strike, 7) * (n - 2)), [bx, by] = pts[Math.min(k, n - 1)];
      const [px, py] = pts[Math.max(0, k - 1)];
      let a = Math.atan2(by - py, bx - px) + (hash2(id, strike, 8) < 0.5 ? 1 : -1) * (0.6 + hash2(id, strike, 9) * 0.6);
      let x = bx, y = by;
      g.strokeStyle = hash2(id, strike, 10) < 0.5 ? pal.core : pal.glow; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 3; s++) { a += (hash2(id * 3 + s, strike, 11) - 0.5) * 1.2; x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
      g.stroke();
    }
    // a spark racing along the bolt, edge -> tip, every 1-3 seconds
    const period = 1.1 + (id % 7) * 0.3, ph = ((T + id * 0.37) % period) / period;
    const f = ph * (n - 1), i = Math.min(n - 2, Math.floor(f)), u = f - i;
    const sx = lerp(pts[i][0], pts[i + 1][0], u), sy = lerp(pts[i][1], pts[i + 1][1], u);
    glowAt(sx, sy, 9, 9, 0.6, GL);
    g.fillStyle = '#fff'; g.fillRect(Math.round(sx) - 1, Math.round(sy) - 1, 3, 3);
    if (ph > 0.9) {                                        // ...and it POPS at the tip
      const [tx, ty] = pts[n - 1];
      for (let s = 0; s < 6; s++) {
        g.fillStyle = s % 3 ? pal.glow : pal.core;
        g.fillRect(Math.round(tx + (rnd() - 0.5) * 14), Math.round(ty + (rnd() - 0.5) * 14), 1 + (s & 1), 1);
      }
    }
  }
}

function drawEdge(camX, camY) {
  const e = world.edge, ox = -camX, oy = -camY;
  const far = Math.max(Math.hypot(camX, camY), Math.hypot(camX + W, camY), Math.hypot(camX, camY + H), Math.hypot(camX + W, camY + H));
  if (far < e.min - 240) return;                   // the edge (and its glow) isn't on screen
  // 1) GLOW along the border, like the rifts have — reaches ~130px into the map
  glowLine(e.pts, ox, oy, 260, 0.85 + 0.15 * Math.sin(S.t * 1.7));

  // 2) cracks running from the edge into the map
  const vis = e.cracks.map((ln, i) => [ln, i])
    .filter(([ln]) => ln.some(([x, y]) => x + ox > -20 && x + ox < W + 20 && y + oy > -20 && y + oy < H + 20));
  if (vis.length) drawBolts(vis, ox, oy);

  // 3) the wall: everything OUTSIDE the broken outline is solid glitch
  g.save(); g.beginPath(); g.rect(0, 0, W, H);
  e.pts.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy)); g.closePath();
  g.clip('evenodd');                               // evenodd = "inside the rectangle but NOT inside the outline"
  wallFill(0, 0, W, H, 3);
  g.restore();

  // 4) glitch pieces breaking off the border — some fly far into the map
  for (let i = 0; i < e.N; i += 2) {                   // (every 2nd point is plenty — half the work)
    const [px, py] = e.pts[i], sx = px + ox, sy = py + oy;
    if (sx < -130 || sx > W + 130 || sy < -130 || sy > H + 130) continue;
    const a = i / e.N * 6.283;
    for (let k = 0; k < 3; k++) {
      const d = Math.pow(rnd(), 2.2) * 130;         // mostly close to the edge, a few far in
      const x = sx - Math.cos(a) * d + ri(-7, 7), y = sy - Math.sin(a) * d + ri(-7, 7);
      glitchPiece(Math.round(x), Math.round(y));
    }
  }
}

// dots around a square whose corners are r away from the middle.
// rot = 0 gives a diamond. dash > 0 leaves every dash-th dot out.
function dotSquare(cx, cy, r, rot, n, s = 1, dash = 0, dashOff = 0) {
  for (let i = 0; i < n; i++) {
    if (dash && (i + dashOff) % dash === 0) continue;
    const t = i / n * 4, side = Math.floor(t), f = t - side;
    const a0 = rot + side * 1.5708, a1 = a0 + 1.5708;
    g.fillRect(Math.round(cx + lerp(Math.cos(a0), Math.cos(a1), f) * r - s / 2),
               Math.round(cy + lerp(Math.sin(a0), Math.sin(a1), f) * r - s / 2), s, s);
  }
}
// a 1-pixel line, drawn dot by dot so it stays crisp
function pixLine(x0, y0, x1, y1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) g.fillRect(Math.round(lerp(x0, x1, i / n)), Math.round(lerp(y0, y1, i / n)), 1, 1);
}

// Delivered shards orbit The Anchor on 3 tilted rings. A circle squashed
// flat (tilt) looks like a ring seen from an angle — that's the 3D trick.
// rot turns each ring a bit so they cross each other like an atom.
const ORBITS = [
  { r: 32, tilt: 0.36, rot: -0.35, spd: 0.9 },
  { r: 47, tilt: 0.3,  rot: 0.32,  spd: -0.6 },
  { r: 62, tilt: 0.42, rot: -0.08, spd: 0.42 },
];
// where on ring o is angle a?  Returns x, y and depth (+ = in FRONT of the core)
function orbitPos(o, a, r) {
  const px = Math.cos(a) * r, py = Math.sin(a) * r * o.tilt, c = Math.cos(o.rot), s = Math.sin(o.rot);
  return [px * c - py * s, px * s + py * c, Math.sin(a)];
}

// little lightning bolts that jump out of the core
function updateArcs(dt, k) {
  for (const a of world.arcs) a.life -= dt;
  world.arcs = world.arcs.filter(a => a.life > 0);
  if (rnd() < (1.5 + k * 6 + world.anchorPulse * 25) * dt) {
    const ang = rnd() * 6.283, len = rr(28, 70) * (1 + world.anchorPulse * 0.8), pts = [];
    let side = 0;
    for (let d = 8; d < len; d += rr(3, 7)) {
      side += rr(-3, 3);                                // wander left/right = zig-zag
      pts.push([Math.cos(ang) * d - Math.sin(ang) * side, Math.sin(ang) * d + Math.cos(ang) * side]);
    }
    world.arcs.push({ pts, life: rr(0.08, 0.22) });
  }
}

function drawAnchor(camX, camY, k) {
  const ax = Math.round(-camX), ay = Math.round(-camY);
  if (ax < -200 || ax > W + 200 || ay < -200 || ay > H + 200) return;
  const T = S.t, p = world.anchorPulse, stab = world.delivered / Math.max(1, world.total);
  const beat = beatK();
  const sc = 1 + p * 0.35 + stab * 0.35 + Math.sin(T * 2) * 0.03;
  const cs = sc * (1 + beat * 0.14);                    // the core itself thumps on the beat

  // 1) big red glow ('lighter' = light adds up, like real glow)
  g.globalCompositeOperation = 'lighter';
  const R = (95 + beat * 14) * sc, gr = g.createRadialGradient(ax, ay, 0, ax, ay, R);
  gr.addColorStop(0, 'rgba(255,60,60,0.95)');
  gr.addColorStop(0.1, 'rgba(255,0,0,0.6)');
  gr.addColorStop(0.4, 'rgba(170,0,0,0.22)');
  gr.addColorStop(1, 'rgba(80,0,0,0)');
  g.fillStyle = gr; g.fillRect(ax - R, ay - R, R * 2, R * 2);
  g.globalCompositeOperation = 'source-over';

  // 2) faint grey diamond outlines behind it, slowly breathing
  g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1;
  for (const [i, d] of world.anchorDia.entries()) {
    const b = 1 + Math.sin(T * 0.7 + i * 1.9) * 0.08;
    const x = ax + d.x * sc, y = ay + d.y * sc, s = d.s * sc * b;
    g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x - s, y); g.closePath(); g.stroke();
  }

  // 3) the band of squares streaming out of the core. pow(u, 1.6) makes
  //    them start slow (crowded near the core) and speed up as they leave.
  const cb = Math.cos(-0.45), sb = Math.sin(-0.45), fq = Math.floor(T * 10);
  for (const q of world.anchorSq) {
    const u = (q.u0 + T * q.v) % 1;
    const along = q.side * 165 * Math.pow(u, 1.6), perp = q.perp * (1 - 0.6 * u);
    let x = ax + (along * cb - perp * sb) * sc, y = ay + (along * sb + perp * cb) * sc;
    const hh = hash2(q.id, fq, 3);
    if (hh < 0.04) continue;
    if (hh > 0.93 - k * 0.2) { x += (hash2(q.id, fq, 4) - 0.5) * 24; y += (hash2(q.id, fq, 5) - 0.5) * 6; }
    const s = Math.round((2 + q.sz * (3 + (1 - u) * 9)) * (0.9 + p * 0.5 + beat * 0.25));
    g.globalAlpha = clamp(q.a * (0.85 + p * 0.5 + beat * 0.3) * Math.min(1, (1 - u) * 2.5), 0, 1);
    g.fillStyle = q.col;
    g.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), s, s);
  }
  g.globalAlpha = 1;

  // 4+5) orbit rings and orbiting shards. Draw the BACK half first, then
  //      the core, then the FRONT half — so they pass behind and in front of it.
  const home = world.shards.filter(s => s.state === 'home');
  const orbitLayer = front => {
    for (const o of ORBITS) {                           // the rings: a dotted path
      g.fillStyle = '#ff0000';
      for (let i = 0; i < 80; i++) {
        if ((i + Math.floor(T * 5)) % 4 === 0) continue;
        const [x, y, d] = orbitPos(o, i / 80 * 6.283 + T * o.spd * 0.25, o.r * sc);
        if ((d > 0) !== front) continue;
        g.globalAlpha = front ? 0.55 : 0.18;
        g.fillRect(Math.round(ax + x), Math.round(ay + y), 1, 1);
      }
    }
    g.globalAlpha = 1;
    if (S.mode === 'clear') return;                     // (the level-complete animation draws them instead)
    for (const s of home) {                             // your shards riding them
      const o = ORBITS[s.ring], grow = Math.min(1, (T - s.born) * 2.5);
      const [x, y, d] = orbitPos(o, s.oa + T * o.spd, o.r * sc * grow);
      // remember where it is, so the level-complete animation can start from here
      s.lastOx = x; s.lastOy = y; s.lastA = s.ang + T * s.spin;
      if ((d > 0) !== front) continue;
      drawShard(s, ax + x, ay + y, ART, k, front ? 0.6 : 0.3);
    }
  };
  orbitLayer(false);

  // 6) lens flare: long horizontal streak + shorter vertical one = a star
  g.globalCompositeOperation = 'lighter';
  const fw = (130 + beat * 20) * sc, lg = g.createLinearGradient(ax - fw, 0, ax + fw, 0);
  lg.addColorStop(0, 'rgba(255,0,0,0)'); lg.addColorStop(0.5, 'rgba(255,230,230,0.95)'); lg.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = lg; g.fillRect(ax - fw, ay, fw * 2, 1);
  g.globalAlpha = 0.35; g.fillRect(ax - fw * 0.6, ay - 1, fw * 1.2, 3); g.globalAlpha = 1;
  const fh = 38 * cs, vg = g.createLinearGradient(0, ay - fh, 0, ay + fh);
  vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(0.5, 'rgba(255,230,230,0.9)'); vg.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = vg; g.fillRect(ax, ay - fh, 1, fh * 2);
  g.globalCompositeOperation = 'source-over';

  // 7) two pixel squares spinning around the core in opposite directions
  g.fillStyle = '#ff0000'; g.globalAlpha = 0.9;
  dotSquare(ax, ay, 21 * cs, T * 0.7, 64, 1, 5, Math.floor(T * 8));
  g.fillStyle = '#fff'; g.globalAlpha = 0.6 + beat * 0.4;
  dotSquare(ax, ay, 28 * cs, -T * 0.45, 20, 2);
  g.globalAlpha = 1;

  // 8) THE CORE — a black rim makes it pop out of the glow
  diamond(ax, ay, 18 * cs, 'rgba(255,0,0,0.3)');
  diamond(ax, ay, 13 * cs, '#000');
  diamond(ax, ay, 11 * cs, '#ff0000');
  if (rnd() < 0.04 + k * 0.2)                           // glitch: a ghost of the core jumps sideways
    diamond(ax + ri(-5, 5), ay + ri(-1, 1), 7 * cs, 'rgba(255,255,255,0.6)');
  diamond(ax, ay, 6 * cs + p * 2, '#fff');
  g.globalCompositeOperation = 'lighter';
  const hot = g.createRadialGradient(ax, ay, 0, ax, ay, 14 * cs);
  hot.addColorStop(0, `rgba(255,255,255,${0.5 + beat * 0.5})`); hot.addColorStop(1, 'rgba(255,40,40,0)');
  g.fillStyle = hot; g.fillRect(ax - 14 * cs, ay - 14 * cs, 28 * cs, 28 * cs);
  g.globalCompositeOperation = 'source-over';

  orbitLayer(true);
  if (S.mode === 'clear') drawSealAssembly(ax, ay, k);

  // 9) lightning: red bolts with a white-hot start
  for (const a of world.arcs) {
    for (let i = 1; i < a.pts.length; i++) {
      g.fillStyle = i < 3 || rnd() < 0.1 ? '#fff' : '#ff0000';
      pixLine(ax + a.pts[i - 1][0] * sc, ay + a.pts[i - 1][1] * sc, ax + a.pts[i][0] * sc, ay + a.pts[i][1] * sc);
    }
  }

  // 10) shock waves when a shard arrives: a red circle + a white diamond
  if (p > 0) {
    const rr2 = (1 - p) * 140;
    g.fillStyle = '#ff0000'; g.globalAlpha = p;
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * 6.283 + p;
      g.fillRect(Math.round(ax + Math.cos(a) * rr2), Math.round(ay + Math.sin(a) * rr2), 2, 2);
    }
    g.fillStyle = '#fff';
    dotSquare(ax, ay, (1 - p) * 110 * sc, 0, 80, 1);
    g.globalAlpha = 1;
  }

  // delivery zone ring — shows up when you're carrying shards
  if (player && player.carried.length && S.mode === 'play') {
    const inside = Math.hypot(player.x, player.y) <= CFG.deliverRange;
    g.fillStyle = inside ? '#fff' : '#ff0000';
    g.globalAlpha = inside ? 0.8 : 0.45;
    for (let i = 0; i < 72; i++) {
      if ((i + Math.floor(S.t * 8)) % 3 === 0) continue;
      const a = i / 72 * 6.283 + S.t * 0.2;
      g.fillRect(Math.round(ax + Math.cos(a) * CFG.deliverRange), Math.round(ay + Math.sin(a) * CFG.deliverRange), 1, 1);
    }
    g.globalAlpha = 1;
  }
}

// LEVEL COMPLETE — the cutscene (T = seconds since the last shard arrived)
//   0.0  black bars slide in, the camera glides to The Anchor, and your pieces
//        leave their orbits and spread into a big ring, each lined up with its spot
//   1.2  one by one, around the circle like a clock hand, each piece flies in
//        and SNAPS into place (click!) — slightly overshooting, then settling
//   4.2  all in... silence. The seal trembles. The cracks burn brighter.
//   4.6  BOOM: flash, light beams, three shock rings — the seal is whole again.
//        It keeps its cracks, glowing: you can see what it went through.
const CLEAR = { fly0: 1.2, fly1: 3.6, flyDur: 0.6, hold: 4.2, done: 4.6, text: 5.3, enter: 6, end: 11 };

// where a piece waits in the big ring (angle = the direction of its spot)
function hoverPose(s, T, R) {
  const slotA = Math.atan2(s.piece.cy, s.piece.cx), FR = R + 46;
  const u = Math.min(1, T / CLEAR.fly0), e = u * u * (3 - 2 * u);
  return [lerp(s.asX, Math.cos(slotA) * FR, e), lerp(s.asY, Math.sin(slotA) * FR, e) + Math.sin(T * 3 + s.bob) * 2 * e, s.asA + T * 0.8];
}
// a piece's spot in the seal, with the whole seal turned by rot
function sealSpot(s, rot) {
  const c = Math.cos(rot), sn = Math.sin(rot);
  return [(s.piece.cx * c - s.piece.cy * sn) * ART, (s.piece.cx * sn + s.piece.cy * c) * ART];
}

function drawSealAssembly(ax, ay, k) {
  const seal = world.seal, T = S.clearT, R = seal.rad * ART;
  const home = world.shards.filter(s => s.state === 'home');

  if (T >= CLEAR.hold) {                                // WHOLE again (but still cracked)
    const done = T >= CLEAR.done, u = Math.max(0, T - CLEAR.done), rot = u * 0.2;
    const tremble = done ? 0 : 1.3;                     // shaking in the silence
    const ox = ax + rr(-tremble, tremble), oy = ay + rr(-tremble, tremble);
    if (done) {
      // light beams spinning out of it: pure red wedges (added as light) with
      // a thin white line down the middle of every other one
      g.save(); g.globalCompositeOperation = 'lighter';
      const grow = Math.min(1, u * 3), fade = Math.min(1, u * 4);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * 6.283 + u * 0.3, len = (R * 3 + 220) * grow, wd = 0.035 + 0.02 * Math.sin(u * 3 + i);
        g.globalAlpha = (i % 2 ? 0.12 : 0.22) * fade; g.fillStyle = '#ff0000';
        g.beginPath(); g.moveTo(ox, oy);
        g.lineTo(ox + Math.cos(a - wd) * len, oy + Math.sin(a - wd) * len);
        g.lineTo(ox + Math.cos(a + wd) * len, oy + Math.sin(a + wd) * len); g.closePath(); g.fill();
        if (i % 2 === 0) {
          g.globalAlpha = 0.6 * fade; g.strokeStyle = '#fff'; g.lineWidth = 1;
          g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.cos(a) * len, oy + Math.sin(a) * len); g.stroke();
        }
      }
      g.restore();
      glowAt(ox, oy, R * 2.4, R * 2.4, 0.8 + Math.max(0, 1 - u) * 0.8);
    } else glowAt(ox, oy, R * 1.8, R * 1.8, 0.4 + (T - CLEAR.hold) * 1.5);
    for (const s of home) { const [px, py] = sealSpot(s, rot); drawShard(s, ox + px, oy + py, ART, 0, 0.12, rot, true); }
    // the cracks between the pieces GLOW — burning up in the silence, pulsing after
    const c = Math.cos(rot), sn = Math.sin(rot);
    const lines = home.map(s => [...s.piece.poly, s.piece.poly[0]].map(([x, y]) => [(x * c - y * sn) * ART, (x * sn + y * c) * ART]));
    g.save(); g.globalAlpha = done ? 0.6 + 0.35 * Math.sin(u * 4) : Math.min(1, (T - CLEAR.hold) * 3);
    crackLines(lines, ox, oy); g.restore();
    if (done && u < 1.4) {                              // three shock rings, one after another
      for (let r = 0; r < 3; r++) {
        const v = u - r * 0.18; if (v < 0 || v > 0.9) continue;
        g.fillStyle = r === 1 ? '#ff0000' : '#fff'; g.globalAlpha = 1 - v / 0.9;
        const rad = R + v * 330;
        for (let i = 0; i < 120; i++) { const a = i / 120 * 6.283; g.fillRect(Math.round(ox + Math.cos(a) * rad), Math.round(oy + Math.sin(a) * rad), 2, 2); }
      }
      g.globalAlpha = 1;
    }
    return;
  }

  for (const s of home) {                               // GATHERING + ASSEMBLING
    const [tx, ty] = sealSpot(s, 0);
    let x, y, a, glow = 0.7;
    if (T < s.asT) [x, y, a] = hoverPose(s, T, R);      // spread out and wait, turning slowly
    else {
      const [hx, hy, ha] = hoverPose(s, s.asT, R);      // fly in from where it was waiting
      const u = Math.min(1, (T - s.asT) / CLEAR.flyDur);
      // "back" easing: it shoots a little PAST its spot, then settles back = a satisfying snap
      const c1 = 1.70158, e = 1 + (c1 + 1) * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
      x = lerp(hx, tx, e); y = lerp(hy, ty, e);
      const turn = ((-ha % 6.283) + 9.425) % 6.283 - 3.1416;   // shortest way round to angle 0
      a = ha + turn * Math.min(1, u * 1.3); glow = u < 1 ? 1 : 0.15;
    }
    drawShard(s, ax + x, ay + y, ART, k * 0.3, glow, a, true);
  }
}

// =====================================================================
//  THE BLUE PORTAL — the one thing in V0ID3D that is NOT red or glitchy.
//  Calm, smooth and deep: a window into another space, inspired by the
//  End portal's starfield. Everything here moves slowly and smoothly.
// =====================================================================
// the rim's shape: an oval that gently breathes (smooth sine waves only)
const portalShape = (a, t) => 1 + 0.028 * Math.sin(a * 3 + t * 0.7) + 0.016 * Math.sin(a * 5 - t * 1.1) + 0.007 * Math.sin(a * 8 + t * 1.7);

// drawn in TWO passes: 'outer' (halo, rays, specks) goes BEFORE the bloom so
// it glows; 'inner' (the dark window, rim, motes) goes AFTER, so the glow
// can't wash blue haze over the deep, dark inside
function drawPortal(camX, camY, pass) {
  const P = world.portal; if (!P) return;
  const sx = P.x - camX, sy = P.y - camY, T = S.t, RX = P.rx, RY = P.ry;
  if (sx < -320 || sx > W + 320 || sy < -320 || sy > H + 320) return;
  const rim = k => { g.beginPath();
    for (let i = 0; i <= 72; i++) { const a = i / 72 * 6.283, m = portalShape(a, T) * k; i ? g.lineTo(sx + Math.cos(a) * RX * m, sy + Math.sin(a) * RY * m) : g.moveTo(sx + Math.cos(a) * RX * m, sy + Math.sin(a) * RY * m); }
    g.closePath(); };

  if (pass === 'inner') return drawPortalInner(sx, sy, RX, RY, T, rim, P);

  // 0) SPACE BENDS AROUND IT. Take a snapshot of everything already drawn
  //    around the portal, then paint it back in thin rings — each ring turned
  //    a bit more (and pulled in a bit more) the closer it is to the rim.
  //    The void itself gets twisted into a slowly spinning whirlpool.
  // (only the square around the portal is copied and redrawn — copying the
  // whole screen 12+ times a frame was the biggest cause of lag)
  const R0 = RY * 0.95, R1 = RY * 3.8, NR = 12;
  const bx = Math.max(0, Math.floor(sx - R1 * 1.3)), by = Math.max(0, Math.floor(sy - R1 * 1.3));
  const bw = Math.min(W, Math.ceil(sx + R1 * 1.3)) - bx, bh = Math.min(H, Math.ceil(sy + R1 * 1.3)) - by;
  if (bw <= 0 || bh <= 0) return;
  psg.globalCompositeOperation = 'copy'; psg.drawImage(cv, bx, by, bw, bh, bx, by, bw, bh);
  for (let k = NR - 1; k >= 0; k--) {                   // outside ring first
    const u0 = k / NR, u1 = (k + 1) / NR, r0 = lerp(R0, R1, u0), r1 = lerp(R0, R1, u1);
    const f = 1 - (u0 + u1) / 2;                         // 1 = at the rim ... 0 = far out
    // the twist SWAYS (sin) instead of growing forever — if it kept growing,
    // neighbouring rings would drift further and further apart into a mess
    const twist = f * f * (0.9 + 0.4 * Math.sin(T * 0.45)), pinch = 1 + f * f * 0.22;
    const q0 = lerp(RX / RY, 1, u0), q1 = lerp(RX / RY, 1, u1);   // oval near the rim -> round further out
    g.save(); g.beginPath();
    g.ellipse(sx, sy, r1 * q1, r1, 0, 0, 6.2832); g.ellipse(sx, sy, r0 * q0, r0, 0, 0, 6.2832);
    g.clip('evenodd');                                   // = only the ring between the two ovals
    g.translate(sx, sy); g.rotate(twist); g.scale(pinch, pinch); g.translate(-sx, -sy);
    // only the square this ring actually covers (the inner rings are small)
    const rq = r1 * 1.15, qx = Math.max(bx, Math.floor(sx - rq)), qy = Math.max(by, Math.floor(sy - rq));
    const qw = Math.min(bx + bw, Math.ceil(sx + rq)) - qx, qh = Math.min(by + bh, Math.ceil(sy + rq)) - qy;
    if (qw > 0 && qh > 0) g.drawImage(psnap, qx, qy, qw, qh, qx, qy, qw, qh);
    g.restore();
  }
  // a shadow just outside the rim: the ground falls away into the hole
  const sh = g.createRadialGradient(sx, sy, RY * 0.9, sx, sy, RY * 1.9);
  sh.addColorStop(0, 'rgba(0,0,0,0.8)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(sx - RY * 2, sy - RY * 2, RY * 4, RY * 4);

  // 1) a huge soft blue halo, slowly breathing
  glowAt(sx, sy, RX * 4.5, RY * 3.6, 0.5 + 0.12 * Math.sin(T * 1.3), GLOW_BLUE);
  // cracks in the void around it, crackling with blue-white lightning
  drawBolts(P.cracks.map((ln, i) => [ln, 500 + i]), sx, sy, BLUE_BOLTS);

  // the PURE ZONE: a faint ring of soft blue dots showing how far the calm
  // reaches — brighter while you're inside it
  g.save(); g.globalCompositeOperation = 'lighter';
  const zr = CFG.pureRange * 0.92;
  for (let i = 0; i < 90; i++) {
    const a = i / 90 * 6.283 + T * 0.05;
    g.globalAlpha = (0.18 + S.pure * 0.35) * (0.6 + 0.4 * Math.sin(a * 6 + T * 2));
    g.drawImage(PDOTS[i % 2 ? 0 : 3], sx + Math.cos(a) * zr - 2, sy + Math.sin(a) * zr - 2, 4, 4);
  }
  g.restore();

  // 2) faint light rays slowly turning
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = '#6f5cff';
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * 6.283 + T * 0.12, len = RY * (3.2 + Math.sin(T * 0.8 + i * 2) * 0.6), wd = 0.035;
    g.globalAlpha = 0.06 + 0.035 * Math.sin(T * 1.1 + i);
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a - wd) * len, sy + Math.sin(a - wd) * len * 0.85);
    g.lineTo(sx + Math.cos(a + wd) * len, sy + Math.sin(a + wd) * len * 0.85); g.closePath(); g.fill();
  }
  // 3) specks of light being SUCKED IN on spiral paths
  for (let i = 0; i < 28; i++) {
    const ph = ((T * (0.12 + (i % 5) * 0.02) + i * 0.137) % 1);        // 0 = far out ... 1 = reaches the rim
    const a = i * 2.4 + (1 - ph) * 3.2 + T * 0.2, r = 1 + Math.pow(1 - ph, 1.3) * 2.4;
    const x = sx + Math.cos(a) * RX * r, y = sy + Math.sin(a) * RY * r * 0.9, s = 2 + (1 - ph) * 3;
    g.globalAlpha = Math.min(1, ph * 3) * Math.min(1, (1 - ph) * 6) * 0.9;
    g.drawImage(PDOTS[i % PDOTS.length], x - s, y - s, s * 2, s * 2);
  }
  g.restore();
}

function drawPortalInner(sx, sy, RX, RY, T, rim, P) {
  // 4) THE WINDOW: cut to the rim shape, then paint deep space inside it
  g.save(); rim(1); g.clip();
  const bg = g.createRadialGradient(sx, sy, 0, sx, sy, RY * 1.1);
  bg.addColorStop(0, '#1a1052'); bg.addColorStop(0.55, '#0a0628'); bg.addColorStop(1, '#030110');
  g.fillStyle = bg; g.fillRect(sx - RX * 1.3, sy - RY * 1.3, RX * 2.6, RY * 2.6);
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {                           // faint, slow nebula clouds
    const a = T * (0.09 + i * 0.04) + i * 2.1, s = RX * (1.1 + i * 0.25);
    g.globalAlpha = 0.07; g.drawImage(PDOTS[i === 1 ? 4 : 2], sx + Math.cos(a) * RX * 0.45 - s, sy + Math.sin(a) * RY * 0.4 - s, s * 2, s * 2);
  }
  // TUNNEL RINGS: faint ovals that keep shrinking toward the middle, forever —
  // it feels like the portal goes on and on, deep into the distance
  g.strokeStyle = '#8b6dff'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const k = 1 - ((T * 0.18 + i / 6) % 1);               // 1 = at the rim ... 0 = deep in the middle
    g.globalAlpha = 0.28 * k * k;
    g.beginPath(); g.ellipse(sx, sy, RX * k, RY * k, 0, 0, 6.2832); g.stroke();
  }
  // the starfield: 5 layers at different DEPTHS. The deepest layer barely
  // moves when the portal slides across your screen, the nearest moves most —
  // that difference (parallax) is what makes it look like you're looking INTO
  // it. Each layer also slowly swirls, in alternating directions.
  const offBaseX = W / 2 - sx, offBaseY = H / 2 - sy, span = RY * 1.25;
  for (let L = 0; L < 5; L++) {
    const p = 0.12 + L * 0.16, cell = 19 - L * 2.2, size = 0.8 + L * 0.45;
    const rot = T * (L % 2 ? -1 : 1) * (0.04 + L * 0.025), c = Math.cos(rot), s = Math.sin(rot);
    const offX = offBaseX * (1 - p) * 0.6, offY = offBaseY * (1 - p) * 0.6;
    // which grid cells land inside the window? (undo the swirl + slide to find out)
    const qx0 = -(offX * c + offY * s), qy0 = -(-offX * s + offY * c);
    for (let i = Math.floor((qx0 - span) / cell); i <= Math.floor((qx0 + span) / cell); i++)
      for (let j = Math.floor((qy0 - span) / cell); j <= Math.floor((qy0 + span) / cell); j++) {
        const h = hash2(i, j, 300 + L); if (h > 0.6) continue;
        const qx = i * cell + hash2(i, j, 310 + L) * cell, qy = j * cell + hash2(i, j, 320 + L) * cell;
        const x = sx + offX + qx * c - qy * s, y = sy + offY + qx * s + qy * c;
        if (Math.abs(x - sx) > RX * 1.2 || Math.abs(y - sy) > RY * 1.2) continue;
        const tw = 0.5 + 0.5 * Math.sin(T * (0.8 + h * 3) + h * 40);          // twinkle
        const sz = size * (0.55 + h) * (h < 0.04 ? 2.2 : 1);                 // a few big bright ones
        g.globalAlpha = (0.3 + 0.7 * tw) * (0.45 + p * 0.7);
        g.drawImage(PDOTS[(hash2(i, j, 330 + L) * 4) | 0], x - sz, y - sz, sz * 2, sz * 2);
      }
  }
  // darker toward the rim, so the middle feels far away
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  const vg = g.createRadialGradient(sx, sy, RY * 0.45, sx, sy, RY * 1.05);
  vg.addColorStop(0, 'rgba(3,1,16,0)'); vg.addColorStop(1, 'rgba(3,1,16,0.85)');
  g.fillStyle = vg; g.fillRect(sx - RX * 1.3, sy - RY * 1.3, RX * 2.6, RY * 2.6);
  // LIGHTNING flickering across the deep inside: a new bolt ~9 times a second,
  // from one side of the rim to the other, wiggling most in the middle
  const lb = Math.floor(T * 9);
  g.lineWidth = 1;
  for (let n = 0; n < 2; n++) {
    if (hash2(lb, n, 91) > 0.35) continue;
    const a1 = hash2(lb, n, 92) * 6.283, a2 = a1 + 2 + hash2(lb, n, 93) * 2.3;
    const x0 = sx + Math.cos(a1) * RX * 0.9, y0 = sy + Math.sin(a1) * RY * 0.9;
    const x1 = sx + Math.cos(a2) * RX * 0.9, y1 = sy + Math.sin(a2) * RY * 0.9;
    for (const [col, jit] of [['#6b5cff', 1.6], [n ? '#c9b8ff' : '#fff', 1]]) {
      g.strokeStyle = col; g.beginPath(); g.moveTo(x0, y0);
      for (let s = 1; s <= 7; s++) {
        const f = s / 7, wig = (1 - Math.abs(f - 0.5) * 2) * 8 * jit;
        g.lineTo(lerp(x0, x1, f) + (hash2(lb * 7 + s, n, 94) - 0.5) * wig, lerp(y0, y1, f) + (hash2(lb * 7 + s, n, 95) - 0.5) * wig);
      }
      g.stroke();
    }
  }
  g.restore();

  // 5) the rim: a smooth glowing cyan edge, plus a faint second ring outside
  // TORN EDGES: jagged pieces of the surrounding void hang over the rim. Each
  // one hangs there for a few seconds... then tears off and falls in,
  // spinning and shrinking. It shows the real void from where it tore off.
  for (let i = 0; i < 10; i++) {
    const a0 = hash2(i, 1, 71) * 6.283;                                 // randomly spaced around the rim
    const cyc = 3 + hash2(i, 2, 71) * 4, ph = ((T + hash2(i, 3, 71) * cyc) % cyc) / cyc;
    const fall = ph < 0.72 ? 0 : (ph - 0.72) / 0.28;                  // 0 = hanging on ... 1 = gone in
    const m = portalShape(a0, T), ex = sx + Math.cos(a0) * RX * m, ey = sy + Math.sin(a0) * RY * m;
    const x = lerp(ex, sx, fall * 0.85), y = lerp(ey, sy, fall * 0.85);
    const sc = 1 - fall * 0.85, w = (4 + hash2(i, 4, 71) * 5) * sc, d = (2.5 + hash2(i, 6, 71) * 3) * sc;
    // a FLAP: wide along the rim, hanging a little way in, with a ragged inner edge.
    // (tx, ty) = along the rim, (nx, ny) = pointing into the portal
    const rot = fall * fall * 5, tx = Math.cos(a0 + 1.5708 + rot), ty = Math.sin(a0 + 1.5708 + rot);
    const nx = -Math.cos(a0 + rot), ny = -Math.sin(a0 + rot);
    const shape = [[-w, -d * 0.4], [w, -d * 0.4], [w * 0.7, d * (0.6 + hash2(i, 7, 71) * 0.6)], [w * 0.15, d * 0.5], [-w * 0.45, d * (0.8 + hash2(i, 8, 71) * 0.5)]];
    g.save(); g.beginPath();
    shape.forEach(([u, v], k) => { const px = x + tx * u + nx * v, py = y + ty * u + ny * v; k ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.closePath();
    g.save(); g.clip(); g.drawImage(psnap, Math.round(x - ex - Math.cos(a0) * 4), Math.round(y - ey - Math.sin(a0) * 4)); g.restore();
    g.globalAlpha = 1 - fall; g.strokeStyle = '#a57bff'; g.lineWidth = 1; g.stroke();
    g.restore();
  }
  glowStroke(() => rim(1), 30, 0.75 + 0.1 * Math.sin(T * 2), '#6a4dff', 7);   // (small rim: 7 layers is plenty)
  g.save(); g.strokeStyle = '#e4dcff'; g.lineWidth = 1; rim(1); g.stroke();
  g.globalAlpha = 0.35 + 0.15 * Math.sin(T * 1.6); g.strokeStyle = '#a57bff'; rim(1.16); g.stroke();
  g.restore();

  // 6) motes of light orbiting it on a tilted ring, with little tails
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++) {
    for (let k = 0; k < 5; k++) {                          // k = 0 is the mote, 1..4 its fading tail
      const a = T * 0.9 + i / 12 * 6.283 - k * 0.07;
      const x = sx + Math.cos(a) * RX * 1.55, y = sy + Math.sin(a) * RY * 0.55 + Math.sin(a * 2 + i) * 3;
      const s = (k ? 2.2 : 3.4) * (1 - k * 0.15);
      g.globalAlpha = (1 - k * 0.22) * (Math.sin(a) > 0 ? 0.95 : 0.4);   // dimmer when "behind" the portal
      g.drawImage(PDOTS[i % 2 ? 3 : 0], x - s, y - s, s * 2, s * 2);
    }
  }
  g.restore();
}

// =====================================================================
//  NODES — they drift around in clumps. Any two Nodes close enough form a
//  NODE CONNECTION: spiky red lightning between them. Walk into one = -8 HP.
// =====================================================================
function updateNodes(dt) {
  const N = world.nodes; if (!N.length) return;
  const mid = {};                                   // the middle of each clump
  for (const nd of N) { const m = mid[nd.clump] || (mid[nd.clump] = { x: 0, y: 0, n: 0 }); m.x += nd.x; m.y += nd.y; m.n++; }
  // SMOOTH wandering: it's not the direction that changes randomly, it's how
  // hard it's TURNING — and even that changes slowly. So the paths curve gently.
  // Each CLUMP has its own travel direction (so the whole group goes places)...
  world.clumpDir = world.clumpDir || {};
  for (const c in mid) {
    const cd = world.clumpDir[c] || (world.clumpDir[c] = { ang: rnd() * 6.283, turn: 0 });
    cd.turn = clamp(cd.turn + (rnd() - 0.5) * 1.6 * dt, -0.6, 0.6); cd.ang += cd.turn * dt;
    const m = mid[c], mx = m.x / m.n, my = m.y / m.n, pd = Math.hypot(mx, my) || 1;
    const er = edgeRadiusAt(world.edge, Math.atan2(my, mx));
    // heading into the edge or The Anchor? steer the whole clump away
    const out = pd > er - 220 ? -1 : pd < 380 ? 1 : 0;
    if (out) { const want = Math.atan2(my * out, mx * out), diff = ((want - cd.ang + 9.425) % 6.283) - 3.1416; cd.ang += diff * 1.2 * dt; }
  }
  for (const nd of N) {
    // ...and each Node wobbles around that with a little wander of its own
    nd.turn = clamp(nd.turn + (rnd() - 0.5) * 3 * dt, -1, 1);
    nd.ang += nd.turn * dt;
    const cd = world.clumpDir[nd.clump];
    let tx = Math.cos(cd.ang) * CFG.nodeSpeed + Math.cos(nd.ang) * CFG.nodeSpeed * 0.45;
    let ty = Math.sin(cd.ang) * CFG.nodeSpeed + Math.sin(nd.ang) * CFG.nodeSpeed * 0.45;
    const m = mid[nd.clump], mx = m.x / m.n - nd.x, my = m.y / m.n - nd.y, md = Math.hypot(mx, my);
    if (md > 45) { tx += mx / md * 22; ty += my / md * 22; }                 // stay (loosely) with your clump
    for (const o of N) {                                                     // don't sit on each other
      if (o === nd) continue;
      const dx = nd.x - o.x, dy = nd.y - o.y, d = Math.hypot(dx, dy);
      if (d < 18 && d > 0) { tx += dx / d * 30; ty += dy / d * 30; }
    }
    for (const b of world.blobs) {                                           // steer around Rifts
      const dx = nd.x - b.x, dy = nd.y - b.y, d = Math.hypot(dx, dy);
      if (d < b.r * 1.4 + 20 && d > 0) { tx += dx / d * 45; ty += dy / d * 45; }
    }
    const pd = Math.hypot(nd.x, nd.y) || 1, er = edgeRadiusAt(world.edge, Math.atan2(nd.y, nd.x));
    if (pd > er - 120) { tx -= nd.x / pd * 45; ty -= nd.y / pd * 45; }       // turn back from the edge
    if (pd < 260) { tx += nd.x / pd * 45; ty += nd.y / pd * 45; }            // keep away from The Anchor
    const e = 1 - Math.exp(-dt * 1.5);                                       // ease into it = smooth
    nd.vx += (tx - nd.vx) * e; nd.vy += (ty - nd.vy) * e;
    nd.x += nd.vx * dt; nd.y += nd.vy * dt;
  }
  // node connections: every pair closer than nodeLink. s = strength: it
  // flickers weakly right at the limit and is solid when they're close
  const links = [];
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const d = Math.hypot(N[i].x - N[j].x, N[i].y - N[j].y);
    if (d < CFG.nodeLink) links.push([N[i], N[j], clamp((CFG.nodeLink - d) / 15, 0, 1)]);
  }
  world.links = links;
}

function drawNodes(camX, camY) {
  const T = S.t, fq = Math.floor(T * 15);
  // NODE CONNECTIONS: spiky red lightning — a zig-zag whose teeth flip every strike
  for (const [a, b, s] of world.links) {
    if (s < 1 && rnd() > s) continue;                                        // weak ones flicker
    const x0 = a.x - camX, y0 = a.y - camY, x1 = b.x - camX, y1 = b.y - camY;
    if (Math.max(x0, x1) < -10 || Math.min(x0, x1) > W + 10 || Math.max(y0, y1) < -10 || Math.min(y0, y1) > H + 10) continue;
    const len = Math.hypot(x1 - x0, y1 - y0) || 1, nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
    const n = Math.max(4, Math.round(len / 6)), pts = [[x0, y0]];
    for (let i = 1; i < n; i++) {
      const sp = (i % 2 ? 1 : -1) * (2 + hash2(a.id * 97 + b.id, i + fq * 13, 81) * 4);   // alternating sharp teeth
      pts.push([lerp(x0, x1, i / n) + nx * sp, lerp(y0, y1, i / n) + ny * sp]);
    }
    pts.push([x1, y1]);
    glowAt((x0 + x1) / 2, (y0 + y1) / 2, len * 0.55, len * 0.55, 0.18 * s);
    for (const [w, col] of [[3, '#ff0000'], [1, '#fff']]) {
      g.strokeStyle = col; g.lineWidth = w; g.beginPath();
      pts.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
    }
  }
  // the NODES: a small red core with spikes spinning around it
  for (const nd of world.nodes) {
    const x = nd.x - camX, y = nd.y - camY;
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    glowAt(x, y, 18, 18, 0.6);
    const sp = T * 2.5 + nd.spin, pulse = 0.85 + 0.15 * Math.sin(T * 6 + nd.spin);
    g.strokeStyle = '#ff0000'; g.lineWidth = 1; g.beginPath();
    for (let i = 0; i < 8; i++) {                                            // spikes spinning around it
      const a = sp + i * 0.7854, r = (i % 2 ? 10 : 7) * pulse;
      g.moveTo(x + Math.cos(a) * 3.5, y + Math.sin(a) * 3.5); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    g.stroke();
    diamond(x, y, 5.5, '#000');                                              // a black rim so it stands out
    diamond(x, y, 4.5, '#ff0000'); diamond(x, y, 2, '#fff');
  }
}

// how calm a spot is because of the portal: 1 right next to it, 0 out of reach
function portalCalm(x, y) {
  const P = world.portal;
  return P ? clamp(1 - Math.hypot(x - P.x, y - P.y) / CFG.pureRange, 0, 1) : 0;
}

function drawBlobs(camX, camY, k, late) {
  const fq = Math.floor(S.t * 12);
  for (const b of world.blobs) {
    const m = b.r * 4;                                // rough size incl. the glow
    if (b.x - camX > W + m || b.y - camY > H + m || b.x - camX < -m || b.y - camY < -m) continue;
    const lp = portalCalm(b.x, b.y);                  // near the portal = purified
    const r = (b === S.riftB ? S.rift : 0) * (1 - lp); // it gets angrier when you're close
    // glowing aura: slowly breathing, brighter and bigger when you're near.
    // Near the portal the red glow fades and a calm BLUE glow takes over.
    const breathe = 0.8 + 0.2 * Math.sin(S.t * 2.1 + (b.seed % 100));
    const gs = b.r * (2.4 + r * 0.9);
    glowAt(b.x - camX, b.y - camY, gs, gs * 1.25, (0.38 + late * 0.2 + r * 0.45) * breathe * (1 - lp));
    if (lp > 0) glowAt(b.x - camX, b.y - camY, gs, gs * 1.25, 0.5 * lp * breathe, GLOW_BLUE);
    if (!b.spr) b.spr = makeBlob(Math.round(b.r), b.seed);   // bake it the first time we see it
    const sp = b.spr, x = b.x - camX - sp.cx, y = b.y - camY - sp.cy;
    if (x > W || y > H || x + sp.w < 0 || y + sp.h < 0) continue;
    // purified rifts stop flickering between frames: they hold still
    const fr = sp.frames[lp > 0.6 ? 0 : (hash2(b.seed, fq) * sp.frames.length) | 0];
    let jx = 0;
    if (rnd() < (0.02 + k * 0.08 + r * 0.5) * (1 - lp)) jx = ri(-3, 3) * (1 + late * 3 + r * 2);
    const ghost = Math.max(late, r) * (1 - lp);
    if (ghost > 0.25 && rnd() < ghost * 0.35) {      // afterimage when breaking
      g.globalAlpha = 0.35; g.drawImage(fr, Math.round(x + ri(-8, 8) * ghost), Math.round(y)); g.globalAlpha = 1;
    }
    const P = world.portal;
    const sk = P ? clamp(1 - Math.hypot(P.x - b.x, P.y - b.y) / 340, 0, 1) : 0;   // how hard the portal pulls it
    if (sk > 0) {
      // BEING SUCKED IN: stretched toward the portal (and squeezed thinner),
      // leaning in with a pull that pulses, like it's fighting it
      const ang = Math.atan2(P.y - b.y, P.x - b.x);
      const st = 1 + sk * (0.6 + 0.12 * Math.sin(S.t * 3 + b.seed)), sq = 1 - sk * 0.3;
      const pull = sk * 9 * (0.6 + 0.4 * Math.sin(S.t * 2 + b.seed));
      g.save();
      g.translate(b.x - camX + Math.cos(ang) * pull, b.y - camY + Math.sin(ang) * pull);
      g.rotate(ang); g.scale(st, sq); g.rotate(-ang);   // turn, stretch along that direction, turn back
      g.drawImage(fr, -sp.cx, -sp.cy);
      g.restore();
      // a river of bits pouring off it into the portal, curving like a whirlpool,
      // turning from red glitch to purple to white as they get purified
      for (let i = 0, n = Math.round(8 + sk * 22); i < n; i++) {
        const ph = (S.t * (0.3 + (i % 4) * 0.07) + i / n) % 1;           // 0 = leaving the rift ... 1 = gone in
        const off = (hash2(i, b.seed, 1) - 0.5) * 1.3;
        const x0 = b.x + Math.cos(ang + off) * b.r * 0.9, y0 = b.y + Math.sin(ang + off) * b.r * 1.1;
        const mx = (x0 + P.x) / 2 - Math.sin(ang) * 45, my = (y0 + P.y) / 2 + Math.cos(ang) * 45;   // bend = whirlpool
        const e = ph * ph, ie = 1 - e;                                   // speeds up as it gets closer
        const px = ie * ie * x0 + 2 * ie * e * mx + e * e * P.x - camX, py = ie * ie * y0 + 2 * ie * e * my + e * e * P.y - camY;
        if (ph < 0.45) {
          const [pw, ph2] = glitchSize(); g.fillStyle = glitchCol(); g.fillRect(Math.round(px), Math.round(py), pw, ph2);
        } else {
          const s = 3 * (1 - ph) + 1;
          g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.9;
          g.drawImage(PDOTS[ph < 0.75 ? 1 : 3], px - s, py - s, s * 2, s * 2);
          g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
        }
      }
    } else g.drawImage(fr, Math.round(x + jx), Math.round(y));
    // live glitch bits flickering around it — a few drift far out
    for (let i = 0, n = Math.round((3 + ((b.r / 8) | 0) + r * 8) * (1 - lp)); i < n; i++) {
      const a = rnd() * 6.283, d = b.r * (1 + Math.pow(rnd(), 1.8) * 1.9);
      const [pw, ph] = glitchSize(); g.fillStyle = glitchCol();
      g.fillRect(Math.round(b.x - camX + Math.cos(a) * d), Math.round(b.y - camY + Math.sin(a) * d * 1.25), pw, ph);
    }
  }
}

// the outline of a seal piece, drawn around its own middle (0, 0)
function piecePath(P) {
  g.beginPath();
  P.poly.forEach(([px, py], i) => i ? g.lineTo(px - P.cx, py - P.cy) : g.moveTo(px - P.cx, py - P.cy));
  g.closePath();
}

// one glowing, glitchy shard = one broken piece of this area's seal.
// ang = force a rotation, still = no bobbing / fragments (for the assembly)
function drawShard(s, x, y, sc, k, glowA = 1, ang = null, still = false) {
  if (!still) y += Math.sin(S.t * 2 + s.bob) * 1.5 * sc;
  g.globalCompositeOperation = 'lighter';
  const r = 22 * sc * (0.9 + 0.12 * Math.sin(S.t * 5 + s.bob));
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, 'rgba(255,0,0,0.6)'); gr.addColorStop(0.4, 'rgba(200,0,0,0.2)'); gr.addColorStop(1, 'rgba(120,0,0,0)');
  g.globalAlpha = glowA; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;

  const P = s.piece, seal = world.seal, a = ang ?? s.ang + S.t * s.spin;
  g.save(); g.translate(x, y); g.rotate(a); g.scale(sc, sc);
  if (!still && rnd() < 0.06 + k * 0.2) {              // glitch ghost
    g.save(); g.translate(ri(-3, 3) / sc, 0); piecePath(P); g.fillStyle = 'rgba(255,255,255,0.55)'; g.fill(); g.restore();
  }
  // the piece: the seal picture, cut out to this piece's shape
  piecePath(P);
  g.save(); g.clip(); g.drawImage(seal.img, -seal.rad - 1 - P.cx, -seal.rad - 1 - P.cy); g.restore();
  g.strokeStyle = '#fff'; g.lineWidth = 1 / sc; g.stroke();     // bright broken edges
  g.restore();
  if (still) return;

  const gl = hash2(s.id, Math.floor(S.t * 3), 77);             // a sparkle "+" pops on a corner now and then
  if (gl > 0.78 && sc >= 0.8) {
    const [vx, vy] = P.poly[((gl * 100) | 0) % P.poly.length], ca = Math.cos(a), sa = Math.sin(a);
    const px = x + ((vx - P.cx) * ca - (vy - P.cy) * sa) * sc, py = y + ((vx - P.cx) * sa + (vy - P.cy) * ca) * sc;
    g.fillStyle = '#fff'; g.fillRect(Math.round(px) - 2, Math.round(py), 5, 1); g.fillRect(Math.round(px), Math.round(py) - 2, 1, 5);
  }
  if (rnd() < 0.05 + k * 0.15) {                       // a slice of the shard slides sideways
    const hy = Math.round(y + ri(-6, 5) * sc), sw = Math.round(24 * sc);
    g.drawImage(cv, Math.round(x - sw / 2), hy, sw, 2, Math.round(x - sw / 2) + ri(-4, 4), hy, sw, 2);
  }
  const fq = Math.floor(S.t * 8);                      // tiny fragments buzzing around
  for (let i = 0; i < 3; i++) {
    const h = hash2(s.id * 7 + i, fq, 9);
    if (h < 0.4) continue;
    g.fillStyle = h > 0.8 ? '#fff' : '#ff0000';
    g.fillRect(Math.round(x + (hash2(s.id, fq, i) - 0.5) * 26 * sc), Math.round(y + (hash2(s.id, fq, i + 5) - 0.5) * 20 * sc), 1, 1);
  }
}

function drawPlayer(camX, camY, k) {
  for (const t of player.trail) {
    g.globalAlpha = t.life * 1.6;
    g.fillStyle = t.red ? '#ff0000' : '#fff';
    g.fillRect(Math.round(t.x - camX), Math.round(t.y - camY), 1, 1);
  }
  g.globalAlpha = 1;
  const x = Math.round(player.x - camX), y = Math.round(player.y - camY);
  glowAt(x, y, 16, 16, 0.4);                                    // a red glow around you
  g.fillStyle = '#fff'; g.globalAlpha = 0.6;                    // a ring of dots spinning around you
  dotSquare(x, y, 10, S.t * 1.6, 20, 1, 3, Math.floor(S.t * 6));
  g.globalAlpha = 1;
  if (rnd() < 0.05 + k * 0.25) diamond(x + ri(-3, 3), y, 5, 'rgba(255,0,0,0.7)');   // red ghost
  if (S.hurtT > 0 && Math.floor(S.t * 20) % 2) return;       // blinking right after a hit
  diamond(x, y, 5, '#fff');
  diamond(x, y, 2, '#000');
  diamond(x, y, 0.8 + beatK() * 1.2, '#ff0000');               // a red core, pulsing with The Anchor's heartbeat
  if (rnd() < k * 0.3) { g.fillStyle = '#fff'; g.fillRect(x + ri(-8, 8), y + ri(-6, 6), ri(1, 6), 1); }
}

// =====================================================================
//  BLOOM — makes bright things GLOW. Shrink a copy of the picture to 1/4
//  size and blur it, then ADD it back on top ('lighter'). Bright pixels
//  spill a soft halo into the dark around them; black stays black.
// =====================================================================
// (FAST version: no blur filter. Shrinking a picture with smoothing on
// averages neighbouring pixels together — that IS a blur, and it's nearly
// free. Shrink twice (1/4, then 1/8), then stretch both back up.)
function bloom(strength) {
  bl.globalCompositeOperation = 'copy'; bl.imageSmoothingEnabled = true; bl.imageSmoothingQuality = 'high';
  bl.drawImage(cv, 0, 0, bloomC.width, bloomC.height);
  bl2.globalCompositeOperation = 'copy'; bl2.imageSmoothingEnabled = true;
  bl2.drawImage(bloomC, 0, 0, bloomC2.width, bloomC2.height);
  g.save();
  g.imageSmoothingEnabled = true;                     // smooth when stretching back up = soft glow
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = strength * 0.55; g.drawImage(bloomC, 0, 0, W, H);    // tight glow
  g.globalAlpha = strength * 0.6; g.drawImage(bloomC2, 0, 0, W, H);    // wide glow
  g.restore();
}

// =====================================================================
//  SCREEN GLITCH EFFECTS — applied to the finished picture
// =====================================================================
function postFX(k, late) {
  const bursting = S.gb > 0;
  // 1) glitch pieces — a random mix of shapes, each with a random size
  let n = 0;
  if (bursting) n = ri(2, 4 + Math.round(k * 16));
  else if (rnd() < 0.12 + k * k * 0.7) n = ri(1, Math.round(1 + k * 8));
  for (let i = 0; i < n; i++) {
    const type = rnd();
    const [w, h] = glitchSize(ri(1, Math.round(1 + k * 5)));     // pieces get bigger as k rises
    const x = ri(-10, W), y = ri(-5, H);
    if (type < 0.2) {                          // slide a whole strip sideways
      const sh = ri(1, Math.round(3 + k * 24)), dx = (rnd() < 0.5 ? -1 : 1) * ri(2, Math.round(6 + k * 40));
      moveRegion(0, y, W, sh, dx, 0);
    } else if (type < 0.42) {                  // cut out a block of the picture and move it
      moveRegion(x, y, w * 2, h * 2, ri(-30, 30) * (0.3 + k), ri(-12, 12) * (0.3 + k));
    } else if (type < 0.68) {                  // solid block
      g.fillStyle = glitchCol(); g.fillRect(x, y, w, h);
    } else if (type < 0.8) {                   // block of static
      wallFill(x, y, w * 2, h * 2, 6);
    } else if (type < 0.92) {                  // a cluster of little squares
      const s = ri(1, 4), c = glitchCol(), m = ri(4, 14);
      for (let j = 0; j < m; j++) { g.fillStyle = rnd() < 0.7 ? c : glitchCol(); g.fillRect(x + ri(0, 8) * s, y + ri(0, 5) * s, s, s); }
    } else {                                   // hollow box
      g.strokeStyle = glitchCol(); g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, w * 2, h * 2);
    }
  }
  // 2) red ghost: copy the picture, keep only the red part, add it back shifted
