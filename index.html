  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, v = rr(20, 120) * speed;
    S.dim.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rr(0.5, 1.6), max: 1.6, col: cols[ri(0, cols.length - 1)],
                    s: rnd() < 0.25 ? 2 : 1, tri: tri && rnd() < 0.6, rot: rnd() * 6.283, spin: rr(-6, 6) });
  }
}

// THE RIFT OF CRACKED REALITY: its crack-lightning (a fixed shape that
// re-strikes a little all the time) and the triangles floating around it
function makeRealityRift() {
  const spot = dimSpot(120), bolts = [], tris = [];
  const nb = ri(5, 7);
  for (let i = 0; i < nb; i++) {                                    // LONG lightning cracks reaching far out
    let a = i / nb * 6.283 + rr(-0.4, 0.4), x = 0, y = 0;
    const ln = [[0, 0]], len = rr(70, 125), n = 11;
    for (let s = 0; s < n; s++) { a += rr(-0.5, 0.5); x += Math.cos(a) * len / n; y += Math.sin(a) * len / n; ln.push([x, y]); }
    bolts.push(ln);
    for (let b = 0, nbr = ri(1, 2); b < nbr; b++) {                // side branches splitting off it
      const k = ri(2, n - 3); let [bx, by] = ln[k], ba = a + (rnd() < 0.5 ? 1 : -1) * rr(0.6, 1.1);
      const br = [[bx, by]], bl = len * rr(0.25, 0.45);
      for (let s = 0; s < 5; s++) { ba += rr(-0.5, 0.5); bx += Math.cos(ba) * bl / 5; by += Math.sin(ba) * bl / 5; br.push([bx, by]); }
      bolts.push(br);
    }
  }
  for (let i = 0; i < 22; i++)
    tris.push({ a: rnd() * 6.283, r: rr(26, 130), w: rr(-0.25, 0.25), rot: rnd() * 6.283, spin: rr(-1.5, 1.5), s: rr(2, 4.5), light: rnd() < 0.5, bob: rnd() * 6.283 });
  return { ...spot, t: 0, bolts, tris };
}

// THE CRACK, which breaks like glass. It starts as a few tiny cracks right
// where the Rift was (the very first shards break out of the middle), and
// from there a spiderweb spreads out: cracks shooting OUT, and rings going
// AROUND. Where they cross, they cut everything into pieces — and every
// piece is cut once more corner to corner, into two sharp TRIANGLES (glass
// shards). Once a shard is cracked all the way around, it breaks off and is
// sucked into the hole... and behind it there's nothing. Pitch black.
// (Positions are relative to the crack's middle.)
function makeCrack(x, y) { return { x, y, web: makeCrackWeb() }; }

// (the cracks spread out to 480 px — just past the screen's corners, which
// are ~370 px from the middle. Shards further out break off at the very end,
// together with the last ones you can see.) The first 34 px crack open fast,
// while it tears open; after that it's slow, then faster and faster.
const webReach = ct => ct < DIMQ.open ? 34 * smoothstep(ct / DIMQ.open) : 34 + 446 * Math.pow(Math.min(1, (ct - DIMQ.open) / DIMQ.spread), 1.5);
const webTime = r => r <= 34 ? DIMQ.open * r / 34 : DIMQ.open + DIMQ.spread * Math.pow(clamp((r - 34) / 446, 0, 1), 1 / 1.5);   // WHEN the cracks reach distance r
function makeCrackWeb() {
  const N = ri(22, 28), rings = [0, 10, 21, 34, 49, 66, 86, 109, 135, 165, 199, 238, 282, 332, 390, 455, 530], a0 = rnd() * 6.283, rad = [];
  for (let i = 0; i < N; i++) {                                     // each crack going out = a jagged line of points
    const a = a0 + (i + rr(-0.25, 0.25)) / N * 6.283, pts = [];
    for (let j = 0; j < rings.length; j++) {
      // (each point wobbles, but less than halfway to its neighbours — so pieces never overlap)
      const gap = Math.min(j ? rings[j] - rings[j - 1] : 0, j < rings.length - 1 ? rings[j + 1] - rings[j] : 75);
      const r = rings[j] + (rnd() - 0.5) * 0.6 * gap, aj = a + rr(-0.07, 0.07);
      pts.push([Math.cos(aj) * r, Math.sin(aj) * r]);
    }
    rad.push(pts);
  }
  const cells = [], quads = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < rings.length - 1; j++) {
    const A = rad[i], B = rad[(i + 1) % N], q = [A[j], A[j + 1], B[j + 1], B[j]];   // the piece between two cracks and two rings
    // cut it corner to corner (a random one of its two diagonals) into 2 sharp triangles
    const flip = rnd() < 0.5, diag = j === 0 ? null : flip ? [q[0], q[2]] : [q[1], q[3]];
    const tris = j === 0 ? [[q[0], q[1], q[2]]] : flip ? [[q[0], q[1], q[2]], [q[0], q[2], q[3]]] : [[q[0], q[1], q[3]], [q[1], q[2], q[3]]];
    const cracked = webTime(rings[j + 1]), quad = { diag, tris: [], cracked };
    for (const poly of tris) {
      const cx = (poly[0][0] + poly[1][0] + poly[2][0]) / 3, cy = (poly[0][1] + poly[1][1] + poly[2][1]) / 3;
      // it breaks off a moment after the cracks around it are complete
      const c = { poly, cx, cy, fall: cracked + (j < 2 ? rr(0, 0.25) : rr(0.1, 1.1)), spin: rr(-4, 4), started: false };
      cells.push(c); quad.tris.push(c);
    }
    quads.push(quad);
  }
  const end = Math.max(...cells.map(c => c.fall)) + DIMQ.fallDur;   // when the very last shard is gone
  return { N, rings, rad, cells, quads, end };
}

function updateDimPath(dt) {
  const D = S.dim; if (!D.phase) return;
  const [yx, yy] = dimYou();
  D.flash = Math.max(0, D.flash - dt * 1.8);
  for (const p of D.fx) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += p.spin * dt;
    p.vx *= 1 - dt * 1.2; p.vy *= 1 - dt * 1.2;                     // (they slow down as they fly)
  }
  D.fx = D.fx.filter(p => p.life > 0);
  for (const r of D.rings) r.t += dt;
  D.rings = D.rings.filter(r => r.t < r.dur);

  if (D.phase === 'dots') {
    if (!D.dot) {
      D.wait -= dt;
      if (D.wait <= 0) { D.dot = { ...dimSpot(), t: 0 }; SFX.dotAppear(); }
    } else {
      const d = D.dot; d.t += dt;
      if (d.t > 0.35 && Math.hypot(d.x - yx, d.y - yy) < DIMQ.touch) {           // YOU TOUCHED IT
        D.found++;
        dimBurst(d.x, d.y, 46, 1, ['#fff', '#fff', '#cfdcff', '#8fa8ff', '#b08cff']);
        D.rings.push({ x: d.x, y: d.y, t: 0, dur: 0.9, r: 70, col: '#cfdcff' });
        D.flash = 0.22; SFX.dotTouch(D.found / D.need);
        D.dot = null;
        if (D.found >= D.need) { D.phase = 'rift'; D.rift = makeRealityRift(); SFX.riftAppear(); }   // ...the last one: THE RIFT
        else D.wait = DIMQ.nextDot;
      }
    }
  } else if (D.phase === 'rift') {
    const R = D.rift; R.t += dt;
    const d = Math.hypot(R.x - yx, R.y - yy);
    // HOLD E next to it. Let go, and the charge drains away again.
    if (d < DIMQ.near && keys.e && R.t > 1) D.hold = Math.min(DIMQ.hold, D.hold + dt);
    else D.hold = Math.max(0, D.hold - dt * 2);
    const near = clamp(1 - d / 420, 0, 1), pan = clamp((R.x - yx) / 220, -1, 1);
    SFX.riftHumSet(near, pan); SFX.riftChargeSet(D.hold / DIMQ.hold);
    if (rnd() < near * near * 7 * dt) burst(rr(0.01, 0.04), 0.04 + near * 0.12, rr(2500, 8000), 4, false, pan);   // it crackles
    if (D.hold >= DIMQ.hold) {                                                    // IT EXPLODES
      D.phase = 'boom'; D.t2 = 0; D.flash = 1;
      SFX.riftBoom();
      // the blast THROWS YOU BACK a little... (then the crack pulls you in)
      const bx = yx - R.x, by = yy - R.y, bl = Math.hypot(bx, by) || 1;
      D.vx += bx / bl * 170; D.vy += by / bl * 170;
      dimBurst(R.x, R.y, 150, 2.2, ['#fff', '#effcff', '#8fe6ff', '#35c8ff', '#b08cff']);
      dimBurst(R.x, R.y, 34, 1.6, ['#dfe9f0', '#9aa9b4'], true);                   // its triangles fly away
      for (const [dl, r, col] of [[0, 170, '#fff'], [0.12, 260, '#8fe6ff'], [0.28, 380, '#b08cff']]) D.rings.push({ x: R.x, y: R.y, t: -dl, dur: 1.3, r, col });
    }
  } else if (D.phase === 'boom') {
    D.t2 += dt;
    if (D.t2 >= DIMQ.boom) { D.phase = 'crack'; D.ct = 0; D.crack = makeCrack(D.rift.x, D.rift.y); SFX.crackOpen(D.crack.web.end); }
  } else if (D.phase === 'crack') {
    D.ct += dt;
    // IT SUCKS YOU IN: a pull toward its middle that keeps getting stronger
    // (and dimControl() makes your own floating fade out at the same time)
    const C = D.crack, dx = C.x - yx, dy = C.y - yy, dist = Math.hypot(dx, dy);
    const pull = 1 - dimControl(), sp = Math.min(dist * 2.2, 30 + D.ct * 35);
    const tvx = dist > 0.5 ? dx / dist * sp : 0, tvy = dist > 0.5 ? dy / dist * sp : 0, k = pull * Math.min(1, dt * 6);
    D.vx += (tvx - D.vx) * k; D.vy += (tvy - D.vy) * k;
    // THE WIND: streaks of air rushing into the hole from all around, swirling
    // a little (like water down a drain), faster and faster the closer they get.
    // Kept as distance r + angle a from the hole — that makes "toward the
    // middle" simply: make r smaller.
    // It picks up over the first few seconds, and near the end it smoothly
    // DIES DOWN (fewer and fainter streaks) as the last shards go
    const grow = clamp(D.ct / 3, 0, 1);
    D.windK = 1 - smoothstep(clamp((D.ct - (C.web.end - 3.2)) / 2.6, 0, 1));
    for (let i = 0, n = Math.round((3 + grow * 9) * D.windK); i < n; i++)
      D.wind.push({ r: rr(40, 440), a: rnd() * 6.283, v: rr(60, 140), sw: rr(0.2, 0.5), b: rnd() < 0.3 });
    for (const w of D.wind) { w.v *= 1 + dt * 1.6; w.r -= w.v * dt; w.a += w.sw * w.v * dt / Math.max(w.r, 25); }
    D.wind = D.wind.filter(w => w.r > 5);
    // a shard breaking off: sometimes a little glass "tink" (not every one — there are 700+)
    for (const c of C.web.cells) if (!c.started && D.ct >= c.fall) {
      c.started = true;
      if (rnd() < 0.12) SFX.glassBit(clamp((C.x + c.cx - yx) / 250, -1, 1));
    }
    if (D.ct >= C.web.end) { D.phase = 'void'; D.fx = []; D.rings = []; D.wind = []; }   // the last shard is gone: it's all black now
  }
}

// ---------------------------------------------------------------------
//  DRAWING
// ---------------------------------------------------------------------
function dimTri(x, y, s, rot) {                                     // a little triangle
  g.beginPath();
  for (let i = 0; i < 3; i++) { const a = rot + i * 2.094; i ? g.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s) : g.moveTo(x + Math.cos(a) * s, y + Math.sin(a) * s); }
  g.closePath(); g.fill();
}
// an arrow on the screen edge, pointing at something you can't see right now
function dimArrow(sx, sy, cx, cy) {
  const m = 14;
  if (sx > m && sx < W - m && sy > m && sy < H - m) return;
  const a = Math.atan2(sy - cy, sx - cx), ca = Math.cos(a), sa = Math.sin(a);
  const k = Math.min((W / 2 - m) / Math.max(1e-6, Math.abs(ca)), (H / 2 - m) / Math.max(1e-6, Math.abs(sa)));
  const ax = cx + ca * k, ay = cy + sa * k;
  glowAt(ax, ay, 16, 16, 0.7, GLOW_BLUE);
  g.fillStyle = '#eef2ff'; g.beginPath();
  g.moveTo(ax + ca * 6, ay + sa * 6); g.lineTo(ax + Math.cos(a + 2.4) * 5, ay + Math.sin(a + 2.4) * 5); g.lineTo(ax + Math.cos(a - 2.4) * 5, ay + Math.sin(a - 2.4) * 5);
  g.closePath(); g.fill();
}
// A VERY BRIGHT DOT: a white-hot point in layers of blue glow, with a star's rays
function drawBrightDot(x, y, age, T) {
  const b = smoothstep(clamp(age / 0.5, 0, 1)), p = 0.88 + 0.12 * Math.sin(T * 4.2);
  glowAt(x, y, 64 * p * b, 64 * p * b, 0.5 * b, GLOW_BLUE);
  glowAt(x, y, 26 * p * b, 26 * p * b, 0.95 * b, PDOTS[0]);
  glowAt(x, y, 13 * p, 13 * p, b, PDOTS[3]);
  glowAt(x, y, 7, 7, b, PDOTS[3]);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const [dx, dy, len] of [[1, 0, 40], [0, 1, 28], [0.707, 0.707, 12], [0.707, -0.707, 12]]) {
    const L = len * p * b, gr = g.createLinearGradient(x - dx * L, y - dy * L, x + dx * L, y + dy * L);
    gr.addColorStop(0, 'rgba(150,170,255,0)'); gr.addColorStop(0.5, 'rgba(245,247,255,0.95)'); gr.addColorStop(1, 'rgba(150,170,255,0)');
    g.strokeStyle = gr; g.lineWidth = 1; g.beginPath(); g.moveTo(x - dx * L, y - dy * L); g.lineTo(x + dx * L, y + dy * L); g.stroke();
  }
  if (age < 0.6) {                                                  // it appears with a ring of light
    g.globalAlpha = 1 - age / 0.6; g.strokeStyle = '#cfdcff'; g.beginPath(); g.arc(x, y, 4 + age * 70, 0, 6.2832); g.stroke();
  }
  g.restore();
  g.fillStyle = '#fff'; g.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
}
// THE RIFT OF CRACKED REALITY (k = 0..1 how charged it is while you hold E)
function drawRealityRift(R, x, y, T, k) {
  const app = smoothstep(clamp(R.t / 0.9, 0, 1)), p = (1 + 0.06 * Math.sin(T * 2.4)) * (1 + k * 0.35) * app, sh = k * 2.5;
  const X = x + rr(-sh, sh), Y = y + rr(-sh, sh);
  glowAt(X, Y, 120 * p, 120 * p, 0.3, GLOW_CYAN);                  // a wide dark-cyan haze
  glowAt(X, Y, 52 * p, 52 * p, 0.85, GLOW_CYAN);
  glowAt(X, Y, 26 * p, 26 * p, 1, PDOTS[3]);                        // the white-hot core
  glowAt(X, Y, 12 * p, 12 * p, 1, PDOTS[3]);
  // bits of broken reality: little triangles slowly drifting around it
  for (const tr of R.tris) {
    const a = tr.a + T * tr.w, r = tr.r * (1 + k * 0.25) * app;
    g.globalAlpha = (0.35 + 0.5 * (0.5 + 0.5 * Math.sin(T * 1.7 + tr.bob))) * app;
    g.fillStyle = tr.light ? '#e6eef3' : '#8796a1';
    dimTri(X + Math.cos(a) * r, Y + Math.sin(a) * r * 0.85 + Math.sin(T + tr.bob) * 2, tr.s, tr.rot + T * tr.spin);
  }
  g.globalAlpha = 1;
  // its CRACKS: white lightning branching out of the core
  drawBolts(R.bolts.map((ln, i) => [ln.map(([bx, by]) => [X + bx * p, Y + by * p]), 1600 + i, true]), 0, 0, CYAN_BOLTS, app);
  g.fillStyle = '#fff'; g.fillRect(Math.round(X) - 1, Math.round(Y) - 1, 3, 3);
}

// everything on the path, drawn BEFORE the bloom so it all glows
function drawDimPath(cx, cy) {
  const D = S.dim, T = S.starT; if (!D.phase) return;
  const at = (x, y) => [cx + x - D.camX, cy + y - D.camY];         // a spot -> where it is on the screen
  if (D.dot) {
    const [sx, sy] = at(D.dot.x, D.dot.y);
    drawBrightDot(sx, sy, D.dot.t, T);
    dimArrow(sx, sy, cx, cy);
  }
  if (D.phase === 'rift') {
    const R = D.rift, [sx, sy] = at(R.x, R.y), k = D.hold / DIMQ.hold;
    drawRealityRift(R, sx, sy, T, k);
    dimArrow(sx, sy, cx, cy);
    const [yx, yy] = dimYou();
    if (Math.hypot(R.x - yx, R.y - yy) < DIMQ.near && R.t > 1) {    // the popup: [E] ??? and how long you've held it
      text('[E] ???', sx, sy - 64, 2, '#effcff', 0.25, 'center');
      const bw = 46, bx = Math.round(sx - bw / 2), by = Math.round(sy - 46);
      g.fillStyle = '#12303a'; g.fillRect(bx, by, bw, 2);
      g.fillStyle = k > 0.97 && Math.floor(T * 20) % 2 ? '#fff' : '#8fe6ff'; g.fillRect(bx, by, Math.round(bw * k), 2);
    }
  }
  if (D.phase === 'boom') {                                         // THE EXPLOSION
    const R = D.rift, [x, y] = at(R.x, R.y), u = D.t2 / DIMQ.boom, fade = 1 - u;
    g.imageSmoothingEnabled = true;
    glowAt(x, y, 150 * (1 + u * 1.5), 150 * (1 + u * 1.5), 0.8 * fade, GLOW_CYAN);
    glowAt(x, y, 50 * fade + 6, 50 * fade + 6, fade, PDOTS[3]);
    g.imageSmoothingEnabled = false;
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 24; i++) {                                  // rays of light shooting out
      const a = hash2(i, 1, 221) * 6.283, L = (60 + u * 460) * (0.5 + hash2(i, 2, 221));
      const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L, gr = g.createLinearGradient(x, y, ex, ey);
      gr.addColorStop(0, 'rgba(240,252,255,0.95)'); gr.addColorStop(1, 'rgba(53,200,255,0)');
      g.strokeStyle = gr; g.lineWidth = 1 + hash2(i, 3, 221) * 2; g.globalAlpha = fade;
      g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
    }
    g.restore();
    const bolts = [];                                               // lightning blasting outward
    for (let i = 0; i < 10; i++) {
      const sd = Math.floor(D.t2 * 10) * 17 + i;
      let h = hash2(sd, 1, 223) * 6.283, bx = x, by = y;
      const st = (30 + u * 260) / 7, ln = [[bx, by]];
      for (let s = 0; s < 7; s++) { h += (hash2(sd * 5 + s, 2, 223) - 0.5) * 1.1; bx += Math.cos(h) * st; by += Math.sin(h) * st; ln.push([bx, by]); }
      bolts.push([ln, 1700 + i, true]);
    }
    drawBolts(bolts, 0, 0, CYAN_BOLTS, fade);
  }
  // rings of light flying out
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const r of D.rings) {
    if (r.t < 0) continue;
    const u = r.t / r.dur, [x, y] = at(r.x, r.y);
    g.globalAlpha = (1 - u) * 0.9; g.strokeStyle = r.col; g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, r.r * (1 - Math.pow(1 - u, 3)), 0, 6.2832); g.stroke();
  }
  // glowing bits and triangles
  for (const p of D.fx) {
    const [x, y] = at(p.x, p.y);
    if (x < -8 || x > W + 8 || y < -8 || y > H + 8) continue;
    g.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1); g.fillStyle = p.col;
    if (p.tri) dimTri(x, y, 3, p.rot); else g.fillRect(Math.round(x), Math.round(y), p.s, p.s);
  }
  g.restore();
}

// THE CRACK. Drawn AFTER the bloom so its black stays pitch black.
//  1) a copy of the picture right now (the flying shards carry their bit of it)
//  2) where shards have broken off: nothing — pitch black
//  3) the cracks (glowing cyan, white-hot in the middle), with lightning at
//     their growing tips
//  4) the shards being sucked into the hole right now
//  5) the WIND rushing into the hole
function drawDimCrack(cx, cy) {
  const D = S.dim; if (D.phase !== 'crack') return;
  const C = D.crack, Wb = C.web, t = D.ct;
  const sh = t < DIMQ.open ? 2 : 0;                                // it shakes while it tears open
  const ox = cx + C.x - D.camX + rr(-sh, sh), oy = cy + C.y - D.camY + rr(-sh, sh);
  const NR = Wb.rings.length - 1, gone = c => t >= c.fall;
  const quad = (i, j) => Wb.quads[((i + Wb.N) % Wb.N) * NR + j];
  const quadGone = q => q.tris.every(gone);                        // (both its shards have broken off)
  // 1)
  sg.globalCompositeOperation = 'copy'; sg.drawImage(cv, 0, 0); sg.globalCompositeOperation = 'source-over';
  // 2) (all the holes in ONE path, so there are no thin seams between neighbouring shards)
  g.fillStyle = '#000'; g.beginPath();
  for (const c of Wb.cells) if (gone(c)) { c.poly.forEach(([x, y], k) => k ? g.lineTo(ox + x, oy + y) : g.moveTo(ox + x, oy + y)); g.closePath(); }
  g.fill();
  // 3) (a crack between two pieces that are BOTH gone is gone too — no lines floating in the black)
  const R = webReach(t), seg = [], tips = [];
  for (let i = 0; i < Wb.N; i++) {
    const P = Wb.rad[i], Q = Wb.rad[(i + 1) % Wb.N];
    for (let j = 0; j < NR; j++) {
      if (Wb.rings[j] >= R) break;
      const here = quad(i, j);
      if (!quadGone(quad(i - 1, j)) || !quadGone(here)) {         // the crack going OUT (still growing?)
        const f = Math.min(1, (R - Wb.rings[j]) / (Wb.rings[j + 1] - Wb.rings[j]));
        const e = [lerp(P[j][0], P[j + 1][0], f), lerp(P[j][1], P[j + 1][1], f)];
        seg.push([P[j], e]); if (f < 1 && i % 2) tips.push(e);
      }
      const rf = j > 0 ? clamp((R - Wb.rings[j] * 1.25) / (Wb.rings[j] * 0.35 + 8), 0, 1) : 0;   // the ring cracks come a bit later
      if (rf > 0 && (!quadGone(quad(i, j - 1)) || !quadGone(here))) seg.push([P[j], [lerp(P[j][0], Q[j][0], rf), lerp(P[j][1], Q[j][1], rf)]]);
      // the corner-to-corner crack that splits a piece into its 2 shards (once it's cracked all round)
      if (here.diag && R >= Wb.rings[j + 1] && !quadGone(here)) seg.push(here.diag);
    }
  }
  const lines = () => { g.beginPath(); for (const [a, b] of seg) { g.moveTo(ox + a[0], oy + a[1]); g.lineTo(ox + b[0], oy + b[1]); } };
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#35c8ff'; g.lineCap = 'round';

    g.globalAlpha = (bright ? 0.55 : 0.22) * (D.windK ?? 1); g.stroke();   // (fading out at the end)
  }

}

<script>
// V0ID3D — objects.js: Rifts, shards and you (the player)
"use strict";

// how calm a spot is because of the portal: 1 right next to it, 0 out of reach
function portalCalm(x, y) {
  const P = world.portal;
  return P ? clamp(1 - Math.hypot(x - P.x, y - P.y) / CFG.pureRange, 0, 1) : 0;
}

// BAKING BIT BY BIT: each frame, do ONE small baking step — finish a Rift
// that's half-baked, or start one that's just outside the screen (nearest
// first), so it's ready before you get there
function bakeRiftsAhead(camX, camY) {
  let best = null, bd = 1e9;
  const mx = camX + W / 2, my = camY + H / 2, reach = W * 1.6;
  for (const b of world.blobs) {
    if (b.spr && !b.spr.gen) continue;                               // (fully baked)
    const d = Math.hypot(b.x - mx, b.y - my);
    if (d < reach && d < bd) { bd = d; best = b; }
  }
  if (!best) return;
  if (!best.spr) best.spr = startBlob(Math.round(best.r), best.seed); else growBlob(best.spr);
}

function drawBlobs(camX, camY, k, late) {
  const fq = Math.floor(S.t * 12);

  // 1 -> 0), shaking as it goes, and then it's gone for the rest of the area
  const gone = S.stab || 0;

  const cs = 1 - gone;
  if (gone <= 0) bakeRiftsAhead(camX, camY);
  for (const b of world.blobs) {
    const m = b.r * 4;                                // rough size incl. the glow
    if (b.x - camX > W + m || b.y - camY > H + m || b.x - camX < -m || b.y - camY < -m) continue;
    const lp = portalCalm(b.x, b.y);                  // near the portal = purified
    const r = (b === S.riftB ? S.rift : 0) * (1 - lp); // it gets angrier when you're close

        const off = (hash2(i, b.seed, 1) - 0.5) * 1.3;

}

// where a shard CRACKS in two (made once per shard, the first time it's needed):

function shardCut(s) {

  const P = s.piece, rad = Math.max(...P.poly.map(([x, y]) => Math.hypot(x - P.cx, y - P.cy)));

  return (s.cut = pts);
}
// the outline of a seal piece, drawn around its own middle (0, 0)
function piecePath(P) {
  g.beginPath();
  P.poly.forEach(([px, py], i) => i ? g.lineTo(px - P.cx, py - P.cy) : g.moveTo(px - P.cx, py - P.cy));

}

// ang = force a rotation, still = no bobbing / fragments (for the assembly)

  const c = makeCanvas(48, 48), x = c.getContext('2d'), gr = x.createRadialGradient(24, 24, 0, 24, 24, 24);
  gr.addColorStop(0, 'rgba(255,0,0,0.6)'); gr.addColorStop(0.4, 'rgba(200,0,0,0.2)'); gr.addColorStop(1, 'rgba(120,0,0,0)');

})();

  g.globalAlpha = glowA; g.drawImage(s.pure ? PURE_GLOW : SHARD_GLOW, x - r, y - r, r * 2, r * 2);   // (the glow is baked once, see below)
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;

  g.save(); g.translate(x, y); g.rotate(a); g.scale(sc, sc);
  const cut = s.half !== undefined ? shardCut(s.parent || s) : null;
  if (cut) { g.beginPath(); g.moveTo(-60, s.half ? 60 : -60); for (const [cx, cy] of cut) g.lineTo(cx, cy); g.lineTo(60, s.half ? 60 : -60); g.closePath(); g.clip(); }   // a cracked HALF: only its side of the jagged cut
  if (!still && rnd() < 0.06 + k * 0.2) {              // glitch ghost
    g.save(); g.translate(ri(-3, 3) / sc, 0); piecePath(P); g.fillStyle = 'rgba(255,255,255,0.55)'; g.fill(); g.restore();
  }

  g.save(); g.clip(); g.drawImage(seal.img, -seal.rad - 1 - P.cx, -seal.rad - 1 - P.cy);
  const sh = P.shade;                                          // its own shade (every shard is a little different)
  g.globalCompositeOperation = sh.op; g.globalAlpha = sh.a; g.fillStyle = sh.col; g.fill();
  // PURIFIED: the 'color' blend keeps how light/dark each pixel is but swaps its colour
  // for blue-purple — so it's the same picture, just purified
  if (s.pure) { g.globalCompositeOperation = 'color'; g.globalAlpha = 1; g.fillStyle = '#7a5cff'; g.fill(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.3; g.fillStyle = '#3a2cff'; g.fill(); }
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 0.55;

  g.restore();

  g.strokeStyle = '#fff'; g.lineWidth = 1 / sc; g.stroke();     // bright broken (cracked) edges
  if (cut) { g.save(); piecePath(P); g.clip(); g.beginPath(); cut.forEach(([cx, cy], i) => i ? g.lineTo(cx, cy) : g.moveTo(cx, cy)); g.strokeStyle = '#fff'; g.stroke(); g.restore(); }   // the fresh crack (only INSIDE the shard)

    g.fillStyle = '#fff'; g.fillRect(Math.round(px) - 2, Math.round(py), 5, 1); g.fillRect(Math.round(px), Math.round(py) - 2, 1, 5);
  }

  for (let i = 0; i < 3; i++) {
    const h = hash2(s.id * 7 + i, fq, 9);
    if (h < 0.4) continue;
    g.fillStyle = h > 0.8 ? '#fff' : s.pure ? '#8a6cff' : '#ff0000';
    g.fillRect(Math.round(x + (hash2(s.id, fq, i) - 0.5) * 26 * sc), Math.round(y + (hash2(s.id, fq, i + 5) - 0.5) * 20 * sc), 1, 1);
  }
}

function drawPlayer(camX, camY, k) {
  // DASH afterimages: fading copies of you along the dash, red ones slightly off
  for (const gh of player.ghosts || []) {
    const gx = Math.round(gh.x - camX), gy = Math.round(gh.y - camY), a = gh.life / 0.3;

  g.globalAlpha = 1;
  if (rnd() < 0.05 + k * 0.25) diamond(x + ri(-3, 3), y, 5, 'rgba(255,0,0,0.7)');   // red ghost

}

<script>
// V0ID3D — purify.js: tearing purified shards off their podiums, CORRUPTING them at The Anchor, returning them, the shield, and the Purification
"use strict";

// =====================================================================
//  THE TWIST: you are the red. The blue is the universe's PURIFICATION —
//  and you're corrupting it. (sectors with podiums, like The Voidlands):
//   1) the shards start PURIFIED (blue), held on their podiums by lightning,
//      deep inside clumps of Purification. HOLD E next to one: the
//      lightning strains and SNAPS, bolt by bolt, until it's yours.
//      (you can only carry ONE; Q drops it)
//   2) bring it to The Anchor, press E: it comes back CORRUPTED (red)
//   3) bring it BACK to its podium (it pulses faster the closer you get —
//      "hot and cold") and press E: the podium is corrupted, and the
//      Purification around it burns away
//   A corrupted shard is also your SHIELD (hold SPACE): it bounces a
//   Beamer's beam back — red — and blows it up. CFG.shieldBlocks times,
//   then it's purified again and needs corrupting again.
//   (in the code, s.pure = true means BLUE, false means RED/corrupted)
// =====================================================================
const PURE_GLOW = makeSoftDot(140, 90, 255, 48);           // a purified shard's blue-purple glow
const CORRUPT_COLS = ['#ff0000', '#ff0000', '#000', '#fff', '#a00000'];
const PURE_COLS = ['#8a6cff', '#6e96ff', '#fff', '#b48cff'];
const CORRUPT_HOVER = -48, CORRUPT_TIME = 1.6;            // the shard hangs this far above The Anchor while it's corrupted, for this long

// --- the shard you're holding (or null) ---
const held = () => player && player.held;
const nearAnchor = () => Math.hypot(player.x, player.y) <= CFG.deliverRange;
function podiumNear(ok = p => p.state !== 'corrupt' && p.state !== 'corrupting') {
  let best = null, bd = CFG.podiumRange;
  for (const p of world.podiums) if (ok(p)) { const d = Math.hypot(p.x - player.x, p.y - player.y); if (d < bd) { bd = d; best = p; } }
  return best;
}

// E (pressed): corrupt at The Anchor, or put it back on its podium.
// (Taking a shard OFF a podium is HOLD E — see updatePurify.)
function interactPurify() {
  const s = held();
  if (!s) { if (!podiumNear(p => p.state === 'pure')) { say(nearAnchor() ? 'BRING A SHARD TO CORRUPT' : 'FIND A SHARD'); SFX.denied(); } return; }
  if (s.anim) return;                                       // (busy: it's still flying)
  if (s.half !== undefined) {                               // a HALF (a Basher cracked it): both halves go into The Anchor
    if (!nearAnchor()) { say('PUT IT IN THE ANCHOR  -  THEN BRING THE OTHER HALF'); SFX.denied(); return; }
    halfIntoAnchor(s); return;
  }
  const p = podiumNear();
  if (p) {
    if (p !== s.podium) { say('THIS IS NOT ITS PODIUM'); SFX.denied(); return; }
    if (s.pure) { say('CORRUPT IT AT THE ANCHOR FIRST'); SFX.denied(); return; }
    placeShard(s, p); return;
  }
  if (nearAnchor()) {
    if (!s.pure) { say('ALREADY CORRUPTED  -  RETURN IT TO ITS PODIUM'); SFX.denied(); return; }
    s.anim = { phase: 'in', t: 0, x0: s.cx, y0: s.cy };    // it flies into The Anchor... and comes back corrupted
    SFX.launch();
    return;
  }
  say(s.pure ? 'BRING IT TO THE ANCHOR' : 'RETURN IT TO ITS PODIUM  -  IT PULSES FASTER WHEN YOU ARE CLOSE'); SFX.denied();
}
// a HALF goes into The Anchor and waits there. When its other half arrives,
// they JOIN back into one shard — and that shard is corrupted (the ritual)
function halfIntoAnchor(h) {
  player.held = null; h.state = 'inAnchor';
  world.anchorHalves.push(h); world.anchorPulse = 1;
  explode(0, 0, 'pure', 0.5, false); SFX.halfIn();
  const other = world.anchorHalves.find(o => o !== h && o.parent === h.parent);
  if (!other) { pops.push({ x: 0, y: -40, life: 2, txt: '1/2  -  BRING THE OTHER HALF' }); return; }
  world.anchorHalves = world.anchorHalves.filter(o => o !== h && o !== other);
  h.state = other.state = 'merged';
  const s = h.parent;
  s.state = 'held'; s.pure = true; s.charges = 0; player.held = s; s.cx = 0; s.cy = 0;
  s.anim = { phase: 'in', t: 0, x0: 0, y0: 0 };
  explode(0, -20, 'pure', 1.0, false); SFX.merge();

}
// Q: drop it on the ground
function dropShard() {
  const s = held(); if (!s || s.anim) return;

      g.fillRect(Math.round(n.x - camX + Math.cos(a) * r), Math.round(n.y - camY + Math.sin(a) * r), 2, 2);
    }
    for (let k = 0; k < 14; k++) {                         // specks drifting outward
      const a = hash2(k, n.id, 703) * 6.2832, u = (S.t * (0.15 + hash2(k, n.id, 704) * 0.2) + hash2(k, n.id, 705)) % 1;
      const r = (nullRadius(n, Math.round(a / 6.2832 * N)) * sz) + u * 26;
      g.globalAlpha = 1 - u; g.fillStyle = k % 2 ? '#8a6cff' : '#6e96ff';
      g.fillRect(Math.round(n.x - camX + Math.cos(a) * r), Math.round(n.y - camY + Math.sin(a) * r), 1, 1);
    }
    g.globalAlpha = 1;
    if (burning) glowAt(n.x - camX, n.y - camY, n.r * sz + 30, n.r * sz + 30, 0.6 * (1 - n.burn));   // burning away: red fire
  }
}

// =====================================================================
//  THE BARRIER — the map's REAL border in podium sectors (the one that throws
//  you back). It looks nothing like the Purification's wall: a CYAN force field.
//   - outside it: a dark grid of cyan diamonds, with a band of light sweeping over it
//   - the wall: a glowing cyan line with white dashes racing along it
//   - PYLONS along it (little cyan crystals), with cyan lightning jumping between them
//     (more of it the closer you are — the wind gets stronger too)
//   - touch it and it throws you back: a ripple spreads where you hit it
// =====================================================================
function drawBarrier(camX, camY) {
  const e = world.edge, T = S.t, ox = -camX, oy = -camY;
  const far = Math.max(Math.hypot(camX, camY), Math.hypot(camX + W, camY), Math.hypot(camX, camY + H), Math.hypot(camX + W, camY + H));
  if (far < e.min - 140) return;                           // (not on screen)
  const near = S.windK || 0, trace = () => { g.beginPath(); e.pts.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy)); g.closePath(); };
  // 1) OUTSIDE: a dark FORCE FIELD — a grid of cyan diamonds (stuck to the world), with a band of light sweeping across it
  g.save(); g.beginPath(); g.rect(0, 0, W, H); e.pts.forEach(([x, y], i) => i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy)); g.closePath(); g.clip('evenodd');
  g.fillStyle = '#01080c'; g.fillRect(0, 0, W, H);
  const sz = 16, bx = ((camX - camY) % sz + sz) % sz, by = ((camX + camY) % sz + sz) % sz;
  g.strokeStyle = '#0b3440'; g.lineWidth = 1; g.beginPath();
  for (let k = -H - sz; k < W + sz; k += sz) { g.moveTo(k - bx, 0); g.lineTo(k - bx + H, H); g.moveTo(k + by, H); g.lineTo(k + by + H, 0); }
  g.stroke();
  const sweep = ((T * 120) % (W + H + 400)) - 200;
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35; g.strokeStyle = '#2fd0ff'; g.lineWidth = 1; g.beginPath();
  for (let k = -H - sz; k < W + sz; k += sz) { const x = k - bx; if (Math.abs(x + H / 2 - sweep) < 60) { g.moveTo(x, 0); g.lineTo(x + H, H); } }
  g.stroke(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.restore();
  // 2) the glow, 3) the wall: a CYAN energy line with white dashes racing along it
  glowLine(e.pts, ox, oy, 60, 0.14 + 0.05 * Math.sin(T * 3) + near * 0.3, '#2fd0ff');
  trace(); g.lineJoin = 'round';
  g.strokeStyle = '#0a5a70'; g.lineWidth = 5; g.stroke();
  g.strokeStyle = '#5ff0ff'; g.lineWidth = 2; g.stroke();
  g.setLineDash([2, 6]); g.lineDashOffset = -T * 50; g.strokeStyle = '#fff'; g.lineWidth = 1; g.stroke(); g.setLineDash([]);
  // 4) PYLONS (little cyan crystals) with cyan lightning jumping between them
  const step = 12, fq = Math.floor(T * 10), bolts = [];
  for (let i = 0; i < e.N; i += step) {
    const [px, py] = e.pts[i], x = px + ox, y = py + oy;
    if (x < -160 || x > W + 160 || y < -160 || y > H + 160) continue;
    const [qx, qy] = e.pts[(i + step) % e.N];
    if (hash2(i, fq, 991) < 0.2 + near * 0.6) bolts.push([boltPts(x, y, qx + ox, qy + oy, i, 6, 5), 2100 + i, true]);
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
    glowAt(x, y, 10, 10, 0.7, GLOW_CYAN);
    diamond(Math.round(x), Math.round(y), 4, '#022028'); diamond(Math.round(x), Math.round(y), 3, '#2fd0ff');
    diamond(Math.round(x), Math.round(y), 1.5, Math.floor(T * 3 + i) % 4 ? '#c8faff' : '#fff');
  }
  if (bolts.length) drawBolts(bolts, 0, 0, CYAN_BOLTS, 0.85);
  // 5) the RIPPLE where you were thrown back
  const hit = S.barrierHit, u = hit ? (T - hit.t) / 0.9 : 1;
  if (u < 1) {
    for (const [r, col] of [[8 + u * 70, '#fff'], [4 + u * 45, '#2fd0ff']]) {
      g.globalAlpha = 1 - u; g.fillStyle = col;
      for (let i = 0; i < 40; i++) { const a2 = i / 40 * 6.2832; g.fillRect(Math.round(hit.x + ox + Math.cos(a2) * r), Math.round(hit.y + oy + Math.sin(a2) * r), 2, 2); }
    }
    g.globalAlpha = 1;
  }
}

// =====================================================================
//  THE HELD SHARD + THE SHIELD
// =====================================================================
function drawHeld(camX, camY, k) {
  const s = held(); if (!s) return;
  const x = s.cx - camX, y = s.cy - camY, A = s.anim;
  if (A && (A.phase === 'charge' || A.phase === 'burst')) { drawCorruption(s, x, y, -camX, -camY, A); return; }
  if (!s.pure && !s.anim && s.pulseK > 0) glowAt(x, y, 18 + s.pulseK * 22, 18 + s.pulseK * 22, 0.7 * s.pulseK);   // the hot/cold pulse
  drawShard(s, x, y, ART, k, 0.8);
  drawShard(s, x, y, ART, k, 0.8);
  if (S.shield) {
    // the SHIELD: a spinning frame of red pixels around you
    const px = Math.round(player.x - camX), py = Math.round(player.y - camY);
    glowAt(px, py, 30, 30, 0.6);
    g.fillStyle = '#ff0000'; dotSquare(px, py, 17, S.t * 2.5, 36, 2);
    g.fillStyle = '#fff'; dotSquare(px, py, 13, -S.t * 3.5, 20, 1, 3, Math.floor(S.t * 10));
  }
}

// THE CORRUPTION RITUAL (see updatePurify). ax, ay = The Anchor on screen.
function drawCorruption(s, x, y, ax, ay, A) {
  if (A.phase === 'burst') {
    // the SHOCKWAVE: two rings of pixels racing out, and a red-white flash
    const u = A.t / 0.45;
    glowAt(x, y, 30 + u * 120, 30 + u * 120, (1 - u) * 1.2);
    for (const [r, col, sz] of [[10 + u * 230, '#ff0000', 2], [6 + u * 150, '#fff', 1]]) {
      g.globalAlpha = 1 - u; g.fillStyle = col;
      for (let i = 0; i < 90; i++) { const a = i / 90 * 6.2832; g.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 0.85), sz, sz); }
    }
    g.globalAlpha = 1;
    drawShard(s, x, y, ART * (1 + (1 - u) * 0.4), 0, 1, S.t * 0.4, true);
    return;
  }
  const c = A.c || 0;
  // red LIGHTNING from The Anchor up into the shard — more bolts as it goes
  const bolts = [];
  for (let i = 0, n = 2 + Math.round(c * 4); i < n; i++) bolts.push([boltPts(ax + (i - n / 2) * 3, ay, x, y + 4, 300 + i, 7, 5 + c * 4), 1300 + i, true]);
  drawBolts(bolts, 0, 0, RED_BOLTS, 0.6 + c * 0.4);
  glowAt(x, y, 18 + c * 34, 18 + c * 34, 0.3 + c * 0.7);
  // the shard: still blue... with the RED creeping up through it from the
  // bottom (a jagged line that rises as c goes 0 -> 1)
  const spin = S.t * (0.2 + c * 0.3);
  drawShard(s, x, y, ART, 0, 0.6, spin, true);
  const top = y + 14 - c * 30, fq = Math.floor(S.t * 20);
  g.save(); g.beginPath(); g.moveTo(x - 20, y + 20);
  for (let i = 0; i <= 10; i++) g.lineTo(x - 20 + i * 4, top + (hash2(i, fq, 741) - 0.5) * 6);
  g.lineTo(x + 20, y + 20); g.closePath(); g.clip();
  s.pure = false; drawShard(s, x, y, ART, 0, 0.6, spin, true); s.pure = true;
  g.restore();
  // a ring of red pixels tightening around it, and glitch slices
  g.fillStyle = '#ff0000'; dotSquare(x, y, 22 - c * 8, -S.t * (2 + c * 10), 24, 1, 3, fq);
  if (rnd() < c * 0.6) moveRegion(x - 14, y + ri(-12, 10), 28, ri(1, 4), ri(-5, 5), 0);
}

// =====================================================================
//  THE HUD for podium sectors — three panels:
//   top-left:  where you are, health (10 blocks = 10 beam hits), dash
//   top-right: the podiums (corrupted ones glow red, purified ones are dim blue)
//   bottom:    what you're holding + what to do with it (and the hot/cold signal)
// =====================================================================
function hudPanel(x, y, w, h, col = '#3c3c42') {
  g.fillStyle = '#000'; g.fillRect(x, y, w, h);
  g.fillStyle = '#16161a'; g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1);
  bracket(x - 2, y - 2, w + 4, h + 4, 5, col);
}
// HUD PIECES SLIDE IN: when a piece first appears it slides in from its own
// side (or edge) and fades in. While it moves, it's drawn on its own layer
// (hudC) — g is pointed at that layer for a moment, so every drawing helper
// draws there — and then the whole layer is stamped onto the screen, shifted
// and see-through. (Fading each line and glow separately wouldn't work: some
// helpers reset the see-through-ness when they're done.)
const hudC = document.createElement('canvas');
const HUD_IN = 0.55, HUD_DELAY = { stats: 0, front: 0.12, pods: 0.24 };
function hudK(key) {                                       // 0 ... 1: how far this piece has come in
  const seen = S.hudSeen || (S.hudSeen = {});
  if (seen[key] === undefined) seen[key] = S.t + (HUD_DELAY[key] || 0);
  return smoothstep(clamp((S.t - seen[key]) / HUD_IN, 0, 1));
}
function hudLayer(k, dx, dy, draw) {
  if (k >= 1) return draw();
  if (k <= 0) return;
  if (hudC.width !== W || hudC.height !== H) { hudC.width = W; hudC.height = H; }
  const hx = hudC.getContext('2d'); hx.imageSmoothingEnabled = false; hx.clearRect(0, 0, W, H);
  const main = g; g = hx;
  try { draw(); } finally { g = main; }

}
function drawPurifyHUD(k, late) {
  const s = held(), calm = 1 - S.pure;
  // (in the tutorial the HUD appears one piece at a time, when it's introduced)
  const hud = k => !S.tutorial || !TUT || TUT.hud[k];
  // --- top-left: area, health, dash ---
  if (hud('stats')) hudLayer(hudK('stats'), -170, 0, () => {
    hudPanel(8, 8, 150, 40, S.hitFlash > 0.3 ? '#ff0000' : '#3c3c42');
    diamond(15, 15, 2.5, '#ff0000');
    text(areaName(), 21, 12, 1, '#c8c8d0', 0.04 * calm);
    const segs = Math.min(20, Math.ceil(CFG.maxHp / CFG.beamDamage)), seg = CFG.maxHp / segs, sw = Math.floor(104 / segs);   // (never more than 20 blocks)
    for (let i = 0; i < segs; i++) {
      const full = S.hp >= (i + 1) * seg - 0.01, part = !full && S.hp > i * seg;
      g.fillStyle = full ? (S.hitFlash > 0.4 && Math.floor(S.t * 20) % 2 ? '#fff' : '#ff0000') : part ? '#8a0000' : '#262626';
      g.fillRect(14 + i * sw, 23, sw - 2, 6);
    }
    text(String(Math.ceil(S.hp)), 152, 23, 1, S.hp <= 30 ? '#ff0000' : '#8c8c96', 0.03, 'right');
    const dk = 1 - clamp((S.dashCd || 0) / CFG.dashCooldown, 0, 1), ready = dk >= 1, flash = S.dashReadyT > 0 && Math.floor(S.t * 20) % 2;
    g.fillStyle = '#262626'; g.fillRect(14, 36, 66, 2);
    g.fillStyle = ready ? (flash ? '#ff0000' : '#fff') : '#5a5a64'; g.fillRect(14, 36, Math.round(66 * dk), 2);
    text('[SHIFT] DASH', 152, 34, 1, ready ? '#c8c8d0' : '#3c3c42', 0, 'right');
  });
  // --- top-middle: THE ANCHOR — how much room is left before the darkness reaches it ---
  if (world.front) hudLayer(hudK('front'), 0, -40, () => {
    const F = world.front, left = clamp((F.minR - CFG.nullFail) / (F.start - CFG.nullFail), 0, 1);
    const gw = 150, gx = Math.round(W / 2 - gw / 2), danger = left < 0.25;
    hudPanel(gx, 8, gw, 24, danger && Math.floor(S.t * 4) % 2 ? '#ff0000' : '#3c3c42');
    text('PURIFICATION', W / 2, 11, 1, danger ? '#ff0000' : '#8c8c96', danger ? 0.2 : 0.03, 'center');
    // the bar: white = the space left around The Anchor, black = the Purification eating in from the edge
    g.fillStyle = '#fff'; g.fillRect(gx + 6, 22, Math.round((gw - 12) * left), 5);
    g.fillStyle = '#16161a'; g.fillRect(gx + 6 + Math.round((gw - 12) * left), 22, (gw - 12) - Math.round((gw - 12) * left), 5);
    diamond(gx + 6, 24, 3, '#ff0000');                       // The Anchor sits at the left end
  });
  // --- top-right: the podiums ---
  if (hud('pods')) hudLayer(hudK('pods'), 170, 0, () => {
    const n = world.podiums.length, pw = Math.max(146, n * 10 + 16), px = W - 8 - pw;
    hudPanel(px, 8, pw, 32, world.delivered >= n ? '#ff0000' : '#3c3c42');
    text('PODIUMS CORRUPTED', px + 6, 12, 1, '#8c8c96', 0);
    text(world.delivered + '/' + n, px + pw - 6, 12, 1, '#fff', 0.03, 'right');
    // the squares fill up from the LEFT: corrupted first, then the one being corrupted, then the rest
    const RANK = { corrupt: 0, corrupting: 1, empty: 2, pure: 3 }, order = world.podiums.slice().sort((a, b) => RANK[a.state] - RANK[b.state]);
    for (let i = 0; i < n; i++) {
      const p = order[i], x = px + 8 + i * 10, mine = s && !s.pure && s.podium === p;
      if (p.filled) { glowAt(x + 3, 29, 6, 6, 0.6); g.fillStyle = '#ff0000'; g.fillRect(x, 26, 7, 7); g.fillStyle = '#fff'; g.fillRect(x + 2, 28, 3, 3); }   // corrupted
      else if (p.state === 'corrupting') { const fh = Math.round(7 * p.corruptT / podCorruptTime()); g.fillStyle = '#3a2c8a'; g.fillRect(x, 26, 7, 7); g.fillStyle = Math.floor(S.t * 6) % 2 ? '#ff0000' : '#c00000'; g.fillRect(x, 33 - fh, 7, fh); }   // corrupting: filling up red
      else if (p.state === 'pure') { g.fillStyle = '#3a2c8a'; g.fillRect(x, 26, 7, 7); g.fillStyle = '#5b4cc8'; g.fillRect(x + 2, 28, 3, 3); }   // still purified: dim blue
      else { g.fillStyle = mine && Math.floor(S.t * 4) % 2 ? '#ff0000' : '#3c3c42'; g.fillRect(x, 26, 7, 7); g.fillStyle = '#000'; g.fillRect(x + 1, 27, 5, 5); }   // empty (you have its shard)
    }

  });
  // --- bottom: what you're holding --- (only while you hold something: it slides up from the bottom)
  if (s) S.heldShow = s;
  if (hud('held') && S.heldShow) hudLayer(smoothstep(S.heldK || 0), 0, 60, () => {
    const s = S.heldShow;                                 // (while sliding away it still shows what you were holding)
    const bw = 230, bx = Math.round(W / 2 - bw / 2), by = H - 44;
    hudPanel(bx, by, bw, 36, s ? (s.pure ? '#8a6cff' : '#ff0000') : '#3c3c42');
    g.fillStyle = '#0a0a0c'; g.fillRect(bx + 4, by + 3, 30, 30);
    if (s) drawShard(s, bx + 19, by + 18, 0.75, 0, 0.5, S.t * 0.7, true);
    else if (!s) { g.fillStyle = '#262626'; g.fillRect(bx + 12, by + 17, 14, 1); }
    const tx = bx + 40;
    if (!s) { text('EMPTY HANDS', tx, by + 6, 1, '#5a5a64', 0); text('TEAR A SHARD OFF A PODIUM', tx, by + 19, 1, '#3c3c42', 0); }
    else if (s.anim) { text('CORRUPTING...', tx, by + 6, 1, '#ff0000', 0.3); }
    else if (s.half !== undefined) { text('HALF A SHARD', tx, by + 6, 1, '#b48cff', 0.05); text('PUT BOTH HALVES IN THE ANCHOR', tx, by + 19, 1, '#8c8c96', 0); }
    else if (s.pure) { text('SHARD', tx, by + 6, 1, '#b48cff', 0.05); text('CORRUPT IT AT THE ANCHOR', tx, by + 19, 1, '#8c8c96', 0); }
    else {
      text('CORRUPTED SHARD', tx, by + 6, 1, '#ff0000', 0.08);
      // the SIGNAL: 5 bars, more of them lit the closer its podium is (they flash with each pulse)
      text('SIGNAL', tx, by + 21, 1, '#5a5a64', 0);
      const lit = Math.ceil((s.hotK || 0) * 5 - 0.001);
      for (let i = 0; i < 5; i++) { g.fillStyle = i < lit ? (s.pulseK > 0.5 ? '#fff' : '#ff0000') : '#262626'; g.fillRect(tx + 40 + i * 5, by + 28 - (i + 1) * 2, 3, (i + 1) * 2); }
      text('SHIELD', tx + 72, by + 21, 1, '#5a5a64', 0);
      for (let i = 0; i < CFG.shieldBlocks; i++) diamond(tx + 116 + i * 9, by + 24, 3, i < s.charges ? '#ff0000' : '#262626');
    }
    text('[Q] DROP', bx + bw - 4, by + 6, 1, s && !s.anim ? '#5a5a64' : '#1a1a1e', 0, 'right');
  });
  const by = H - 44;
  // what you can do right here
  let prompt = '';
  const p = podiumNear();
  if (!s && podiumNear(q => q.state === 'pure')) prompt = 'HOLD [E]  TEAR IT OFF';
  if (s && !s.anim) {
    if (s.half !== undefined) prompt = nearAnchor() ? '[E] PUT IT IN THE ANCHOR' : '';
    else if (p && !s.pure && p === s.podium) prompt = '[E] CORRUPT THE PODIUM';
    else if (p && p.state !== 'pure') prompt = p !== s.podium ? 'NOT ITS PODIUM' : 'CORRUPT IT FIRST';
    else if (s.pure && nearAnchor()) prompt = '[E] CORRUPT';
    else if (!s.pure && s.charges > 0 && world.beamers.some(b => !b.dead && (b.state === 'chase' || b.state === 'charge') && Math.hypot(b.x - player.x, b.y - player.y) < 260)) prompt = S.shield ? 'SHIELD UP' : 'HOLD [SPACE]  SHIELD';
  }
  if (prompt && Math.floor(S.t * 3) % 3) text(prompt, W / 2, by - 18, 2, prompt[0] === '[' || prompt === 'SHIELD UP' || prompt.startsWith('HOLD') ? '#fff' : '#ff0000', 0.1, 'center');
  if (S.msgT > 0) text(S.msg, W / 2, by - 32, 1, '#ff0000', 0.25, 'center');

  for (const p of world.podiums) {
    const sx = p.x - cam.x + W / 2, sy = p.y - cam.y + H / 2;
    if (!p.seen && sx > 0 && sx < W && sy > 0 && sy < H) p.seen = true;

      g.fillStyle = col;
      for (let i = 0; i < 6; i++) for (let w2 = -i; w2 <= i; w2++) if (Math.abs(w2) === i || i === 5) g.fillRect(Math.round(x + c * (2 - i) - sn * w2 * 0.8), Math.round(y + sn * (2 - i) + c * w2 * 0.8), 1, 1);   // an arrowhead
      g.fillRect(Math.round(x - c * 7) - 1, Math.round(y - sn * 7) - 1, 3, 2);                                    // a little podium block behind it
    });
  }

  const hunting = [...world.beamers.filter(b => !b.dead && (b.state === 'chase' || b.state === 'charge' || b.state === 'fire')),
    ...world.bashers.filter(b => b.state === 'windup' || b.state === 'bash'), ...world.maws.filter(m => m.state === 'track' || m.state === 'open' || m.state === 'zap')];
  for (const b of hunting)
    edgeArrow(b.x, b.y, (x, y, a) => {
      const c = Math.cos(a), sn = Math.sin(a); g.fillStyle = (b.state === 'charge' || b.state === 'windup' || b.state === 'open') && Math.floor(S.t * 12) % 2 ? '#fff' : '#8a6cff';   // (purified enemies: blue-purple)
      for (let i = 0; i < 5; i++) for (const sd of [-1, 1]) g.fillRect(Math.round(x - c * i + sd * sn * i), Math.round(y - sn * i - sd * c * i), 2, 2);   // a ">" pointing at it
    });
  // THE BANNER: when you enter, the reality + sector name slide down at the top, stay, and fade

<script>
// V0ID3D — beamers.js: BEAMERS — the universe's PURIFIED guardians. Beamer (1 beam), Dual Beamer (2), Triple Beamer (3, rare)
"use strict";

// =====================================================================
//  A Beamer's brain is a "STATE MACHINE" — it's always in exactly one
//  state, and simple rules move it to the next:
//    wander  -> drifts around, until it SEES you (closer than beamerSight)
//    chase   -> turns to face you and comes after you
//    charge  -> close enough: it stops, aims, and its emitters heat up
//               (the last moment the aim is LOCKED — that's your chance to dodge)
//    fire    -> the beam(s)! 10 damage... unless your shield is up
//    cool    -> a short rest, then back to chasing
//  If you get far away (beamerLose) or into The Anchor's light, it gives
//  up and wanders again. It never enters The Anchor's light itself.
//
//  EMITTERS ("pods"): each beam comes from its own little crystal. A plain
//  Beamer has one at its tip. Dual and Triple Beamers have pods floating at
//  their SIDES — and every pod turns to aim at you BY ITSELF, so all the
//  beams meet on you (instead of the side beams flying past you).
//  f, s = where the pod sits: f = forward, s = sideways (in body sizes)
// =====================================================================
const BEAMER_KIND = {
  1: { r: 10, dmg: 5, pods: [{ f: 0.95, s: 0 }], name: 'BEAMER' },                                   // dmg = damage PER LASER
  2: { r: 13, dmg: 3, pods: [{ f: 0.1, s: -1.4 }, { f: 0.1, s: 1.4 }], name: 'DUAL BEAMER' },
  3: { r: 17, dmg: 15, pods: [{ f: 0.95, s: 0 }, { f: 0, s: -1.45 }, { f: 0, s: 1.45 }], name: 'TRIPLE BEAMER' },
};
const BEAM = { charge: 0.65, lock: 0.18, fire: 0.22, gap: 0.14, cool: 1.3,   // fire = how long ONE laser lasts; gap = the pause before the next laser fires
               cone: 0.35, sideCone: 0.6 };   // how far the middle / side emitters can swivel away from straight ahead (radians: 0.35 = 20°, 0.6 = 35°)
const angDiff = (a, b) => ((b - a + 9.4248) % 6.2832) - 3.1416;      // the shortest turn from angle a to angle b
const BEAM_PAL = { out: '#5b3cff', mid: '#8a6cff', core: '#fff' };    // the beams: blue-purple with a white-hot core

// where pod i is right now (in the world)
function podPos(b, i) {
  const K = BEAMER_KIND[b.kind], P = K.pods[i], c = Math.cos(b.ang), s = Math.sin(b.ang), bob = Math.sin(S.t * 3 + b.id) * 1.5;

}

function updateBeamers(dt) {
  if (!world.beamers) return;
  const safeP = Math.hypot(player.x, player.y) < CFG.beamerSafe - 30;   // you're in The Anchor's light
  for (const b of world.beamers) {
    if (b.dead) { b.deadT += dt; continue; }
    darkTick(b, dt);
    const K = BEAMER_KIND[b.kind], dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy), toP = Math.atan2(dy, dx);

    // it can only swivel inside a CONE in front (like a turret) — so when you're
    // BEHIND a Beamer, it has to turn its whole body first; the beams never

    speed *= diff().speed;                                    // (the difficulty)

<script>
// V0ID3D — fx.js: EXPLOSIONS (flash, shockwave rings, debris streaks, light, shake, boom) and flying SPIKES
"use strict";

// =====================================================================
//  EXPLOSIONS — one call, explode(x, y, kind, size), does everything:
//   a white-hot FLASH, two SHOCKWAVE rings racing out, DEBRIS streaks
//   flying off, sparks, a burst of LIGHT (it lights up the smoke around
//   it), screen shake and a boom. kind = the colours: 'red' (corruption),
//   'pure' (blue-purple) or 'mix' (both — a purified thing getting corrupted)
// =====================================================================
const FX_COLS = {
  red: { ring: '#ff0000', ring2: '#fff', parts: ['#ff0000', '#ff0000', '#000', '#fff', '#a00000'], light: [1, 0.08, 0.05] },
  pure: { ring: '#8a6cff', ring2: '#fff', parts: ['#8a6cff', '#6e96ff', '#fff', '#b48cff'], light: [0.5, 0.45, 1] },
  dark: { ring: '#c040ff', ring2: '#2a0840', parts: ['#a020ff', '#5a1a8a', '#000', '#f0c0ff'], light: [0.7, 0.1, 1] },   // a DARK enemy turning normal
  mix: { ring: '#ff0000', ring2: '#8a6cff', parts: ['#ff0000', '#8a6cff', '#fff', '#6e96ff', '#000'], light: [1, 0.3, 0.8] },

const FX = { list: [] };
function explode(x, y, kind = 'red', size = 1, sound = true) {
  const C = FX_COLS[kind];

  for (let i = 0, n = Math.round(10 + size * 8); i < n; i++) rays.push({ a: rnd() * 6.283, len: rr(20, 60) * size, sp: rr(0.7, 1.3) });
  FX.list.push({ x, y, t: 0, size, kind, rays, life: 0.55 + size * 0.25 });
  burstParticles(x, y, Math.round(30 * size + 10), 1.2 + size * 0.6, C.parts);
  S.shake = Math.max(S.shake, 3 + size * 4);

}
function updateFX(dt) {
  for (const f of FX.list) f.t += dt;
  FX.list = FX.list.filter(f => f.t < f.life);

  updateSuck(dt);
}
function drawFX(camX, camY) {
  for (const f of FX.list) {
    const x = f.x - camX, y = f.y - camY, u = f.t / f.life, C = FX_COLS[f.kind], s = f.size;
    if (x < -300 || x > W + 300 || y < -300 || y > H + 300) continue;

    if (u < 0.12) { glowAt(x, y, 50 * s, 50 * s, 1, PDOTS[3]); glowAt(x, y, 30 * s, 30 * s, 1, PDOTS[3]); }

// =====================================================================
//  SUCKED IN: the remains of an enemy that blew up on The Anchor. Chunks

// =====================================================================

// =====================================================================
const SPIKES = { list: [] };
function shootSpikes(x, y, n, speed, dmg) {

// V0ID3D — enemies.js: PURIFICATION MINES, BASHERS and THUNDERMAWS
"use strict";

// (angDiff and segDistB live in beamers.js)
// where along a line (0 = start ... 1 = end) a point is closest
function segT(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy; return l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0; }

// =====================================================================
//  PURIFICATION MINES — floating spiky orbs of pure light. Get close and
//  BOOM: 15 damage, and the shard you're holding is PURIFIED again.
//  Holding SPACE (your shield) when you get close: it still explodes and
//  still purifies your shard — but you take no damage.
//  The explosion also purifies any corrupted shard lying near it.
// =====================================================================
function updateMines(dt) {
  for (const m of world.mines) {
    m.t += dt;
    const d = Math.hypot(player.x - m.x, player.y - m.y), range = CFG.mineRange + (m.dark ? CFG.darkMineRange : 0);   // (a DARK mine goes off from further away)
    m.near = clamp(1 - (d - range) / 90, 0, 1);
    if (m.arm > 0) { m.arm -= dt; continue; }               // (just turned normal: re-arming)       // (it blinks faster as you come close)
    if (m.near > 0.15) { m.beepT = (m.beepT || 0) - dt; if (m.beepT <= 0) { m.beepT = 0.7 - m.near * 0.55; SFX.mineBeep(m.near, clamp((m.x - player.x) / 200, -1, 1)); } }   // ticking faster as you come close
    if (m.chain !== undefined) { m.chain -= dt; if (m.chain <= 0) { mineShot(m); continue; } }   // (set off by a blast next to it)
    if (m.quiet !== undefined) { m.quiet -= dt; if (m.quiet <= 0) { quietBlast(m); continue; } }   // (set off by a mine next to it: harmless to you)
    if (d < range) mineBlast(m);
  }
  world.mines = world.mines.filter(m => !m.gone);
}
function mineBlast(m) {
  const dmg = CFG.mineDamage + (m.dark ? CFG.darkMineDmg : 0);   // (a dark mine hits harder)
  if (m.dark) { m.dark = false; m.arm = 2; explode(m.x, m.y, 'dark', 1); } else m.gone = true;   // a dark mine only turns NORMAL (and re-arms)
  explode(m.x, m.y, 'pure', 1.4, false);                  // (its own sound, not the usual boom)
  SFX.mineBlast();
  const s = held();
  if (s && !s.pure && !s.anim) { s.pure = true; s.charges = 0; }
  for (const q of world.shards) if (q.state === 'free' && !q.pure && Math.hypot(q.x - m.x, q.y - m.y) < CFG.mineBlast) { q.pure = true; q.charges = 0; }
  if (!S.shield) hurt(dmg, 'mine', false, true);
  chainMines(m);
}
// CHAIN REACTION: a mine going off sets off every other mine within
// CFG.mineChain, one after another — but those DON'T hurt you or purify your
// shard (you already took the first one). They do keep the chain going.
function chainMines(m) {
  for (const o of world.mines) if (o !== m && !o.gone && o.quiet === undefined && o.chain === undefined && !(o.arm > 0) && Math.hypot(o.x - m.x, o.y - m.y) < CFG.mineChain) o.quiet = rr(0.1, 0.18);
}
function quietBlast(m) {
  delete m.quiet;
  if (m.dark) { m.dark = false; m.arm = 2; explode(m.x, m.y, 'dark', 0.9); } else { m.gone = true; explode(m.x, m.y, 'pure', 1.1, false); SFX.mineBlast(); }
  chainMines(m);
}
// TRICK SHOT: a Beamer's laser hits a mine (lure one so a mine is between
// you). The mine goes off in a much BIGGER blast that destroys every enemy
// near it — the shooter too. They burst in blue-purple, not red: they're
// destroyed by their own purification, not corrupted.
// (You only get hurt / your shard purified if you're inside the normal blast.)
function mineShot(m) {
  const dmg = CFG.mineDamage + (m.dark ? CFG.darkMineDmg : 0);
  if (m.dark) { m.dark = false; m.arm = 2; delete m.chain; explode(m.x, m.y, 'dark', 1); } else m.gone = true;
  explode(m.x, m.y, 'pure', 2.2, false); SFX.mineBlast();
  S.shake = Math.max(S.shake, 8);
  const R = CFG.mineShotBlast, near = (e) => Math.hypot(e.x - m.x, e.y - m.y) < R;
  for (const b of world.beamers) if (!b.dead && near(b) && tryKill(b)) { b.dead = true; b.deadT = 0; explode(b.x, b.y, 'pure', 0.8 + b.kind * 0.3); SFX.beamerExplode(clamp((b.x - player.x) / 200, -1, 1), b.kind); }
  for (const b of world.bashers) if (!b.dead && near(b) && tryKill(b)) { b.dead = true; explode(b.x, b.y, 'pure', 1); }
  for (const o of world.mines) if (!o.gone && o !== m && near(o)) o.chain = 0.12;   // other mines nearby go off too (a moment later)
  for (const q of world.shards) if (q.state === 'free' && !q.pure && Math.hypot(q.x - m.x, q.y - m.y) < CFG.mineBlast) { q.pure = true; q.charges = 0; }
  if (Math.hypot(player.x - m.x, player.y - m.y) < CFG.mineBlast) {
    const s = held(); if (s && !s.pure && !s.anim) { s.pure = true; s.charges = 0; }
    if (!S.shield) hurt(dmg, 'mine', false, true);
  }
}
function drawMines(camX, camY) {
  for (const m of world.mines) {
    const x = m.x - camX, y = m.y - camY + Math.sin(m.t * 2 + m.id) * 1.5;
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    const blink = Math.sin(m.t * (3 + m.near * 25)) > 0.3;
    glowAt(x, y, 18 + m.near * 14, 18 + m.near * 14, 0.5 + m.near * 0.4, GLOW_BLUE);
    // a PULSE ring rolling out of it (like sonar) — faster and brighter when you're close
    const pu = (m.t * (0.5 + m.near * 2.5) + m.id * 0.37) % 1;
    g.globalAlpha = (1 - pu) * (0.3 + m.near * 0.6); g.fillStyle = m.near > 0.6 ? '#fff' : '#8a6cff';
    for (let i = 0; i < 24; i++) { const a = i / 24 * 6.2832; g.fillRect(Math.round(x + Math.cos(a) * (8 + pu * 40)), Math.round(y + Math.sin(a) * (8 + pu * 40)), 1, 1); }
    g.globalAlpha = 1;
    // three little motes orbiting it
    for (let k = 0; k < 3; k++) { const a = m.t * (1.6 + k * 0.5) * (k % 2 ? -1 : 1) + k * 2.1, rad = 13 + k * 2.5; g.fillStyle = k ? '#b48cff' : '#fff'; g.fillRect(Math.round(x + Math.cos(a) * rad), Math.round(y + Math.sin(a) * rad * 0.8), 1, 1); }
    // close to you it gets UNSTABLE: sparks arc between its spikes
    if (m.near > 0.2 && hash2(m.id, Math.floor(S.t * 14), 931) < m.near * 0.9) {
      const i0 = Math.floor(hash2(m.id, Math.floor(S.t * 14), 932) * 6), a0 = i0 / 6 * 6.283 + m.t * 0.8, a1 = a0 + 2.094;
      drawBolts([[boltPts(x + Math.cos(a0) * 10, y + Math.sin(a0) * 10, x + Math.cos(a1) * 10, y + Math.sin(a1) * 10, m.id * 5 + i0, 4, 4), 1800 + m.id, true]], 0, 0, TETHER_BOLTS, 0.9);
    }
    // its danger ring: a faint circle of dots that turns white when you're close
    g.globalAlpha = 0.25 + m.near * 0.6; g.fillStyle = m.near > 0.6 && blink ? '#fff' : '#6e96ff';
    const mr = CFG.mineRange + (m.dark ? CFG.darkMineRange : 0); if (m.dark) g.fillStyle = m.near > 0.6 && blink ? '#fff' : '#c040ff';
    for (let i = 0; i < 28; i++) { if ((i + Math.floor(m.t * 6)) % 3 === 0) continue; const a = i / 28 * 6.2832 + m.t * 0.3; g.fillRect(Math.round(x + Math.cos(a) * mr), Math.round(y + Math.sin(a) * mr), 1, 1); }
    g.globalAlpha = 1;
    // the spikes (6, slowly turning) and the core
    g.strokeStyle = '#b48cff'; g.lineWidth = 1; g.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + m.t * 0.8; g.moveTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4); g.lineTo(x + Math.cos(a) * 10, y + Math.sin(a) * 10); }
    g.stroke();
    if (m.dark) drawDarkAura(x, y, 10, m.id + 50);
    diamond(Math.round(x), Math.round(y), 6, m.dark ? '#1a0628' : '#100c30'); diamond(Math.round(x), Math.round(y), 4.5, m.dark ? '#a020ff' : m.arm > 0 && Math.floor(S.t * 10) % 2 ? '#3a2c8a' : '#8a6cff');
    diamond(Math.round(x), Math.round(y), 2, blink ? '#fff' : '#6e96ff');
  }
}

// =====================================================================
//  BASHERS — a spiky ball with a long wavy tail. It sees you, WINDS UP
//  (shaking, spikes out), then BASHES straight at you, leaving afterimages.
//  Hit = 25 damage, and your shard is PURIFIED and CRACKS in two halves
//  (a half, or a shard that was already split once, is knocked away instead).
//  Hit while your shield is up: the Basher BURSTS into spikes (3 damage
//  each), and your shard CRACKS in two purified halves (only once per shard).
// =====================================================================
const BASH = { windup: 0.85, bash: 0.68, speed: 300, recover: 1.3 };
function updateBashers(dt) {
  const safeP = Math.hypot(player.x, player.y) < CFG.beamerSafe - 30;
  for (const b of world.bashers) {
    if (b.dead) continue;                                 // (blown up this frame — by a shot mine)
    darkTick(b, dt);
    b.t += dt;
    const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy), toP = Math.atan2(dy, dx);
    let vx = 0, vy = 0;
    b.alert = Math.max(0, (b.alert || 0) - dt);
    if (b.state === 'wander') {
      if (b.hunt > 0) { b.hunt -= dt; b.wa = toP; }        // ALERTED (a shard was torn off nearby): it comes for you
      else if (b.home && Math.hypot(b.x - b.home.x, b.y - b.home.y) > CFG.guardRange) b.wa = Math.atan2(b.home.y - b.y, b.home.x - b.x);   // GUARDING: back toward its podium
      else if (b.t > b.next) { b.wa += rr(-1.5, 1.5); b.next = b.t + rr(2, 4); }
      const sp = (b.hunt > 0 ? 75 : 22) * (b.dark ? CFG.darkSpeed : 1) * diff().speed;
      vx = Math.cos(b.wa) * sp; vy = Math.sin(b.wa) * sp; b.ang = b.wa;
      if (d < CFG.basherSight && !safeP) { b.state = 'windup'; b.t = 0; SFX.basherWind(clamp(-dx / 200, -1, 1)); }
    } else if (b.state === 'windup') {
      if (b.t < BASH.windup - 0.15) b.ang += clamp(angDiff(b.ang, toP), -5 * dt, 5 * dt);   // aims... then locks just before it goes
      vx = -Math.cos(b.ang) * 18; vy = -Math.sin(b.ang) * 18;            // (pulls back a little, like winding up a punch)
      if (b.t >= BASH.windup) { b.state = 'bash'; b.t = 0; b.hit = false; SFX.bash(clamp(-dx / 200, -1, 1)); explode(b.x - Math.cos(b.ang) * 6, b.y - Math.sin(b.ang) * 6, 'pure', 0.3, false); }   // (a burst of light as it launches)
    } else if (b.state === 'bash') {
      const bs = BASH.speed * (b.dark ? CFG.darkSpeed : 1) * diff().speed;   // (dark / harder: faster)
      vx = Math.cos(b.ang) * bs; vy = Math.sin(b.ang) * bs;
      if (rnd() < 0.7) b.ghosts.push({ x: b.x, y: b.y, life: 0.35 });
      if (rnd() < 0.8) { const a = b.ang + Math.PI + rr(-0.5, 0.5); particles.push({ x: b.x + rr(-4, 4), y: b.y + rr(-4, 4), vx: Math.cos(a) * rr(40, 120), vy: Math.sin(a) * rr(40, 120), life: 0.35, max: 0.35, col: rnd() < 0.4 ? '#fff' : '#8a6cff', s: 1, streak: true }); }   // sparks spraying off behind it
      if (b.t >= BASH.bash) { b.state = 'recover'; b.t = 0; }
    } else {
      vx = b.vx * 0.9; vy = b.vy * 0.9;
      if (b.t >= BASH.recover) { b.state = d < CFG.basherSight * 1.6 && !safeP ? 'windup' : 'wander'; b.t = 0; if (b.state === 'windup') SFX.basherWind(clamp(-dx / 200, -1, 1)); }
    }
    // out of The Anchor's light, and inside the map
    const ad = Math.hypot(b.x, b.y);
    if (ad < CFG.beamerSafe && b.state !== 'bash') { vx += b.x / ad * 90; vy += b.y / ad * 90; b.wa = Math.atan2(b.y, b.x); }
    const lim = edgeRadiusAt(world.edge, Math.atan2(b.y, b.x)) - 60;
    if (ad > lim) { vx -= b.x / ad * 80; vy -= b.y / ad * 80; b.wa = Math.atan2(-b.y, -b.x); }
    const k = b.state === 'bash' ? 1 : 1 - Math.exp(-dt * 4);
    b.vx += (vx - b.vx) * k; b.vy += (vy - b.vy) * k;
    const ox = b.x, oy = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    // the bash hits if you were anywhere along the path it just moved (a fast
    // Basher on a slow frame could otherwise jump right past you)
    if (b.state === 'bash' && !b.hit && segDistB(player.x, player.y, ox, oy, b.x, b.y) < CFG.basherHit) { b.hit = true; basherHits(b); if (b.dead) continue; }
    if (b.dark) dropSlime(b, Math.hypot(b.x - ox, b.y - oy));   // a dark Basher leaves SLIME
    if (Math.hypot(b.x, b.y) < CFG.anchorTouch && tryKill(b)) { b.dead = true; explode(b.x, b.y, 'mix', 1.2); suckRemains(b.x, b.y, ['#8a6cff', '#100c30', '#b48cff', '#fff']); world.anchorPulse = 1; continue; }   // it touched The Anchor: BOOM — and The Anchor swallows what's left
    // the TAIL: each segment follows the one in front of it (that's what makes it wave)
    let px = b.x, py = b.y;
    for (const seg of b.tail) { seg.x += (px - seg.x) * Math.min(1, dt * 14); seg.y += (py - seg.y) * Math.min(1, dt * 14); const sd = Math.hypot(seg.x - px, seg.y - py); if (sd > 5) { seg.x = px + (seg.x - px) / sd * 5; seg.y = py + (seg.y - py) / sd * 5; } px = seg.x; py = seg.y; }
    for (const gh of b.ghosts) gh.life -= dt;
    b.ghosts = b.ghosts.filter(gh => gh.life > 0);
  }
  world.bashers = world.bashers.filter(b => !b.dead);
  updateSlime(dt);
}
function basherHits(b) {
  const s = held();
  if (S.shield) {
    // SHIELD: it bursts into spikes... and cracks your shard (once per shard)
    // (a DARK Basher only turns normal — and bounces off)
    if (!tryKill(b)) { shieldBlock(); SFX.basherBreak(); b.vx *= -0.4; b.vy *= -0.4; b.state = 'recover'; b.t = 0; return; }
    b.dead = true;
    explode(b.x, b.y, 'mix', 1.3);
    shootSpikes(b.x, b.y, 18, 150, CFG.spikeDamage);
    SFX.basherBreak();
    if (s && !s.anim && !s.split && s.half === undefined) splitShard(s, b.ang);
    else shieldBlock();
  } else {
    hurt(CFG.basherDamage + (b.dark ? CFG.darkDmg : 0), 'basher', false, true);
    S.shake = Math.max(S.shake, 9);
    // KNOCKED AWAY: you fly off the way the Basher was going (you can't steer for a moment)
    player.dashT = 0; player.vx = Math.cos(b.ang) * CFG.basherKnock; player.vy = Math.sin(b.ang) * CFG.basherKnock; S.launchT = 0.3;
    if (s && !s.anim && !s.split && s.half === undefined) { splitShard(s, b.ang); SFX.split(); }   // purified + cracked in two
    else if (s && !s.anim) knockShard(s, b.ang);   // (a half, or a shard that was already split once: knocked away)
    b.vx *= -0.3; b.vy *= -0.3; b.state = 'recover'; b.t = 0;
  }
}
// your shard is knocked out of your hands and flies off
function knockShard(s, a) {
  player.held = null;
  s.state = 'free'; s.noPick = true;
  s.x = player.x + Math.cos(a) * rr(45, 70) + rr(-10, 10); s.y = player.y + Math.sin(a) * rr(45, 70) + rr(-10, 10);
  const lim = edgeRadiusAt(world.edge, Math.atan2(s.y, s.x)) - 40, sd = Math.hypot(s.x, s.y); if (sd > lim) { s.x *= lim / sd; s.y *= lim / sd; }
  burstParticles(s.x, s.y, 20, 1, s.pure ? PURE_COLS : CORRUPT_COLS);

  SFX.drop();
}
function drawBashers(camX, camY) {
  for (const b of world.bashers) {
    const x = b.x - camX, y = b.y - camY; if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
    // afterimages of the bash: fading blue copies
    for (const gh of b.ghosts) { g.globalAlpha = gh.life / 0.35 * 0.6; diamond(Math.round(gh.x - camX), Math.round(gh.y - camY), b.r * 0.9, '#5b3cff'); diamond(Math.round(gh.x - camX), Math.round(gh.y - camY), b.r * 0.4, '#b48cff'); }
    g.globalAlpha = 1;
    // the tail: segments getting smaller, with a glow at the tip
    b.tail.forEach((seg, i) => { const sz = Math.max(1, (1 - i / b.tail.length) * 4); g.fillStyle = i % 2 ? '#5b3cff' : '#8a6cff'; g.fillRect(Math.round(seg.x - camX - sz / 2), Math.round(seg.y - camY - sz / 2), Math.ceil(sz), Math.ceil(sz)); });
    const tip = b.tail[b.tail.length - 1]; glowAt(tip.x - camX, tip.y - camY, 6, 6, 0.6, PURE_GLOW);
    if (b.alert > 0) text('!', x, y - b.r - 14 - (1 - b.alert) * 4, 2, '#fff', 0.1, 'center');   // it just noticed you
    const wind = b.state === 'windup' ? b.t / BASH.windup : 0, bash = b.state === 'bash';
    const shake = wind * 2.5, sx = x + rr(-shake, shake), sy = y + rr(-shake, shake);
    if (b.dark) drawDarkAura(sx, sy, b.r, b.id + 20);
    if (wind > 0) {                                         // WINDING UP: streaks of energy getting sucked into it
      for (let k = 0; k < 12; k++) {
        const a = hash2(k, b.id, 941) * 6.2832, u = (S.t * (1.5 + hash2(k, b.id, 942)) + hash2(k, b.id, 943)) % 1, d0 = (1 - u) * (34 - wind * 10) + b.r, d1 = d0 + 4 + wind * 4;
        g.globalAlpha = u * wind; g.strokeStyle = k % 3 ? '#8a6cff' : '#fff'; g.beginPath(); g.moveTo(sx + Math.cos(a) * d0, sy + Math.sin(a) * d0); g.lineTo(sx + Math.cos(a) * d1, sy + Math.sin(a) * d1); g.stroke();
      }
      g.globalAlpha = 1;

    if (bash) {                                             // BASHING: speed lines streaming off behind it
      const ca = Math.cos(b.ang), sa = Math.sin(b.ang);
      for (let k = 0; k < 6; k++) { const o = (hash2(k, b.id, 944) - 0.5) * b.r * 1.8, l = 14 + hash2(k, Math.floor(S.t * 20), 945) * 26; g.strokeStyle = k % 2 ? '#fff' : '#b48cff'; g.globalAlpha = 0.7; g.beginPath(); g.moveTo(sx - ca * b.r - sa * o, sy - sa * b.r + ca * o); g.lineTo(sx - ca * (b.r + l) - sa * o, sy - sa * (b.r + l) + ca * o); g.stroke(); }
      g.globalAlpha = 1;
    }
    glowAt(sx, sy, b.r * 2.4, b.r * 2.4, 0.4 + wind * 0.5 + (bash ? 0.4 : 0), GLOW_BLUE);
    // the SPIKES: they stick out further while it winds up
    g.strokeStyle = wind > 0.5 || bash ? '#fff' : '#b48cff'; g.lineWidth = 1; g.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283 + b.t * (bash ? 12 : 1.5), l = (b.r + 3 + wind * 5 + (i % 2 ? 2 : 0)) * (b.dark ? 1.6 : 1); g.moveTo(sx + Math.cos(a) * b.r * 0.6, sy + Math.sin(a) * b.r * 0.6); g.lineTo(sx + Math.cos(a) * l, sy + Math.sin(a) * l); }
    g.stroke();

    g.fillStyle = b.dark ? '#1a0628' : '#100c30'; g.beginPath(); g.arc(sx, sy, b.r * 0.75, 0, 6.2832); g.fill();
    g.strokeStyle = '#8a6cff'; g.stroke();
    diamond(Math.round(sx + Math.cos(b.ang) * 2), Math.round(sy + Math.sin(b.ang) * 2), 2.5 + wind * 2, wind > 0.6 ? '#fff' : '#6e96ff');
    if (b.state === 'windup') {                              // where it's going to bash: a dotted line
      g.strokeStyle = 'rgba(138,108,255,0.7)'; g.setLineDash([2, 4]); g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(b.ang) * 120, sy + Math.sin(b.ang) * 120); g.stroke(); g.setLineDash([]);
    }
  }
}

// =====================================================================
//  CRACKED SHARDS — a Basher hitting your shield cracks your shard into two
//  purified HALVES (only once per shard). Put both halves into The Anchor
//  (one at a time): the first one waits inside it; when the second one
//  arrives they JOIN, and the whole shard gets corrupted.
// =====================================================================
function splitShard(s, a) {
  s.split = true;
  const mk = (half) => ({ piece: s.piece, half, cutA: a, parent: s, pure: true, charges: 0, podium: s.podium, ang: s.ang, spin: s.spin, bob: rnd() * 6, id: 500 + s.id * 2 + half, state: 'free', x: 0, y: 0, cx: player.x, cy: player.y });
  const h0 = mk(0), h1 = mk(1);
  s.state = 'split'; player.held = h0; h0.state = 'held';
  h1.x = player.x + Math.cos(a + 2.4) * 50; h1.y = player.y + Math.sin(a + 2.4) * 50; h1.noPick = true;
  // (keep it inside the map — near the edge it could land where you can never reach it)
  const lim = edgeRadiusAt(world.edge, Math.atan2(h1.y, h1.x)) - 40, hd = Math.hypot(h1.x, h1.y);
  if (hd > lim) { const pd = Math.hypot(player.x, player.y) || 1; h1.x = player.x - player.x / pd * 30; h1.y = player.y - player.y / pd * 30; }   // (then 30 px from you, toward the middle of the map)
  S.shield = false;                                          // (your hands now hold a blue half: the shield is down this very frame)
  world.shards.push(h0, h1);
  explode(player.x, player.y, 'pure', 0.7, false);
  SFX.split();

}

// =====================================================================

// =====================================================================
//  BLOOM — makes bright things GLOW. Shrink a copy of the picture to 1/4
//  size and blur it, then ADD it back on top ('lighter'). Bright pixels
//  spill a soft halo into the dark around them; black stays black.

// (FAST version: no blur filter. Shrinking a picture with smoothing on

// free. Shrink twice (1/4, then 1/8), then mix both glows together on a
// TINY canvas and stretch that over the screen ONCE — painting the whole

//

//  1) shrink to 1/2 and MULTIPLY that copy by itself (half strength). Bright
//     stays bright (1 x 1 = 1) but dim stuff gets dimmer (0.5 x 0.5 = 0.25) —
//     so bright things glow most, and dim grey bits don't smear a haze.

//  3) climb back up: stretch the smallest one up 2x onto the next, and so

function menuCards() {
