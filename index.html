<title>V0ID3D</title>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    display: block;
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated;      /* keep the chunky pixels sharp when scaled up */
    image-rendering: crisp-edges;
    cursor: none;
  }
</style>
<canvas id="c"></canvas>
<script>
"use strict";

// =====================================================================
//  SETTINGS — tweak these to change how the game feels
// =====================================================================
const CFG = {
  firstShards: 11,        // shards in area 1
  moreShardsMin: 2,       // each new area adds 2..5 more shards
  moreShardsMax: 5,
  baseRadius: 1600,       // map size for 11 shards (grows with shard count)
  mapGrowth: 0.35,        // how fast maps grow in later areas
  baseTime: 360,
  timePerExtraShard: 22,  // extra seconds for every shard above 11
  maxTime: 600,           // timer never goes above 10:00
  corruptAt: 60,          // the world starts breaking (and the timer turns red) at 1:00
  screamAt: 30,           // the scream starts at 0:30
  playerSpeed: 115,       // pixels per second
  // (map size, speed and timer were tuned by letting a bot play 1000+ rounds)
  pickupRange: 14,
  deliverRange: 140,      // how close to The Anchor you must be to press E
  baseGlitch: 0.22,       // "moderate" glitch before 2:00 (0 = none, 1 = max)
  riftRange: 120,         // how close (pixels) to a rift before your screen starts glitching
  testStartCarried: 0,
  portalChance: 0.2,      // the blue portal shows up in 1 of every 5 areas
  pureRange: 280,         // how far (pixels) the portal's calm reaches: glitching fades as you get closer
  portalPull: 34,         // how hard The Portal drags you in (a slow drift — you can always walk back out, slowly)
  maxHp: 100,             // your health
  nodeDamage: 8,          // walking into a node connection
  hitCooldown: 0.9,       // after a hit you can't be hit again for this long (seconds)
  riftDamage: 1,          // standing right against a Rift...
  riftDamageEvery: 2,     // ...hurts this often (seconds)
  nodeSpeed: 32,          // how fast Nodes drift (you move 115)
  nodeLink: 70,           // Nodes closer than this form a node connection
  testPortalFirstArea: false,
};

// =====================================================================
//  AUTO-UPDATE (website only). When you quit to the menu or restart, the
//  game quietly asks the website "is there a newer version?" by reading a
//  tiny file, version.json. If its number is different from BUILD_ID, it
//  reloads into the new version. build-site.js stamps a real number in here
//  for the website; 'dev' (your own copy) never checks.
// =====================================================================
const BUILD_ID = '20260912202904';
function checkForUpdate(then = null, resume = null) {
  if (BUILD_ID === 'dev' || location.protocol === 'file:') { if (then) then(); return; }
  if (S.checking) return;
  S.checking = true;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })   // ?t= = never use an old saved copy
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      S.checking = false;
      if (v && v.build && v.build !== BUILD_ID) {
        try { sessionStorage.setItem('v0id3d_updated', JSON.stringify({ resume })); } catch (e) {}
        location.replace(location.pathname + '?v=' + v.build);   // a new address = the browser can't reuse the old page
      } else if (then) then();
    })
    .catch(() => { S.checking = false; if (then) then(); });   // offline? just keep playing
}

// =====================================================================
//  CANVAS — we draw at a LOW resolution and let CSS blow it up.
//  Every game pixel becomes a PX x PX square on screen.
// =====================================================================
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 640, H = 360, PX = 3;

// scratch canvases for screen effects
const scratch = document.createElement('canvas');
const sg = scratch.getContext('2d');
const redCopy = document.createElement('canvas');
const rg = redCopy.getContext('2d');
const bloomC = document.createElement('canvas');           // tiny canvases for the glow
const bl = bloomC.getContext('2d');
const bloomC2 = document.createElement('canvas');
const bl2 = bloomC2.getContext('2d');
const psnap = document.createElement('canvas');            // snapshot of the world around the portal
const psg = psnap.getContext('2d');

function resize() {
  PX = Math.max(2, Math.min(5, Math.round(innerHeight / 340)));
  W = Math.ceil(innerWidth / PX);
  H = Math.ceil(innerHeight / PX);
  for (const c of [cv, scratch, psnap]) { c.width = W; c.height = H; }
  redCopy.width = Math.ceil(W / 2); redCopy.height = Math.ceil(H / 2);   // the red ghost is made at half size (4x cheaper)
  rg.imageSmoothingEnabled = false;
  bloomC.width = Math.ceil(W / 4); bloomC.height = Math.ceil(H / 4);
  bloomC2.width = Math.ceil(W / 8); bloomC2.height = Math.ceil(H / 8);
  cv.style.width = (W * PX) + 'px';
  cv.style.height = (H * PX) + 'px';
  g.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

// =====================================================================
//  SEEDED RANDOM — same seed = same map. That's how procedural
//  generation stays consistent while the level is being played.
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// hash two numbers into 0..1 (used for stars, so they need no storage)
function hash2(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const rnd = Math.random;
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// how far point (px, py) is from the line segment a -> b (for node connections)
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}
const lerp = (a, b, t) => a + (b - a) * t;

// =====================================================================
//  PIXEL FONT — every letter is 5x7 pixels, stored as 7 rows in hex.
//  "0E" = 01110 = .###.
// =====================================================================
const FONT_HEX = {
  A:'0E11111F111111', B:'1E11111E11111E', C:'0E11101010110E', D:'1E11111111111E',
  E:'1F10101E10101F', F:'1F10101E101010', G:'0E11101711110F', H:'1111111F111111',
  I:'0E04040404040E', J:'0702020202120C', K:'11121418141211', L:'1010101010101F',
  M:'111B1515111111', N:'11111915131111', O:'0E11111111110E', P:'1E11111E101010',
  Q:'0E11111115120D', R:'1E11111E141211', S:'0F10100E01011E', T:'1F040404040404',
  U:'1111111111110E', V:'11111111110A04', W:'1111111515150A', X:'11110A040A1111',
  Y:'11110A04040404', Z:'1F01020408101F',
  '0':'0E11131519110E', '1':'040C040404040E', '2':'0E11010204081F', '3':'1F02040201110E',
  '4':'02060A121F0202', '5':'1F101E0101110E', '6':'0608101E11110E', '7':'1F010204080808',
  '8':'0E11110E11110E', '9':'0E11110F01020C',
  ':':'000C0C000C0C00', '.':'00000000000C0C', '/':'01020204080810', '-':'0000001F000000',
  '!':'04040404040004', '?':'0E110102040004', '[':'0E08080808080E', ']':'0E02020202020E',
  '>':'08040201020408', '<':'02040810080402', '_':'0000000000001F', '+':'0004041F040400',
  ' ':'00000000000000', "'":'04040800000000', ',':'00000000040408',
};
const FONT = {};
for (const k in FONT_HEX) {
  const h = FONT_HEX[k], rows = [];
  for (let i = 0; i < 7; i++) rows.push(parseInt(h.substr(i * 2, 2), 16));
  FONT[k] = rows;
}
const textWidth = (s, sc = 1) => s.length * 6 * sc - sc;

// draw text. glitch 0..1 makes rows slide, pixels drop and a red ghost appear
function text(s, x, y, sc = 1, col = '#fff', glitch = 0, align = 'left') {
  s = String(s).toUpperCase();
  if (align === 'center') x -= textWidth(s, sc) / 2;
  else if (align === 'right') x -= textWidth(s, sc);
  x = Math.round(x); y = Math.round(y);
  const passes = glitch > 0 && rnd() < glitch * 0.8 ? 2 : 1;
  for (let p = passes - 1; p >= 0; p--) {
    const ox = p ? ri(-2, 2) * sc : 0, oy = p ? ri(-1, 1) * sc : 0;
    g.fillStyle = p ? '#ff0000' : col;
    for (let r = 0; r < 7; r++) {
      const shift = glitch > 0 && rnd() < glitch * 0.12 ? ri(-3, 3) * sc : 0;
      for (let i = 0; i < s.length; i++) {
        const gl = FONT[s[i]] || FONT['?'];
        const bits = gl[r];
        if (!bits) continue;
        for (let c = 0; c < 5; c++) {
          if (bits & (16 >> c)) {
            if (glitch > 0 && rnd() < glitch * 0.06) continue;
            g.fillRect(x + ox + shift + (i * 6 + c) * sc, y + oy + r * sc, sc, sc);
          }
        }
      }
    }
  }
}

// =====================================================================
//  TEXTURES — made once at startup, pixel by pixel, with ImageData.
// =====================================================================
const BLACK = [0, 0, 0], WHITE = [255, 255, 255], RED = [255, 0, 0], DRED = [150, 0, 0];
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// THE GLITCH PALETTE: 60% red, 30% black, 10% white.
// PURE red: #ff0000 = red all the way up, zero green, zero blue. Any blue
// mixed in pushes it toward pink/crimson, and that looks less vibrant.
const REDS = ['#ff0000', '#ff0000', '#f00000', '#e60000'];
function glitchCol() {
  const q = rnd();
  return q < 0.1 ? '#fff' : q < 0.4 ? '#000' : REDS[(rnd() * REDS.length) | 0];
}
// a random glitch piece size: mostly small, sometimes big.
// Lines, squares and rectangles all mixed together.
function glitchSize(scale = 1, noBig = false) {
  const q = noBig ? rnd() * 0.9 : rnd();
  if (q < 0.3) return [ri(3, 14) * scale, 1];                         // thin line
  if (q < 0.6) { const s = ri(1, 4) * scale; return [s, s]; }         // little square
  if (q < 0.9) return [ri(2, 10) * scale, ri(2, 7) * scale];          // rectangle
  return [ri(8, 26) * scale, ri(4, 14) * scale];                      // big block
}

// A tile of static made of lines, squares and blocks of random sizes.
// It wraps around at the edges so it can repeat without visible seams.
function makeStatic(size, density, onlyRed = false, blackBg = false) {
  const c = makeCanvas(size, size), x = c.getContext('2d');
  if (blackBg) { x.fillStyle = '#000'; x.fillRect(0, 0, size, size); }
  const n = density * size * size / 8;
  for (let i = 0; i < n; i++) {
    const [w, h] = glitchSize(1, rnd() < 0.85);            // big blocks are rare in tiles
    x.fillStyle = onlyRed ? REDS[ri(1, 2)] : glitchCol();
    const px = ri(0, size - 1), py = ri(0, size - 1);
    for (const ox of [0, -size]) for (const oy of [0, -size]) x.fillRect(px + ox, py + oy, w, h);
  }
  return c;
}
// A SOLID tile for the tunnel wall. Pieces are painted on top of each other
// until every pixel is covered, and each pixel ends up the color of the LAST
// piece that landed on it. Since every piece rolls its color with glitchCol(),
// the whole wall comes out 60% red / 30% black / 10% white.
// UNIQUE GLITCH SHAPES — not just boxes. One piece of glitch can be a block,
// a line, a triangle shard, a diagonal slash, a broken letter, a dither
// checkerboard, a ring, a zig-zag or a barcode. The seed decides which (and
// its size), so the same seed always draws the exact same piece.
const GLYPHS = 'ABEFHKMNRSVWXZ0123456789?/<>+-_';
function glitchShape(ctx, x, y, col, s, seed) {
  const R = mulberry32(seed), I = (a, b) => a + Math.floor(R() * (b - a + 1));
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1;
  const q = R();
  if (q < 0.42) {                                             // a block or a line (the classic)
    const t = R();
    if (t < 0.35) ctx.fillRect(x, y, I(3, 14) * s, 1);
    else if (t < 0.65) { const k = I(1, 4) * s; ctx.fillRect(x, y, k, k); }
    else ctx.fillRect(x, y, I(2, 10) * s, I(2, 7) * s);
  } else if (q < 0.52) {                                      // a sharp triangle shard
    const w = I(3, 10) * s, h = I(3, 9) * s;
    ctx.beginPath(); ctx.moveTo(x + R() * w, y); ctx.lineTo(x + w, y + R() * h); ctx.lineTo(x + R() * w * 0.4, y + h); ctx.closePath(); ctx.fill();
  } else if (q < 0.61) {                                      // a diagonal slash (a pixel staircase)
    const len = I(5, 15) * s, dir = R() < 0.5 ? 1 : -1, step = R() < 0.5 ? 1 : 0.5;
    for (let i = 0; i < len; i++) ctx.fillRect(x + i, Math.round(y + dir * i * step), 1 + s, 1);
  } else if (q < 0.69) {                                      // a broken letter from the game's own font
    const rows = FONT[GLYPHS[I(0, GLYPHS.length - 1)]];
    for (let r = 0; r < 7; r++) for (let c2 = 0; c2 < 5; c2++)
      if (rows[r] & (16 >> c2) && R() > 0.2) ctx.fillRect(x + c2 * s, y + r * s, s, s);   // some pixels missing = broken
  } else if (q < 0.77) {                                      // a dither checkerboard
    const w = I(3, 10) * s, h = I(2, 7) * s;
    for (let yy = 0; yy < h; yy++) for (let xx = (yy & 1); xx < w; xx += 2) ctx.fillRect(x + xx, y + yy, 1, 1);
  } else if (q < 0.84) {                                      // a little ring
    const r = I(2, 5) * s;
    for (let i = 0, n = 8 + r * 3; i < n; i++) { const a = i / n * 6.283; ctx.fillRect(Math.round(x + r + Math.cos(a) * r), Math.round(y + r + Math.sin(a) * r), 1, 1); }
  } else if (q < 0.92) {                                      // a zig-zag
    const len = I(6, 16) * s, amp = I(1, 3);
    for (let i = 0; i < len; i++) ctx.fillRect(x + i, y + ((i >> 1) & 1 ? amp : 0), 1, 1);
  } else {                                                    // a barcode
    const w = I(5, 14) * s, h = I(3, 8) * s;
    for (let xx = 0; xx < w; xx += I(1, 3)) if (R() < 0.6) ctx.fillRect(x + xx, y, 1 + (R() < 0.3 ? 1 : 0), h);
  }
}

function makeWall(size) {
  const c = makeCanvas(size, size), x = c.getContext('2d');
  x.fillStyle = REDS[0]; x.fillRect(0, 0, size, size);
  const n = 3 * size * size / 8;
  for (let i = 0; i < n; i++) {
    const col = glitchCol(), px = ri(0, size - 1), py = ri(0, size - 1), seed = (rnd() * 1e9) | 0;
    glitchShape(x, px, py, col, 1, seed);
    // near an edge? draw copies on the other side too, so the tile repeats seamlessly
    if (px > size - 20) glitchShape(x, px - size, py, col, 1, seed);
    if (py > size - 20) glitchShape(x, px, py - size, col, 1, seed);
    if (px > size - 20 && py > size - 20) glitchShape(x, px - size, py - size, col, 1, seed);
  }
  return c;
}
// the GLOW for a wall tile: find every white pixel, blur them into a soft halo.
// (drawn 3x3 times first so the blur wraps around the tile edges seamlessly)
function makeWallGlow(tile) {
  const size = tile.width, d = tile.getContext('2d').getImageData(0, 0, size, size).data;
  const mask = makeCanvas(size, size), mx = mask.getContext('2d'), mi = mx.createImageData(size, size);
  for (let i = 0; i < d.length; i += 4) if (d[i + 1] > 200) { mi.data[i] = mi.data[i + 1] = mi.data[i + 2] = 255; mi.data[i + 3] = 255; }
  mx.putImageData(mi, 0, 0);
  const big = makeCanvas(size * 3, size * 3), bx = big.getContext('2d');
  bx.filter = 'blur(2.5px)';
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) bx.drawImage(mask, a * size, b * size);
  const out = makeCanvas(size, size); out.getContext('2d').drawImage(big, -size, -size);
  return out;
}
const TILE = 256;
const WALL_TILES = [0, 1, 2, 3].map(() => makeWall(TILE));
const WALL = WALL_TILES.map(t => g.createPattern(t, 'repeat'));
const WALL_GLOW = WALL_TILES.map(t => g.createPattern(makeWallGlow(t), 'repeat'));
// one loose glitch piece drawn live: a random unique shape in the glitch
// colors — and if it's white, it gets a small glow of its own
function glitchPiece(x, y, s = 1) {
  const col = glitchCol();
  if (col === '#fff') glowAt(x + 3 * s, y + 2 * s, 7 * s, 7 * s, 0.7, PDOTS[3]);
  glitchShape(g, x, y, col, s, (rnd() * 1e9) | 0);
}
// the matching glow on top of a wall fill — same tile, same position
function wallGlow(i, m, x, y, w, h, a = 0.6) {
  const gp = WALL_GLOW[i]; gp.setTransform(m);
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.fillStyle = gp; g.fillRect(x, y, w, h); g.restore();
}
// fill a rectangle with the SOLID glitch mosaic. It picks a new tile and
// position 12 times a second, so it crackles. (seed = a different look per use)
function wallFill(x, y, w, h, seed = 0) {
  const wf = Math.floor(S.t * 12) + seed * 7, wp = WALL[wf & 3];
  const m = new DOMMatrix().translate((hash2(wf, 1, 21 + seed) * TILE) | 0, (hash2(wf, 2, 21 + seed) * TILE) | 0);
  wp.setTransform(m);
  g.fillStyle = wp; g.fillRect(x, y, w, h);
  wallGlow(wf & 3, m, x, y, w, h);
}
const STATIC = [0, 1, 2, 3].map(() => g.createPattern(makeStatic(TILE, 0.35), 'repeat'));
const STATIC_DENSE = [0, 1, 2, 3].map(() => g.createPattern(makeStatic(TILE, 0.9, false, true), 'repeat'));
const REDSTATIC = [0, 1, 2].map(() => g.createPattern(makeStatic(TILE, 0.12, true), 'repeat'));
// a soft red glow, baked ONCE. Stretching a ready-made picture over each
// rift is much faster than building a new gradient for every rift, every frame.
const GLOW = (() => {
  const c = makeCanvas(128, 128), x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,0,0,1)'); gr.addColorStop(0.35, 'rgba(255,0,0,0.5)'); gr.addColorStop(1, 'rgba(255,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  return c;
})();
// soft ROUND glowing dots in the portal's colors (baked once, like GLOW)
function makeSoftDot(r, gr, b, size = 32) {
  const c = makeCanvas(size, size), x = c.getContext('2d'), h = size / 2;
  const grad = x.createRadialGradient(h, h, 0, h, h, h);
  grad.addColorStop(0, `rgba(${r},${gr},${b},1)`); grad.addColorStop(0.3, `rgba(${r},${gr},${b},0.55)`); grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
  x.fillStyle = grad; x.fillRect(0, 0, size, size);
  return c;
}
const PDOTS = [[110, 150, 255], [165, 100, 255], [80, 105, 255], [255, 255, 255], [205, 120, 255]].map(c => makeSoftDot(...c));   // blue, purple, deep blue, white, violet
const GLOW_BLUE = makeSoftDot(95, 80, 255, 128);          // a blue-purple glow
function glowAt(x, y, rx, ry, alpha, spr = GLOW) {
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.min(1, alpha);
  g.drawImage(spr, Math.round(x - rx), Math.round(y - ry), Math.round(rx * 2), Math.round(ry * 2));
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function staticFill(pats, alpha, x = 0, y = 0, w = W, h = H) {
  const p = pats[ri(0, pats.length - 1)];
  p.setTransform(new DOMMatrix().translate(ri(0, TILE - 1), ri(0, TILE - 1)));
  g.globalAlpha = alpha; g.fillStyle = p; g.fillRect(x, y, w, h); g.globalAlpha = 1;
}

// ---------------------------------------------------------------------
//  RANSOM-STYLE BLOB: a black mass whose edges are torn into horizontal
//  streaks of black, red and white. We bake 6 slightly different
//  frames and flick between them — that's the "buzzing" animation.
// ---------------------------------------------------------------------
function makeBlob(r, seed, frames = 6, stretch = 1.25, pal = null) {
  // colors (a darker set can be passed in for the far-away background rifts)
  const [cRED, cDRED, cWHITE, cAURA] = pal || [RED, DRED, WHITE, [90, 0, 0]];
  const R = mulberry32(seed);
  const rx = r, ry = r * stretch, pad = Math.ceil(r * 1.6);   // lots of room for bits flying off
  const w = Math.ceil(rx * 2 + pad * 2), h = Math.ceil(ry * 2 + r * 3.6);
  const cx = w / 2, cy = h / 2;
  const k1 = R() * 6.28, k2 = R() * 6.28, k3 = R() * 6.28;
  const bl = [], br = [];
  for (let y = 0; y < h; y++) {                 // the wobbly outline (same in every frame)
    const ny = (y - cy) / ry;
    const hw = ny * ny < 1 ? Math.sqrt(1 - ny * ny) : 0;
    const wob = 1 + 0.18 * Math.sin(ny * 3.1 + k1) + 0.1 * Math.sin(ny * 7.3 + k2);
    bl.push(hw * wob * (1 + 0.1 * Math.sin(ny * 5 + k3)));
    br.push(hw * wob * (1 + 0.1 * Math.cos(ny * 4 + k3)));
  }
  const out = [];
  for (let f = 0; f < frames; f++) {
    const c = makeCanvas(w, h), x = c.getContext('2d');
    const img = x.createImageData(w, h), d = img.data;
    const put = (px, py, col) => {
      if (px < 0 || px >= w || py < 0 || py >= h) return;
      const p = (py * w + (px | 0)) * 4; d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = 255;
    };
    // dark red static aura behind it — without this, black-on-black is invisible
    for (let y = 0; y < h; y++) {
      let run = 0, col = null;
      for (let px = 0; px < w; px++) {
        const dd = Math.hypot((px - cx) / rx, (y - cy) / ry);
        if (run <= 0) {
          run = ri(1, 6);
          const dens = dd < 0.9 ? 0.8 : 0.8 * Math.pow(clamp(1 - (dd - 0.9) / 0.85, 0, 1), 1.3);
          col = R() < dens ? (R() < 0.3 ? cRED : R() < 0.55 ? cDRED : cAURA) : null;
        }
        run--;
        if (col) put(px, y, col);
      }
    }
    for (let y = 0; y < h; y++) {
      if (bl[y] <= 0.02) continue;
      // every row sticks out by a random amount -> torn, streaky edges
      const jl = (R() < 0.25 ? R() * 0.55 : R() * 0.12) * rx;
      const jr = (R() < 0.25 ? R() * 0.55 : R() * 0.12) * rx;
      const L = cx - bl[y] * rx - jl, Rt = cx + br[y] * rx + jr;
      let run = 0, runCol = null;
      for (let px = Math.floor(L); px <= Math.ceil(Rt); px++) {
        const e = clamp(Math.min(px - L, Rt - px) / (rx * 0.22), 0, 1);  // 0 = edge, 1 = deep inside
        if (run > 0) { put(px, y, runCol); run--; continue; }
        const q = R();
        if (e > 0.85) {                                  // core: mostly black, a few scratches
          if (q < 0.006) { run = ri(2, 9); runCol = R() < 0.2 ? cWHITE : cRED; put(px, y, runCol); }
          else if (q < 0.016) put(px, y, R() < 0.8 ? cRED : cWHITE);
          else put(px, y, BLACK);
        } else {                                         // torn edge: holes + colored runs
          if (q < 0.2 * (1 - e)) continue;
          const q2 = R();
          if (q2 < 0.07 * (1 - e) + 0.01) { run = ri(0, 3); runCol = cWHITE; put(px, y, cWHITE); }
          else if (q2 < 0.6 * (1 - e) + 0.08) { run = ri(0, 3); runCol = R() < 0.6 ? cRED : cDRED; put(px, y, runCol); }
          else put(px, y, BLACK);
        }
      }
      // loose streaks flying off the sides
      for (const side of [-1, 1]) {
        let px = side < 0 ? L : Rt;
        const n = R() < 0.55 ? ri(1, 3) : 0;
        for (let i = 0; i < n; i++) {
          px += side * (1 + R() * pad * 0.35);
          const q3 = R(), len = ri(1, 7), col = q3 < 0.35 ? BLACK : q3 < 0.9 ? cRED : cWHITE;
          for (let k = 0; k < len; k++) put(px + side * k, y, col);
          px += side * len;
        }
      }
    }
    for (let i = 0; i < r * 2.2; i++) {                 // squares & bits floating around it
      const a = R() * 6.28, dd = 0.95 + Math.pow(R(), 1.6) * 1.45;   // most close, some far out
      const sx = (cx + Math.cos(a) * rx * dd) | 0, sy = (cy + Math.sin(a) * ry * dd) | 0;
      const q4 = R(), col = q4 < 0.1 ? cWHITE : q4 < 0.4 ? BLACK : q4 < 0.75 ? cRED : cDRED;
      const s = R() < 0.6 ? 1 : ri(2, 5), s2 = R() < 0.5 ? s : ri(1, 6);
      for (let yy = 0; yy < s2; yy++) for (let xx = 0; xx < s; xx++) put(sx + xx, sy + yy, col);
    }
    x.putImageData(img, 0, 0);
    out.push(c);
  }
  return { frames: out, w, h, cx, cy };
}

// =====================================================================
//  SOUND — every sound is built live with the Web Audio API.
//  Think of it like LEGO: sources (oscillators, noise) plug into
//  filters, then into volume knobs (gain), then into the speakers.
// =====================================================================
const AU = { ctx: null, muted: false };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const ctx = AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.connect(ctx.destination);
  AU.master = ctx.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.8; AU.master.connect(comp);

  const len = ctx.sampleRate * 2;
  AU.noise = ctx.createBuffer(1, len, ctx.sampleRate);
  const nd = AU.noise.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = rnd() * 2 - 1;
  // "crushed" noise: each value is HELD for a random number of samples and
  // snapped to only 7 levels. That's what makes it sound digital and broken.
  AU.crush = ctx.createBuffer(1, len, ctx.sampleRate);
  const cd = AU.crush.getChannelData(0);
  for (let i = 0, hold = 0, v = 0; i < len; i++) {
    if (hold-- <= 0) { hold = ri(0, 40); v = Math.round((rnd() * 2 - 1) * 3) / 3; }
    cd[i] = v;
  }
  // low drone that is always humming
  AU.drone = ctx.createGain(); AU.drone.gain.value = 0; AU.drone.connect(AU.master);
  AU.droneLP = ctx.createBiquadFilter(); AU.droneLP.type = 'lowpass'; AU.droneLP.frequency.value = 160;
  AU.droneLP.connect(AU.drone);
  AU.dro = [49, 49.5, 24.5].map((f, i) => {
    const o = ctx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = f;
    o.connect(AU.droneLP); o.start(); return o;
  });
  // static bed (gets loud when the world breaks)
  const sn = ctx.createBufferSource(); sn.buffer = AU.crush; sn.loop = true;
  AU.statBP = ctx.createBiquadFilter(); AU.statBP.type = 'bandpass'; AU.statBP.frequency.value = 1200; AU.statBP.Q.value = 0.7;
  AU.stat = ctx.createGain(); AU.stat.gain.value = 0;
  sn.connect(AU.statBP).connect(AU.stat).connect(AU.master); sn.start();
  // shard hum — a fluttering crackle that gets louder and pans left/right
  // toward the nearest shard, so you can HEAR where it is
  const hn = ctx.createBufferSource(); hn.buffer = AU.crush; hn.loop = true;
  const hbp = ctx.createBiquadFilter(); hbp.type = 'bandpass'; hbp.frequency.value = 2600; hbp.Q.value = 3;
  const trem = ctx.createGain(); trem.gain.value = 0.5;
  const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 9;
  const lfoAmt = ctx.createGain(); lfoAmt.gain.value = 0.5; lfo.connect(lfoAmt).connect(trem.gain); lfo.start();
  AU.hum = ctx.createGain(); AU.hum.gain.value = 0;
  AU.humPan = ctx.createStereoPanner();
  hn.connect(hbp).connect(trem).connect(AU.hum).connect(AU.humPan).connect(AU.master); hn.start();

  // THE SCREAM (0:30 and below). Normally it's the RANSOM screech from your
  // clip (see startClipScream). Until the clip is loaded, a HOMEMADE one plays:
  // buzzy sawtooth "voices" through three bandpass filters tuned like a mouth
  // saying "AAAH" (those peaks are called formants), then distortion.
  AU.scream = ctx.createGain(); AU.scream.gain.value = 0;
  const shaper = ctx.createWaveShaper(), curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = Math.tanh((i / 511.5 - 1) * 5);
  shaper.curve = curve;
  AU.scrStut = ctx.createGain(); AU.scrStut.gain.value = 1;
  AU.scrSynth = ctx.createGain(); AU.scrSynth.gain.value = 1;       // volume of the homemade one
  shaper.connect(AU.scrSynth).connect(AU.scrStut).connect(AU.scream).connect(AU.master);
  const mouth = [[800, 5, 1], [1150, 7, 0.6], [2800, 9, 0.35]].map(([f, q, v]) => {
    const b = ctx.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = f; b.Q.value = q;
    const gg = ctx.createGain(); gg.gain.value = v; b.connect(gg).connect(shaper); return b;
  });
  const vib = ctx.createOscillator(); vib.frequency.value = 6.3;          // wobbly throat
  const vibAmt = ctx.createGain(); vibAmt.gain.value = 55; vib.connect(vibAmt); vib.start();
  const jit = ctx.createOscillator(); jit.type = 'square'; jit.frequency.value = 11;
  const jitAmt = ctx.createGain(); jitAmt.gain.value = 30; jit.connect(jitAmt); jit.start();
  AU.scrOsc = [1, 1.013, 0.994, 1.5, 0.5].map(m => {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 400 * m; o.mult = m;
    vibAmt.connect(o.detune); jitAmt.connect(o.detune);
    mouth.forEach(b => o.connect(b)); o.start(); return o;
  });
  const br = ctx.createBufferSource(); br.buffer = AU.noise; br.loop = true;  // raspy breath
  const brf = ctx.createBiquadFilter(); brf.type = 'bandpass'; brf.frequency.value = 1900; brf.Q.value = 0.8;
  const brg = ctx.createGain(); brg.gain.value = 0.6; br.connect(brf).connect(brg).connect(shaper); br.start();
  const stu = ctx.createOscillator(); stu.type = 'square'; stu.frequency.value = 13;   // glitchy stutter
  AU.scrStuAmt = ctx.createGain(); AU.scrStuAmt.gain.value = 0; stu.connect(AU.scrStuAmt).connect(AU.scrStut.gain); stu.start();

  // MUSIC bus + an echo (a delay that feeds back into itself)
  AU.music = ctx.createGain(); AU.music.gain.value = 0.5; AU.music.connect(AU.master);
  AU.echo = ctx.createDelay(1); AU.echo.delayTime.value = 0.33;
  const fb = ctx.createGain(); fb.gain.value = 0.38;
  const echoLP = ctx.createBiquadFilter(); echoLP.type = 'lowpass'; echoLP.frequency.value = 2200;
  AU.echo.connect(echoLP).connect(fb).connect(AU.echo);
  echoLP.connect(AU.music);

  // THE PORTAL'S HUM: four soft sine tones (a dreamy E major 7 chord),
  // slowly swelling in and out. Nothing crushed or glitchy — it's the
  // only calm sound in the game.
  AU.portal = ctx.createGain(); AU.portal.gain.value = 0;
  AU.portalPan = ctx.createStereoPanner();
  const swell = ctx.createGain(); swell.gain.value = 0.7;
  const sw = ctx.createOscillator(); sw.frequency.value = 0.25;
  const swAmt = ctx.createGain(); swAmt.gain.value = 0.3; sw.connect(swAmt).connect(swell.gain); sw.start();
  for (const [f, v] of [[164.8, 0.5], [329.6, 0.35], [493.9, 0.25], [622.3, 0.18], [987.8, 0.1]]) {
    for (const det of [-4, 4]) {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.frequency.value = f; o.detune.value = det; og.gain.value = v;
      o.connect(og).connect(swell); o.start();
    }
  }
  swell.connect(AU.portal).connect(AU.portalPan).connect(AU.master);

  // THE PORTAL SONG's own volume knob (turned up by purity) + its own long,
  // soft echo, so its notes ring out like they're in a huge calm space
  AU.pmus = ctx.createGain(); AU.pmus.gain.value = 0; AU.pmus.connect(AU.master);
  AU.pecho = ctx.createDelay(1); AU.pecho.delayTime.value = 0.42;
  const pfb = ctx.createGain(); pfb.gain.value = 0.5;
  const plp = ctx.createBiquadFilter(); plp.type = 'lowpass'; plp.frequency.value = 2600;
  AU.pecho.connect(plp).connect(pfb).connect(AU.pecho); plp.connect(AU.pmus);

  // unpack the kill sound: base64 text -> bytes -> audio the game can play
  try {
    const bin = atob(KILL_SOUND.split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer).then(b => {
      AU.kill = b;
      // and a BACKWARDS copy (same samples, last one first) for reverse effects
      AU.killRev = ctx.createBuffer(b.numberOfChannels, b.length, b.sampleRate);
      for (let c = 0; c < b.numberOfChannels; c++) AU.killRev.getChannelData(c).set(b.getChannelData(c).slice().reverse());
      startClipScream(b);
    }, () => {});
  } catch (e) {}
}

// THE RANSOM SCREAM: the screech part of your clip, looping forever (silent
// until 0:30). A plain loop would CLICK every time it jumps from its end back
// to its start, because the sound wave doesn't line up. So we build a special
// loop: its last 0.1 s slowly fades into the sound from just BEFORE the start.
// When it wraps around, the two ends match perfectly — no click.
function startClipScream(b) {
  const ctx = AU.ctx, sr = b.sampleRate;
  const A = Math.round(0.2 * sr), B = Math.round(1.2 * sr), X = Math.round(0.1 * sr), len = B - A;
  const loop = ctx.createBuffer(b.numberOfChannels, len, sr);
  for (let c = 0; c < b.numberOfChannels; c++) {
    const src = b.getChannelData(c), out = loop.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const f = i < len - X ? 0 : (i - (len - X)) / X;             // 0 -> 1 across the last 0.1 s
      out[i] = f ? src[A + i] * (1 - f) + src[A - X + i - (len - X)] * f : src[A + i];
    }
  }
  const s = ctx.createBufferSource(); s.buffer = loop; s.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;   // cut the clip's bass: only the screech is left
  const gn = ctx.createGain(); gn.gain.value = 1.6;
  s.connect(hp).connect(gn).connect(distortion(1.8)).connect(AU.scrStut); s.start();
  AU.scrClip = s;
  AU.scrSynth.gain.value = 0;                                      // switch off the homemade scream
}
// a distortion "curve": squashes loud parts flat, which makes sound rough
function distortion(amount) {
  const sh = AU.ctx.createWaveShaper(), curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = Math.tanh((i / 511.5 - 1) * amount);
  sh.curve = curve;
  return sh;
}
function setMute(m) {
  AU.muted = m;
  if (AU.ctx) AU.master.gain.setTargetAtTime(m ? 0 : 0.8, AU.ctx.currentTime, 0.02);
}

// a chirp: one oscillator jumping between frequencies
function blip(freqs, step = 0.02, vol = 0.08, type = 'square', pan = 0, delay = 0) {
  const ctx = AU.ctx; if (!ctx) return;
  const t = ctx.currentTime + delay, dur = freqs.length * step;
  const o = ctx.createOscillator(), gn = ctx.createGain(), p = ctx.createStereoPanner();
  o.type = type; p.pan.value = pan;
  freqs.forEach((f, i) => o.frequency.setValueAtTime(f, t + i * step));
  gn.gain.setValueAtTime(vol, t); gn.gain.setValueAtTime(vol, t + dur * 0.8); gn.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(gn).connect(p).connect(AU.master); o.start(t); o.stop(t + dur + 0.02);
}
// a burst of (crushed) noise through a filter
function burst(dur = 0.1, vol = 0.2, freq = 1500, q = 1, crush = true, pan = 0, sweepTo = 0, delay = 0) {
  const ctx = AU.ctx; if (!ctx) return;
  const t = ctx.currentTime + delay;
  const s = ctx.createBufferSource(); s.buffer = crush ? AU.crush : AU.noise;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  const gn = ctx.createGain(), p = ctx.createStereoPanner(); p.pan.value = pan;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(gn).connect(p).connect(AU.master);
  s.start(t, rnd() * 1.5); s.stop(t + dur + 0.05);
}
// one tone that slides from f to f * endMult (1 = stays put), through a lowpass
function swoop(dur, f, endMult, type, cutoff, vol, pan = 0) {
  const ctx = AU.ctx; if (!ctx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gn = ctx.createGain(), p = ctx.createStereoPanner();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (endMult !== 1) o.frequency.exponentialRampToValueAtTime(f * endMult, t + dur);
  lp.type = 'lowpass'; lp.frequency.value = cutoff; p.pan.value = pan;
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + 0.005);
  gn.gain.setValueAtTime(vol, t + dur * 0.7); gn.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(lp).connect(gn).connect(p).connect(AU.master); o.start(t); o.stop(t + dur + 0.02);
}
// a deep boom: a sine wave that drops in pitch fast
function thump(vol = 0.5, f0 = 120, f1 = 38, dur = 0.4, delay = 0) {
  const ctx = AU.ctx; if (!ctx) return;
  const t = ctx.currentTime + delay;
  const o = ctx.createOscillator(), gn = ctx.createGain();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn).connect(AU.master); o.start(t); o.stop(t + dur + 0.05);
}

// EXTRA HITS for the jumpscare — one or more for every moment in the DEATH
// timeline, all going through their own heavy distortion = LOUD and harsh.
// gate = the kill sound's trance gate, so the big buzz gets chopped in sync.
function jumpscareHits(t, gate) {
  const ctx = AU.ctx;
  const bus = ctx.createGain(); bus.gain.value = 1.3;
  bus.connect(distortion(2.5)).connect(AU.master);
  // a tone sliding from f0 to f1. swell = fade IN (and cut dead) instead of hit-then-fade
  const osc = (when, dur, f0, f1, type, vol, pan = 0, swell = false) => {
    const a = t + when, b = a + dur;
    const o = ctx.createOscillator(), gn = ctx.createGain(), p = ctx.createStereoPanner();
    o.type = type; o.frequency.setValueAtTime(f0, a);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, b);
    if (swell) { gn.gain.setValueAtTime(0.001, a); gn.gain.exponentialRampToValueAtTime(vol, b); gn.gain.setValueAtTime(0, b); }
    else { gn.gain.setValueAtTime(vol, a); gn.gain.exponentialRampToValueAtTime(0.001, b); }
    p.pan.value = pan; o.connect(gn).connect(p).connect(bus); o.start(a); o.stop(b + 0.02);
  };
  // noise through a bandpass filter sliding from f0 to f1
  const noise = (when, dur, vol, f0, f1, q = 1, pan = 0, swell = false) => {
    const a = t + when, b = a + dur;
    const s = ctx.createBufferSource(); s.buffer = AU.crush;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, a);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, b);
    const gn = ctx.createGain(), p = ctx.createStereoPanner(); p.pan.value = pan;
    if (swell) { gn.gain.setValueAtTime(0.001, a); gn.gain.exponentialRampToValueAtTime(vol, b); gn.gain.setValueAtTime(0, b); }
    else { gn.gain.setValueAtTime(vol, a); gn.gain.exponentialRampToValueAtTime(0.001, b); }
    s.connect(f).connect(gn).connect(p).connect(bus); s.start(a, rnd() * 1.5); s.stop(b + 0.02);
  };

  // 1) THE SLAM: sub-bass drop + noise blast + a METAL CLANG. Metal sounds
  //    "clangy" because its tones are NOT neat multiples (1, 2.76, 5.4, 8.9...)
  osc(DEATH.slam, 1.0, 90, 22, 'sine', 1.0);
  noise(DEATH.slam, 0.5, 0.9, 6000, 400, 0.4);
  for (const [m, v] of [[1, 0.35], [2.76, 0.25], [5.4, 0.18], [8.93, 0.12]])
    osc(DEATH.slam, 0.9, 180 * m, 175 * m, 'sine', v);
  // 2) beat repeat: a snare crack + a bass stab on each hit
  DEATH.repeat.forEach((r, i) => {
    noise(r, 0.12, 0.7, 2500, 1200, 0.8, [-0.8, 0.8, 0][i]);
    osc(r, 0.1, 110, 55, 'square', 0.4, [-0.8, 0.8, 0][i]);
  });
  // glass CRACKING: bursts of tiny sharp ticks as the cracks spread
  for (const [when, n] of [[DEATH.slam, 12], ...DEATH.repeat.map(r => [r, 6])])
    for (let i = 0; i < n; i++) { const f = rr(4000, 10000); noise(when + rr(0, 0.08), rr(0.004, 0.012), rr(0.5, 0.9), f, f, 5, rr(-1, 1)); }
  // 3) RISER: noise + a siren sweeping UP... cut dead right at the silence
  noise(0.7, DEATH.still - 0.7, 0.4, 400, 7000, 2, 0, true);
  osc(0.7, DEATH.still - 0.7, 200, 1600, 'sawtooth', 0.2, 0, true);
  // 4) CD skip: a loud digital click on every skip, bouncing left/right
  DEATH.skips.forEach((s, i) => noise(DEATH.crash + s, 0.03, 0.9, 3000 + i * 600, 3000 + i * 600, 3, i % 2 ? 0.7 : -0.7));
  // 5) THE DROP
  osc(DEATH.land, 1.6, 60, 26, 'sine', 1.2);                              // huge 808 boom
  noise(DEATH.land, 0.9, 1.0, 8000, 300, 0.3);                            // explosion
  osc(DEATH.land, 1.2, 1400, 90, 'sawtooth', 0.35);                       // screaming dive
  for (const n of [33, 34, 39, 40]) osc(DEATH.land, 0.8, NOTE(n), NOTE(n), 'sawtooth', 0.22);   // ugly low chord
  for (let i = 0; i < 14; i++)                                            // shattering glass
    noise(DEATH.land + rr(0, 0.45), rr(0.01, 0.04), rr(0.3, 0.6), rr(3000, 9000), rr(3000, 9000), 4, rr(-1, 1));
  // 6) trance gate: a massive bass buzz, chopped by the SAME gate as the clip
  if (gate) {
    const [g0, g1] = DEATH.gate;
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gn = ctx.createGain();
    o.type = 'square'; o.frequency.value = 55; lp.type = 'lowpass'; lp.frequency.value = 700;
    gn.gain.setValueAtTime(0.6, t + g0); gn.gain.setValueAtTime(0, t + g1);
    o.connect(lp).connect(gn).connect(gate); o.start(t + g0); o.stop(t + g1 + 0.02);
  }
  // 7) tape stop + TV off: a power-down whine, then the old-TV "thunk"
  osc(DEATH.tape, 0.4, 900, 40, 'sawtooth', 0.35);
  osc(DEATH.off + 0.14, 0.25, 120, 30, 'sine', 0.9);
  noise(DEATH.off + 0.14, 0.04, 0.8, 5000, 5000, 1);
}

const SFX = {
  pickup(pan) {
    const f = []; let base = rr(500, 800);
    for (let i = 0; i < 7; i++) { f.push(base); base *= rr(1.1, 1.35); }
    blip(f, 0.022, 0.06, 'square', pan);
    blip([1760], 0.5, 0.05, 'sine', pan, 0.12);
    blip([2637], 0.4, 0.035, 'sine', pan, 0.14);
    burst(0.05, 0.15, 4000, 2, true, pan);
  },
  launch() { burst(0.6, 0.12, 300, 2, false, 0, 2600); blip([200, 300, 450, 700], 0.04, 0.03, 'sawtooth'); },
  anchor() {
    thump(0.55, 130, 36, 0.5);
    burst(0.3, 0.22, 700, 0.8);
    blip([rr(300, 400), rr(900, 1300), rr(200, 250)], 0.03, 0.05, 'square');
  },
  denied() { blip([220, 160], 0.07, 0.05, 'square'); burst(0.08, 0.1, 900, 2); },
  // THE GRAB: a sharp electric SNAP, then a buzzing hum that rises and gets
  // angrier while you're pulled apart, with zaps crackling all around
  grab() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime, end = t + GRAB.tear;
    burst(0.15, 0.6, 5000, 0.6, true); thump(0.6, 300, 60, 0.2);
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gn = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(240, end);
    o2.type = 'square'; o2.frequency.setValueAtTime(61.5, t); o2.frequency.exponentialRampToValueAtTime(247, end);   // slightly off = buzzy
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(600, t); lp.frequency.exponentialRampToValueAtTime(4000, end);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.25, t + 0.2);
    gn.gain.setValueAtTime(0.25, end - 0.02); gn.gain.linearRampToValueAtTime(0, end);
    o.connect(lp); o2.connect(lp); lp.connect(distortion(3)).connect(gn).connect(AU.master);
    o.start(t); o2.start(t); o.stop(end + 0.05); o2.stop(end + 0.05);
    for (let i = 0; i < 14; i++) burst(0.02, rr(0.2, 0.4), rr(2000, 8000), 3, true, rr(-1, 1), 0, rr(0, GRAB.tear));
  },
  // HIT BY A NODE CONNECTION: an electric zap diving down + a thud
  zapHurt() {
    burst(0.12, 0.5, 3000, 0.8, true);
    blip([900, 500, 260, 120], 0.03, 0.08, 'sawtooth');
    thump(0.5, 160, 50, 0.18);
  },
  // A RIFT'S BITE: a small crunchy glitch
  riftBite() { burst(0.08, 0.28, 900, 1.5, true); thump(0.25, 90, 40, 0.12); },
  // THE CRACK DEATH: glass cracking all over, a deep boom, and the crash from
  // your RANSOM clip (if it's loaded)
  crackDeath() {
    const ctx = AU.ctx; if (!ctx) return;
    thump(1, 180, 25, 1.0);
    burst(0.4, 0.5, 2000, 0.5, true);
    for (let i = 0; i < 20; i++) { const f = rr(4000, 10000); burst(rr(0.004, 0.012), rr(0.5, 0.9), f, 5, true, rr(-1, 1), 0, rr(0, 0.5)); }
    if (AU.kill) {
      const s = ctx.createBufferSource(), gn = ctx.createGain(), t = ctx.currentTime;
      s.buffer = AU.kill; gn.gain.setValueAtTime(0.9, t); gn.gain.setValueAtTime(0.9, t + 0.9); gn.gain.linearRampToValueAtTime(0, t + 1.3);
      s.connect(distortion(1.6)).connect(gn).connect(AU.master); s.start(t, 1.29, 1.3);
    }
  },
  // RIP: you tear apart
  tear() { burst(0.5, 0.7, 1200, 0.4, true); burst(0.3, 0.5, 6000, 1, false, 0, 300); thump(0.9, 180, 30, 0.5); },
  // the cutscene build-up: a rumble, rising noise and a rising tone that all
  // swell louder and higher... then CUT to silence when the seal is complete
  gather() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime, end = t + CLEAR.hold;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(1, end - 0.05); out.gain.setValueAtTime(0, end);
    out.connect(AU.master);
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), og = ctx.createGain();   // the rumble
    o.type = 'sawtooth'; o.frequency.setValueAtTime(40, t); o.frequency.exponentialRampToValueAtTime(90, end);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(150, t); lp.frequency.exponentialRampToValueAtTime(900, end);
    og.gain.value = 0.2; o.connect(lp).connect(og).connect(out); o.start(t); o.stop(end + 0.05);
    const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();  // rising noise
    n.buffer = AU.noise; n.loop = true;
    bp.type = 'bandpass'; bp.Q.value = 1.5; bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(6000, end);
    ng.gain.value = 0.14; n.connect(bp).connect(ng).connect(out); n.start(t); n.stop(end + 0.05);
    const o2 = ctx.createOscillator(), o2g = ctx.createGain();                               // rising tone
    o2.type = 'triangle'; o2.frequency.setValueAtTime(220, t); o2.frequency.exponentialRampToValueAtTime(660, end);
    o2g.gain.value = 0.05; o2.connect(o2g).connect(out); o2.start(t); o2.stop(end + 0.05);
  },
  // THE SEAL IS WHOLE: a deep boom, a rushing wave, and a huge chord that
  // rings out for seconds (A minor, stacked from very low to very high)
  sealed() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime;
    thump(1, 160, 28, 2.2);
    burst(2.5, 0.35, 400, 0.5, false, 0, 8000);
    for (const [f, v] of [[55, 0.08], [110, 0.06], [164.8, 0.045], [220, 0.04], [261.6, 0.03], [329.6, 0.03], [440, 0.02], [880, 0.012]])
      for (const det of [-7, 7]) {
        const o = ctx.createOscillator(), gn = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        lp.type = 'lowpass'; lp.frequency.setValueAtTime(3000, t); lp.frequency.exponentialRampToValueAtTime(500, t + 5);
        gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(v, t + 0.05); gn.gain.exponentialRampToValueAtTime(0.001, t + 5.5);
        o.connect(lp).connect(gn).connect(AU.master); o.start(t); o.stop(t + 5.6);
      }
  },
  // one piece clicks into place. f = 0..1 (first piece .. last piece), so the
  // ticks climb higher and higher as the circle fills up
  click(f) {
    const p = 700 * Math.pow(2, f * 1.5);
    blip([p, p * 1.5], 0.025, 0.05, 'square');
    burst(0.03, 0.18, 6000, 3);
  },
  // one clock tick. k = 0..1 (1:00 left ... 0:00): it starts barely there and
  // ends LOUD, with a heavy clunk in the last seconds. tock = the lower half.
  // The portal hushes it.
  clock(k, tock) {
    const v = (0.012 + k * k * 0.3) * (1 - S.pure);
    if (v < 0.002) return;
    blip([tock ? 1500 : 2100], 0.018, v * 0.6, 'square');
    burst(0.03, v, tock ? 2500 : 4000, 4);
    if (k > 0.6) thump(v * 1.2, 150, 60, 0.08);
  },
  complete() {
    [110, 165, 220, 330, 440].forEach((f, i) => {
      const ctx = AU.ctx; if (!ctx) return;
      const t = ctx.currentTime, o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 2, t + 1.6);
      o.detune.value = rr(-12, 12);
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.035, t + 0.3); gn.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
      o.connect(gn).connect(AU.master); o.start(t); o.stop(t + 2.3);
    });
    burst(1.8, 0.2, 200, 1, false, 0, 6000);
    thump(0.7, 90, 30, 1.2);
  },
  // THE KILL SOUND — your RANSOM clip, REMIXED live. A remix is just a list
  // of PIECES of the clip, each played at its own time, speed and place.
  //
  //  BUILD-UP
  //   0.00  hit! the clip starts, doubled an octave lower for weight
  //   0.40  "beat repeat": a tenth of a second repeats 3x, bouncing left/right
  //   0.70  the clip comes back pitched UP (tension!) while a filter slowly
  //         removes the bass — so the drop hits harder when the bass returns
  //   0.97  the crash plays BACKWARDS, which sounds like it's sucking in...
  //  THE DROP
  //   1.22  ...to the crash, skipping like a scratched CD, faster and faster
  //   1.52  it LANDS: slowed down + an octave-down copy = huge
  //   1.90  "trance gate": the volume chops on/off 14 times a second
  //   2.30  "tape stop": everything slows down to nothing (as the TV turns off)
  //   2.70  the clip's last chord rings out over the game-over screen
  death() {
    const ctx = AU.ctx; if (!ctx) return;
    if (!AU.kill) return SFX.deathSynth();          // clip not loaded? use the homemade one
    const t = ctx.currentTime, K = AU.kill, dur = K.duration;
    const START = 0.07, CRASH = 1.29;               // where things are inside the clip
    const dist = distortion(1.6), out = ctx.createGain();
    out.gain.value = 0.85; dist.connect(out).connect(AU.master);

    // the build-up filter: a HIGHPASS only lets high sounds through. Sliding it
    // up makes the bass fade away... then we snap it back down for the drop.
    const build = ctx.createBiquadFilter(); build.type = 'highpass';
    build.frequency.setValueAtTime(20, t);
    build.frequency.setValueAtTime(20, t + 0.7);
    build.frequency.exponentialRampToValueAtTime(1800, t + DEATH.crash);
    build.frequency.setValueAtTime(20, t + DEATH.land);
    build.connect(dist);

    // the trance gate: a square wave flips the volume between 0 and 1
    const gate = ctx.createGain(); gate.gain.setValueAtTime(1, t);
    const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 14;
    const depth = ctx.createGain(); depth.gain.setValueAtTime(0, t);
    const [g0, g1] = DEATH.gate;
    gate.gain.setValueAtTime(0.5, t + g0); depth.gain.setValueAtTime(0.5, t + g0);
    gate.gain.setValueAtTime(1, t + g1); depth.gain.setValueAtTime(0, t + g1);
    lfo.connect(depth).connect(gate.gain); lfo.start(t); lfo.stop(t + 2.4);
    gate.connect(dist);

    // ONE PIECE: when (seconds from now), from (seconds into the clip), len (how much clip)
    // options: rate (speed AND pitch: 2 = octave up, 0.5 = octave down), vol, pan,
    //          rev (backwards), to (which effect it goes through), tapeStop
    const piece = (when, from, len, o = {}) => {
      const rate = o.rate || 1, vol = o.vol ?? 1;
      const s = ctx.createBufferSource(); s.buffer = o.rev ? AU.killRev : K;
      s.playbackRate.value = rate;
      const gn = ctx.createGain(); gn.gain.value = vol;
      const p = ctx.createStereoPanner(); p.pan.value = o.pan || 0;
      s.connect(gn).connect(p).connect(o.to || dist);
      // backwards: the clip is flipped, so "from" has to be flipped too
      s.start(t + when, o.rev ? dur - from - len : from, len);
      if (o.tapeStop) {                             // slide the speed down to almost 0 and fade
        const [a, b] = o.tapeStop;
        s.playbackRate.setValueAtTime(rate, t + a); s.playbackRate.exponentialRampToValueAtTime(0.12, t + b);
        gn.gain.setValueAtTime(vol, t + a); gn.gain.linearRampToValueAtTime(0, t + b);
        s.stop(t + b + 0.03);
      }
    };

    // --- BUILD-UP ---
    piece(0, START, 0.4, { to: build });
    piece(0, START, 0.2, { to: build, rate: 0.5, vol: 0.55 });              // octave down
    for (let i = 0; i < 3; i++)                                             // beat repeat
      piece(DEATH.repeat[i], 0.47, 0.1, { to: build, pan: [-0.8, 0.8, 0][i] });
    piece(0.7, 0.57, 0.3, { to: build, rate: 1.12 });                       // pitched up
    piece(0.97, 0.87, 0.25, { to: build, vol: 0.5 });
    piece(0.97, CRASH, 0.25, { to: build, rev: true, vol: 1.2 });           // backwards crash
    // --- THE DROP ---
    const skips = DEATH.skips;                                              // closer and closer
    skips.forEach((w, i) => piece(DEATH.crash + w, CRASH, Math.min(0.06, (skips[i + 1] ?? 0.3) - w),
      { rate: 1 + i * 0.06, vol: 1 - i * 0.08, pan: i % 2 ? 0.7 : -0.7 }));
    const stop = [DEATH.tape, DEATH.tape + 0.32];
    piece(DEATH.land, CRASH, dur - CRASH, { to: gate, rate: 0.92, tapeStop: stop });
    piece(DEATH.land, CRASH, dur - CRASH, { to: gate, rate: 0.46, vol: 0.5, tapeStop: stop });
    piece(2.7, 2.4, dur - 2.4, { vol: 0.9 });                               // the last chord

    // drums on top
    thump(0.9, 200, 30, 0.6); burst(0.3, 0.4, 1500, 0.4, true);             // the hit
    for (const r of DEATH.repeat) thump(0.35, 160, 50, 0.12, r);           // kicks under the beat repeat
    thump(1, 200, 25, 1.2, DEATH.land); burst(0.9, 0.4, 3000, 0.3, true, 0, 300, DEATH.land);
    for (let i = 0; i < 4; i++) thump(0.5, 130, 35, 0.25, DEATH.gate[0] + i * 0.1);   // pounding under the gate
    jumpscareHits(t, gate);                                                 // + all the LOUD extras
  },

  // the HOMEMADE version, built from a spectrogram of the clip. Only used
  // if the real clip can't be loaded.
  deathSynth() {
    const ctx = AU.ctx; if (!ctx) return;
    const t = ctx.currentTime;
    const bus = ctx.createGain(); bus.gain.value = 0.9; bus.connect(AU.master);
    const dist = distortion(3); dist.connect(bus);

    // 1) the screech: two notes a "fifth" apart (1200 / 800 = 1.5), each with
    //    two slightly out-of-tune copies so it buzzes instead of beeping
    const scr = ctx.createGain();
    scr.gain.setValueAtTime(0, t); scr.gain.linearRampToValueAtTime(0.09, t + 0.02);
    scr.gain.setValueAtTime(0.09, t + 2.3); scr.gain.linearRampToValueAtTime(0, t + 2.55);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 350;
    // the stutter: from 1.3s a fast square wave switches the volume on/off 17x a second
    const stut = ctx.createGain(); stut.gain.setValueAtTime(1, t); stut.gain.setValueAtTime(0.5, t + 1.3);
    const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 17;
    const lfoAmt = ctx.createGain(); lfoAmt.gain.setValueAtTime(0, t); lfoAmt.gain.setValueAtTime(0.5, t + 1.3);
    lfo.connect(lfoAmt).connect(stut.gain); lfo.start(t); lfo.stop(t + 2.6);
    scr.connect(hp).connect(stut).connect(dist);
    for (const f of [802, 1203]) for (const det of [-14, 0, 14]) {
      const o = ctx.createOscillator(); o.type = det ? 'sawtooth' : 'square'; o.detune.value = det;
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.93, t + 2.3);       // the slow sag
      o.frequency.exponentialRampToValueAtTime(f * 0.2, t + 2.55);       // the dive
      o.connect(scr); o.start(t); o.stop(t + 2.6);
    }

    // 2) sub-bass rumble (43, 73, 100 Hz — the loudest low pitches in the clip)
    const sub = ctx.createGain();
    sub.gain.setValueAtTime(0, t); sub.gain.linearRampToValueAtTime(0.2, t + 0.03);
    sub.gain.setValueAtTime(0.2, t + 2.3); sub.gain.exponentialRampToValueAtTime(0.001, t + 3.4);
    sub.connect(bus);
    for (const f of [43, 73, 100]) {
      const o = ctx.createOscillator(); o.frequency.value = f; o.connect(sub); o.start(t); o.stop(t + 3.5);
    }
    for (const d of [0, 0.42, 0.84]) thump(0.7, 140, 32, 0.4, d);   // pounding hits
    thump(1, 200, 25, 1.2, 1.3);

    // 3) impact, the crash at 1.3s, and the downward sweep at 2.3s
    burst(0.4, 0.45, 1500, 0.4, true);
    burst(1.1, 0.5, 3000, 0.25, false, 0, 0, 1.3);
    burst(0.8, 0.35, 5000, 0.5, true, 0, 400, 1.3);
    burst(0.35, 0.35, 900, 2, true, 0, 90, 2.3);

    // 4) the low chord it lands on: G, B, D, G (196, 245, 293, 392 Hz)
    for (const f of [196, 245, 293, 392]) for (const det of [-8, 8]) {
      const o = ctx.createOscillator(), gn = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      lp.type = 'lowpass'; lp.frequency.value = 1400;
      gn.gain.setValueAtTime(0, t + 2.35); gn.gain.linearRampToValueAtTime(0.03, t + 2.42);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 4.3);
      o.connect(lp).connect(gn).connect(dist); o.start(t + 2.35); o.stop(t + 4.4);
    }
  },
  // random glitch noises. Each call picks one of 8 kinds of broken-computer
  // sound, at a random spot left/right. k = 0..1 makes them louder and wilder.
  glitch(k) {
    const pan = rr(-1, 1), v = 0.6 + k * 1.5, q = rnd();
    if (q < 0.2)                                 // CRACKLE: a burst of crushed noise
      burst(rr(0.02, 0.14 + k * 0.2), rr(0.04, 0.1) * v, rr(300, 5000), rr(0.5, 4), true, pan);
    else if (q < 0.33) {                         // CHIRP: jumps between random pitches
      const f = []; for (let i = 0, n = ri(3, 9); i < n; i++) f.push(rr(80, 3000));
      blip(f, rr(0.012, 0.03), rr(0.02, 0.045) * v, rnd() < 0.5 ? 'square' : 'sawtooth', pan);
    } else if (q < 0.47) {                       // STUTTER: the same tiny sound repeating, like a frozen computer
      const f = rr(200, 4000), gap = rr(0.02, 0.05), qq = rr(1, 5), len = rr(0.01, 0.025);
      for (let i = 0, n = ri(3, 8 + Math.round(k * 8)); i < n; i++) burst(len, rr(0.05, 0.09) * v, f, qq, true, pan, 0, i * gap);
    } else if (q < 0.59) {                       // DATA: a super-fast stream of beeps, like a modem
      const f = []; for (let i = 0, n = ri(8, 20); i < n; i++) f.push(400 * Math.pow(2, ri(0, 36) / 12));
      blip(f, rr(0.006, 0.012), rr(0.015, 0.03) * v, 'square', pan);
    } else if (q < 0.69) {                       // ZAP: a buzzy tone diving down
      const f0 = rr(800, 3000);
      blip([f0, f0 * 0.6, f0 * 0.35, f0 * 0.2, f0 * 0.1], 0.015, 0.04 * v, 'sawtooth', pan);
    } else if (q < 0.79) {                       // BUZZ: a short ugly low hum, like electricity
      swoop(rr(0.05, 0.2 + k * 0.2), rr(50, 130), 1, 'square', 900, 0.05 * v, pan);
    } else if (q < 0.9) {                        // CLICKS: a handful of tiny ticks
      for (let i = 0, n = ri(2, 6); i < n; i++) burst(0.006, rr(0.08, 0.15) * v, rr(2000, 7000), 1, true, rr(-1, 1), 0, rr(0, 0.15));
    } else {                                     // TAPE STOP: a tone that sags and dies
      swoop(rr(0.25, 0.45), rr(300, 900), 0.15, 'sawtooth', 2000, 0.04 * v, pan);
    }
  },
};
// called every frame to steer the background layers
// scream = 0..1 (0 = silent, 1 = full scream at 0:00)
function audioUpdate(k, humVol, humPan, scream, musicVol) {
  const ctx = AU.ctx; if (!ctx) return;
  const t = ctx.currentTime;
  AU.drone.gain.setTargetAtTime(0.085 + k * 0.1, t, 0.3);
  AU.droneLP.frequency.setTargetAtTime(160 + k * 900, t, 0.3);
  AU.dro[1].frequency.setTargetAtTime(49.5 + k * 6 + (k > 0.3 ? rr(-3, 3) * k : 0), t, 0.1);
  AU.stat.gain.setTargetAtTime(0.006 + k * k * 0.16, t, 0.2);
  AU.statBP.frequency.setTargetAtTime(1200 + rr(-400, 400) * k, t, 0.05);
  AU.hum.gain.setTargetAtTime(humVol * 0.18, t, 0.08);
  AU.humPan.pan.setTargetAtTime(humPan, t, 0.08);
  // the scream fades in very slowly at first (scream^2.5), then fast
  AU.scream.gain.setTargetAtTime(0.26 * Math.pow(scream, 2.5), t, 0.15);
  const pitch = 330 + scream * scream * 520;                 // and rises in pitch
  for (const o of AU.scrOsc) o.frequency.setTargetAtTime(pitch * o.mult * rr(0.99, 1.01), t, 0.2);
  // the RANSOM scream starts slow and deep (70% speed) and rises to its REAL
  // pitch exactly at 0:00 — so it flows straight into the kill sound
  if (AU.scrClip) AU.scrClip.playbackRate.setTargetAtTime(0.7 + scream * scream * 0.3, t, 0.2);
  AU.scrStuAmt.gain.setTargetAtTime(scream * 0.6, t, 0.2);
  AU.music.gain.setTargetAtTime(musicVol, t, 0.3);
}

// =====================================================================
//  MUSIC — a tiny "step sequencer". The song is split into 16th-note
//  steps. A bit before each step is due, we look at the pattern and
//  schedule its notes at the exact time, so the beat never wobbles.
// =====================================================================
const MUS = { track: null, step: 0, next: 0 };
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);      // note number -> Hz (69 = A)
function tone(freq, t, dur, o = {}) {
  const ctx = AU.ctx;
  const osc = ctx.createOscillator(); osc.type = o.type || 'triangle';
  osc.frequency.value = freq; osc.detune.value = o.detune || 0;
  const gn = ctx.createGain(), vol = o.vol || 0.05;
  if (o.pad) {                                            // slow swell in and out
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + dur * 0.35);
    gn.gain.setValueAtTime(vol, t + dur * 0.6); gn.gain.linearRampToValueAtTime(0, t + dur);
  } else {                                                // pluck: hit, then fade
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  }
  let node = osc;
  if (o.cutoff) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.cutoff; f.Q.value = o.q || 1; osc.connect(f); node = f; }
  node.connect(gn).connect(o.bus || AU.music);            // (o.bus = send it somewhere else)
  if (o.echo) { const e = ctx.createGain(); e.gain.value = o.echo; gn.connect(e).connect(o.echoBus || AU.echo); }
  osc.start(t); osc.stop(t + dur + 0.05);
}

// MENU: slow, sad chords (Am - F - Dm - E) with a broken music box on top
const MENU_CHORDS = [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59]];
function menuStep(step, t, sd) {
  const bar = Math.floor(step / 16) % 4, s = step % 16, ch = MENU_CHORDS[bar];
  if (s === 0) {
    for (const n of ch) for (const d of [-8, 8])
      tone(NOTE(n), t, sd * 17, { type: 'sawtooth', vol: 0.014, pad: true, cutoff: 800, detune: d });
    tone(NOTE(ch[0] - 24), t, sd * 16, { type: 'sine', vol: 0.09, pad: true });
  }
  const arp = [0, 3, 6, 8, 10, 13].indexOf(s);
  if (arp >= 0) {
    const n = ch[arp % 3] + (arp >= 3 ? 24 : 12);
    if (rnd() < 0.13) {                                    // glitch: stutter at a wrong pitch
      const f = NOTE(n + ri(-7, 7));
      for (let i = 0; i < 4; i++) tone(f, t + i * sd / 4, sd / 4, { type: 'square', vol: 0.02 });
    } else tone(NOTE(n), t, sd * 6, { type: 'triangle', vol: 0.045, echo: 0.5 });
  }
  if (s === 12 && bar === 3) tone(NOTE(76), t, sd * 10, { type: 'sine', vol: 0.03, echo: 0.6 });
}

// how hard The Anchor thumps right now. It has its own HEARTBEAT:
// lub (big) ... dub (smaller) ... pause. S.beatPh goes 0 -> 1 once per beat.
function beatK() {
  const p = S.beatPh;
  const lub = Math.exp(-p * 14);
  const dub = p >= 0.2 ? 0.7 * Math.exp(-(p - 0.2) * 14) : 0;
  return Math.max(lub, dub);
}

// THE PORTAL SONG — the opposite of everything else in the game: clean,
// slow, warm and bright. Four dreamy chords (Emaj7, F#/E, C#m7, Amaj7),
// soft pads, a deep bass note and a gentle music-box melody on top.
const PORTAL_CHORDS = [[52, 56, 59, 63], [54, 58, 61, 64], [49, 52, 56, 59], [45, 49, 52, 56]];
const PMUS = { step: 0, next: 0, on: false };
function portalStep(step, t, sd) {
  const bar = Math.floor(step / 16) % 4, s = step % 16, ch = PORTAL_CHORDS[bar];
  const o = { bus: AU.pmus, echoBus: AU.pecho };
  if (s === 0) {
    for (const n of ch) for (const d of [-6, 6])                                     // soft pad
      tone(NOTE(n), t, sd * 17, { ...o, type: 'triangle', vol: 0.02, pad: true, cutoff: 1400, detune: d });
    tone(NOTE(ch[0] - 12), t, sd * 16, { ...o, type: 'sine', vol: 0.08, pad: true });   // deep bass note
  }
  if (s % 2 === 0 && hash2(step, 3, 51) < 0.7) {                                    // music box
    const n = ch[((hash2(step, 1, 52) * 4) | 0)] + (hash2(step, 2, 53) < 0.4 ? 24 : 12);
    tone(NOTE(n), t, sd * 7, { ...o, type: 'sine', vol: 0.05, echo: 0.55 });
  }
  if (s === 10 && bar % 2) tone(NOTE(ch[3] + 24), t, sd * 12, { ...o, type: 'sine', vol: 0.025, echo: 0.7 });   // high sparkle
}
function portalMusicTick() {
  const ctx = AU.ctx; if (!ctx || !AU.pmus) return;
  AU.pmus.gain.setTargetAtTime(S.pure * 0.9, ctx.currentTime, 0.4);                // louder the closer you are
  const want = S.mode === 'play' && world && world.portal && S.pure > 0.01;
  if (want && !PMUS.on) { PMUS.on = true; PMUS.next = ctx.currentTime + 0.1; }
  if (!want) { PMUS.on = false; return; }
  if (PMUS.next < ctx.currentTime - 0.3) PMUS.next = ctx.currentTime + 0.05;
  while (PMUS.next < ctx.currentTime + 0.15) {
    const sd = 60 / 70 / 4;                                                          // 70 beats per minute: slow
    portalStep(PMUS.step, PMUS.next, sd);
    PMUS.next += sd; PMUS.step++;
  }
}

// music only plays in the menu now — in a level it's just the hum + glitches
// (and the portal song, when you're near a portal)
function musicTick() {
  const ctx = AU.ctx; if (!ctx) return;
  portalMusicTick();
  const want = S.mode === 'title' ? 'menu' : null;
  if (want !== MUS.track) { MUS.track = want; MUS.step = 0; MUS.next = ctx.currentTime + 0.1; }
  if (!MUS.track) return;
  if (MUS.next < ctx.currentTime - 0.3) MUS.next = ctx.currentTime + 0.05;   // fell behind (tab was hidden)
  while (MUS.next < ctx.currentTime + 0.15) {
    const sd = 60 / 68 / 4;
    menuStep(MUS.step, MUS.next, sd);
    MUS.next += sd; MUS.step++;
  }
}

try { S.devMode = localStorage.getItem('v0id3d_dev') === '1'; } catch (e) {}   // stays unlocked

  else { S.updated = false; newRun(); }

let world = null, player = null, particles = [], flyers = [], pops = [];
const cam = { x: 0, y: 0 };

// a normal-distributed random number (most values near 0, few far out)
function gauss(R) { return (R() + R() + R() + R() - 2) / 0.58; }

// =====================================================================
//  PROCEDURAL MAP — a seed goes in, a whole area comes out.
// =====================================================================
// ---------------------------------------------------------------------
//  THE SEAL — every area has one glowing circle, broken into exactly as
//  many pieces as there are shards. Every shard you find IS one piece.
//  Deliver them all and they fly back together into the circle.
// ---------------------------------------------------------------------

// keep only the part of a shape on one side of a straight line
// (the side where nx*x + ny*y <= c). Cutting a shape with lines = "clipping".
function clipHalf(poly, nx, ny, c) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = nx * a[0] + ny * a[1] - c, db = nx * b[0] + ny * b[1] - c;
    if (da <= 0) out.push(a);
    if ((da < 0) !== (db < 0) && da !== db) { const t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  return out;
}
// the balance point of a shape
function polyCentroid(p) {
  let A = 0, cx = 0, cy = 0;
  for (let i = 0; i < p.length; i++) {
    const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], f = x0 * y1 - x1 * y0;
    A += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f;
  }
  return A ? [cx / (3 * A), cy / (3 * A)] : p[0];
}
// VORONOI: every spot in the circle belongs to whichever seed point is
// closest. Between two seeds, the border is the line exactly halfway —
// so each piece = the circle, cut by the halfway line to every other seed.
function voronoiCells(seeds, circle) {
  return seeds.map((s, i) => {
    let poly = circle;
    for (let j = 0; j < seeds.length && poly.length >= 3; j++) {
      if (j === i) continue;
      const o = seeds[j], nx = o[0] - s[0], ny = o[1] - s[1];
      poly = clipHalf(poly, nx, ny, (nx * (o[0] + s[0]) + ny * (o[1] + s[1])) / 2);
    }
    return poly;
  });
}

function makeSeal(n, seed) {
  const R = mulberry32(seed ^ 0x5ea1);
  // more pieces = a bigger circle, so each piece stays shard-sized
  const rad = Math.round(Math.sqrt(170 * n / Math.PI)), c = rad + 1;
  const img = makeCanvas(rad * 2 + 2, rad * 2 + 2), x = img.getContext('2d');

  // --- paint the seal: a pattern, so you can SEE it come back together ---
  const circ = (r, col, lw = 0) => {
    x.beginPath(); x.arc(c, c, r, 0, 6.2832);
    if (lw) { x.strokeStyle = col; x.lineWidth = lw; x.stroke(); } else { x.fillStyle = col; x.fill(); }
  };
  const line = (a, r0, r1, col) => {
    x.strokeStyle = col; x.lineWidth = 1; x.beginPath();
    x.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0); x.lineTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1); x.stroke();
  };
  const dia = (r, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(c, c - r); x.lineTo(c + r, c); x.lineTo(c, c + r); x.lineTo(c - r, c); x.closePath(); x.fill(); };
  circ(rad, '#6e0000');                                           // dark red glass
  for (let i = 0; i < rad * rad * 0.7; i++) {                     // speckles in the glass
    const a = R() * 6.283, d = Math.sqrt(R()) * rad;
    x.fillStyle = R() < 0.5 ? '#8a0000' : '#500000'; x.fillRect((c + Math.cos(a) * d) | 0, (c + Math.sin(a) * d) | 0, 1, 1);
  }
  circ(rad * 0.86, '#ff0000', 2);                                 // red ring
  circ(rad - 1.2, '#fff', 1);                                     // white rim
  for (let i = 0; i < 32; i++) line(i / 32 * 6.283, rad * (i % 4 ? 0.9 : 0.72), rad * 0.97, '#fff');   // rune ticks
  for (let i = 0; i < 8; i++) line(i / 8 * 6.283 + 0.39, rad * 0.3, rad * 0.8, '#ff0000');              // spokes
  circ(rad * 0.56, '#fff', 1);
  circ(rad * 0.3, '#ff0000');
  dia(rad * 0.2, '#fff'); dia(rad * 0.11, '#000'); dia(rad * 0.05, '#ff0000');   // The Anchor's symbol

  // --- break it ---
  const seeds = [], minD = rad * Math.sqrt(Math.PI / n) * 0.75;
  for (let tries = 0; seeds.length < n && tries < 6000; tries++) {
    const a = R() * 6.283, d = Math.sqrt(R()) * rad * 0.92, p = [Math.cos(a) * d, Math.sin(a) * d];
    if (seeds.every(q => Math.hypot(q[0] - p[0], q[1] - p[1]) > (tries < 4000 ? minD : minD * 0.4))) seeds.push(p);
  }
  const circle = [];
  for (let i = 0; i < 48; i++) circle.push([Math.cos(i / 48 * 6.283) * rad, Math.sin(i / 48 * 6.283) * rad]);
  // "relax" the seeds 3 times (move each one to the middle of its piece)
  // so the pieces come out similar in size instead of some tiny, some huge
  for (let it = 0; it < 3; it++) voronoiCells(seeds, circle).forEach((cell, i) => { if (cell.length >= 3) seeds[i] = polyCentroid(cell); });
  const pieces = voronoiCells(seeds, circle).map(poly => {
    const [cx, cy] = polyCentroid(poly);
    return { poly, cx, cy };
  });
  return { img, rad, pieces };
}
// artifacts are ALWAYS drawn this big — on the ground, carried, orbiting,
// flying and in the cutscene — so it's clearly the same object everywhere
const ART = 1;
const sealScale = () => ART;

// ---------------------------------------------------------------------
//  THE EDGE OF THE MAP — not a perfect circle, but broken. Its radius
//  changes around the circle, mixed from 3 ingredients:
//    waves   — big slow bulges (sine waves going around)
//    notches — sharp V-shaped bites taken out of it
//    jag     — a fine random zig-zag, so the line is never smooth
//  ...plus cracks that run from the edge into the map.
//  (The "wave" counts are whole numbers so the shape joins up with
//  itself perfectly when it goes all the way around.)
// ---------------------------------------------------------------------
function makeEdge(R, radius) {
  const N = 720;
  const waves = [3, 5, 8, 13].map((f, i) => [f, [0.022, 0.016, 0.01, 0.006][i], R() * 6.283]);
  const notches = [];
  for (let i = 0; i < 16; i++) notches.push({ a: R() * 6.283, w: 0.008 + R() * 0.03, d: 0.015 + R() * 0.03 });
  const r = new Float32Array(N), pts = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * 6.283;
    let m = 0.95;
    for (const [f, amp, ph] of waves) m += Math.sin(a * f + ph) * amp;
    for (const n of notches) {
      const d = Math.abs(((a - n.a + 9.425) % 6.283) - 3.1416);        // angle distance, wrapping around
      if (d < n.w) m -= n.d * (1 - d / n.w);
    }
    m += (R() - 0.5) * 0.008;
    r[i] = radius * m;
    pts.push([Math.cos(a) * r[i], Math.sin(a) * r[i]]);
  }
  const e = { N, r, pts, min: Math.min(...r), cracks: [] };
  // cracks: start on the edge (many at the notches) and wander INTO the map
  for (let i = 0; i < 40; i++) {
    const a = i < notches.length ? notches[i].a : R() * 6.283, inward = a + Math.PI;
    let heading = inward + (R() - 0.5) * 0.6, rad = edgeRadiusAt(e, a) + 6;
    let x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    const line = [[x, y]], len = 50 + R() * 190;
    for (let walked = 0; walked < len;) {
      const st = 6 + R() * 10;
      heading += (R() - 0.5) * 0.8 + (inward - heading) * 0.25;         // zig-zag, but keep heading inward
      x += Math.cos(heading) * st; y += Math.sin(heading) * st; walked += st;
      line.push([x, y]);
    }
    e.cracks.push(line);
  }
  return e;
}
// how far the edge is from the middle, in direction a (smoothly between samples)
function edgeRadiusAt(e, a) {
  const f = (((a / 6.2832) % 1) + 1) % 1 * e.N, i = Math.floor(f) % e.N, t = f - Math.floor(f);
  return e.r[i] * (1 - t) + e.r[(i + 1) % e.N] * t;
}

// cracks in the void around the portal: jagged lines shooting OUT from its
// rim (the opposite of the map edge's cracks, which run inward), some forked
function portalCracks(R, rx, ry) {
  const cracks = [];
  for (let i = 0; i < 11; i++) {
    const a = i / 11 * 6.283 + (R() - 0.5) * 0.4;
    let x = Math.cos(a) * rx * 1.05, y = Math.sin(a) * ry * 1.05, h = a;
    const ln = [[x, y]], len = 30 + R() * 90;
    for (let d = 0; d < len;) {
      const st = 4 + R() * 7;
      h += (R() - 0.5) * 0.9 + (a - h) * 0.3;         // zig-zag, but keep heading outward
      x += Math.cos(h) * st; y += Math.sin(h) * st; d += st; ln.push([x, y]);
    }
    cracks.push(ln);
    if (R() < 0.5 && ln.length > 4) {                  // a fork off the side
      const k = 2 + Math.floor(R() * (ln.length - 3));
      let [bx, by] = ln[k], bh = a + (R() < 0.5 ? 0.8 : -0.8);
      const br = [[bx, by]];
      for (let s = 0, n = 3 + Math.floor(R() * 3); s < n; s++) { bh += (R() - 0.5) * 0.8; bx += Math.cos(bh) * 6; by += Math.sin(bh) * 6; br.push([bx, by]); }
      cracks.push(br);
    }
  }
  return cracks;
}

// portal: 0 = none, 1 = somewhere in the map, 2 = close to The Anchor (testing)
function genWorld(n, seed, portal = 0) {
  const R = mulberry32(seed);
  const radius = CFG.baseRadius * Math.pow(n / 11, CFG.mapGrowth);
  const area = Math.PI * radius * radius;
  const w = { seed, radius, shards: [], blobs: [], tears: [], anchorSq: [], anchorDia: [],
              anchorPulse: 0, delivered: 0, total: n };
  w.edge = makeEdge(R, radius);

  // corruption masses — solid, you have to walk around them.
  // Their pictures (sprites) are only baked when you first get near one,
  // so a huge map doesn't freeze the game while it loads.
  const blobCount = Math.round(area / 200000);
  for (let tries = 0; w.blobs.length < blobCount && tries < 4000; tries++) {
    const r = 16 + R() * R() * 44, a = R() * 6.283;
    const d = Math.sqrt(R()) * (radius - r * 1.8 - 50);             // fully inside the map
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (Math.hypot(x, y) < 240 + r) continue;                       // keep the Anchor clear
    if (d + r * 1.4 > edgeRadiusAt(w.edge, a) - 30) continue;        // stay inside the broken edge
    if (w.blobs.some(b => Math.hypot(b.x - x, b.y - y) < b.r + r + 70)) continue;
    w.blobs.push({ x, y, r, seed: (R() * 1e9) | 0, spr: null });
  }

  // the blue portal — clear of the masses and not too near the edge
  w.portal = null;
  for (let tries = 0; portal && !w.portal && tries < 500; tries++) {
    const a = R() * 6.283, d = portal === 2 ? 215 : 380 + Math.sqrt(R()) * (edgeRadiusAt(w.edge, a) - 700);
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (portal === 1 && w.blobs.some(b => Math.hypot(b.x - x, b.y - y) < b.r + 110)) continue;
    w.portal = { x, y, rx: 20, ry: 28, cracks: portalCracks(R, 20, 28) };
  }
  if (portal === 2 && w.portal) {        // TEMPORARY test: a rift right next to it, so you can watch it get sucked in
    const a = Math.atan2(w.portal.y, w.portal.x) + 0.6;
    const bx = w.portal.x + Math.cos(a) * 125, by = w.portal.y + Math.sin(a) * 125;
    if (!w.blobs.some(b => Math.hypot(b.x - bx, b.y - by) < b.r + 60)) w.blobs.push({ x: bx, y: by, r: 26, seed: (R() * 1e9) | 0, spr: null });
  }

  // the shards — always well inside the edge
  for (let tries = 0; w.shards.length < n && tries < 10000; tries++) {
    const a = R() * 6.283, d = 200 + Math.sqrt(R()) * (radius - 360);
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (w.portal && Math.hypot(w.portal.x - x, w.portal.y - y) < 110) continue;   // not inside the portal
    if (d > edgeRadiusAt(w.edge, a) - 160) continue;                // well inside the broken edge
    if (w.blobs.some(b => Math.hypot(b.x - x, (b.y - y) / 1.25) < b.r + 26)) continue;
    if (w.shards.some(s => Math.hypot(s.x - x, s.y - y) < 150)) continue;
    w.shards.push({ x, y, state: 'free', ang: R() * 6.28, spin: (R() - 0.5) * 0.8, bob: R() * 6.28,
                    id: w.shards.length });
  }
  w.total = w.shards.length;
  // NODES: clumps of 3-8, away from The Anchor, the Rifts and The Portal
  w.nodes = []; w.links = [];
  const clumps = Math.max(3, Math.round(2 + n / 5));
  for (let c = 0; c < clumps; c++) {
    let cx = 0, cy = 0;
    for (let tries = 0; tries < 300; tries++) {
      const a = R() * 6.283, d = 420 + Math.sqrt(R()) * (edgeRadiusAt(w.edge, a) - 600);
      cx = Math.cos(a) * d; cy = Math.sin(a) * d;
      if (w.blobs.some(b => Math.hypot(b.x - cx, b.y - cy) < b.r + 70)) continue;
      if (w.portal && Math.hypot(w.portal.x - cx, w.portal.y - cy) < CFG.pureRange + 60) continue;
      break;
    }
    for (let i = 0, size = 3 + Math.floor(R() * 6); i < size; i++)
      w.nodes.push({ x: cx + (R() - 0.5) * 60, y: cy + (R() - 0.5) * 60, vx: 0, vy: 0,
                     ang: R() * 6.283, turn: 0, clump: c, id: w.nodes.length, spin: R() * 6.283 });
  }
  // break this area's seal into exactly one piece per shard
  w.seal = makeSeal(w.total, seed);
  w.shards.forEach((s, i) => { s.piece = w.seal.pieces[i]; });

  // void tears — patches where reality flickers
  const tearCount = Math.round(area / 200000);
  for (let i = 0; i < tearCount; i++) {
    const a = R() * 6.283, d = Math.sqrt(R()) * radius;
    w.tears.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, w: 30 + R() * 150, h: 3 + R() * 22, ph: R() * 100 });
  }

  // The Anchor: a diagonal band of red squares (like your picture).
  // Each square streams OUT of the core along the band: u goes 0 -> 1,
  // then wraps back to 0 (the core), so the stream never runs out.
  const cols = ['#ff0000', '#d00000', '#8a0000', '#ff2a2a', '#b00000'];
  for (let i = 0; i < 64; i++)
    w.anchorSq.push({ u0: R(), v: 0.05 + R() * 0.09, side: R() < 0.5 ? -1 : 1, perp: gauss(R) * 11,
                      sz: R(), a: 0.4 + R() * 0.6, col: cols[(R() * cols.length) | 0], id: i });
  w.arcs = [];
  for (let i = 0; i < 5; i++)
    w.anchorDia.push({ x: gauss(R) * 40, y: gauss(R) * 25, s: 14 + R() * 32 });
  return w;
}

// =====================================================================
//  FLOW — starting areas, winning, dying
// =====================================================================
function startArea(area, n) {
  S.area = area; S.shardCount = n;
  const portal = CFG.testPortalFirstArea && area === 1 ? 2 : rnd() < CFG.portalChance ? 1 : 0;
  world = genWorld(n, (rnd() * 1e9) | 0, portal);
  S.timeMax = S.time = Math.min(CFG.maxTime, CFG.baseTime + (n - CFG.firstShards) * CFG.timePerExtraShard);
  player = { x: 0, y: 70, vx: 0, vy: 0, carried: [], trail: [] };
