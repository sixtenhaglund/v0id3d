  const off = (bursting ? ri(1, 3) : 0) + Math.round(k * k * 6 * rnd());
  if (off > 0) {
    rg.globalCompositeOperation = 'copy'; rg.drawImage(cv, 0, 0, redCopy.width, redCopy.height);
    rg.globalCompositeOperation = 'multiply'; rg.fillStyle = '#f00'; rg.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5;
    g.drawImage(redCopy, off * (rnd() < 0.5 ? -1 : 1), 0, W, H);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  // 3) right before the end: solid bars of pure red (sometimes white) slice across
  if (late > 0.8 && rnd() < (late - 0.8) * 0.8) {
    for (let i = 0, n = ri(1, 4); i < n; i++) {
      g.fillStyle = rnd() < 0.15 ? '#fff' : REDS[ri(0, 3)];
      g.fillRect(0, ri(0, H), W, ri(1, 6));
    }
  }
}

// move one rectangle of the picture by (dx, dy). It copies ONLY that
// rectangle (through the scratch canvas) — copying the whole screen just
// to move a thin strip was a big waste
function moveRegion(x, y, w, h, dx, dy) {
  let x0 = Math.max(0, Math.round(x)), y0 = Math.max(0, Math.round(y));
  const x1 = Math.min(W, Math.round(x + w)), y1 = Math.min(H, Math.round(y + h));
  if (x1 <= x0 || y1 <= y0) return;
  sg.globalCompositeOperation = 'source-over';
  sg.drawImage(cv, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
  g.drawImage(scratch, x0, y0, x1 - x0, y1 - y0, Math.round(x0 + dx), Math.round(y0 + dy), x1 - x0, y1 - y0);
}

// RIFT INTERFERENCE: the closer you are to a rift, the more it breaks your
// screen. Most of the damage clusters AROUND the rift, so the glitch
// itself tells you which way the danger is.  R = 0..1, (rx, ry) = rift on screen
function riftFX(R, rx, ry) {
  if (R < 0.02) return;
  // a spot near the rift: gauss() puts most of them close, a few far away
  const nearRift = spread => [rx + gauss(rnd) * spread, ry + gauss(rnd) * spread * 0.6];

  // 1) screen tearing: strips of the picture slide sideways
  const tears = Math.round(R * R * 14 + rnd() * R * 5);
  for (let i = 0; i < tears; i++) {
    const y = Math.round(rnd() < 0.65 ? nearRift(40 + R * 60)[1] : rnd() * H);
    const h = ri(1, Math.round(2 + R * 10)), dx = (rnd() < 0.5 ? -1 : 1) * ri(2, Math.round(4 + R * 34));
    moveRegion(0, y, W, h, dx, 0);
  }

  // 2) a swarm of glitch pieces around the rift (60% red / 30% black / 10% white)
  const pieces = Math.round(R * R * 45 + rnd() * R * 8);
  for (let i = 0; i < pieces; i++) {
    const [x, y] = nearRift(30 + R * 80);
    const [w, h] = glitchSize(rnd() < R ? 2 : 1);
    g.fillStyle = glitchCol(); g.fillRect(Math.round(x), Math.round(y), w, h);
  }

  // 3) chunks of the picture near the rift get cut out and moved
  if (rnd() < R * 0.8) {
    for (let i = 0, n = ri(1, 1 + Math.round(R * 4)); i < n; i++) {
      const [x, y] = nearRift(40 + R * 50), bw = ri(8, 20 + R * 50), bh = ri(3, 6 + R * 20);
      moveRegion(x, y, bw, bh, ri(-20, 20) * R, ri(-8, 8) * R);
    }
  }

  // 4) red ghost: a red copy of the screen shifted sideways
  if (R > 0.2 && rnd() < R * 0.6) {
    rg.globalCompositeOperation = 'copy'; rg.drawImage(cv, 0, 0, redCopy.width, redCopy.height);
    rg.globalCompositeOperation = 'multiply'; rg.fillStyle = '#f00'; rg.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.25 + R * 0.35;
    g.drawImage(redCopy, (rnd() < 0.5 ? -1 : 1) * ri(1, Math.round(2 + R * 8)), 0, W, H);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  // 5) really close: bands of static rip across the WHOLE screen
  if (R > 0.55 && rnd() < (R - 0.55) * 1.2) {
    for (let i = 0, n = ri(1, 3); i < n; i++) wallFill(0, ri(0, H), W, ri(1, Math.round(3 + R * 8)), 7 + i);
  }
}

// THE TUNNEL: like running out of oxygen in Frozen Planet, the screen
// closes in from the edges as a shrinking oval — the corners go first.
// But instead of just going dark, the edges are eaten by glitch static.
// the tunnel's BROKEN shape. tunnelM(a) = how far out the wall is in
// direction a (1 = the plain oval). Same recipe as the map edge — waves,
// notches and a jagged zig-zag — but the waves slowly drift, so it's alive.
const TUNNEL = (() => {
  const notches = [], jag = [], cracks = [];
  for (let i = 0; i < 9; i++) notches.push({ a: rnd() * 6.283, w: 0.05 + rnd() * 0.1, d: 0.1 + rnd() * 0.16 });
  for (let i = 0; i < 240; i++) jag.push(rnd());
  for (let i = 0; i < 14; i++) {                  // cracks: wiggly lines heading inward (in "oval units")
    const a = i < notches.length ? notches[i].a : rnd() * 6.283, steps = [];
    let h = a + Math.PI + (rnd() - 0.5) * 0.5, x = 0, y = 0;
    for (let s = 0, n = 6 + ri(0, 8); s < n; s++) {
      h += (rnd() - 0.5) * 0.9 + (a + Math.PI - h) * 0.3;
      const st = 0.03 + rnd() * 0.04;
      x += Math.cos(h) * st; y += Math.sin(h) * st; steps.push([x, y]);
    }
    cracks.push({ a, steps });
  }
  return { notches, jag, cracks };
})();
function tunnelM(a) {
  const t = S.t * 0.05;
  let m = 1 + Math.sin(a * 3 + 1.3 + t) * 0.05 + Math.sin(a * 5 + 4.1 - t * 1.5) * 0.035 + Math.sin(a * 9 + 2.2) * 0.02;
  for (const n of TUNNEL.notches) {
    const d = Math.abs(((a - n.a + 9.425) % 6.283) - 3.1416);
    if (d < n.w) m -= n.d * (1 - d / n.w);
  }
  const j = (((a / 6.2832) % 1) + 1) % 1 * 240, i = Math.floor(j), f = j - i;
  return m + (TUNNEL.jag[i % 240] * (1 - f) + TUNNEL.jag[(i + 1) % 240] * f - 0.5) * 0.05;
}

// THE GRAB — when the timer hits zero, the lightning catches you:
//   0.00  the bolts SNAP onto you (each one onto a piece of your diamond)
//   0.25  they slowly pull you apart; the pieces tremble, strands stretch between them
//   1.00  RIP: the pieces tear away along the bolts
//   1.25  ...then the screen-crack jumpscare (the DEATH timeline)
const GRAB = { snap: 0.25, tear: 1.0, end: 1.25 };
// your diamond split into 4 triangles (cut along both of its diagonals)
const GRAB_PIECES = [[[0, 0], [0, -5], [5, 0]], [[0, 0], [5, 0], [0, 5]], [[0, 0], [0, 5], [-5, 0]], [[0, 0], [-5, 0], [0, -5]]];
const GRAB_DIRS = [[0.707, -0.707], [0.707, 0.707], [-0.707, 0.707], [-0.707, -0.707]];
const GS = 1.3;                                             // pieces are a bit bigger; the real drama comes from the ZOOM
function grabPull() {                                       // how far apart the pieces are
  const u = S.grabT;
  if (u < GRAB.snap) return 0;
  if (u < GRAB.tear) { const v = (u - GRAB.snap) / (GRAB.tear - GRAB.snap); return v * v * 9; }
  const v = (u - GRAB.tear) / (GRAB.end - GRAB.tear); return 9 + v * v * 120;
}
function grabPieces(px, py) {                               // where each piece is (works for screen OR world coords)
  const pull = grabPull(), tr = S.grabT > GRAB.snap && S.grabT < GRAB.tear ? 1.2 : 0.4;
  return GRAB_DIRS.map(([dx, dy], k) => [px + dx * (pull + 2) * GS + (hash2(k, Math.floor(S.t * 30), 63) * 2 - 1) * tr * GS,
                                         py + dy * (pull + 2) * GS + (hash2(k, Math.floor(S.t * 30), 64) * 2 - 1) * tr * GS]);
}
// YOU, being torn apart — in two layers:
//   'under' = your glow + the stretching strands, drawn INSIDE the world
//             (so the bloom lights them like everything else)
//   'over'  = your core + the 4 pieces, drawn after the bolts so the bolts
//             don't hide you — but still BEFORE the zoom, so it all zooms together
function drawGrabbedPlayer(px, py, layer) {
  const u = S.grabT, pull = grabPull(), pieces = grabPieces(px, py), torn = u >= GRAB.tear;
  const tv = torn ? Math.min(1, (u - GRAB.tear) / (GRAB.end - GRAB.tear)) : 0;   // 0..1 after the rip
  const fq = Math.floor(S.t * 20);
  if (layer === 'under') glowAt(px, py, 16 + pull, 16 + pull, 0.3 + Math.min(pull, 9) * 0.02);
  if (layer === 'under' && !torn) {
    // strands of you stretching like taffy between your core and each piece:
    // wobbly, thinning out as they stretch (a red one and a white one each)
    g.globalAlpha = Math.max(0.25, 1 - pull / 11); g.lineWidth = 1;
    pieces.forEach(([x, y], k) => {
      for (const col of ['#ff0000', '#fff']) {
        g.strokeStyle = col; g.beginPath(); g.moveTo(px, py);
        for (let s = 1; s <= 4; s++) {
          const f = s / 4, wob = Math.sin(f * Math.PI) * 2.5;
          g.lineTo(lerp(px, x, f) + (hash2(k * 9 + s, fq, col === '#fff' ? 65 : 66) - 0.5) * wob,
                   lerp(py, y, f) + (hash2(k * 9 + s, fq, col === '#fff' ? 67 : 68) - 0.5) * wob);
        }
        g.stroke();
      }
    });
    g.globalAlpha = 1;
  }
  if (layer !== 'over') return;
  // your red core: unstable, flickering, swelling as you're pulled
  if (!torn && hash2(1, Math.floor(S.t * 25), 69) > 0.15) diamond(px, py, (1.3 + Math.sin(S.t * 40) * 0.4 + Math.min(pull, 9) * 0.1) * GS, '#ff0000');
  GRAB_PIECES.forEach((tri, k) => {
    const [x, y] = pieces[k], [dx, dy] = GRAB_DIRS[k], dir = Math.atan2(dy, dx);
    const ox = x - dx * 2 * GS, oy = y - dy * 2 * GS;        // where this piece's corner of "you" is now
    const stretch = 1 + Math.min(pull, 9) * 0.06;            // pulled long toward its bolt...
    const shrink = torn ? 1 - tv * 0.85 : 1;                 // ...and after the rip, falling apart
    const spin = torn ? tv * tv * 7 * (k % 2 ? 1 : -1) : (hash2(k, Math.floor(S.t * 30), 70) - 0.5) * 0.15;
    const tri2 = f => { g.beginPath(); tri.forEach(([tx, ty], i) => i ? g.lineTo(tx * f, ty * f) : g.moveTo(tx * f, ty * f)); g.closePath(); };
    g.save();
    g.translate(ox, oy);
    g.rotate(dir); g.scale(stretch * shrink, (2 - stretch) * shrink); g.rotate(-dir + spin);   // stretch along the pull
    g.scale(GS, GS);
    // the colours split apart as it breaks: a red copy sliding out from behind
    g.save(); g.translate(Math.cos(dir) * (0.6 + pull * 0.08), Math.sin(dir) * (0.6 + pull * 0.08));
    g.fillStyle = '#ff0000'; g.globalAlpha = 0.75; tri2(1); g.fill(); g.restore();
    g.fillStyle = '#fff'; tri2(1); g.fill();
    g.fillStyle = '#000'; tri2(0.4); g.fill();
    // corruption eating into the piece: red and black pixels, more and more
    g.save(); tri2(1); g.clip();
    for (let i = 0, n = Math.round(Math.min(pull, 9) * 1.2 + (torn ? 14 : 0)); i < n; i++) {
      g.fillStyle = hash2(k * 50 + i, fq, 71) < 0.6 ? '#ff0000' : '#000';
      g.fillRect(hash2(k * 50 + i, fq, 72) * 10 - 5, hash2(k * 50 + i, fq, 73) * 10 - 5, 1 / GS + 0.4, 1 / GS);
    }
    g.restore();
    g.restore();
  });
}

// the ZOOM: the whole picture pushes in on you as you're grabbed, and a bit
// more when you rip — everything zooms together, so nothing looks stuck on
function grabZoom(px, py) {
  const u = S.mode === 'grabbed' ? S.grabT : GRAB.end;
  const z = 1 + 0.75 * (1 - Math.pow(1 - Math.min(1, u / 0.3), 3)) + Math.max(0, u - GRAB.tear) * 1.2;
  const vw = W / z, vh = H / z, vx = clamp(px - vw / 2, 0, W - vw), vy = clamp(py - vh / 2, 0, H - vh);
  sg.globalCompositeOperation = 'source-over'; sg.drawImage(cv, 0, 0);
  g.drawImage(scratch, vx, vy, vw, vh, 0, 0, W, H);
}

// px, py = where YOU are on screen — the lightning reaches for you
function edgeCorruption(L, px = W / 2, py = H / 2) {
  if (L <= 0.001) return;
  const cx = W / 2, cy = H / 2;
  const size = Math.max(0.55, 1.45 - 1.3 * L);             // (stops closing at 55%, so you can SEE the lightning get you)
  const ax = W * 0.5 * size, by = H * 0.5 * size;         // half-width / half-height of the plain oval

  // 1) GLOW traced along the broken outline. 'lighter' ADDS light, so on
  //    black it makes pure glowing red instead of a muddy dark shadow.
  if (ax > 1) {
    const outline = [];
    for (let i = 0; i < 160; i++) {
      const a = i / 160 * 6.283 - 3.1416, m = tunnelM(a);
      outline.push([cx + Math.cos(a) * ax * m, cy + Math.sin(a) * by * m]);
    }
    glowLine(outline, 0, 0, 150, Math.min(1, 0.35 + L * 1.3));
  }

  // 2) LIGHTNING REACHING FOR YOU. Each bolt starts on the tunnel wall and
  //    stretches toward you — a bit closer every second as time runs out.
  //    When the timer hits zero, they GRAB you (each one onto a piece of you).
  if (L > 0.12 && ax > 1) {
    const grabbing = S.mode === 'grabbed', pieces = grabbing ? grabPieces(px, py) : null;
    const rf = Math.pow(Math.min(1, (L - 0.12) / 0.88), 1.2);          // 0 = just started ... 1 = almost on you
    const bolts = [], slow = Math.floor(S.t * 2);
    TUNNEL.cracks.forEach((c, id) => {
      const m = tunnelM(c.a), x0 = cx + Math.cos(c.a) * ax * m, y0 = cy + Math.sin(c.a) * by * m;
      // while grabbing: 4 bolts HOLD ON (one per piece of you); the rest let go and pull back
      const holds = grabbing && id < pieces.length;
      const [tx, ty] = holds ? pieces[id] : [px, py];
      const reach = rf * (0.62 + 0.3 * hash2(id, 1, 61));
      let f = holds ? Math.min(1, S.grabT / GRAB.snap) : grabbing ? reach * Math.max(0.35, 1 - S.grabT * 1.5) : reach;
      if (holds) f *= 1 - 3 / Math.max(3.5, Math.hypot(tx - x0, ty - y0));   // stop just short, so you can see the piece
      const ex = lerp(x0, tx, f), ey = lerp(y0, ty, f), len = Math.hypot(ex - x0, ey - y0);
      const nx = -(ey - y0) / (len || 1), ny = (ex - x0) / (len || 1);       // sideways, for the zig-zag
      const ln = [];
      for (let s = 0, n = 9; s <= n; s++) {                                  // wiggly path, pinned at both ends
        const u = s / n, wig = (hash2(id * 17 + s, slow, 62) - 0.5) * Math.min(22, len * 0.18) * Math.sin(u * Math.PI);
        ln.push([lerp(x0, ex, u) + nx * wig, lerp(y0, ey, u) + ny * wig]);
      }
      bolts.push([ln, 100 + id, holds]);
    });
    drawBolts(bolts, 0, 0);
  }

  // 3) the torn wall: everything outside the broken outline gets eaten
  const fq = Math.floor(S.t * 14);
  g.save(); g.beginPath();
  for (let y = 0; y < H; y++) {
    const dy = by > 0 ? (y - cy) / by : 9;
    const row = y >> 1;                                   // pieces are 2 pixels tall
    const n1 = hash2(row, fq, 11), n2 = hash2(row, fq, 12);
    const jl = (n1 - 0.3) * (8 + L * 24) * (n1 > 0.93 ? 3 : 1);
    const jr = (n2 - 0.3) * (8 + L * 24) * (n2 > 0.93 ? 3 : 1);
    // how far out the wall is on this row, on one side (-1 = left, 1 = right)
    const reach = side => {
      if (Math.abs(dy) >= 1.4) return 0;
      const base = Math.sqrt(Math.max(0, 1 - dy * dy));
      const m = tunnelM(Math.atan2(dy, side * Math.max(base, 0.05))), dyp = dy / m;
      return Math.abs(dyp) >= 1 ? 0 : ax * m * Math.sqrt(1 - dyp * dyp);
    };
    const hl = reach(-1), hr = reach(1);
    if (hl <= 0 && hr <= 0) { g.rect(0, y, W, 1); continue; }
    const l = cx - hl + jl, r = cx + hr - jr;
    if (l > 0) g.rect(0, y, l, 1);
    if (r < W) g.rect(r, y, W - r, 1);
  }
  g.clip();
  // the wall picks a new tile + position 12 times a second (not every frame,
  // so it crackles instead of turning into a blur)
  const wf = Math.floor(S.t * 12), wp = WALL[wf % WALL.length];
  const wm = new DOMMatrix().translate((hash2(wf, 1, 21) * TILE) | 0, (hash2(wf, 2, 21) * TILE) | 0);
  wp.setTransform(wm);
  g.fillStyle = wp; g.fillRect(0, 0, W, H);
  wallGlow(wf % WALL.length, wm, 0, 0, W, H);             // the white bits GLOW
  g.restore();

  // 4) glitch pieces breaking off the wall — some fly far in
  const pieces = Math.round(10 + L * 110);
  for (let i = 0; i < pieces; i++) {
    const a = rnd() * 6.283 - 3.1416, m = tunnelM(a), f = 1.02 - Math.pow(rnd(), 2) * 0.5;
    glitchPiece(Math.round(cx + Math.cos(a) * ax * m * f), Math.round(cy + Math.sin(a) * by * m * f), rnd() < L ? 2 : 1);
  }
}

// =====================================================================
//  HUD + SCREENS
// =====================================================================
// four L-shaped corners around a box — a clean "sci-fi screen" frame
function bracket(x, y, w, h, len, col) {
  g.fillStyle = col;
  g.fillRect(x, y, len, 1); g.fillRect(x, y, 1, len);                                  // top-left
  g.fillRect(x + w - len, y, len, 1); g.fillRect(x + w - 1, y, 1, len);                // top-right
  g.fillRect(x, y + h - 1, len, 1); g.fillRect(x, y + h - len, 1, len);                // bottom-left
  g.fillRect(x + w - len, y + h - 1, len, 1); g.fillRect(x + w - 1, y + h - len, 1, len);  // bottom-right
}

function drawHUD(k, late) {
  // --- glitchy timer ---
  const t = Math.max(0, S.time), m = Math.floor(t / 60), s = Math.floor(t % 60);
  let str = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  const calm = 1 - S.pure;                         // near the portal the text stops glitching
  if (rnd() < (0.02 + late * 0.25) * calm) {       // a digit briefly shows garbage
    const i = [0, 1, 3, 4][ri(0, 3)];
    str = str.slice(0, i) + '0123456789?/_'[ri(0, 12)] + str.slice(i + 1);
  }
  const danger = S.time < CFG.corruptAt;
  const blink = S.time < 30 && Math.floor(S.t * 4) % 2;
  const jx = late > 0 && rnd() < calm ? ri(-1, 1) * Math.round(late * 3) : 0;
  // PURIFIED timer: purple near the portal (paler while it rewinds)
  const purified = S.pure > 0.35, pur = S.rewinding ? '#cbbcff' : '#9a86ff';
  const tcol = purified ? pur : danger ? (blink ? '#fff' : '#ff0000') : '#fff';
  text(str, W / 2 + jx, 8, 3, tcol, (0.12 + late * 0.8 + S.rift * 0.5) * calm, 'center');
  // a frame around the timer (corner brackets) + a bar showing how much time is left
  const fw = textWidth('00:00', 3) + 14, fx = Math.round(W / 2 - fw / 2) + jx, fc = purified ? pur : danger ? '#ff0000' : '#fff';
  // THE PORTAL'S LIGHTNING swarms the timer — more bolts the closer you are
  if (S.pure > 0.2) {
    const nb = Math.round(S.pure * 7), fq2 = Math.floor(S.t * 12), bolts = [];
    const per = u => {                                          // a point on the timer's frame, u = 0..1 around it
      const pw = fw, ph = 32, L = (pw + ph) * 2; let d = u * L;
      if (d < pw) return [fx + d, 3]; d -= pw;
      if (d < ph) return [fx + pw, 3 + d]; d -= ph;
      if (d < pw) return [fx + pw - d, 3 + ph]; d -= pw;
      return [fx, 3 + ph - d];
    };
    for (let i = 0; i < nb; i++) {
      const u0 = hash2(i, fq2, 91), u1 = (u0 + 0.12 + hash2(i, fq2, 92) * 0.4) % 1;
      const [x0, y0] = per(u0), [x1, y1] = per(u1), pts = [];
      for (let s = 0; s <= 6; s++) {
        const f = s / 6, wig = Math.sin(f * Math.PI) * 9;
        pts.push([lerp(x0, x1, f) + (hash2(i * 7 + s, fq2, 93) - 0.5) * wig, lerp(y0, y1, f) + (hash2(i * 7 + s, fq2, 94) - 0.5) * wig]);
      }
      bolts.push([pts, 700 + i, true]);
    }
    glowAt(W / 2, 19, fw * 0.8, 24, 0.4 * S.pure, GLOW_BLUE);
    drawBolts(bolts, 0, 0, BLUE_BOLTS);
  }
  bracket(fx, 3, fw, 32, 5, fc);
  g.fillStyle = '#262626'; g.fillRect(fx + 4, 31, fw - 8, 2);
  g.fillStyle = fc; g.fillRect(fx + 4, 31, Math.round((fw - 8) * clamp(S.time / S.timeMax, 0, 1)), 2);

  diamond(10, 11, 2.5, '#ff0000');
  text('AREA ' + S.area, 16, 8, 1, '#8c8c96', (0.05 + late * 0.3) * calm);
  // HEALTH, under the area number: a bar + the number (flashes white when hit)
  const hpw = 58, hpx = 10, hpy = 19, hpc = S.hitFlash > 0.4 && Math.floor(S.t * 20) % 2 ? '#fff' : '#ff0000';
  g.fillStyle = '#262626'; g.fillRect(hpx, hpy, hpw, 4);
  g.fillStyle = hpc; g.fillRect(hpx, hpy, Math.round(hpw * clamp(S.hp / CFG.maxHp, 0, 1)), 4);
  text(Math.ceil(S.hp) + ' HP', hpx + hpw + 5, hpy - 1, 1, S.hp <= 25 ? '#ff0000' : '#8c8c96', 0.04 * calm);
  // shard counter with a mini shard icon
  const cnt = world.delivered + '/' + world.total;
  text(cnt, W - 8, 8, 2, '#fff', (0.05 + late * 0.3) * calm, 'right');
  const ix = W - 14 - textWidth(cnt, 2);
  diamond(ix, 14, 4, '#ff0000'); g.fillStyle = '#fff'; g.fillRect(ix - 1, 12, 1, 2);
  // one pip per shard: white = delivered, red = you're carrying it, dark = still out there
  for (let i = 0, per = 15; i < world.total; i++) {
    const col = i < world.delivered ? '#fff' : i < world.delivered + player.carried.length ? '#ff0000' : '#333';
    diamond(W - 10 - (i % per) * 7, 29 + Math.floor(i / per) * 7, 2.5, col);
  }

  // prompt when you can deliver
  const inRange = Math.hypot(player.x, player.y) <= CFG.deliverRange;
  if (inRange && player.carried.length && Math.floor(S.t * 3) % 3)
    text('[E] DELIVER', W / 2, H - 30, 2, '#fff', 0.1, 'center');
  if (S.msgT > 0) text(S.msg, W / 2, H - 46, 1, '#ff0000', 0.25, 'center');

  // arrow to The Anchor when it's off screen
  const ax = -cam.x + W / 2, ay = -cam.y + H / 2;
  if (ax < 10 || ax > W - 10 || ay < 10 || ay > H - 10) {
    const dx = ax - W / 2, dy = ay - H / 2;
    const f = Math.min((W / 2 - 14) / Math.abs(dx || 1e-6), (H / 2 - 14) / Math.abs(dy || 1e-6));
    const x = W / 2 + dx * f, y = H / 2 + dy * f;
    const pulse = 4 + Math.sin(S.t * 5) * 0.8;          // always there, gently pulsing
    glowAt(x, y, 10, 10, 0.5);
    diamond(Math.round(x), Math.round(y), pulse, '#ff0000'); diamond(Math.round(x), Math.round(y), 1.5, '#fff');
  }

  // area intro
  if (S.intro > 0) {
    const gl = S.intro > 2.8 ? 0.8 : 0.1;
    g.globalAlpha = Math.min(1, S.intro);
    text('AREA ' + S.area, W / 2, H / 2 - 50, 4, '#fff', gl, 'center');
    text(world.total + ' SHARDS  -  BRING THEM TO THE ANCHOR', W / 2, H / 2 - 16, 1, '#ff0000', gl, 'center');
    g.globalAlpha = 1;
  }
}

// THE JUMPSCARE — your SCREEN cracks like glass and explodes. Every moment is
// synced to the kill-sound remix, and both use this ONE list of times, so
// the picture and the sound can never drift apart.
//   0.06  the screen freezes and CRACKS — a spiderweb from where the hit landed
//   0.40  beat repeat: each hit spreads the cracks further
//   0.70  build-up: pieces of glass fall out, leaving black holes
//   1.12  silence before the drop: everything goes DEAD STILL
//   1.22  the CD skip: the broken screen jumps left/right with each skip
//   1.52  THE DROP: white flash, the whole screen EXPLODES toward you
//   1.90  trance gate: strips of the picture chop back and forth
//   2.30  tape stop: the picture sags down... then the old-TV switch-off
const DEATH = {
  slam: 0.06, repeat: [0.4, 0.5, 0.6], still: 1.12,
  crash: 1.22, skips: [0, 0.07, 0.13, 0.18, 0.225, 0.265], land: 1.52,
  gate: [1.9, 2.28], tape: 2.3, off: 2.45, end: 2.65,
};

// Build the broken glass. A spiderweb is two kinds of crack: straight-ish
// lines shooting OUT from the hit (radial), and rings going AROUND it.
// Where they cross, they cut the screen into pieces ("cells").
// (ix, iy) = where the hit lands; fall0..fall1 = when loose pieces fall out
function buildShatter(ix = W / 2 + rr(-24, 24), iy = H / 2 + rr(-14, 14), fall0 = 0.72, fall1 = DEATH.still) {
  const fr = makeCanvas(W, H); fr.getContext('2d').drawImage(cv, 0, 0);   // freeze the screen as it was
  const N = ri(11, 14), rings = [0, 7, 18, 36, 64, 105, 165, 250, 380, 600];
  const rad = [], a0 = rnd() * 6.283;
  for (let i = 0; i < N; i++) {                       // each radial crack = a wobbly line of points
    const a = a0 + (i + rr(-0.3, 0.3)) / N * 6.283, pts = [];
    for (let j = 0; j < rings.length; j++) {
      const r = rings[j] * rr(0.85, 1.15), aj = a + rr(-0.08, 0.08);
      pts.push([ix + Math.cos(aj) * r, iy + Math.sin(aj) * r * 0.9]);
    }
    rad.push(pts);
  }
  const cells = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < rings.length - 1; j++) {
    const A = rad[i], B = rad[(i + 1) % N];
    const poly = [A[j], A[j + 1], B[j + 1], B[j]];   // the piece between two cracks and two rings
    const cx = poly.reduce((s, p) => s + p[0], 0) / 4, cy = poly.reduce((s, p) => s + p[1], 0) / 4;
    cells.push({
      poly, cx, cy, rin: rings[j],
      ox: rr(-2, 2), oy: rr(-2, 2),                    // cracked pieces sit a bit crooked
      fall: j >= 3 && rnd() < 0.45 ? rr(fall0, fall1) : 99,        // some fall out
      vx: rr(-25, 25), spin: rr(-1.5, 1.5), edge: rnd() < 0.35,    // some catch the light
    });
  }
  const debris = [];                                   // tiny glass bits for the explosion
  for (let i = 0; i < 140; i++) {
    const a = rnd() * 6.283, v = rr(80, 520);
    debris.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: rnd() < 0.2 ? 3 : rnd() < 0.5 ? 2 : 1, col: rnd() < 0.6 ? '#fff' : REDS[ri(0, 3)] });
  }
  return { fr, ix, iy, rad, rings, cells, N, debris };
}

// how far the cracks have spread (in pixels from the hit): a jump on
// the slam and on each beat-repeat hit, then racing to the edges
function crackReach(vt) {
  let L = vt >= DEATH.slam ? 70 : 0;
  DEATH.repeat.forEach((r, i) => { if (vt >= r) L = 70 + (i + 1) * 90; });
  if (vt >= 0.7) L = 340 + (vt - 0.7) * 900;
  return L;
}

function cellPath(c) {
  g.beginPath(); c.poly.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
}
// one piece of glass: the frozen screen, cut to the piece's shape, then
// moved / spun / grown. (translate to its middle, spin, grow, translate back)
function drawCell(SH, c, ox, oy, rot, sc, flying) {
  g.save();
  g.translate(c.cx + ox, c.cy + oy); g.rotate(rot); g.scale(sc, sc); g.translate(-c.cx, -c.cy);
  cellPath(c);
  g.save(); g.clip(); g.drawImage(SH.fr, 0, 0); g.restore();
  if (c.edge || flying) { g.strokeStyle = '#fff'; g.lineWidth = 1 / sc; g.stroke(); }   // a shiny glass edge
  g.restore();
}

// the cracks: a thick pure-red glow line, with a thin white line on top
function drawCracks(SH, L) {
  const seg = [];
  for (let i = 0; i < SH.N; i++) {
    const P = SH.rad[i], Q = SH.rad[(i + 1) % SH.N];
    for (let j = 0; j < SH.rings.length - 1; j++) {
      if (SH.rings[j] >= L) break;
      const f = Math.min(1, (L - SH.rings[j]) / (SH.rings[j + 1] - SH.rings[j]));   // a crack still growing
      seg.push([P[j], [lerp(P[j][0], P[j + 1][0], f), lerp(P[j][1], P[j + 1][1], f)]]);
      if (j > 0 && SH.rings[j] * 1.4 < L) seg.push([P[j], Q[j]]);                  // ring pieces
    }
  }
  for (const [w, col] of [[3, '#ff0000'], [1, '#fff']]) {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    for (const [a, b] of seg) { g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
    g.stroke();
  }
  for (let i = 0; i < 26; i++) {                       // crushed glass right where it hit
    const a = hash2(i, 1, 81) * 6.283, d = hash2(i, 2, 81) * 9;
    g.fillStyle = hash2(i, 3, 81) < 0.6 ? '#fff' : '#ff0000';
    g.fillRect(Math.round(SH.ix + Math.cos(a) * d), Math.round(SH.iy + Math.sin(a) * d), 1 + (i % 2), 1);
  }
}

function drawJumpscare(t) {
  if (t < DEATH.slam) return;
  if (!S.shatter) S.shatter = buildShatter();
  const SH = S.shatter;
  // "visual time" STOPS during the silence and the CD skip, then carries on
  const vt = t < DEATH.still ? t : t < DEATH.land ? DEATH.still : t - (DEATH.land - DEATH.still);
  const skipping = t >= DEATH.crash && t < DEATH.land, landed = t >= DEATH.land;
  const still = t >= DEATH.still && t < DEATH.crash, u = t - DEATH.slam;
  let skipN = 0;
  if (skipping) DEATH.skips.forEach((s, i) => { if (t >= DEATH.crash + s) skipN = i; });

  // --- camera ---
  let pump = 0;                                        // kicks on each beat-repeat hit
  for (const r of DEATH.repeat) if (t >= r) pump = Math.max(pump, Math.exp(-(t - r) * 18));
  const punch = u < 0.16 ? 1.12 - 0.12 * (1 - Math.pow(1 - u / 0.16, 3)) : 1;   // the hit punches in
  const zoom = punch * (1 + pump * 0.05);
  const shake = still ? 0 : skipping ? 1 : 3 + pump * 10 + (u < 0.2 ? 10 : 0) + Math.max(0, vt - 0.7) * 8 + (landed ? 6 : 0);
  const jump = skipping ? (skipN % 2 ? 1 : -1) * (5 + skipN * 3) : 0;   // follows the sound left/right
  const sx = rr(-shake, shake) + jump, sy = rr(-shake, shake);
  const boom = landed ? t - DEATH.land : -1;           // seconds since the explosion

  // 1) behind the glass: nothing but black
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);

  // 2) the glass
  const L = crackReach(vt);
  g.save(); g.translate(W / 2 + sx, H / 2 + sy); g.scale(zoom, zoom); g.translate(-W / 2, -H / 2);
  if (!landed) g.drawImage(SH.fr, 0, 0);               // the unbroken part
  for (const c of SH.cells) {
    const cracked = c.rin < L;
    if (!cracked && !landed) continue;                 // still in one piece: nothing to do
    let ox = c.ox, oy = c.oy, rot = 0, sc = 1;
    if (vt > c.fall) {                                 // falling out (gravity: distance grows with time²)
      const f = vt - c.fall;
      ox += c.vx * f; oy += 320 * f * f; rot = c.spin * f * 3;
    }
    if (boom >= 0) {                                   // EXPLODING toward you: flies out, spins, GROWS
      const dx = c.cx - SH.ix, dy = c.cy - SH.iy, dl = Math.hypot(dx, dy) || 1;
      const push = (40 + dl) * boom * (1 + boom * 1.5);
      ox += dx / dl * push; oy += dy / dl * push; rot += c.spin * boom * 5; sc = 1 + boom * 3;
    }
    if (!landed) { g.fillStyle = '#000'; cellPath(c); g.fill(); }   // the hole where it WAS
    if (c.cy + oy - 40 > H * 1.5 || Math.abs(ox) > W * 1.5 || Math.abs(oy) > H * 1.5) continue;
    drawCell(SH, c, ox, oy, rot, sc, landed);
  }
  if (!landed) drawCracks(SH, L);
  g.restore();

  // 3) the explosion: tiny glass bits flying out from where it hit
  if (boom >= 0) {
    for (const d of SH.debris) {
      const k = 1 + boom * 3;                          // they speed up (flying at the camera)
      const x = SH.ix + d.vx * boom * k, y = SH.iy + d.vy * boom * k + 60 * boom * boom;
      if (x < -5 || x > W + 5 || y < -5 || y > H + 5) continue;
      const s = Math.round(d.s * (1 + boom * 2.5));   // and get bigger as they get closer
      g.fillStyle = d.col; g.fillRect(Math.round(x), Math.round(y), s, s);
    }
  }

  // 4) torn strips sliding sideways (not during the silence)
  sg.globalCompositeOperation = 'copy'; sg.drawImage(cv, 0, 0);
  if (!still) for (let i = 0, n = landed ? 12 : skipping ? 8 : 3; i < n; i++) {
    const y = ri(0, H), h = ri(1, landed ? 12 : 5), dx = (rnd() < 0.5 ? -1 : 1) * ri(3, landed ? 60 : 14);
    g.drawImage(scratch, 0, y, W, h, dx, y, W, h);
  }

  // 5) THE DROP: one white flash, then a red ghost copy splitting off
  if (t >= DEATH.land && t < DEATH.land + 0.045) { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }
  else if (landed && t < DEATH.land + 0.5) {
    rg.globalCompositeOperation = 'copy'; rg.drawImage(cv, 0, 0, redCopy.width, redCopy.height);
    rg.globalCompositeOperation = 'multiply'; rg.fillStyle = '#f00'; rg.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.7;
    g.drawImage(redCopy, ri(4, 14) * (rnd() < 0.5 ? -1 : 1), 0, W, H);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  // 6) trance gate: bands of the picture slide back and forth, 14x a second
  if (t >= DEATH.gate[0] && t < DEATH.gate[1]) {
    const flip = Math.floor((t - DEATH.gate[0]) * 28) % 2 ? 1 : -1;
    sg.drawImage(cv, 0, 0);
    for (let y = 0; y < H; y += 8) g.drawImage(scratch, 0, y, W, 4, flip * ((y >> 3) % 2 ? 14 : -14), y, W, 4);
  }

  // 7) tape stop: the picture sags and slides down
  if (t >= DEATH.tape && t < DEATH.off) {
    const c = (t - DEATH.tape) / (DEATH.off - DEATH.tape);
    sg.drawImage(cv, 0, 0);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.drawImage(scratch, 0, 0, W, H, 0, Math.round(c * c * H * 0.35), W, Math.round(H * (1 - c * 0.3)));
  }

  // 8) old-TV switch-off: squash the whole picture into a thin line
  if (t > DEATH.off) {
    const c = Math.min(1, (t - DEATH.off) / 0.14);
    sg.drawImage(cv, 0, 0);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const h = Math.max(1, Math.round(H * (1 - c))), w = W * (1 + c * 0.5);
    g.drawImage(scratch, (W - w) / 2, Math.round(H / 2 - h / 2), w, h);
  }
}

function dim(a) { g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(0, 0, W, H); }

function drawTitle() {
  dim(0.3);
  const y = Math.round(H * 0.2), lw = textWidth('V0ID3D', 8);
  glowAt(W / 2, y + 28, lw * 0.75, 44, 0.55);                   // red glow behind the logo
  text('V0ID3D', W / 2 + 2, y + 2, 8, '#8a0000', 0, 'center');
  text('V0ID3D', W / 2, y, 8, '#fff', 0.35, 'center');
  const sweep = (S.t * 0.45) % 1.6;                             // a bright line scanning down the logo
  if (sweep < 1) { g.fillStyle = '#fff'; g.fillRect(Math.round(W / 2 - lw / 2), y + Math.round(sweep * 56), lw, 1); }
  g.fillStyle = '#ff0000';                                      // lines either side of the subtitle
  const sw = textWidth('STABILIZE REALITY', 1);
  g.fillRect(Math.round(W / 2 - sw / 2 - 46), y + 69, 38, 1); g.fillRect(Math.round(W / 2 + sw / 2 + 8), y + 69, 38, 1);
  text('STABILIZE REALITY', W / 2, y + 66, 1, '#ff0000', 0.15, 'center');
  // browsers block sound until you click or press something, so the
  // first press just "wakes up" the audio and starts the menu music
  if (Math.floor(S.t * 2) % 2)
    text(!AU.ctx ? 'CLICK TO ENTER THE VOID' : S.resume ? 'PRESS ENTER TO CONTINUE AREA ' + S.resume.area : 'PRESS ENTER TO START', W / 2, H - 70, 2, '#fff', 0.2, 'center');
  if (S.updated) text('NEW VERSION LOADED', W / 2, H - 88, 1, '#ff0000', 0.1, 'center');
  text('WASD / ARROWS  MOVE    E  DELIVER    M  MUTE    F  FULLSCREEN    ESC  PAUSE', W / 2, H - 36, 1, '#8c8c96', 0.03, 'center');
  if (S.best) text('BEST: AREA ' + S.best + ' CLEARED', W / 2, H - 22, 1, '#8c8c96', 0.03, 'center');
  // credit where it's due: the kill sound + scream come from DOORS
  text('RANSOM SOUND FROM DOORS - ALL CREDIT TO LSPLASH', W / 2, H - 10, 1, '#5e5e66', 0, 'center');
}

function drawClear() {
  const T = S.clearT, u = T - CLEAR.done;
  // black CINEMA BARS slide in from the top and bottom: "this is a cutscene"
  const bar = Math.round(H * 0.11 * (1 - Math.pow(1 - Math.min(1, T / 0.8), 3)));
  g.fillStyle = '#000'; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar);
  g.fillStyle = '#ff0000'; g.fillRect(0, bar, W, 1); g.fillRect(0, H - bar - 1, W, 1);
  if (u >= 0 && u < 0.06) { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }   // the flash when it completes
  const a = clamp((T - CLEAR.text) * 1.5, 0, 1);    // the words appear after the seal is whole
  if (a <= 0) return;
  g.globalAlpha = a;
  text('AREA ' + S.area + ' STABILIZED', W / 2, Math.max(4, bar / 2 - 10), 3, '#fff', Math.max(0.05, 0.5 - (T - CLEAR.text) * 0.4), 'center');
  const t = Math.max(0, S.time), m = Math.floor(t / 60), s = String(Math.floor(t % 60)).padStart(2, '0');
  text('TIME LEFT  ' + m + ':' + s, W / 2, bar + 6, 1, '#ff0000', 0.05, 'center');
  if (T > CLEAR.enter && Math.floor(S.t * 2) % 2) text('PRESS ENTER', W / 2, H - bar / 2 - 3, 1, '#fff', 0.1, 'center');
  g.globalAlpha = 1;
}

// IN THE PORTAL'S MIDDLE: blue/purple energy lightning creeps in from the
// four corners of your screen — more bolts, reaching further, the longer you
// stay (k = 0..1). It's only a look: it doesn't hurt you.
function drawCornerEnergy(k) {
  const T = S.t, strike = Math.floor(T * 12), bolts = [];
  const corners = [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]];
  corners.forEach(([cx, cy, sx, sy], c) => {
    glowAt(cx, cy, 40 + k * 120, 30 + k * 90, 0.35 + k * 0.5, GLOW_BLUE);    // the corner glows
    for (let i = 0, n = Math.round(1 + k * 6); i < n; i++) {
      // each bolt heads into the screen at its own angle, wiggling as it goes
      let a = Math.atan2(sy, sx) + (hash2(c * 13 + i, Math.floor(T * 1.5), 101) - 0.5) * 1.3;
      const len = (25 + hash2(c * 13 + i, Math.floor(T * 1.5), 102) * 70) * (0.4 + k);
      let x = cx, y = cy; const pts = [[x, y]];
      for (let s = 0, steps = 7; s < steps; s++) {
        a += (hash2(c * 97 + i * 7 + s, Math.floor(T * 3), 103) - 0.5) * 0.9;
        x += Math.cos(a) * len / steps; y += Math.sin(a) * len / steps; pts.push([x, y]);
      }
      bolts.push([pts, 900 + c * 10 + i]);
    }
  });
  drawBolts(bolts, 0, 0, BLUE_BOLTS);
  // a thin frame of energy along the edges, spreading out from the corners
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = '#6a4dff'; g.globalAlpha = 0.6 * k;
  const ew = W * 0.5 * k, eh = H * 0.5 * k;
  g.fillRect(0, 0, ew, 2); g.fillRect(W - ew, 0, ew, 2); g.fillRect(0, H - 2, ew, 2); g.fillRect(W - ew, H - 2, ew, 2);
  g.fillRect(0, 0, 2, eh); g.fillRect(0, H - eh, 2, eh); g.fillRect(W - 2, 0, 2, eh); g.fillRect(W - 2, H - eh, 2, eh);
  g.restore();
}

// OUCH: a solid red frame around the screen + glitch bits along the edges
// (solid pieces, not a see-through red wash)
function drawHitFlash() {
  const f = S.hitFlash, t = Math.ceil(f * 5);
  g.fillStyle = '#ff0000';
  g.fillRect(0, 0, W, t); g.fillRect(0, H - t, W, t); g.fillRect(0, 0, t, H); g.fillRect(W - t, 0, t, H);
  for (let i = 0, n = Math.round(f * 30); i < n; i++) {
    const side = i % 4, u = rnd();
    glitchPiece(side === 0 ? u * W : side === 1 ? W - ri(4, 20) : side === 2 ? u * W : ri(0, 16),
                side === 0 ? ri(0, 14) : side === 1 ? u * H : side === 2 ? H - ri(4, 16) : u * H);
  }
}

// THE CRACK DEATH (damage or The Portal): the screen freezes and cracks from
// where you are, the cracks race outward, pieces start falling out... then
// the death menu. (t = seconds since you died)
function drawCrackDeath(t, px, py) {
  if (!S.shatter) S.shatter = buildShatter(px, py, 0.55, 1.2);
  const SH = S.shatter, shake = t < 0.15 ? 6 : Math.max(0, 2 - t * 2);
  const L = 30 + Math.pow(Math.min(1, t / CRACK.spread), 0.7) * 640;        // how far the cracks have spread
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(rr(-shake, shake), rr(-shake, shake));
  g.drawImage(SH.fr, 0, 0);
  for (const c of SH.cells) {
    if (c.rin >= L) continue;                                                // not cracked yet
    let ox = c.ox, oy = c.oy, rot = 0;
    if (t > c.fall) { const f = t - c.fall; ox += c.vx * f; oy += 320 * f * f; rot = c.spin * f * 3; }
    g.fillStyle = '#000'; cellPath(c); g.fill();                             // the gap where it was
    if (c.cy + oy - 40 > H * 1.5) continue;
    drawCell(SH, c, ox, oy, rot, 1, false);
  }
  drawCracks(SH, L);
  g.restore();
  if (t < 0.05) { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }           // the moment it breaks
}

function drawDead() {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);                 // solid black — no muddy dimming
  // torn bands of solid glitch along the top and bottom edges
  const fq = Math.floor(S.t * 12);
  for (let d = 0; d < 22; d += 2) {
    const reach = 1 - Math.pow(d / 22, 1.5);                    // rows further from the edge are shorter
    for (const y of [d, H - 2 - d]) {
      const n = hash2(y, fq, 111), len = W * reach * (0.55 + n * 0.45), x0 = hash2(y, fq, 112) * (W - len);
      wallFill(Math.round(x0), y, Math.round(len), 2, 9);
    }
  }
  const [head, cause] = DEATH_TEXT[S.deathCause] || DEATH_TEXT.time;
  glowAt(W / 2, H / 2 - 44, 190, 34, 0.5);
  text(head, W / 2, H / 2 - 56, 3, '#ff0000', 0.5, 'center');
  text(cause, W / 2, H / 2 - 24, 1, '#fff', 0.15, 'center');                 // what killed you
  text('AREA ' + S.area + '    ' + world.delivered + '/' + world.total + ' SHARDS DELIVERED', W / 2, H / 2 - 6, 1, '#8c8c96', 0.05, 'center');
  text('[R] TRY AGAIN      [ENTER] MENU', W / 2, H / 2 + 22, 1, '#8c8c96', 0.05, 'center');
}

// =====================================================================
//  RENDER — draws one frame, back to front
// =====================================================================
function render() {
  const k = glitchK(), late = lateV();
  const sh = S.shake + (S.mode === 'play' ? late * late * 3 + S.rift * S.rift * 2.5 * (1 - S.pure) : 0);
  const camX = Math.round(cam.x - W / 2 + rr(-sh, sh)), camY = Math.round(cam.y - H / 2 + rr(-sh, sh));

  drawBackground(camX, camY, k, late);
  drawAnchor(camX, camY, k);
  drawBlobs(camX, camY, k, late);
  drawNodes(camX, camY);
  drawPortal(camX, camY, 'outer');
  for (const s of world.shards) if (s.state === 'free') {
    const x = s.x - camX, y = s.y - camY;
    if (x > -30 && x < W + 30 && y > -30 && y < H + 30) drawShard(s, x, y, ART, k);
  }
  for (const f of flyers) drawShard(f.s, f.x - camX, f.y - camY, ART, k);
  if (player && S.mode !== 'dead') {
    for (const s of player.carried) drawShard(s, s.cx - camX, s.cy - camY, ART, k, 0.6);
    if (S.mode === 'play' || S.mode === 'paused' || S.mode === 'clear' || S.mode === 'cracking') drawPlayer(camX, camY, k);
    else if (S.mode === 'grabbed') drawGrabbedPlayer(Math.round(player.x - camX), Math.round(player.y - camY), 'under');
  }
  for (const p of particles) {
    g.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); g.fillStyle = p.col;
    g.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), p.streak ? p.s * 3 : p.s, p.s);
  }
  g.globalAlpha = 1;
  for (const p of pops) {
    g.globalAlpha = clamp(p.life, 0, 1);
    text(p.txt, p.x - camX, p.y - camY, 1, '#ff0000', 0.15, 'center');
  }
  g.globalAlpha = 1;
  drawMotes(camX, camY);
  bloom(0.75);                                     // everything bright starts to glow
  // the solid glitch goes on AFTER the glow — otherwise the glow smears red
  // haze over its black pieces and the whole thing turns muddy
  drawTears(camX, camY, k, late);
  drawEdge(camX, camY);
  drawPortal(camX, camY, 'inner');
  if (world.portal && player && S.mode === 'play' &&                     // walking over it? stay on top
      Math.hypot(player.x - world.portal.x, player.y - world.portal.y) < 80) drawPlayer(camX, camY, k);

  postFX(k, late);
  riftFX(S.rift * (1 - S.pure), S.riftX - camX, S.riftY - camY);
  edgeCorruption(S.mode === 'dying' ? 0.6 + S.dieT * 0.3 : S.mode === 'grabbed' ? 1 : late,
                 player ? player.x - camX : W / 2, player ? player.y - camY : H / 2);
  // zoom in on you while you're grabbed (and on the jumpscare's first frame,
  // so the frozen "glass" it cracks is the zoomed view — no jump)
  if (S.mode === 'grabbed') drawGrabbedPlayer(Math.round(player.x - camX), Math.round(player.y - camY), 'over');
  if (player && (S.mode === 'grabbed' || (S.mode === 'dying' && !S.shatter))) grabZoom(player.x - camX, player.y - camY);
  if (S.mode === 'dying') drawJumpscare(S.dieT);
  if (S.mode === 'cracking') drawCrackDeath(S.crackT, player.x - camX, player.y - camY);
  if (S.hitFlash > 0 && S.mode === 'play') drawHitFlash();
  if (S.core > 0.01 && (S.mode === 'play' || S.mode === 'paused')) drawCornerEnergy(S.core);

  if (S.mode === 'play' || S.mode === 'paused' || S.mode === 'grabbed') drawHUD(k, late);
  if (S.mode === 'paused') {
    dim(0.6);
    text('PAUSED', W / 2, H / 2 - 30, 4, '#fff', 0.2, 'center');
    text('ESC  RESUME      Q  QUIT TO MENU', W / 2, H / 2 + 10, 1, '#8c8c96', 0.03, 'center');
  }
  if (S.mode === 'title') drawTitle();
  if (S.mode === 'clear') drawClear();
  if (S.mode === 'dead') drawDead();
  // DEV MODE: a small label (under your health in a level), and a big notice right after unlocking
  if (S.devMode && (S.mode === 'title' || S.mode === 'play' || S.mode === 'paused'))
    text('DEV MODE', 10, S.mode === 'title' ? 8 : 29, 1, '#8c8c96', 0, 'left');
  if (S.devFlash > 0 && Math.floor(S.t * 6) % 3) text('DEV MODE UNLOCKED', W / 2, H / 2 + 36, 2, '#fff', 0.25, 'center');
}

// =====================================================================
//  INPUT
// =====================================================================
addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  keys[key] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) e.preventDefault();
  if (e.repeat) return;
  const firstPress = !AU.ctx;
  audioInit();                                 // browsers only allow sound after you press something
  // SECRET CODES: remember the last 12 single keys typed. Typing dev_mode
  // (any caps) unlocks dev mode. (The m in the code doesn't toggle mute.)
  const inCode = key === 'm' && S.typed.endsWith('dev_');
  if (key.length === 1) S.typed = (S.typed + key).slice(-12);
  if (S.typed.endsWith('dev_mode') && !S.devMode) unlockDevMode();
  if (key === 'm' && !inCode) setMute(!AU.muted);
  if (key === 'f') toggleFullscreen();
  if (S.mode === 'title') { if (!firstPress && (key === 'enter' || key === ' ')) startFromTitle(); }
  else if (S.mode === 'play') {
    if (key === 'e') tryDeliver();
    if (key === 'escape' || key === 'p') S.mode = 'paused';
  }
  else if (S.mode === 'paused') {
    if (key === 'escape' || key === 'p') S.mode = 'play';
    if (key === 'q') toTitle(true);
  }
  else if (S.mode === 'clear') { if (S.clearT > CLEAR.enter && (key === 'enter' || key === ' ')) nextArea(); }
  else if (S.mode === 'dead') {
    if (key === 'r') checkForUpdate(() => startArea(S.area, S.shardCount), { area: S.area, n: S.shardCount });
    if (key === 'enter') toTitle(true);
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
// F = fullscreen: the game fills your whole monitor. (Some sites that show
// the game inside a frame don't allow this — then nothing happens.)
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
addEventListener('mousedown', () => {
  const firstPress = !AU.ctx;
  audioInit();
  if (S.mode === 'title' && !firstPress) startFromTitle();
});
addEventListener('blur', () => {
  for (const key in keys) keys[key] = false;
  if (S.mode === 'play') S.mode = 'paused';
});

// =====================================================================
//  GAME LOOP
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  musicTick();
  render();
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
</script>
